<style>
  :root {
    --bg: #0a0a0c;
    --surface: #131318;
    --surface-2: #1b1b22;
    --border: #26262f;
    --ink: #f4f4f6;
    --ink-mid: #b9b9c4;
    --ink-soft: #71717e;
    --orange: #ff6b1a;
    --orange-soft: #ff8d4d;
    --gold: #e8b54a;
    --ff-display: 'Archivo Black', 'Archivo', sans-serif;
    --ff-body: 'Archivo', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ff-body); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--orange); color: #000; }

  /* ── HERO ── */
  .hero {
    min-height: 92vh; position: relative; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(255,107,26,0.16) 0%, transparent 50%),
      radial-gradient(ellipse at 20% 80%, rgba(255,107,26,0.08) 0%, transparent 45%),
      linear-gradient(180deg, #0c0c10 0%, #0a0a0c 100%);
    overflow: hidden;
  }
  .hero::before { /* court lines */
    content: ''; position: absolute; inset: 0; opacity: 0.05; pointer-events: none;
    background-image:
      radial-gradient(circle at 50% 120%, transparent 38%, #fff 38.5%, #fff 39%, transparent 39.5%),
      linear-gradient(90deg, transparent 49.8%, #fff 49.8%, #fff 50.2%, transparent 50.2%);
  }
  .hero-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; pointer-events: none;
  }
  .hero-fade-top, .hero-fade-bottom {
    position: absolute; left: 0; right: 0; height: 200px;
    pointer-events: none; z-index: 1;
  }
  .hero-fade-top { top: 0; background: linear-gradient(to bottom, #0a0a0c, transparent); }
  .hero-fade-bottom { bottom: 0; background: linear-gradient(to top, #0a0a0c, transparent); }
  .hero-scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: rgba(10,10,12,0.45); }
  .hero-topbar, .hero-inner { position: relative; z-index: 10; }
  .hero-ball {
    position: absolute; right: -8vw; top: 12vh; width: 46vw; max-width: 560px; aspect-ratio: 1;
    border-radius: 50%; opacity: 0.13; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #ff8d4d, #c24808 70%, #6e2604);
    box-shadow: inset -30px -40px 80px rgba(0,0,0,0.6);
    animation: floatBall 9s ease-in-out infinite;
  }
  .hero-ball::before, .hero-ball::after {
    content: ''; position: absolute; background: #0a0a0c; opacity: 0.55;
  }
  .hero-ball::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
  .hero-ball::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }
  @keyframes floatBall { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-28px) rotate(4deg); } }

  .hero-inner { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 80px; position: relative; z-index: 1; }
  .hero-kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: var(--orange); margin-bottom: 22px; animation: fadeUp 0.7s ease both; }
  .hero-title {
    font-family: var(--ff-display); font-size: clamp(44px, 9vw, 110px); line-height: 0.95;
    letter-spacing: -0.01em; text-transform: uppercase;
    background: linear-gradient(180deg, #fff 30%, #ffb27e 75%, var(--orange) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fadeUp 0.7s 0.12s ease both;
  }
  .hero-sub { font-size: clamp(15px, 2.2vw, 21px); color: var(--ink-mid); margin-top: 22px; font-weight: 600; letter-spacing: 0.04em; animation: fadeUp 0.7s 0.24s ease both; }
  .hero-cta {
    margin-top: 42px; display: inline-block; padding: 17px 46px; border-radius: 100px;
    background: linear-gradient(135deg, var(--orange), #e84e00); color: #000;
    font-weight: 800; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
    box-shadow: 0 8px 32px rgba(255,107,26,0.35); transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.7s 0.36s ease both;
  }
  .hero-cta:hover { transform: translateY(-3px); box-shadow: 0 14px 44px rgba(255,107,26,0.5); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  .hero-topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px clamp(20px, 5vw, 56px); position: relative; z-index: 2; }
  .hero-logo { height: 46px; filter: invert(1) brightness(1.6); }
  .hero-logo-fallback { font-family: var(--ff-display); font-size: 26px; letter-spacing: 0.06em; }
  .hero-logo-fallback span { color: var(--orange); }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 100px; overflow: hidden; }
  .lang-toggle button {
    background: none; border: none; color: var(--ink-soft); font-family: var(--ff-body);
    font-weight: 700; font-size: 12px; letter-spacing: 0.1em; padding: 8px 16px; cursor: pointer; transition: all 0.2s;
  }
  .lang-toggle button.active { background: var(--orange); color: #000; }

  /* ── NAV ── */
  .nav {
    position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; gap: 4px;
    background: rgba(10,10,12,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 0 16px;
  }
  .nav a {
    color: var(--ink-soft); text-decoration: none; font-weight: 700; font-size: 13px;
    letter-spacing: 0.14em; text-transform: uppercase; padding: 18px 22px; position: relative; transition: color 0.2s;
    white-space: nowrap;
  }
  .nav a:hover, .nav a.active { color: var(--ink); }
  .nav a::after {
    content: ''; position: absolute; left: 22px; right: 22px; bottom: 0; height: 3px;
    background: var(--orange); transform: scaleX(0); transition: transform 0.25s; transform-origin: left;
  }
  .nav a:hover::after, .nav a.active::after { transform: scaleX(1); }

  /* ── SECTIONS ── */
  .section { max-width: 1180px; margin: 0 auto; padding: clamp(56px, 9vw, 110px) clamp(18px, 4vw, 40px); }
  .sec-kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
  .sec-title { font-family: var(--ff-display); font-size: clamp(30px, 5vw, 52px); text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: clamp(28px, 4vw, 48px); }

  /* ── STANDINGS ── */
  .standings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table th {
    text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); padding: 16px 18px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .standings-table th:hover { color: var(--orange); }
  .standings-table td { padding: 15px 18px; border-bottom: 1px solid #1d1d24; font-size: 14.5px; }
  .standings-table tbody tr { transition: background 0.18s; cursor: pointer; }
  .standings-table tbody tr:hover { background: rgba(255,107,26,0.05); }
  .standings-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
  .standings-table tbody tr:nth-child(even):hover { background: rgba(255,107,26,0.05); }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
    border-radius: 8px; font-weight: 800; font-size: 13px; background: var(--surface-2); color: var(--ink-mid);
  }
  .rank-1 { background: linear-gradient(135deg, var(--orange), #e84e00); color: #000; }
  .rank-2 { background: #34343f; color: #d7d7df; }
  .rank-3 { background: #2c2218; color: #c98a4a; }
  .team-cell { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .team-logo-sq {
    width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; border: 1px solid var(--border);
  }
  .last5 { display: flex; gap: 4px; }
  .l5-dot { width: 9px; height: 9px; border-radius: 50%; }
  .l5-w { background: #34d27b; } .l5-l { background: #3a3a44; }
  .roster-row td { background: #101015 !important; padding: 18px 22px; cursor: default; }
  .roster-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .roster-chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 100px; padding: 6px 14px; font-size: 12.5px; color: var(--ink-mid); }
  .roster-chip b { color: var(--ink); }

  /* ── SCHEDULE ── */
  .sched-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .chip-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-mid);
    font-family: var(--ff-body); font-weight: 700; font-size: 12.5px; letter-spacing: 0.08em;
    padding: 9px 20px; border-radius: 100px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .chip-btn:hover { border-color: var(--orange); color: var(--ink); }
  .chip-btn.active { background: var(--orange); border-color: var(--orange); color: #000; }
  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .game-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; cursor: pointer;
  }
  .game-card:hover { transform: translateY(-4px); border-color: rgba(255,107,26,0.45); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
  .game-date { font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 16px; display: flex; justify-content: space-between; }
  .game-status-live { color: var(--orange); }
  .game-final { color: #34d27b; }
  .game-matchup { display: flex; flex-direction: column; gap: 12px; }
  .game-team { display: flex; align-items: center; justify-content: space-between; }
  .game-team-info { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 15px; }
  .game-score { font-family: var(--ff-display); font-size: 24px; }
  .game-score.winner { color: var(--orange); }
  .game-score.loser { color: var(--ink-soft); }
  .game-venue { margin-top: 16px; padding-top: 14px; border-top: 1px solid #1d1d24; font-size: 12.5px; color: var(--ink-soft); display: flex; justify-content: space-between; }

  /* ── PLAYER CARDS / TIERS ── */
  .player-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; align-items: center; }
  .search-inp {
    background: var(--surface); border: 1px solid var(--border); border-radius: 100px; color: var(--ink);
    font-family: var(--ff-body); font-size: 13.5px; padding: 10px 22px; min-width: 220px; outline: none; transition: border-color 0.2s;
  }
  .search-inp:focus { border-color: var(--orange); }
  .search-inp::placeholder { color: var(--ink-soft); }
  .filter-select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 100px; color: var(--ink-mid);
    font-family: var(--ff-body); font-weight: 600; font-size: 12.5px; padding: 10px 18px; cursor: pointer; outline: none;
  }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px; }

  .pcard {
    aspect-ratio: 2.5 / 3.5; border-radius: 16px; position: relative; overflow: hidden;
    transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow 0.28s; cursor: pointer;
  }
  .pcard:hover { transform: translateY(-8px) scale(1.025); box-shadow: 0 24px 56px rgba(0,0,0,0.55); z-index: 2; }
  .pcard-inner {
    position: absolute; inset: 9px; border-radius: 11px; display: flex; flex-direction: column; overflow: hidden;
  }
  /* Full-bleed photo: top + bottom scrims keep overlaid text readable over any image */
  .pcard-inner::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 30%; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.72), transparent);
  }
  .pcard-inner::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.88) 55%);
  }
  .pc-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 13px 6px; position: relative; z-index: 3; margin-bottom: auto; }
  .pc-league { font-size: 9px; font-weight: 800; letter-spacing: 0.22em; opacity: 0.65; }
  .pc-tier-block { text-align: right; }
  .pc-tier { font-family: var(--ff-display); font-size: 15px; letter-spacing: 0.08em; line-height: 1; }
  .pc-arch { font-size: 8.5px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; opacity: 0.8; }
  .pc-photo {
    position: absolute; inset: 0; margin: 0; z-index: 1; overflow: hidden;
    background: linear-gradient(160deg, #2c2c34, #15151b);   /* neutral fallback when no photo */
    background-size: cover; background-position: center top;
    display: flex; align-items: center; justify-content: center;
  }
  .pc-photo-init {
    font-family: var(--ff-display); font-size: 64px; opacity: 0.35;
  }
  .pc-bottom { padding: 8px 13px 4px; position: relative; z-index: 3; }
  .pc-name { font-family: var(--ff-display); font-size: 16.5px; letter-spacing: 0.01em; line-height: 1.05; }
  .pc-meta { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin-top: 4px; }
  .pc-stats { display: flex; gap: 0; margin: 9px 13px 12px; border-radius: 8px; overflow: hidden; position: relative; z-index: 3; }
  .pc-stat { flex: 1; text-align: center; padding: 7px 2px; }
  .pc-stat-v { font-family: var(--ff-display); font-size: 15px; line-height: 1; }
  .pc-stat-k { font-size: 7.5px; font-weight: 800; letter-spacing: 0.18em; margin-top: 3px; opacity: 0.65; }
  .pc-share {
    position: absolute; bottom: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: #fff; opacity: 0; transform: translateY(8px); transition: all 0.22s; z-index: 5;
    backdrop-filter: blur(6px);
  }
  .pcard:hover .pc-share { opacity: 1; transform: translateY(0); }
  .pc-share:hover { background: var(--orange); color: #000; }

  /* TIER FRAMES — each completely distinct */
  /* Bronze: rough stone */
  .t-bronze { background: repeating-linear-gradient(37deg, #6e4a26 0px, #7d5630 5px, #5c3c1d 9px, #75502b 14px); }
  .t-bronze .pcard-inner { background: linear-gradient(168deg, #36250f 0%, #241808 100%); color: #e8d4b8; }
  .t-bronze .pc-tier { color: #cd9858; }
  .t-bronze .pc-photo { background: linear-gradient(180deg, #4a3418, #33230e); }
  .t-bronze .pc-photo-init { color: #cd9858; }
  .t-bronze .pc-stats { background: rgba(0,0,0,0.35); }
  .t-bronze .pc-stat-v { color: #e0b87e; }

  /* Silver: clean metallic */
  .t-silver { background: linear-gradient(155deg, #eef0f3 0%, #b8bdc4 25%, #e4e7eb 50%, #9aa0a8 75%, #dde0e5 100%); }
  .t-silver .pcard-inner { background: linear-gradient(170deg, #272c33 0%, #171a1f 100%); color: #e6e9ed; }
  .t-silver .pc-tier { color: #d7dce2; }
  .t-silver .pc-photo { background: linear-gradient(180deg, #333942, #20242b); }
  .t-silver .pc-photo-init { color: #8e99a6; }
  .t-silver .pc-stats { background: rgba(255,255,255,0.06); }
  .t-silver .pc-stat-v { color: #fff; }

  /* Gold: ornate luxury */
  .t-gold { background: linear-gradient(150deg, #f5d878 0%, #c89a2e 25%, #f0d070 50%, #a87d1c 75%, #e8c660 100%); }
  .t-gold .pcard-inner {
    background: linear-gradient(170deg, #2b2007 0%, #1b1304 100%); color: #f3e3b3;
    box-shadow: inset 0 0 0 1px #18120399, inset 0 0 0 2.5px #c9a44066;
  }
  .t-gold .pc-tier { color: #ffd75e; text-shadow: 0 0 8px rgba(255,200,60,0.5); }
  .t-gold .pc-photo { background: linear-gradient(180deg, #3a2c0d, #261c07); }
  .t-gold .pc-photo-init { color: #c9a440; }
  .t-gold .pc-stats { background: rgba(201,164,64,0.12); }
  .t-gold .pc-stat-v { color: #ffd75e; }

  /* Platinum: geometric modern */
  .t-platinum { background: conic-gradient(from 200deg at 80% 15%, #e8ebef 0deg, #aab2bc 70deg, #d4d9df 140deg, #8f98a4 210deg, #dde1e6 290deg, #e8ebef 360deg); }
  .t-platinum .pcard-inner {
    background: linear-gradient(170deg, #1f242b 0%, #121519 100%); color: #dde2e8;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  }
  .t-platinum .pc-tier { color: #e6ebf1; letter-spacing: 0.14em; }
  .t-platinum .pc-photo { background: linear-gradient(135deg, #292f37, #191d23); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .t-platinum .pc-photo-init { color: #7e8995; }
  .t-platinum .pc-stats { background: rgba(255,255,255,0.05); }
  .t-platinum .pc-stat-v { color: #f4f7fa; }

  /* Diamond: crystal sparkle */
  .t-diamond {
    background: conic-gradient(from 0deg at 50% 50%, #e9fbff 0deg, #8fdcf2 56deg, #fff 90deg, #5cc4e8 140deg, #d4f4fd 190deg, #fff 240deg, #6fcdec 290deg, #e9fbff 360deg);
  }
  .t-diamond::after {
    content: '✦'; position: absolute; top: 14px; right: 40px; font-size: 13px; color: #fff;
    text-shadow: 0 0 8px #7fdcff; animation: sparkle 2.6s ease-in-out infinite; z-index: 3; pointer-events: none;
  }
  @keyframes sparkle { 0%,100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .t-diamond .pcard-inner { background: linear-gradient(170deg, #06202b 0%, #03131c 100%); color: #d8f4fd; box-shadow: inset 0 0 22px rgba(95,205,245,0.25); }
  .t-diamond .pc-tier { color: #8ee6ff; text-shadow: 0 0 10px rgba(120,225,255,0.7); }
  .t-diamond .pc-photo { background: linear-gradient(180deg, #0a2c3a, #051b25); }
  .t-diamond .pc-photo-init { color: #5ab8d6; }
  .t-diamond .pc-stats { background: rgba(120,225,255,0.09); }

const HERO_VIDEO_SRC = 'https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8';

function HeroVideo() {
  const videoRef = useRef(null);
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    let hls = null;
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari — native HLS
      video.src = HERO_VIDEO_SRC;
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls();
      hls.loadSource(HERO_VIDEO_SRC);
      hls.attachMedia(video);
    }
    return () => { if (hls) hls.destroy(); };
  }, []);
  return <video ref={videoRef} className="hero-video" autoPlay loop muted playsInline aria-hidden="true" />;
}

// Per-session visitor id (persists for the browser session) — used by page-view analytics
function getAnalyticsSessionId() {
  let id = sessionStorage.getItem('analytics_session_id');
  if (!id) { id = 'session_' + Math.random().toString(36).substring(2, 15); sessionStorage.setItem('analytics_session_id', id); }
  return id;
}

const RANK_TIERS = [
  { id: "bronze",   minRP: 0     },
  { id: "silver",   minRP: 150   },
  { id: "gold",     minRP: 450   },
  { id: "platinum", minRP: 1000  },
  { id: "diamond",  minRP: 2200  },
  { id: "elite",    minRP: 4500  },
  { id: "legend",   minRP: 9000  },
];
// Platform tier ids → NLS card frames (platform "elite" wears the CHAMPION frame)
const TIER_TO_NLS = { bronze: 'bronze', silver: 'silver', gold: 'gold', platinum: 'platinum', diamond: 'diamond', elite: 'champion', legend: 'legend' };

function getTierId(rp) {
  let tier = RANK_TIERS[0];
  for (const t of RANK_TIERS) { if (rp >= t.minRP) tier = t; }
  return tier.id;
}

// NLS-frame tier icons (platform tier ids → emoji), used in the progression bar
const NLS_TIER_ICON = { bronze: '🥉', silver: '🥈', gold: '🥇', platinum: '🏅', diamond: '💎', champion: '🏆', legend: '👑' };

// How close a player is to the next tier (RP-based). Returns NLS-frame labels/icons.
function getPlayerProgression(rp) {
  rp = rp || 0;
  let idx = 0;
  for (let i = 0; i < RANK_TIERS.length; i++) { if (rp >= RANK_TIERS[i].minRP) idx = i; }
  const cur = RANK_TIERS[idx];
  const next = RANK_TIERS[idx + 1] || null;
  const curNls = TIER_TO_NLS[cur.id] || 'bronze';
  if (!next) return { rp, curNls, curLabel: TIERS[curNls].label, curIcon: NLS_TIER_ICON[curNls], nextNls: null, rpNeeded: 0, pct: 100, isMax: true };
  const nextNls = TIER_TO_NLS[next.id] || 'legend';
  const span = next.minRP - cur.minRP;
  const into = rp - cur.minRP;
  const pct = span > 0 ? Math.max(0, Math.min(100, Math.round((into / span) * 100))) : 0;
  return {
    rp, curNls, curLabel: TIERS[curNls].label, curIcon: NLS_TIER_ICON[curNls],
    nextNls, nextLabel: TIERS[nextNls].label, nextIcon: NLS_TIER_ICON[nextNls],
    rpNeeded: Math.max(0, next.minRP - rp), pct, isMax: false,
  };
}

function calcPlayerRP(player, allGames, league) {
  const season  = (league && league.season) || {};
  const resetAt = season.resetAt || 0;
  const pid     = String(player.id);
  const milData = ((league && league.playerMilestones) || {})[pid] || {};
  const achieved = new Set(milData.milestones || []);
  const games = [...(allGames || [])]
    .filter(g => {
      if (!g.playerStats || g.playerStats[pid] === undefined) return false;
      if (resetAt) { const gt = new Date((g.date||'9999')+'T00:00').getTime(); if (gt < resetAt) return false; }
      return true;
    })
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if (!games.length) return 0;
  const baseScores = games.map(g => {
    const ps = g.playerStats[pid] || {};
    return Math.max(0,
      (+(ps.points||0))*1.0 + (+(ps.rebounds||0))*0.7 + (+(ps.assists||0))*1.2 +
      (+(ps.steals||0))*1.5 + (+(ps.blocks||0))*1.5 - (+(ps.turnovers||0))*1.0);
  });
  const avg = baseScores.reduce((s,x)=>s+x,0) / baseScores.length;
  let aStr = 0, bStr = 0;
  const adjusted = baseScores.map(s => {
    if (s >= avg) { aStr++; bStr = 0; } else { bStr++; aStr = 0; }
    let m = 1;
    if (s >= avg) {
      if (aStr>=7) m=1.70; else if (aStr>=6) m=1.50; else if (aStr>=5) m=1.35;
      else if (aStr>=4) m=1.25; else if (aStr>=3) m=1.15; else if (aStr>=2) m=1.08;
    } else if (bStr >= 3) m = 0.95;
    return s * m;
  });
  let total = adjusted.reduce((s,x)=>s+x,0);
  let milRP = 0;
  const gp = games.length;
  if (gp>=1  && !achieved.has('games_1'))  milRP+=5;
  if (gp>=5  && !achieved.has('games_5'))  milRP+=15;
  if (gp>=10 && !achieved.has('games_10')) milRP+=30;
  if (gp>=15 && !achieved.has('games_15')) milRP+=60;
  if (gp>=20 && !achieved.has('games_20')) milRP+=120;
  let h15=achieved.has('pts_15'),h20=achieved.has('pts_20'),h30=achieved.has('pts_30'),h40=achieved.has('pts_40');
  let hDD=achieved.has('double_double'),hTD=achieved.has('triple_double'),hQD=achieved.has('quad_double');
  let hW3=achieved.has('ws_3'),hW5=achieved.has('ws_5'),hW8=achieved.has('ws_8'),hW10=achieved.has('ws_10');
  let wStr = 0;
  games.forEach(g => {
    const ps = g.playerStats[pid]||{}; const pts=+(ps.points||0),reb=+(ps.rebounds||0),ast=+(ps.assists||0),stl=+(ps.steals||0),blk=+(ps.blocks||0);
    if (!h15&&pts>=15){milRP+=15;h15=true;} if (!h20&&pts>=20){milRP+=35;h20=true;}
    if (!h30&&pts>=30){milRP+=80;h30=true;} if (!h40&&pts>=40){milRP+=200;h40=true;}
    const t10=[pts,reb,ast,stl,blk].filter(v=>v>=10).length;
    if (!hDD&&t10>=2){milRP+=40;hDD=true;} if (!hTD&&t10>=3){milRP+=120;hTD=true;} if (!hQD&&t10>=4){milRP+=500;hQD=true;}
    const hs=parseInt(g.homeScore),as2=parseInt(g.awayScore);
    const won=!isNaN(hs)&&!isNaN(as2)&&((g.home===player.team&&hs>as2)||(g.away===player.team&&as2>hs));
    if (won) wStr++; else wStr=0;
    if (!hW3&&wStr>=3){milRP+=20;hW3=true;} if (!hW5&&wStr>=5){milRP+=45;hW5=true;}
    if (!hW8&&wStr>=8){milRP+=100;hW8=true;} if (!hW10&&wStr>=10){milRP+=250;hW10=true;}
  });
  const adjTotal = (milData.rpAdjustments||[]).reduce((s,a)=>s+(+(a.amount||0)),0);
  return Math.max(0, Math.round(total + milRP + adjTotal));
}

function formatHeight(height, units) {
  if (!height && height !== 0) return '';
  if (units === 'metric') return `${height} cm`;
  const ft = Math.floor(height / 12);
  const inches = height % 12;
  return `${ft}'${inches}"`;
}
function formatWeight(weight, units) {
  if (!weight && weight !== 0) return '';
  return units === 'metric' ? `${weight} kg` : `${weight} lbs`;
}

function deriveArchetype(tierNls, ppg, rpg, apg) {
  if (tierNls === 'legend')   return { fr: 'ICÔNE',     en: 'ICON' };
  if (tierNls === 'champion') return { fr: 'FINISSEUR', en: 'CLOSER' };
  const best = Math.max(ppg, rpg, apg);
  if (best === apg && apg > 0) return { fr: 'CRÉATEUR',  en: 'PLAYMAKER' };
  if (best === rpg && rpg > 0) return { fr: 'REBONDEUR', en: 'REBOUNDER' };
  if (ppg >= 18)               return { fr: 'SNIPER',    en: 'SNIPER' };
  if (ppg > 0)                 return { fr: 'MARQUEUR',  en: 'SCORER' };
  return { fr: 'BATAILLEUR', en: 'GRINDER' };
}

// Transform raw Firestore docs into the view shape the NLS UI renders
function buildLiveViewData(meta, rawTeams, rawPlayers, rawGames) {
  const units = (meta && meta.units) || 'imperial';
  const leagueLike = { season: meta && meta.season, playerMilestones: meta && meta.playerMilestones };

  // Games → normalized schedule
  const games = (rawGames || []).map(g => {
    const hs = (g.homeScore !== undefined && g.homeScore !== null && g.homeScore !== '') ? +g.homeScore : null;
    const as = (g.awayScore !== undefined && g.awayScore !== null && g.awayScore !== '') ? +g.awayScore : null;
    return { id: g.id, date: g.date || '', time: g.time || '', home: g.home || '', away: g.away || '', venue: g.venue || '', categoryId: g.categoryId != null ? String(g.categoryId) : '', hs, as, playerStats: g.playerStats || {} };
  });

  // Teams → computed W-L + last 5 + points for/against from completed games
  const played = games.filter(g => g.hs !== null && g.as !== null).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const teams = (rawTeams || []).map((tm, i) => {
    const results = [];
    let pf = 0, pa = 0;
    played.forEach(g => {
      if (g.home === tm.name) { results.push(g.hs > g.as ? 1 : 0); pf += g.hs; pa += g.as; }
      else if (g.away === tm.name) { results.push(g.as > g.hs ? 1 : 0); pf += g.as; pa += g.hs; }
    });
    const w = results.filter(r => r).length;
    return { id: tm.id || i, name: tm.name || '', emoji: tm.emoji || '🏀', logoUrl: tm.logoUrl || '', color: tm.color || '#ff6b1a', categoryId: tm.categoryId != null ? String(tm.categoryId) : '', w, l: results.length - w, pf, pa, last5: results.slice(-5) };
  });

  // Players → stats averages + tier + archetype + bio fields
  const players = (rawPlayers || []).map(p => {
    const pid = String(p.id);
    const pGames = games.filter(g => g.playerStats && g.playerStats[pid] !== undefined);
    const gp = pGames.length;
    const sum = k => pGames.reduce((s, g) => s + (+((g.playerStats[pid] || {})[k] || 0)), 0);
    const ppg = gp ? sum('points') / gp : 0;
    const rpg = gp ? sum('rebounds') / gp : 0;
    const apg = gp ? sum('assists') / gp : 0;
    const spg = gp ? sum('steals') / gp : 0;
    const bpg = gp ? sum('blocks') / gp : 0;
    const rp = calcPlayerRP({ ...p, id: pid }, games, leagueLike);
    const tierNls = TIER_TO_NLS[getTierId(rp)] || 'bronze';
    return {
      id: pid, name: p.name || '', team: p.team || '', pos: p.position || '',
      number: p.number || '', photoUrl: p.photoUrl || '',
      height: p.height, weight: p.weight, categoryId: p.categoryId != null ? String(p.categoryId) : '',
      tier: tierNls, arch: deriveArchetype(tierNls, ppg, rpg, apg),
      ppg, rpg, apg, spg, bpg, gp, rp,
    };
  });

  // Categories, sorted by the owner's saved categoryOrder when present (else array/insertion order)
  const rawCats = ((meta && meta.categories) || []).map(c => ({ id: String(c.id), name: c.displayName || c.name || 'Catégorie' }));
  const catOrder = ((meta && meta.categoryOrder) || []).map(String);
  const categories = catOrder.length
    ? [...rawCats].sort((a, b) => { const ia = catOrder.indexOf(a.id), ib = catOrder.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); })
    : rawCats;

  return { teams, players, games, units, categories, ps: (meta && meta.publicSettings) || {}, meta };
}

// Real-time Firestore listeners — same 4-listener pattern as public.html
function useLeagueData() {
  const [meta, setMeta] = useState(null);
  const [teams, setTeams] = useState([]);
  const [players, setPlayers] = useState([]);
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(!!LIVE_LEAGUE_ID);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!LIVE_LEAGUE_ID) return;
    let unsubs = [];
    const psUnsubs = new Map(); // gameId -> unsub

    function startListeners() {
      const _db = window.__wxDB;
      const _FS = window.__wxFS || {};
      if (!window.__wxFirebaseReady || !_db) return;
      const { doc, collection, onSnapshot } = _FS;
      const lid = String(LIVE_LEAGUE_ID);

      unsubs.push(onSnapshot(doc(_db, 'leagues', lid),
        snap => {
          if (!snap.exists()) { setError('not-found'); setLoading(false); return; }
          setMeta(snap.data()); setLoading(false);
        },
        err => { console.error('[NLS] League doc listen error:', err); setError('connection'); setLoading(false); }
      ));

      unsubs.push(onSnapshot(collection(_db, 'leagues', lid, 'teams'),
        snap => setTeams(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
        err => console.error('[NLS] Teams listen error:', err)
      ));

      unsubs.push(onSnapshot(collection(_db, 'leagues', lid, 'players'),
        snap => setPlayers(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
        err => console.error('[NLS] Players listen error:', err)
      ));

      unsubs.push(onSnapshot(collection(_db, 'leagues', lid, 'games'),
        snap => {
          setGames(prev => snap.docs.map(d => {
            const existing = prev.find(g => String(g.id) === d.id);
            return { id: d.id, ...d.data(), playerStats: (existing && existing.playerStats) || {} };
          }));
          // Sync nested playerStats listeners with current game set
          const ids = new Set(snap.docs.map(d => d.id));
          for (const [gid, u] of psUnsubs.entries()) {
            if (!ids.has(gid)) { u(); psUnsubs.delete(gid); }
          }
          snap.docs.forEach(d => {
            const gid = d.id;
            if (!psUnsubs.has(gid)) {
              psUnsubs.set(gid, onSnapshot(collection(_db, 'leagues', lid, 'games', gid, 'playerStats'),
                psSnap => {
                  const stats = {};
                  psSnap.docs.forEach(ps => { stats[ps.id] = ps.data(); });
                  setGames(prev => prev.map(g => String(g.id) === gid ? { ...g, playerStats: stats } : g));
                },
                err => console.error(`[NLS] PlayerStats listen error for game ${gid}:`, err)
              ));
            }
          });
        },
        err => console.error('[NLS] Games listen error:', err)
      ));
    }

    if (window.__wxFirebaseReady) startListeners();
    else window.addEventListener('wxFirebaseReady', startListeners, { once: true });

    return () => { unsubs.forEach(u => u()); psUnsubs.forEach(u => u()); };
  }, []);

  return { live: !!LIVE_LEAGUE_ID, meta, teams, players, games, loading, error };
}

/* ═══════════ PLAYER CARD ═══════════ */
function PlayerCard({ p, lang, t, onShare, onOpen, teams, units }) {
  const tier = TIERS[p.tier];
  const team = (teams || []).find(tm => tm.name === p.team);
  const initials = p.name.split(' ').map(w => w[0]).join('');
  const fh = formatHeight(p.height, units);
  const fw = formatWeight(p.weight, units);
  return (
    <div className={`pcard ${tier.cls}`} id={`pcard-${p.id}`} onClick={onOpen ? () => onOpen(p) : undefined}>
      <div className="pcard-inner">
        <div className="pc-top">
          <span className="pc-league">NLS</span>
          <div className="pc-tier-block">
            <div className="pc-tier">{tier.label}</div>
            <div className="pc-arch">{p.arch[lang]}</div>
          </div>
        </div>
        <div className="pc-photo">
          {p.photoUrl
            ? <img src={p.photoUrl} alt={p.name} loading="lazy" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
            : <span className="pc-photo-init">{initials}</span>}
        </div>
        <div className="pc-bottom">
          <div className="pc-name">{p.number ? `#${p.number} ` : ''}{p.name}</div>
          <div className="pc-meta">{team ? team.emoji + ' ' : ''}{p.team}{p.pos ? ` · ${p.pos}` : ''}</div>
          {(fh || fw) && <div className="pc-meta" style={{ marginTop: 2, opacity: 0.55 }}>{fh}{fh && fw ? ' • ' : ''}{fw}</div>}
        </div>
        <div className="pc-stats">
          <div className="pc-stat"><div className="pc-stat-v">{p.ppg.toFixed(1)}</div><div className="pc-stat-k">{t.ppg}</div></div>
          <div className="pc-stat"><div className="pc-stat-v">{p.rpg.toFixed(1)}</div><div className="pc-stat-k">{t.rpg}</div></div>
          <div className="pc-stat"><div className="pc-stat-v">{p.apg.toFixed(1)}</div><div className="pc-stat-k">{t.apg}</div></div>
        </div>
      </div>
      <button className="pc-share" title={t.download} onClick={e => { e.stopPropagation(); onShare(p); }}>⤓</button>
    </div>
  );
}

function PlayerModal({ p, teams, units, lang, t, games, onClose, onShare }) {
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const team = (teams || []).find(tm => tm.name === p.team);
  const pid = p.id;
  const pGames = (games || [])
    .filter(g => g.hs !== null && g.playerStats && g.playerStats[pid] !== undefined)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const sumK = k => pGames.reduce((s, g) => s + (+((g.playerStats[pid] || {})[k] || 0)), 0);
  const fgPct = sumK('fga') > 0 ? (sumK('fgm') / sumK('fga') * 100).toFixed(1) : null;
  const ftPct = sumK('fta') > 0 ? (sumK('ftm') / sumK('fta') * 100).toFixed(1) : null;
  const prog = getPlayerProgression(p.rp);
  const statCells = [
    ['PTS/G', p.ppg.toFixed(1)], ['REB/G', p.rpg.toFixed(1)], ['AST/G', p.apg.toFixed(1)],
    ['STL/G', (p.spg || 0).toFixed(1)], ['BLK/G', (p.bpg || 0).toFixed(1)],
    ...(fgPct !== null ? [['FG%', fgPct + '%']] : []),
    ...(ftPct !== null ? [['FT%', ftPct + '%']] : []),
    [t.gp, String(p.gp || 0)],
  ];

  return (
    <div className="modal-ov" onClick={e => { if (e.target.classList.contains('modal-ov')) onClose(); }}>
      <div className="pmodal" style={{ position: 'relative' }}>
        <button className="pmodal-close" onClick={onClose} aria-label="Close">✕</button>
        <div className="pmodal-body">
          <div className="pmodal-left">
            <PlayerCard p={p} lang={lang} t={t} teams={teams} units={units} onShare={onShare} />
          </div>
          <div className="pmodal-right">
            <div className="pm-name">{p.number ? `#${p.number} ` : ''}{p.name}</div>
            <div className="pm-sub">{team ? team.emoji + ' ' : ''}{p.team}{p.pos ? ' · ' + p.pos : ''} · {p.arch[lang]}</div>

            <div className="pm-section-t">{t.seasonStats}</div>
            <div className="pm-stats-grid">
              {statCells.map(([k, v]) => (
                <div key={k} className="pm-stat"><div className="pm-stat-v">{v}</div><div className="pm-stat-k">{k}</div></div>
              ))}
            </div>

            <div className="pm-section-t">{t.tierProgress}</div>
            <div className="pm-prog-head">
              <span className="pm-prog-tier">{prog.curIcon} {prog.curLabel}</span>
              {!prog.isMax && <span className="pm-prog-tier" style={{ color: 'var(--ink-soft)' }}>{prog.nextIcon} {prog.nextLabel}</span>}
            </div>
            <div className="pm-prog-bar"><div className="pm-prog-fill" style={{ width: prog.pct + '%' }}></div></div>
            <div className="pm-prog-need">{prog.isMax ? t.maxTier : t.rpToReach(prog.rpNeeded, prog.nextLabel)}</div>

            <div className="pm-section-t">{t.gameLog}</div>
            {pGames.length > 0 ? (
              <div style={{ overflowX: 'auto' }}>
                <table className="pm-log">
                  <thead><tr><th>Date</th><th>{t.opponent}</th><th style={{ textAlign: 'center' }}>{t.ppg}</th><th style={{ textAlign: 'center' }}>{t.rpg}</th><th style={{ textAlign: 'center' }}>{t.apg}</th></tr></thead>
                  <tbody>
                    {pGames.map(g => {
                      const opp = g.home === p.team ? g.away : g.home;
                      const st = g.playerStats[pid] || {};
                      return (
                        <tr key={g.id}>
                          <td style={{ color: 'var(--ink-soft)', whiteSpace: 'nowrap' }}>{fmtDate(g.date, lang)}</td>
                          <td style={{ whiteSpace: 'nowrap' }}>{opp}</td>
                          <td style={{ textAlign: 'center', fontWeight: 700 }}>{+(st.points || 0)}</td>
                          <td style={{ textAlign: 'center' }}>{+(st.rebounds || 0)}</td>
                          <td style={{ textAlign: 'center' }}>{+(st.assists || 0)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            ) : (
              <div className="pm-prog-need" style={{ textAlign: 'left' }}>{t.noGamesYet}</div>
            )}

            <div className="pm-actions">
              <button className="pm-btn" style={{ background: 'var(--orange)', color: '#000' }} onClick={() => onShare(p)}>⤓ {t.download}</button>
              <button className="pm-btn" style={{ background: 'var(--surface-2)', color: 'var(--ink)' }} onClick={() => {
                const url = `${location.origin}${location.pathname}?league=${LIVE_LEAGUE_ID || ''}&player=${p.id}`;
                if (navigator.share) navigator.share({ title: p.name, url }).catch(() => {});
                else navigator.clipboard.writeText(url).then(() => {}).catch(() => {});
              }}>🔗 {t.share}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════ APP ═══════════ */
function App() {
  const [lang, setLang] = useState('fr');
  const t = STR[lang];

  // ── DATA — live Firestore when ?league= is set, demo data otherwise ──
  const data = useLeagueData();
  const live = data.live;
  const view = useMemo(() => live
    ? buildLiveViewData(data.meta, data.teams, data.players, data.games)
    : { teams: DEMO_TEAMS, players: DEMO_PLAYERS, games: DEMO_GAMES, units: 'imperial', categories: [], ps: {}, meta: null },
    [live, data.meta, data.teams, data.players, data.games]);
  const TEAMS = view.teams, PLAYERS = view.players, GAMES = view.games;
  const ps = {
    showStandings: true, showSchedule: true, showPlayers: true,
    showPlayerCards: true, showStats: true, showLeagueInfo: true,
    ...(view.ps || {}),
  };
  // Owner-editable league message (Website X → Settings → League Message); blank fields fall back to defaults
  const lm = (view.meta && view.meta.leagueMessage) || {};

  // Owner-set accent color (publicSettings.accentColor) — falls back to NLS orange
  useEffect(() => {
    const c = (ps.accentColor || '').trim();
    document.documentElement.style.setProperty('--orange', /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#ff6b1a');
  }, [ps.accentColor]);

  // ── PAGE VIEW ANALYTICS — record on load + on hash (section) change ──
  useEffect(() => {
    if (!LIVE_LEAGUE_ID) return;
    function track() {
      const _db = window.__wxDB, _FS = window.__wxFS || {};
      if (!window.__wxFirebaseReady || !_db || !_FS.setDoc || !_FS.doc) return;
      const section = (window.location.hash || '').replace('#', '') || 'home';
      const today = new Date().toISOString().split('T')[0];
      const viewId = 'v_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
      _FS.setDoc(_FS.doc(_db, 'leagues', String(LIVE_LEAGUE_ID), 'pageViews', viewId), {
        timestamp: Date.now(), date: today, section,
        sessionId: getAnalyticsSessionId(), userAgent: navigator.userAgent || '',
      }).catch(e => console.error('[NLS Analytics] track error:', e));
    }
    if (window.__wxFirebaseReady) track();
    else window.addEventListener('wxFirebaseReady', track, { once: true });
    window.addEventListener('hashchange', track);
    return () => window.removeEventListener('hashchange', track);
  }, []);

  // ── CATEGORY-FIRST NAVIGATION ──
  // Flow: hero → "Explore" → category selector → tabbed, category-filtered sections.
  const cats = view.categories || [];
  // Leagues with no categories get one synthetic "whole league" option so the flow still completes
  const effectiveCats = cats.length ? cats : [{ id: '__all__', name: lang === 'fr' ? 'Toute la ligue' : 'Whole league' }];
  const [showExplorer, setShowExplorer] = useState(false);
  const [selectedCat, setSelectedCat] = useState(null);   // chosen category id (null until picked)
  const [activeTab, setActiveTab] = useState('standings'); // standings | schedule | players | stats
  const [catSearch, setCatSearch] = useState('');
  // True when the entity's categoryId belongs to the selected category (or "whole league")
  const catMatch = (catId) => selectedCat === '__all__' || catId === selectedCat;

  // standings
  const [sortKey, setSortKey] = useState('rank');
  const [openTeam, setOpenTeam] = useState(null);
  const standings = useMemo(() => {
    let src = TEAMS.filter(tm => catMatch(tm.categoryId));
    const rows = src.map(tm => ({ ...tm, pct: (tm.w + tm.l) > 0 ? tm.w / (tm.w + tm.l) : 0 }));
    if (sortKey === 'wins') rows.sort((a, b) => b.w - a.w);
    else rows.sort((a, b) => b.pct - a.pct);
    return rows;
  }, [sortKey, TEAMS, selectedCat]);

  // schedule
  const [schedFilter, setSchedFilter] = useState('all');
  const [schedTeam, setSchedTeam] = useState('all');
  const [openGame, setOpenGame] = useState(null);
  // Team names belonging to the selected category (drives schedule/player team dropdowns + game filtering)
  const catTeamNames = useMemo(() => new Set(TEAMS.filter(tm => catMatch(tm.categoryId)).map(tm => tm.name)), [TEAMS, selectedCat]);
  const games = useMemo(() => {
    let g = [...GAMES]
      .filter(x => catMatch(x.categoryId) || catTeamNames.has(x.home) || catTeamNames.has(x.away))
      .sort((a, b) => a.date.localeCompare(b.date));
    if (schedFilter === 'upcoming') g = g.filter(x => x.hs === null);
    if (schedFilter === 'past') g = g.filter(x => x.hs !== null).reverse();
    if (schedTeam !== 'all') g = g.filter(x => x.home === schedTeam || x.away === schedTeam);
    return g;
  }, [schedFilter, schedTeam, GAMES, selectedCat, catTeamNames]);

  // players
  const [search, setSearch] = useState('');
  const [fTier, setFTier] = useState('all');
  const [fTeam, setFTeam] = useState('all');
  const [fArch, setFArch] = useState('all');
  const [showAllPlayers, setShowAllPlayers] = useState(false);
  const [selectedPlayer, setSelectedPlayer] = useState(null); // player profile modal
  const archetypes = useMemo(() => {
    const seen = new Map();
    PLAYERS.forEach(p => { const a = p.arch && p.arch[lang]; if (a && !seen.has(a)) seen.set(a, a); });
    return Array.from(seen.keys()).sort();
  }, [PLAYERS, lang]);
  const players = useMemo(() => {
    let ps = [...PLAYERS]
      .filter(p => catMatch(p.categoryId) || catTeamNames.has(p.team))
      .sort((a, b) => (b.rp || 0) - (a.rp || 0) || TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
    if (search) ps = ps.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
    if (fTier !== 'all') ps = ps.filter(p => p.tier === fTier);
    if (fTeam !== 'all') ps = ps.filter(p => p.team === fTeam);
    if (fArch !== 'all') ps = ps.filter(p => p.arch && p.arch[lang] === fArch);
    return ps;
  }, [search, fTier, fTeam, fArch, PLAYERS, lang, selectedCat, catTeamNames]);
  // Default view shows top 5; "View All" or any active filter reveals the full filterable gallery
  const anyPlayerFilter = !!search || fTier !== 'all' || fTeam !== 'all' || fArch !== 'all';
  const galleryOpen = showAllPlayers || anyPlayerFilter;
  const shownPlayers = galleryOpen ? players : players.slice(0, 5);

  // category-scoped stat leaders
  const leaders = key => [...PLAYERS]
    .filter(p => catMatch(p.categoryId) || catTeamNames.has(p.team))
    .sort((a, b) => (b[key] || 0) - (a[key] || 0)).slice(0, 5);

  // Open the explorer and scroll to the category selector — shared by every "Explore" button
  const openExplorer = () => { setShowExplorer(true); setTimeout(() => { const el = document.getElementById('explorer'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); };

  // Showcase: best player from up to 4 distinct categories (fills with next-best if fewer categories)
  const showcasePlayers = useMemo(() => {
    const ranked = [...PLAYERS].sort((a, b) => (b.rp || 0) - (a.rp || 0));
    const byCat = new Map();
    ranked.forEach(p => { const c = p.categoryId || '__none__'; if (!byCat.has(c)) byCat.set(c, p); });
    const picks = Array.from(byCat.values()).slice(0, 4);
    const ids = new Set(picks.map(p => p.id));
    for (const p of ranked) { if (picks.length >= 4) break; if (!ids.has(p.id)) { picks.push(p); ids.add(p.id); } }
    return picks;
  }, [PLAYERS]);

  // PNG export
  function shareCard(p) {
    const el = document.getElementById(`pcard-${p.id}`);
    if (!el || typeof html2canvas === 'undefined') return;
    html2canvas(el, { backgroundColor: null, scale: 3 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `${p.name.replace(/\s+/g, '-')}-NLS-card.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  const [logoOk, setLogoOk] = useState(true);

  return (
    <div>
      {/* ── HERO ── */}
      <header className="hero">
        <HeroVideo />
        <div className="hero-scrim"></div>
        <div className="hero-fade-top"></div>
        <div className="hero-fade-bottom"></div>
        <div className="hero-ball"></div>
        <div className="hero-topbar">
          {logoOk
            ? <img className="hero-logo" src={NLS_LOGO} alt="NLS Création" onError={() => setLogoOk(false)} />
            : <div className="hero-logo-fallback">NLS<span>·</span>CRÉATION</div>}
          <div className="lang-toggle">
            <button className={lang === 'fr' ? 'active' : ''} onClick={() => setLang('fr')}>FR</button>
            <button className={lang === 'en' ? 'active' : ''} onClick={() => setLang('en')}>EN</button>
          </div>
        </div>
        <div className="hero-inner">
          <div className="hero-kicker">{live && view.meta && view.meta.name ? view.meta.name.toUpperCase() : t.kicker}</div>
          <h1 className="hero-title">{t.heroTitle}</h1>
          <p className="hero-sub">{t.heroSub}</p>
          <button className="hero-cta" style={{ border: 'none', cursor: 'pointer' }} onClick={openExplorer}>
            {t.cta} →
          </button>
        </div>
      </header>

      {/* ── LOADING / ERROR OVERLAYS (live mode) ── */}
      {live && data.loading && (
        <div style={{ position: 'fixed', inset: 0, background: 'var(--bg)', zIndex: 500, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 22 }}>
          <div style={{ width: 72, height: 72, borderRadius: '50%', background: 'radial-gradient(circle at 35% 30%, #ff8d4d, #c24808 70%, #6e2604)', animation: 'floatBall 1.1s ease-in-out infinite' }}></div>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.32em', color: 'var(--ink-soft)', textTransform: 'uppercase' }}>{t.loadingLeague}</div>
        </div>
      )}
      {live && data.error === 'not-found' && (
        <div style={{ position: 'fixed', inset: 0, background: 'var(--bg)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 44, marginBottom: 14 }}>🏀</div>
            <div style={{ fontFamily: 'var(--ff-display)', fontSize: 24, marginBottom: 8 }}>404</div>
            <div style={{ fontSize: 14, color: 'var(--ink-soft)' }}>{t.notFound}</div>
          </div>
        </div>
      )}

      {/* ── LANDING SECTIONS (shown before the visitor enters the explorer) ── */}
      {!showExplorer && (
        <>
          {/* Section 1 — Player Cards Showcase (arc/carousel) */}
          {(ps.showPlayers !== false && ps.showPlayerCards !== false) && showcasePlayers.length > 0 && (
            <section className="landing-sec">
              <div className="lsec-title">{t.showcaseTitle}</div>
              <div className="lsec-sub">{t.showcaseSub}</div>
              <div className="arc-row">
                {showcasePlayers.map(p => (
                  <div key={p.id} className="arc-card">
                    <PlayerCard p={p} lang={lang} t={t} onShare={shareCard} onOpen={setSelectedPlayer} teams={TEAMS} units={view.units} />
                  </div>
                ))}
              </div>
              <button className="hero-cta" style={{ marginTop: 0, border: 'none', cursor: 'pointer' }} onClick={openExplorer}>{t.cta} →</button>
            </section>
          )}

          {/* Section 2 — League Message / Mission (editable via Website X) */}
          <section className="landing-sec">
            <div className="sec-kicker">{lm.subtitle || t.missionSub}</div>
            <div className="lsec-title">{lm.title || t.missionTitle}</div>
            <div className="mission-body">
              {lm.body
                ? lm.body.split('\n').map((para, i) => <React.Fragment key={i}>{i > 0 && <><br /><br /></>}{para}</React.Fragment>)
                : <>{t.missionP1}<br /><br />{t.missionP2}</>}
            </div>
            <div className="mission-pillars">
              {[
                ['🏆', t.pillarExcellence, t.pillarExcellenceD],
                ['🤝', t.pillarCommunity, t.pillarCommunityD],
                ['📈', t.pillarProgress, t.pillarProgressD],
              ].map(([icon, title, desc]) => (
                <div key={title} className="pillar">
                  <div className="pillar-icon">{icon}</div>
                  <div className="pillar-t">{title}</div>
                  <div className="pillar-d">{desc}</div>
                </div>
              ))}
            </div>
            <button className="hero-cta" style={{ marginTop: 0, border: 'none', cursor: 'pointer' }} onClick={openExplorer}>{lm.cta || `${t.cta} →`}</button>
          </section>
        </>
      )}

      {/* ── CATEGORY SELECTOR (shown after Explore, before a category is chosen) ── */}
      {showExplorer && !selectedCat && (
        <section className="cat-selector" id="explorer">
          <h2>{t.selectCat}</h2>
          <div className="cs-sub">{t.selectCatSub}</div>
          <div className="cat-grid">
            {effectiveCats.filter(c => c.name.toLowerCase().includes(catSearch.toLowerCase())).map(c => (
              <button key={c.id} className="cat-btn" onClick={() => { setSelectedCat(c.id); setActiveTab('standings'); setShowAllPlayers(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
                <div className="cat-btn-icon">🏀</div>{c.name}
              </button>
            ))}
          </div>
          {effectiveCats.length > 4 && (
            <input className="search-inp" placeholder={t.searchCat} value={catSearch} onChange={e => setCatSearch(e.target.value)} />
          )}
          {effectiveCats.filter(c => c.name.toLowerCase().includes(catSearch.toLowerCase())).length === 0 && (
            <div className="empty-note">{t.noCatMatch}</div>
          )}
        </section>
      )}

      {/* ── CATEGORY HEADER + TAB NAV (shown once a category is chosen) ── */}
      {selectedCat && (() => {
        const catName = (effectiveCats.find(c => c.id === selectedCat) || {}).name || '';
        const tabs = [
          ps.showStandings !== false && ['standings', t.navStandings],
          ps.showSchedule !== false && ['schedule', t.navSchedule],
          (ps.showPlayers !== false && ps.showPlayerCards !== false) && ['players', t.navPlayers],
          ps.showStats !== false && ['stats', t.navStats],
        ].filter(Boolean);
        return (
          <>
            <div className="cat-header">
              <div className="cat-header-inner">
                <div className="cat-header-title">{catName}</div>
                <button className="cat-change" onClick={() => { setSelectedCat(null); setCatSearch(''); setSchedTeam('all'); setFTeam('all'); setSearch(''); setTimeout(() => { const el = document.getElementById('explorer'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); }}>{t.changeCat}</button>
              </div>
            </div>
            <nav className="nav">
              {tabs.map(([k, label]) => (
                <a key={k} className={activeTab === k ? 'active' : ''} style={{ cursor: 'pointer' }} onClick={() => setActiveTab(k)}>{label}</a>
              ))}
            </nav>
          </>
        );
      })()}

      {/* ── STANDINGS ── */}
      {selectedCat && activeTab === 'standings' && ps.showStandings !== false && (
      <section className="section" id="classement">
        <div className="sec-kicker">{t.standingsKicker}</div>
        <h2 className="sec-title">{t.standingsTitle}</h2>
        <div className="standings-card">
          <table className="standings-table">
            <thead>
              <tr>
                <th onClick={() => setSortKey('rank')}>{t.thRank}</th>
                <th>{t.thTeam}</th>
                <th onClick={() => setSortKey('wins')}>{t.thRecord}</th>
                <th className="hide-m" onClick={() => setSortKey('rank')}>{t.thPct}</th>
                <th className="hide-m" title="Points For">{t.thPF}</th>
                <th className="hide-m" title="Points Against">{t.thPA}</th>
                <th className="hide-m">{t.thLast5}</th>
              </tr>
            </thead>
            <tbody>
              {standings.map((tm, i) => (
                <React.Fragment key={tm.id}>
                  <tr onClick={() => setOpenTeam(openTeam === tm.id ? null : tm.id)}>
                    <td><span className={`rank-badge rank-${i + 1}`}>{i + 1}</span></td>
                    <td>
                      <div className="team-cell">
                        <div className="team-logo-sq" style={{ background: (tm.color || '#ff6b1a') + '22', overflow: 'hidden' }}>
                          {tm.logoUrl
                            ? <img src={tm.logoUrl} alt={tm.name} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                            : tm.emoji}
                        </div>
                        {tm.name}
                      </div>
                    </td>
                    <td style={{ fontWeight: 700 }}>{tm.w}–{tm.l}</td>
                    <td className="hide-m" style={{ color: 'var(--ink-mid)' }}>{(tm.pct * 100).toFixed(1)}%</td>
                    <td className="hide-m" style={{ color: 'var(--ink-mid)', fontVariantNumeric: 'tabular-nums' }}>{tm.pf || 0}</td>
                    <td className="hide-m" style={{ color: 'var(--ink-mid)', fontVariantNumeric: 'tabular-nums' }}>{tm.pa || 0}</td>
                    <td className="hide-m">
                      <div className="last5">{tm.last5.map((r, j) => <span key={j} className={`l5-dot ${r ? 'l5-w' : 'l5-l'}`}></span>)}</div>
                    </td>
                  </tr>
                  {openTeam === tm.id && (
                    <tr className="roster-row">
                      <td colSpan="7">
                        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginBottom: 10 }}>{t.roster}</div>
                        <div className="roster-chips">
                          {PLAYERS.filter(p => p.team === tm.name).map(p => (
                            <span key={p.id} className="roster-chip"><b>{p.name}</b> · {p.pos} · {p.ppg.toFixed(1)} {t.ppg}</span>
                          ))}
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </section>
      )}

      {/* ── SCHEDULE ── */}
      {selectedCat && activeTab === 'schedule' && ps.showSchedule !== false && (
      <section className="section" id="calendrier">
        <div className="sec-kicker">{t.schedKicker}</div>
        <h2 className="sec-title">{t.schedTitle}</h2>
        <div className="sched-filters">
          {[['all', t.fAll], ['upcoming', t.fUpcoming], ['past', t.fPast]].map(([k, l]) => (
            <button key={k} className={`chip-btn ${schedFilter === k ? 'active' : ''}`} onClick={() => setSchedFilter(k)}>{l}</button>
          ))}
          <select className="filter-select" value={schedTeam} onChange={e => setSchedTeam(e.target.value)}>
            <option value="all">{t.allTeams}</option>
            {TEAMS.filter(tm => catMatch(tm.categoryId)).map(tm => <option key={tm.id} value={tm.name}>{tm.name}</option>)}
          </select>
        </div>
        <div className="games-grid">
          {games.map(g => {
            const played = g.hs !== null;
            const homeTeam = TEAMS.find(tm => tm.name === g.home), awayTeam = TEAMS.find(tm => tm.name === g.away);
            return (
              <div key={g.id} className="game-card" onClick={() => setOpenGame(g)}>
                <div className="game-date">
                  <span>{fmtDate(g.date, lang)} · {g.time}</span>
                  <span className={played ? 'game-final' : 'game-status-live'}>{played ? t.final : t.upcoming}</span>
                </div>
                <div className="game-matchup">
                  <div className="game-team">
                    <div className="game-team-info"><span>{awayTeam?.emoji}</span>{g.away}</div>
                    {played && <span className={`game-score ${g.as > g.hs ? 'winner' : 'loser'}`}>{g.as}</span>}
                  </div>
                  <div className="game-team">
                    <div className="game-team-info"><span>{homeTeam?.emoji}</span>{g.home}</div>
                    {played && <span className={`game-score ${g.hs > g.as ? 'winner' : 'loser'}`}>{g.hs}</span>}
                  </div>
                </div>
                <div className="game-venue"><span>📍 {g.venue}</span></div>
              </div>
            );
          })}
          {!games.length && <div className="empty-note" style={{ gridColumn: '1/-1' }}>—</div>}
        </div>
      </section>
      )}

      {/* ── PLAYERS ── */}
      {selectedCat && activeTab === 'players' && ps.showPlayers !== false && ps.showPlayerCards !== false && (
      <section className="section" id="joueurs">
        <div className="sec-kicker">{t.playersKicker}</div>
        <h2 className="sec-title">{t.playersTitle}</h2>
        {/* Full filter bar — only once the gallery is open (top-5 preview stays clean) */}
        {galleryOpen && (
          <div className="player-filters">
            <input className="search-inp" placeholder={t.searchPh} value={search} onChange={e => setSearch(e.target.value)} />
            <select className="filter-select" value={fTier} onChange={e => setFTier(e.target.value)}>
              <option value="all">{t.allTiers}</option>
              {TIER_ORDER.map(k => <option key={k} value={k}>{TIERS[k].label}</option>)}
            </select>
            <select className="filter-select" value={fArch} onChange={e => setFArch(e.target.value)}>
              <option value="all">{t.allArch}</option>
              {archetypes.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <select className="filter-select" value={fTeam} onChange={e => setFTeam(e.target.value)}>
              <option value="all">{t.allTeams}</option>
              {TEAMS.filter(tm => catMatch(tm.categoryId)).map(tm => <option key={tm.id} value={tm.name}>{tm.name}</option>)}
            </select>
          </div>
        )}
        <div className="cards-grid">
          {shownPlayers.map(p => <PlayerCard key={p.id} p={p} lang={lang} t={t} onShare={shareCard} onOpen={setSelectedPlayer} teams={TEAMS} units={view.units} />)}
        </div>
        {!shownPlayers.length && <div className="empty-note">{t.noPlayers}</div>}
        {/* View All / Show top 5 toggle */}
        {!anyPlayerFilter && players.length > 5 && (
          <div style={{ textAlign: 'center', marginTop: 30 }}>
            <button className="hero-cta" style={{ marginTop: 0, fontSize: 13, padding: '13px 34px' }}
              onClick={() => setShowAllPlayers(v => !v)}>
              {showAllPlayers ? t.showTop5 : `${t.viewAllPlayers} (${players.length})`}
            </button>
          </div>
        )}
      </section>
      )}

      {/* ── STATS ── */}
      {selectedCat && activeTab === 'stats' && ps.showStats !== false && (
      <section className="section" id="statistiques">
        <div className="sec-kicker">{t.statsKicker}</div>
        <h2 className="sec-title">{t.statsTitle}</h2>
        <div className="leaders-grid">
          {[
            ['ppg', t.topScorers], ['rpg', t.topRebounders], ['apg', t.topPlaymakers],
            ...(PLAYERS.some(p => (p.spg || 0) > 0) ? [['spg', t.topSteals]] : []),
            ...(PLAYERS.some(p => (p.bpg || 0) > 0) ? [['bpg', t.topBlocks]] : []),
          ].map(([key, title]) => {
            const top = leaders(key);
            if (!top.length) return null;
            const max = top[0][key] || 1;
            return (
              <div key={key} className="leader-card">
                <div className="leader-title">{title}</div>
                {top.map((p, i) => (
                  <div key={p.id} className="leader-row">
                    <span className="leader-rank">{i + 1}</span>
                    <div className="leader-info">
                      <div className="leader-name">{p.name}</div>
                      <div className="leader-team">{p.team}</div>
                      <div className="leader-bar"><div className="leader-bar-fill" style={{ width: ((p[key] || 0) / max * 100) + '%' }}></div></div>
                    </div>
                    <span className="leader-val">{(p[key] || 0).toFixed(1)}</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </section>
      )}

      {/* ── FOOTER ── */}
      <footer className="footer">
        <div className="footer-grid">
          <div style={{ maxWidth: 320 }}>
            <div className="footer-brand">NLS<span>·</span>CRÉATION</div>
            <p>{t.footerAbout}</p>
          </div>
          <div>
            <h4>{t.footerLeague}</h4>
            <a href="#classement">{t.navStandings}</a>
            <a href="#calendrier">{t.navSchedule}</a>
            <a href="#joueurs">{t.navPlayers}</a>
            <a href="#statistiques">{t.navStats}</a>
          </div>
          <div>
            <h4>{t.footerContact}</h4>
            <a href="https://www.nlscreation.com" target="_blank" rel="noopener noreferrer">nlscreation.com</a>
            <p>Québec, Canada</p>
          </div>
        </div>
        <div className="footer-bottom">
          <span>© 2026 NLS CRÉATION — LA PERSONNALISATION SANS LIMITE</span>
          <span>{t.footerPowered} <strong style={{ color: 'var(--ink-mid)' }}>League Hunter</strong></span>
        </div>
      </footer>

      {/* ── PLAYER PROFILE MODAL ── */}
      {selectedPlayer && (
        <PlayerModal p={selectedPlayer} teams={TEAMS} units={view.units} lang={lang} t={t} games={GAMES} onShare={shareCard} onClose={() => setSelectedPlayer(null)} />
      )}

      {/* ── GAME MODAL ── */}
      {openGame && (() => {
        const g = openGame;
        const played = g.hs !== null;
        const homeTeam = TEAMS.find(tm => tm.name === g.home), awayTeam = TEAMS.find(tm => tm.name === g.away);
        return (
          <div className="modal-ov" onClick={e => { if (e.target.classList.contains('modal-ov')) setOpenGame(null); }}>
            <div className="modal-bx">
              <button className="modal-close" onClick={() => setOpenGame(null)}>✕</button>
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--orange)', marginBottom: 18 }}>
                {fmtDate(g.date, lang)} · {g.time} — {played ? t.final : t.upcoming}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-around', gap: 16, margin: '22px 0' }}>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 38 }}>{awayTeam?.emoji}</div>
                  <div style={{ fontWeight: 800, marginTop: 8, fontSize: 14 }}>{g.away}</div>
                  {played && <div style={{ fontFamily: 'var(--ff-display)', fontSize: 42, marginTop: 6, color: g.as > g.hs ? 'var(--orange)' : 'var(--ink-soft)' }}>{g.as}</div>}
                </div>
                <div style={{ fontFamily: 'var(--ff-display)', fontSize: 18, color: 'var(--ink-soft)' }}>VS</div>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 38 }}>{homeTeam?.emoji}</div>
                  <div style={{ fontWeight: 800, marginTop: 8, fontSize: 14 }}>{g.home}</div>
                  {played && <div style={{ fontFamily: 'var(--ff-display)', fontSize: 42, marginTop: 6, color: g.hs > g.as ? 'var(--orange)' : 'var(--ink-soft)' }}>{g.hs}</div>}
                </div>
              </div>
              <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--ink-soft)', borderTop: '1px solid var(--border)', paddingTop: 16 }}>
                📍 {t.venue}: {g.venue}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
