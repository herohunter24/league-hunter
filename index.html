            <div key={t.id} className={`toast-item toast-${t.type}`}>
              <span style={{ flex: 1 }}>{t.msg}</span>
              <button className="toast-close" onClick={() => dismissToast(t.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  // ── LEAGUE — show spinner while Firestore data is still in flight ──
  if (page === "league" && !league) {
    return (
      <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 900, color: ACC, letterSpacing: "-1px", marginBottom: 20 }}>WEBSITE X</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
            <span className="spinner spinner-dark" style={{ width: 18, height: 18 }} />
            <span style={{ fontSize: 14, color: T2 }}>Chargement des données…</span>
          </div>
        </div>
      </div>
    );
  }

  if (page === "league" && league) {
    const toggles = getToggles(league);
    const sport = league.sport;
    const TABS = [
      ["today",    "Aujourd'hui"],
      ["teams",    "Équipes"],
      ["players",  "Joueurs"],
      ["schedule", "Calendrier"],
      ["scores",   "Scores"],
      ["stats",    "Classement & stats"],
      ["public",   "Site public"],
      ["settings", "Paramètres"],
      ["alertes",  "Alertes"],
    ];
    const COORDINATOR_TABS = new Set(["today", "schedule", "scores", "public"]);
    const visibleTabs = user?.role === "coordinator"
      ? TABS.filter(([t]) => COORDINATOR_TABS.has(t))
      : TABS;
    const TAB_ICONS = {
      today:    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
      teams:    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>,
      players:  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0116 0v2"/></svg>,
      schedule: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/></svg>,
      scores:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      stats:    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
      public:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>,
      settings: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
      alertes:  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>,
    };

    // ── CATEGORY FILTERING ──
    const activeCat = (league.categories || []).find(c => c.id === activeCatId);
    const catTeams   = activeCatId ? league.teams.filter(t => t.categoryId === activeCatId)      : league.teams;
    const catPlayers = activeCatId ? league.players.filter(p => p.categoryId === activeCatId)    : league.players;
    const catSchedule = activeCatId ? (league.schedule || []).filter(g => g.categoryId === activeCatId) : (league.schedule || []);

    // ── Dynamic past/upcoming split (computed at render time, never trust stored `played` flag) ──
    // liveRefreshTick is consumed here so re-renders happen every 60s for live detection
    void liveRefreshTick;
    const upcomingGames = catSchedule
      .filter(g => !isGamePast(g))
      .sort((a, b) => {
        // Today's games first, then future ascending
        const aToday = isGameToday(a) ? 0 : 1;
        const bToday = isGameToday(b) ? 0 : 1;
        if (aToday !== bToday) return aToday - bToday;
        const da = getGameDateTime(a) || new Date((a.date || "9999") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "9999") + "T00:00");
        return da - db;
      });
    const pastGames = catSchedule
      .filter(g => isGamePast(g))
      .sort((a, b) => {
        // Sort: LIVE first, then AWAITING SCORE (most overdue first), then FINAL (most recent first)
        const statusOrder = g => isGameLive(g, sport) ? 0 : isGameAwaiting(g) ? 1 : 2;
        const oa = statusOrder(a), ob = statusOrder(b);
        if (oa !== ob) return oa - ob;
        if (oa === 1) return daysAgo(b) - daysAgo(a); // most overdue first for awaiting
        const da = getGameDateTime(a) || new Date((a.date || "0") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "0") + "T00:00");
        return db - da; // most recent first for finals
      });
    const gamesWithScore = pastGames.filter(g => g.homeScore !== undefined && g.awayScore !== undefined);
    const needsScore     = catSchedule.filter(g => g.homeScore === undefined || g.awayScore === undefined);
    // Backward-compat aliases used by stats calculations below
    const unplayed = upcomingGames;
    const played   = gamesWithScore;

    const standings = catTeams.map(t => {
      const hg = gamesWithScore.filter(g => g.home===t.name), ag = gamesWithScore.filter(g => g.away===t.name);
      const wins = hg.filter(g=>parseInt(g.homeScore)>parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)>parseInt(g.homeScore)).length;
      const losses = hg.filter(g=>parseInt(g.homeScore)<parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)<parseInt(g.homeScore)).length;
      return { name: t.name, emoji: t.emoji, gp: wins+losses, wins, losses };
    }).sort((a,b) => b.wins-a.wins);

    // ── COMPUTE TOTALS ──
    let skaterTotals=[], goalieTotals=[], bballTotals=[];
    if (sport === "Hockey") {
      skaterTotals = catPlayers.filter(p => !isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const goals = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goals||0),0);
        const assists = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        return { ...p, gp: gs.length, goals, assists, points: goals+assists };
      }).sort((a,b) => b.points-a.points || b.goals-a.goals);

      goalieTotals = catPlayers.filter(p => isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const saves = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.saves||0),0);
        const goalsAgainst = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goalsAgainst||0),0);
        const cleanSheets = gs.filter(g=>(g.playerStats[p.id]?.goalsAgainst||0)===0).length;
        const gaa = gs.length>0 ? goalsAgainst/gs.length : null;
        return { ...p, gp: gs.length, saves, goalsAgainst, cleanSheets, gaa };
      }).sort((a,b) => (a.gaa??99)-(b.gaa??99));
    }
    if (sport === "Basketball") {
      bballTotals = catPlayers.map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const points  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.points||0),0);
        const assists  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        const rebounds = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.rebounds||0),0);
        const blocks   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.blocks||0),0);
        const steals   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.steals||0),0);
        return { ...p, gp: gs.length, points, assists, rebounds, blocks, steals };
      }).sort((a,b) => b.points-a.points || b.assists-a.assists);
    }

    // player stat entry helpers
    function getGamePlayers(g) { return catPlayers.filter(p => p.team===g.home||p.team===g.away); }

    const tabLabel = TABS.find(([t]) => t === tab)?.[1] || "";

    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: BG, color: T1, overflow: "hidden" }}>

        {/* ── MISSING SCORE ALERT BANNER ── */}
        {(() => {
          const awaiting = (league.schedule || []).filter(g => isGameAwaiting(g));
          if (!awaiting.length) return null;
          const urgent = awaiting.filter(g => daysAgo(g) >= 2);
          return (
            <div style={{ background: urgent.length ? "#ef444418" : "#f59e0b18", borderBottom: `1px solid ${urgent.length ? "#ef444440" : "#f59e0b40"}`, padding: "10px 32px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: urgent.length ? "#ef4444" : "#f59e0b", display: "flex", alignItems: "center", gap: 8 }}>
                {awaiting.length} match{awaiting.length !== 1 ? "s" : ""} sans score{urgent.length ? ` — ${urgent.length} en retard 48h+` : ""}
              </span>
              <button onClick={() => handleTabSwitch("schedule")}
                style={{ background: urgent.length ? "#ef4444" : "#f59e0b", border: "none", borderRadius: 7, color: "#fff", padding: "6px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                Entrer les scores →
              </button>
            </div>
          );
        })()}

        {/* ── SHELL: SIDEBAR + MAIN ── */}
        <div className="wx-shell">

          {/* SIDEBAR */}
          <nav className="wx-sidebar">
            {/* League switcher (superadmin only) */}
            {user?.role === "superadmin" && (
              <div style={{ padding: "8px 8px 4px" }}>
                <button onClick={handleBack} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "8px 12px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                  Toutes les ligues
                </button>
                {leagues.length > 1 && (
                  <div style={{ position: "relative", marginTop: 6 }}>
                    <button onClick={() => setShowLeagueSwitcher(v => !v)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, width: "100%", background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, color: T1, padding: "8px 12px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, textAlign: "left" }}>{league.name}</span>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    {showLeagueSwitcher && (
                      <div style={{ position: "absolute", left: 0, right: 0, top: "calc(100% + 4px)", background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, boxShadow: "0 6px 24px #00000070", zIndex: 200, maxHeight: 240, overflowY: "auto" }}>
                        {leagues.map(l => (
                          <button key={l.id} onClick={() => { setSelId(l.id); setTab("today"); setShowLeagueSwitcher(false); }}
                            style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", background: l.id === selId ? ACC+"20" : "none", border: "none", padding: "9px 14px", fontSize: 13, color: l.id === selId ? ACC : T1, cursor: "pointer", textAlign: "left", fontWeight: l.id === selId ? 700 : 400 }}>
                            <span style={{ width: 8, height: 8, borderRadius: "50%", background: l.color || ACC, flexShrink: 0 }} />
                            {l.name}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Nav sections */}
            <div style={{ flex: 1, padding: "8px 0" }}>
              {(() => {
                const scoreNeededCount = (catSchedule || []).filter(g => isNeedingScore(g)).length;
                return visibleTabs.map(([t, label]) => (
                  <button key={t} className={`wx-sidebar-item${tab === t ? " active" : ""}`}
                    onClick={() => { handleTabSwitch(t); setMoreSheetOpen(false); }}>
                    {TAB_ICONS[t]}
                    <span style={{ flex: 1, textAlign: "left" }}>{label}</span>
                    {t === "today" && scoreNeededCount > 0 && (
                      <span style={{ background: "#f59e0b", color: "#000", borderRadius: 10, padding: "1px 7px", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>{scoreNeededCount}</span>
                    )}
                  </button>
                ));
              })()}
            </div>

            {/* Bottom: user + logout */}
            <div className="wx-sidebar-bottom">
              <div style={{ padding: "8px 16px 4px", fontSize: 12, color: T2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {user?.displayName || user?.username || user?.email || ""}
                {user?.role === "coordinator" && user?.venue && (
                  <span style={{ display: "block", fontSize: 11, color: T2, opacity: 0.7, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.venue}</span>
                )}
              </div>
              <button className="wx-sidebar-item" onClick={handleLogout}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Déconnexion
              </button>
            </div>
          </nav>

          {/* MAIN AREA */}
          <div className="wx-main" onClick={() => { setOpenTeamMenuId(null); setOpenGameMenuId(null); }}>
            {/* TOP BAR: category picker + Ctrl+K search */}
            <div className="wx-topbar" style={{ borderBottom: `1px solid ${BORDER}`, background: SURF }}>
              {/* Category picker */}
              {(league.categories || []).length > 0 && (() => {
                const cats = league.categories || [];
                const activeCat = cats.find(c => c.id === activeCatId);
                return (
                  <div style={{ position: "relative" }}>
                    <button className="wx-cat-btn" onClick={() => setCatDropdownOpen(v => !v)}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                      {activeCat?.name || "Toutes"}
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    {catDropdownOpen && (
                      <div className="wx-cat-dropdown">
                        {cats.map(c => {
                          const tCount = league.teams.filter(t => t.categoryId === c.id).length;
                          const gCount = (league.schedule || []).filter(g => g.categoryId === c.id).length;
                          return (
                            <button key={c.id} className={`wx-cat-option${activeCatId === c.id ? " active" : ""}`}
                              onClick={() => { setActiveCatId(c.id); setCatDropdownOpen(false); }}>
                              <span>{c.name}</span>
                              <span className="wx-cat-option-count">{tCount} éq · {gCount} matchs</span>
                            </button>
                          );
                        })}
                        <div style={{ borderTop: `1px solid ${BORDER}`, margin: "6px 0 2px" }} />
                        <button className="wx-cat-option" style={{ color: T2, fontSize: 12 }} onClick={() => { setShowCatModal(true); setCatDropdownOpen(false); }}>+ Ajouter catégorie</button>
                        {cats.length > 1 && (
                          <button className="wx-cat-option" style={{ color: T2, fontSize: 12 }} onClick={() => { setReorderCats(cats.slice()); setEditCatId(null); setShowReorderModal(true); setCatDropdownOpen(false); }}>Réordonner / Renommer</button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* Breadcrumb */}
              <div className="wx-breadcrumb">
                <span style={{ color: T2 }}>{league.name}</span>
                {" › "}
                <span>{tabLabel}</span>
              </div>

              {/* Search button (Ctrl+K) */}
              <button onClick={() => { setSearchOpen(true); setSearchQuery(""); }}
                style={{ display: "flex", alignItems: "center", gap: 7, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "7px 12px", fontSize: 13, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Rechercher
                <kbd style={{ fontSize: 10, background: SURF, border: `1px solid ${BORDER}`, borderRadius: 4, padding: "1px 5px", fontFamily: "inherit" }}>⌘K</kbd>
              </button>
            </div>

            {/* CONTENT */}
            <div style={{ maxWidth: 860, margin: "0 auto", padding: "36px 24px", width: "100%" }}>

          {/* ── MIGRATION WARNING ── */}
          {league._migrated && (
            <div style={{ background: "#f59e0b15", border: "1px solid #f59e0b50", borderRadius: 8, padding: "10px 16px", marginBottom: 20, fontSize: 13, color: "#f59e0b", lineHeight: 1.6 }}>
              <strong>Catégories assignées automatiquement.</strong> Les équipes, joueurs et matchs ont été placés dans la catégorie <strong>Général</strong>. Clique sur <strong>Enregistrer</strong> pour sauvegarder dans Firestore.
            </div>
          )}

          {/* ── AUJOURD'HUI ── */}
          {tab==="today" && (() => {
            const todayGames = catSchedule.filter(g => isGameToday(g))
              .sort((a, b) => {
                const da = getGameDateTime(a) || new Date((a.date||"9999")+"T00:00");
                const db = getGameDateTime(b) || new Date((b.date||"9999")+"T00:00");
                return da - db;
              });
            const todayMissing = catSchedule.filter(g => isGamePast(g) && (g.homeScore === undefined || g.awayScore === undefined));
            // Group by gym
            const gymMap = {};
            todayGames.forEach(g => {
              const gym = g.venue || g.gym || "Gymnase non précisé";
              if (!gymMap[gym]) gymMap[gym] = [];
              gymMap[gym].push(g);
            });

            // ── SHARED STATUS FUNCTION (coordinator + owner) ───────────────────
            const getGameStatus = (g) => {
              if (g.locked) return "locked";
              if (g.played && g.homeScore !== undefined) return "final";
              if (isNeedingScore(g)) return "needs_score";
              if (isGameLive(g, sport)) return "live";
              const msLeft = (getGameDateTime(g) || 0) - Date.now();
              if (msLeft > 0 && msLeft < 60 * 60000) return "soon";
              return "upcoming";
            };
            const STATUS_INFO = {
              locked:      { label: "VERROUILLÉ",      bg: "#ffffff12", color: T2 },
              final:       { label: "FINAL",            bg: "#22c55e20", color: "#22c55e" },
              needs_score: { label: "SCORE À ENTRER",   bg: "#f59e0b20", color: "#f59e0b" },
              live:        { label: "EN DIRECT",        bg: ACC+"25",    color: ACC },
              soon:        { label: "BIENTÔT",          bg: "#f59e0b15", color: "#f59e0b" },
              upcoming:    { label: "À VENIR",          bg: "#ffffff0d", color: T2 },
            };

            // ── COORDINATOR BRANCH ──────────────────────────────────────────────
            if (user?.role === "coordinator") {
              const activeVenue = coordVenue !== null ? coordVenue : (user?.venue || "");
              const allVenues = [...new Set(todayGames.map(g => g.venue || g.gym || "Non précisé"))].sort();
              if (activeVenue && !allVenues.includes(activeVenue)) allVenues.unshift(activeVenue);
              const coordTodayGames = activeVenue
                ? todayGames.filter(g => (g.venue || g.gym || "Non précisé") === activeVenue)
                : todayGames;

              const openCoordGame = (g) => {
                const gamePlayers = (league.players || []).filter(p => p.team === g.home || p.team === g.away);
                const initStats = {};
                gamePlayers.forEach(p => {
                  const ps = g.playerStats?.[p.id] || {};
                  const { draft: _d, ...cleanPs } = ps; // strip the draft metadata flag
                  initStats[p.id] = cleanPs;
                });
                // Prefer draft scores if available, else real scores if locked
                const initHS = g.draft?.homeScore !== undefined ? String(g.draft.homeScore)
                             : g.homeScore !== undefined ? String(g.homeScore) : "";
                const initAS = g.draft?.awayScore !== undefined ? String(g.draft.awayScore)
                             : g.awayScore !== undefined ? String(g.awayScore) : "";
                setCoordGame(g); setCoordLocking(false); setCoordLastSaved(null); setCoordPtsWarning(null);
                setCoordDraft({ homeScore: initHS, awayScore: initAS, stats: initStats });
              };

              const doSaveDraft = async () => {
                const hs = parseInt(coordDraft.homeScore), as = parseInt(coordDraft.awayScore);
                if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) { showToast("Scores invalides."); return; }
                setCoordSaving(true);
                try {
                  await saveDraft(coordGame.id, hs, as, coordDraft.stats);
                  setCoordLastSaved(new Date().toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" }));
                  showToast("Brouillon sauvegardé ✓");
                } catch(e) { showToast("Erreur : " + (e.message || "inconnue")); }
                finally { setCoordSaving(false); }
              };

              const checkPtsAndLock = () => {
                const hs = parseInt(coordDraft.homeScore), as = parseInt(coordDraft.awayScore);
                if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) { showToast("Scores invalides."); return; }
                if (sport === "Basketball" && coordGame) {
                  const gp = (league.players || []).filter(p => p.team === coordGame.home || p.team === coordGame.away);
                  const sum = (team) => gp.filter(p => p.team === team).reduce((s, p) => {
                    const v = parseInt(coordDraft.stats?.[p.id]?.points); return s + (isNaN(v) ? 0 : v);
                  }, 0);
                  const hPts = sum(coordGame.home), aPts = sum(coordGame.away);
                  if (hPts !== hs || aPts !== as) {
                    setCoordPtsWarning({ homeTeam: coordGame.home, homeCalc: hPts, homeScore: hs, awayTeam: coordGame.away, awayCalc: aPts, awayScore: as });
                    return;
                  }
                }
                setCoordLocking(true);
              };

              const doLock = async () => {
                const hs = parseInt(coordDraft.homeScore), as = parseInt(coordDraft.awayScore);
                setCoordSaving(true);
                try {
                  await lockScore(coordGame.id, hs, as, coordDraft.stats);
                  setCoordGame(null); setCoordLocking(false); setCoordPtsWarning(null);
                  showToast("Match verrouillé ✓");
                } catch(e) { showToast("Erreur : " + (e.message || "inconnue")); }
                finally { setCoordSaving(false); }
              };

              // ── GAME DETAIL VIEW ───────────────────────────────────────────────
              if (coordGame) {
                const g = coordGame;
                const gamePlayers = (league.players || []).filter(p => p.team === g.home || p.team === g.away);
                const homePs = gamePlayers.filter(p => p.team === g.home);
                const awayPs = gamePlayers.filter(p => p.team === g.away);
                const statCols = (SPORT_STATS[sport] || []).filter(s => !s.isPct && getToggles(league)[s.key] !== false);
                const renderStatsTable = (players) => (
                  <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                      <thead><tr>
                        <th style={{ textAlign: "left", padding: "4px 6px", color: T2, fontWeight: 600, minWidth: 80 }}>Joueur</th>
                        {statCols.map(c => <th key={c.key} style={{ padding: "4px 4px", color: T2, fontWeight: 600, minWidth: 44, textAlign: "center" }}>{c.label}</th>)}
                      </tr></thead>
                      <tbody>
                        {players.map(p => (
                          <tr key={p.id} style={{ borderTop: `1px solid ${BORDER}` }}>
                            <td style={{ padding: "6px 6px", color: T1, maxWidth: 90, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                              {(p.firstName ? p.firstName + " " + (p.lastName || "") : p.name || "").trim() || "Joueur"}
                            </td>
                            {statCols.map(c => (
                              <td key={c.key} style={{ padding: "4px 2px", textAlign: "center" }}>
                                <input type="number" min="0"
                                  style={{ width: 40, background: SURF, border: `1px solid ${BORDER}`, borderRadius: 5, color: T1, fontSize: 12, padding: "4px 2px", textAlign: "center", outline: "none", MozAppearance: "textfield" }}
                                  value={coordDraft.stats?.[p.id]?.[c.key] ?? ""}
                                  onChange={e => {
                                    const val = e.target.value === "" ? undefined : Math.max(0, parseInt(e.target.value) || 0);
                                    setCoordDraft(d => ({ ...d, stats: { ...d.stats, [p.id]: { ...(d.stats[p.id] || {}), [c.key]: val } } }));
                                  }} />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
                return (
                  <div style={{ maxWidth: 480, margin: "0 auto" }}>
                    <button onClick={() => setCoordGame(null)} style={{ background: "none", border: "none", color: ACC, fontSize: 13, cursor: "pointer", padding: "0 0 14px", display: "flex", alignItems: "center", gap: 4 }}>
                      ← Retour
                    </button>
                    {/* Game header */}
                    <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "14px 18px", marginBottom: 14 }}>
                      <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 3 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                      <div style={{ fontSize: 12, color: T2 }}>{g.time || ""}{g.venue ? " · " + g.venue : ""}</div>
                      {g.locked && <div style={{ marginTop: 8, fontSize: 11, color: "#f59e0b", fontWeight: 600 }}>🔒 Match verrouillé — lecture seule pour le coordinateur</div>}
                    </div>
                    {/* Score inputs */}
                    {!g.locked && (
                      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "14px 18px", marginBottom: 14 }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: T2, marginBottom: 12, textTransform: "uppercase", letterSpacing: 0.8 }}>Score</div>
                        <div style={{ display: "flex", gap: 12, alignItems: "flex-end" }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 11, color: T2, marginBottom: 4 }}>{g.home}</div>
                            <input type="number" min="0" style={{ ...inp, fontSize: 24, fontWeight: 800, textAlign: "center", padding: "10px 8px" }}
                              value={coordDraft.homeScore} onChange={e => setCoordDraft(d => ({ ...d, homeScore: e.target.value }))} />
                          </div>
                          <div style={{ paddingBottom: 12, color: T2, fontWeight: 700, fontSize: 18 }}>–</div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 11, color: T2, marginBottom: 4 }}>{g.away}</div>
                            <input type="number" min="0" style={{ ...inp, fontSize: 24, fontWeight: 800, textAlign: "center", padding: "10px 8px" }}
                              value={coordDraft.awayScore} onChange={e => setCoordDraft(d => ({ ...d, awayScore: e.target.value }))} />
                          </div>
                        </div>
                      </div>
                    )}
                    {/* Stats tables */}
                    {!g.locked && statCols.length > 0 && (
                      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "14px 18px", marginBottom: 14 }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: T2, marginBottom: 12, textTransform: "uppercase", letterSpacing: 0.8 }}>Stats joueurs</div>
                        {homePs.length > 0 && <div style={{ marginBottom: 14 }}><div style={{ fontSize: 11, fontWeight: 600, color: ACC, marginBottom: 8 }}>{g.home}</div>{renderStatsTable(homePs)}</div>}
                        {awayPs.length > 0 && <div><div style={{ fontSize: 11, fontWeight: 600, color: ACC, marginBottom: 8 }}>{g.away}</div>{renderStatsTable(awayPs)}</div>}
                        {homePs.length === 0 && awayPs.length === 0 && <div style={{ fontSize: 13, color: T2 }}>Aucun joueur inscrit pour ces équipes.</div>}
                      </div>
                    )}
                    {/* PTS validation warning */}
                    {coordPtsWarning && (
                      <div style={{ background: "#f59e0b10", border: "1px solid #f59e0b40", borderRadius: 12, padding: "16px 18px", marginBottom: 14 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: "#f59e0b", marginBottom: 8 }}>Points joueurs ≠ score d'équipe</div>
                        {coordPtsWarning.homeCalc !== coordPtsWarning.homeScore && (
                          <div style={{ fontSize: 12, color: T2, marginBottom: 4 }}>{coordPtsWarning.homeTeam} : joueurs ({coordPtsWarning.homeCalc}) ≠ score ({coordPtsWarning.homeScore})</div>
                        )}
                        {coordPtsWarning.awayCalc !== coordPtsWarning.awayScore && (
                          <div style={{ fontSize: 12, color: T2, marginBottom: 10 }}>{coordPtsWarning.awayTeam} : joueurs ({coordPtsWarning.awayCalc}) ≠ score ({coordPtsWarning.awayScore})</div>
                        )}
                        <div style={{ display: "flex", gap: 10 }}>
                          <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setCoordPtsWarning(null)}>Corriger</button>
                          <button style={{ ...btn("#f59e0b"), color: "#000", flex: 1 }} onClick={() => { setCoordPtsWarning(null); setCoordLocking(true); }}>Verrouiller quand même</button>
                        </div>
                      </div>
                    )}
                    {/* Lock confirmation */}
                    {!g.locked && !coordPtsWarning && coordLocking && (
                      <div style={{ background: CARD, border: "1px solid #f59e0b40", borderRadius: 12, padding: "18px", marginBottom: 14 }}>
                        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6, color: "#f59e0b" }}>Confirmer le verrouillage ?</div>
                        <div style={{ fontSize: 13, color: T2, marginBottom: 14 }}>Le score sera publié. Seul un responsable pourra déverrouiller.</div>
                        <div style={{ display: "flex", gap: 10 }}>
                          <button style={{ ...btn("#f59e0b"), color: "#000", flex: 1 }} onClick={doLock} disabled={coordSaving}>{coordSaving ? "..." : "Confirmer 🔒"}</button>
                          <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setCoordLocking(false)}>Annuler</button>
                        </div>
                      </div>
                    )}
                    {/* Save / lock buttons */}
                    {!g.locked && !coordPtsWarning && !coordLocking && (
                      <div>
                        <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
                          <button style={{ ...btn("#1e293b"), flex: 1, border: `1px solid ${BORDER}` }} onClick={doSaveDraft} disabled={coordSaving}>{coordSaving ? "..." : "Sauvegarder"}</button>
                          <button style={{ ...btn(), flex: 1 }} onClick={checkPtsAndLock} disabled={coordSaving}>Verrouiller 🔒</button>
                        </div>
                        {coordLastSaved && <div style={{ fontSize: 11, color: T2, textAlign: "center" }}>Brouillon enregistré · {coordLastSaved}</div>}
                      </div>
                    )}
                  </div>
                );
              }

              // ── LIST VIEW ──────────────────────────────────────────────────────
              const notifAvailable = typeof Notification !== "undefined";
              const notifGranted = notifAvailable && Notification.permission === "granted";
              const notifRefused = notifAvailable && Notification.permission === "denied";
              return (
                <div style={{ maxWidth: 480, margin: "0 auto" }}>
                  {/* Title + venue selector */}
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, gap: 12, flexWrap: "wrap" }}>
                    <div style={{ fontSize: 18, fontWeight: 700 }}>Aujourd'hui</div>
                    {allVenues.length > 0 && (
                      <select style={{ ...inp, padding: "6px 12px", fontSize: 13 }} value={activeVenue} onChange={e => setCoordVenue(e.target.value)}>
                        {allVenues.map(v => <option key={v} value={v}>{v}</option>)}
                        <option value="">Tous les gymnases</option>
                      </select>
                    )}
                  </div>
                  {/* Notification CTA */}
                  {!notifGranted && !notifRefused && notifAvailable && (
                    <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "12px 16px", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                      <div style={{ fontSize: 12, color: T2 }}>Reçois un rappel 60 min avant chaque match.</div>
                      <button style={{ ...btn("#1e293b"), border: `1px solid ${BORDER}`, fontSize: 12, whiteSpace: "nowrap", flexShrink: 0 }}
                        onClick={() => Notification.requestPermission().catch(() => {})}>
                        Activer les rappels
                      </button>
                    </div>
                  )}
                  {coordTodayGames.length === 0 ? (
                    <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "32px 24px", textAlign: "center" }}>
                      <div style={{ fontWeight: 700, fontSize: 15, color: T1, marginBottom: 6 }}>
                        {activeVenue ? `Aucun match à "${activeVenue}" aujourd'hui` : "Aucun match aujourd'hui"}
                      </div>
                      <div style={{ fontSize: 13, color: T2 }}>Les matchs du jour apparaîtront ici.</div>
                    </div>
                  ) : (
                    coordTodayGames.map(g => {
                      const status = getGameStatus(g);
                      const si = STATUS_INFO[status];
                      const hasDraft = g.draft?.homeScore !== undefined;
                      const displayScore = g.played ? `${g.homeScore} – ${g.awayScore}` : hasDraft ? `${g.draft.homeScore} – ${g.draft.awayScore}` : null;
                      return (
                        <div key={g.id} style={{ background: CARD, border: `1px solid ${status === "live" ? ACC+"60" : status === "needs_score" ? "#f59e0b40" : BORDER}`, borderRadius: 10, padding: "14px 16px", marginBottom: 10 }}>
                          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 3 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                              <div style={{ fontSize: 12, color: T2 }}>{g.time || "Heure à confirmer"}{g.venue ? " · " + g.venue : ""}</div>
                            </div>
                            <span style={{ background: si.bg, color: si.color, borderRadius: 6, padding: "3px 9px", fontSize: 10, fontWeight: 700, whiteSpace: "nowrap", flexShrink: 0 }}>{si.label}</span>
                          </div>
                          {displayScore && (
                            <div style={{ fontSize: 20, fontWeight: 800, marginTop: 10, letterSpacing: 1 }}>
                              {displayScore}{g.locked && <span style={{ marginLeft: 8, fontSize: 13 }}>🔒</span>}
                              {hasDraft && !g.played && <span style={{ marginLeft: 8, fontSize: 11, color: T2, fontWeight: 400 }}>brouillon</span>}
                            </div>
                          )}
                          {status !== "locked" && (
                            <button onClick={() => openCoordGame(g)}
                              style={{ marginTop: 12, width: "100%", ...btn(displayScore ? "#1e293b" : ACC), fontSize: 13, border: displayScore ? `1px solid ${BORDER}` : "none", justifyContent: "center" }}>
                              {displayScore ? "Modifier" : "Entrer le score"}
                            </button>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              );
            }
            // ── END COORDINATOR BRANCH ──────────────────────────────────────────

            // ── OWNER / SUPERADMIN TODAY ────────────────────────────────────────
            const ownerAllVenues = [...new Set(todayGames.map(g => g.venue || g.gym || "Non précisé"))].sort();
            const ownerActiveVenue = coordVenue; // reuse same state
            const ownerFilteredGymMap = {};
            todayGames
              .filter(g => !ownerActiveVenue || (g.venue || g.gym || "Non précisé") === ownerActiveVenue)
              .forEach(g => {
                const gym = g.venue || g.gym || "Gymnase non précisé";
                if (!ownerFilteredGymMap[gym]) ownerFilteredGymMap[gym] = [];
                ownerFilteredGymMap[gym].push(g);
              });
            return (
              <div>
                {/* Title + venue selector */}
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, gap: 12, flexWrap: "wrap" }}>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>Aujourd'hui</div>
                  {ownerAllVenues.length > 1 && (
                    <select style={{ ...inp, padding: "6px 12px", fontSize: 13 }} value={ownerActiveVenue || ""} onChange={e => setCoordVenue(e.target.value || null)}>
                      <option value="">Tous les gymnases</option>
                      {ownerAllVenues.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  )}
                </div>

                {/* Quick actions */}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 28 }}>
                  <button onClick={() => handleTabSwitch("schedule")} style={{ display: "flex", alignItems: "center", gap: 7, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, color: T1, padding: "9px 16px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                    + Ajouter un match
                  </button>
                  <button onClick={() => handleTabSwitch("players")} style={{ display: "flex", alignItems: "center", gap: 7, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, color: T1, padding: "9px 16px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                    + Ajouter un joueur
                  </button>
                  <button onClick={() => handleTabSwitch("public")} style={{ display: "flex", alignItems: "center", gap: 7, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, color: T1, padding: "9px 16px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                    Ouvrir le site public
                  </button>
                </div>

                {/* Today's games by gym */}
                {todayGames.length === 0 ? (
                  <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "32px 24px", textAlign: "center", marginBottom: 24 }}>
                    <div style={{ marginBottom: 10, color: T2, display: "flex", justifyContent: "center" }}><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <div style={{ fontWeight: 700, fontSize: 15, color: T1, marginBottom: 6 }}>Aucun match aujourd'hui</div>
                    <div style={{ fontSize: 13, color: T2 }}>Les prochains matchs apparaîtront ici le jour même.</div>
                  </div>
                ) : (
                  Object.entries(ownerFilteredGymMap).map(([gym, games]) => (
                    <div key={gym} style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T2, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>{gym}</div>
                      {games.map(g => {
                        const status = getGameStatus(g);
                        const si = STATUS_INFO[status];
                        const hasScore = g.homeScore !== undefined && g.awayScore !== undefined;
                        return (
                          <div key={g.id} style={{ background: CARD, border: `1px solid ${status === "live" ? ACC+"60" : status === "needs_score" ? "#f59e0b40" : BORDER}`, borderRadius: 10, padding: "14px 16px", marginBottom: 8 }}>
                            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                              <div style={{ flex: 1 }}>
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                                <div style={{ fontSize: 12, color: T2 }}>{g.time || "Heure à confirmer"}{g.categoryId ? ` · ${(league.categories||[]).find(c=>c.id===g.categoryId)?.name||""}` : ""}</div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                                <span style={{ background: si.bg, color: si.color, borderRadius: 6, padding: "3px 9px", fontSize: 10, fontWeight: 700 }}>{si.label}</span>
                                {hasScore && <span style={{ fontWeight: 700, fontSize: 15 }}>{g.homeScore} – {g.awayScore}{g.locked ? " 🔒" : ""}</span>}
                              </div>
                            </div>
                            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                              {!hasScore && isGamePast(g) && (
                                <button onClick={() => setEditScore(g)} style={{ ...btn(ACC), fontSize: 12, height: 32, padding: "0 14px" }}>Entrer le score</button>
                              )}
                              {hasScore && !g.locked && (
                                <button onClick={() => setEditScore(g)} style={{ ...btn("#252540"), border: `1px solid ${BORDER}`, fontSize: 12, height: 32, padding: "0 14px" }}>Modifier</button>
                              )}
                              {g.locked && (
                                <button onClick={() => setCoordUnlockGame(g)} style={{ ...btn("#252540"), border: "1px solid #f59e0b40", color: "#f59e0b", fontSize: 12, height: 32, padding: "0 14px" }}>Déverrouiller</button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ))
                )}

                {/* Scores manquants */}
                {todayMissing.length > 0 && (
                  <div style={{ background: "#f59e0b10", border: "1px solid #f59e0b40", borderRadius: 12, padding: "16px 20px" }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#f59e0b", marginBottom: 10 }}>Scores manquants ({todayMissing.length})</div>
                    {todayMissing.slice(0, 5).map(g => (
                      <div key={g.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid #f59e0b20`, gap: 10 }}>
                        <div style={{ fontSize: 13 }}>{g.home} vs {g.away} <span style={{ color: T2, fontSize: 11 }}>({g.date})</span></div>
                        <button onClick={() => setEditScore(g)} style={{ background: "#f59e0b", border: "none", borderRadius: 7, color: "#000", padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Entrer</button>
                      </div>
                    ))}
                    {todayMissing.length > 5 && <div style={{ fontSize: 12, color: T2, marginTop: 8 }}>+{todayMissing.length - 5} autres — voir Calendrier</div>}
                  </div>
                )}
              </div>
            );
          })()}

          {/* ── ÉQUIPES ── */}
          {tab==="teams" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Équipes {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Ajouter une équipe</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} value={nT.name} onChange={e=>setNT({...nT,name:e.target.value})} placeholder="Nom de l'équipe" />
                  {(league.categories || []).length > 1 && (
                    <select style={{ ...inp, flex: 1, minWidth: 140 }} value={nT.categoryId || activeCatId || ""} onChange={e=>setNT({...nT,categoryId:e.target.value})}>
                      <option value="">Catégorie</option>
                      {(league.categories || []).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  )}
                  <button style={btn()} onClick={() => {
                    if (!nT.name || !nT.name.trim()) return;
                    const catId = nT.categoryId || activeCatId || (league.categories?.[0]?.id) || null;
                    const catName = (league.categories || []).find(c => c.id === catId)?.name || '—';
                    addConfirm.ask({
                      actionType: 'add', entityType: 'team', entityLabel: nT.name.trim(),
                      summary: `Ajouter l'équipe "${nT.name.trim()}"${catName !== '—' ? ` à la catégorie "${catName}"` : ''}.`,
                      details: [
                        { label: "Nom", value: nT.name.trim() },
                        ...(catName !== '—' ? [{ label: 'Catégorie', value: catName }] : []),
                      ],
                      confirmLabel: 'Oui, ajouter',
                      onConfirm: () => addTeam(),
                    });
                  }}>Ajouter</button>
                </div>
              </div>
              {catTeams.length===0 ? (
                <div style={{ textAlign: "center", padding: "56px 24px" }}>
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke={T2} strokeWidth="1.5" style={{ marginBottom: 12, opacity: 0.5 }}><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                  <div style={{ fontWeight: 700, fontSize: 16, color: T1, marginBottom: 6 }}>Aucune équipe</div>
                  <div style={{ fontSize: 13, color: T2 }}>Ajouter votre première équipe ci-dessus</div>
                </div>
              ) : (
                <div style={{ border: `1px solid ${BORDER}`, borderRadius: 10, overflow: "hidden" }}>
                  {catTeams.map((t, idx) => {
                    const pCount = catPlayers.filter(p=>p.team===t.name).length;
                    const initials = t.name.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
                    return (
                      <div key={t.id} style={{ display: "flex", alignItems: "center", height: 48, padding: "0 16px", background: idx%2===0 ? CARD : SURF, borderBottom: idx < catTeams.length-1 ? `1px solid ${BORDER}` : "none", gap: 12 }}>
                        {/* Logo or initials circle */}
                        {t.logoUrl
                          ? <img src={t.logoUrl} alt="" style={{ width: 32, height: 32, borderRadius: 6, objectFit: "cover", flexShrink: 0 }} />
                          : <div style={{ width: 32, height: 32, borderRadius: 6, background: ACC+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, color: ACC, flexShrink: 0 }}>{initials}</div>
                        }
                        {/* Name */}
                        <div style={{ flex: 1, fontWeight: 600, fontSize: 14, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</div>
                        {/* Player count */}
                        <div style={{ fontSize: 12, color: T2, flexShrink: 0 }}>{pCount} joueur{pCount !== 1 ? "s" : ""}</div>
                        {/* Actions */}
                        <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                          {_storage && (
                            <label title={t.logoUrl ? "Changer le logo" : "Logo"} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 6, border: `1px solid ${BORDER}`, color: T2, cursor: uploadingId === `team_${t.id}` ? "not-allowed" : "pointer", opacity: uploadingId === `team_${t.id}` ? 0.5 : 1, background: "none" }}>
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                              <input type="file" accept="image/png,image/jpeg,image/webp" style={{ display: "none" }} disabled={!!uploadingId} onChange={e => { const f = e.target.files?.[0]; if (f) uploadTeamLogo(t.id, f); e.target.value = ""; }} />
                            </label>
                          )}
                          {/* Modifier le nom */}
                          <button title="Modifier le nom" onClick={() => { setEditTeam({ id: t.id, name: t.name, emoji: t.emoji }); setEditEmojiErr(""); }} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 6, border: `1px solid ${BORDER}`, color: T2, cursor: "pointer", background: "none" }}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                          </button>
                          {/* Alignement (roster editor) */}
                          <button title="Alignement" onClick={() => openRosterEditor(t)} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 6, border: `1px solid ${BORDER}`, color: T2, cursor: "pointer", background: "none" }}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                          </button>
                          {/* Supprimer */}
                          <button title="Supprimer" onClick={() => openDelTeamModal(t)} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 6, border: `1px solid ${BORDER}`, color: "#ef4444", cursor: "pointer", background: "none" }}
                            onMouseEnter={e => e.currentTarget.style.background = "#ef444420"}
                            onMouseLeave={e => e.currentTarget.style.background = "none"}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
                          </button>
                        </div>
                        {uploadStatus && uploadStatus.key === `team_${t.id}` && (
                          <div style={{ position: "absolute", left: 0, right: 0 }}><UploadStatus statusKey={`team_${t.id}`} /></div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ── JOUEURS ── */}
          {tab==="players" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Joueurs {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Ajouter un joueur</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nP.name} onChange={e=>setNP({...nP,name:e.target.value})} placeholder="Nom complet" />
                  <input style={{ ...inp, flex: 0.5, minWidth: 64 }} value={nP.number} onChange={e=>setNP({...nP,number:e.target.value})} placeholder="#" />
                  <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.position} onChange={e=>setNP({...nP,position:e.target.value})} placeholder={sport==="Hockey"?"Centre / Gardien":"Meneur / Ailier"} />
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nP.team} onChange={e=>setNP({...nP,team:e.target.value})}>
                    <option value="">Équipe</option>
                    {catTeams.map(t => <option key={t.id}>{t.name}</option>)}
                  </select>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} type="email" value={nP.email||""} onChange={e=>setNP({...nP,email:e.target.value})} placeholder="player@email.com (optional)" />
                  {(league.units || 'imperial') === 'imperial' ? (<>
                    <input style={{ ...inp, flex: 0.5, minWidth: 64 }} type="number" min="0" max="8" value={nP.heightFt} onChange={e=>setNP({...nP,heightFt:e.target.value})} placeholder="Ft" title="Height — feet (optional)" />
                    <input style={{ ...inp, flex: 0.5, minWidth: 64 }} type="number" min="0" max="11" value={nP.heightIn} onChange={e=>setNP({...nP,heightIn:e.target.value})} placeholder="In" title="Height — inches (optional)" />
                  </>) : (
                    <input style={{ ...inp, flex: 1, minWidth: 90 }} type="number" min="0" value={nP.heightCm} onChange={e=>setNP({...nP,heightCm:e.target.value})} placeholder="cm (opt.)" title="Height in cm (optional)" />
                  )}
                  <input style={{ ...inp, flex: 0.8, minWidth: 80 }} type="number" min="0" value={nP.weight} onChange={e=>setNP({...nP,weight:e.target.value})} placeholder={(league.units||'imperial')==='metric' ? 'kg (opt.)' : 'lbs (opt.)'} title="Weight (optional)" />
                  <button style={btn()} onClick={() => {
                    if (!nP.name || !nP.name.trim() || !nP.team) return;
                    addConfirm.ask({
                      actionType: 'add', entityType: 'player', entityLabel: nP.name.trim(),
                      summary: `Ajouter le joueur "${nP.name.trim()}" à l'équipe "${nP.team}".`,
                      details: [
                        { label: 'Nom',      value: nP.name.trim() },
                        { label: 'Équipe',   value: nP.team },
                        ...(nP.number   ? [{ label: 'Dossard', value: nP.number }]   : []),
                        ...(nP.position ? [{ label: 'Poste',   value: nP.position }] : []),
                        ...(nP.email    ? [{ label: 'Email',   value: nP.email }]    : []),
                        ...(() => { const units = league.units||'imperial'; const h = units==='metric'?(nP.heightCm?parseInt(nP.heightCm):0):((nP.heightFt||nP.heightIn)?parseInt(nP.heightFt||0)*12+parseInt(nP.heightIn||0):0); return h ? [{ label: 'Taille', value: formatHeight(h, units) }] : []; })(),
                        ...(nP.weight ? [{ label: 'Poids', value: formatWeight(parseInt(nP.weight), league.units||'imperial') }] : []),
                      ],
                      confirmLabel: 'Oui, ajouter',
                      onConfirm: () => addPlayer(),
                    });
                  }}>Ajouter</button>
                </div>
                {sport==="Hockey" && <div style={{ fontSize: 12, color: T2, marginTop: 10 }}>Indiquer le poste <strong style={{ color: T1 }}>Gardien</strong> pour suivre les arrêts séparément.</div>}
                {catTeams.length === 0 && <div style={{ fontSize: 12, color: "#f59e0b", marginTop: 10 }}>Ajouter une équipe dans cette catégorie avant d'ajouter des joueurs.</div>}
              </div>
              {catPlayers.length===0 ? (
                <div style={{ textAlign: "center", padding: "56px 24px" }}>
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke={T2} strokeWidth="1.5" style={{ marginBottom: 12, opacity: 0.5 }}><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0116 0v2"/></svg>
                  <div style={{ fontWeight: 700, fontSize: 16, color: T1, marginBottom: 6 }}>Aucun joueur</div>
                  <div style={{ fontSize: 13, color: T2 }}>Ajouter votre premier joueur ci-dessus</div>
                </div>
              ) :
                catTeams.map(t => {
                  const tp = catPlayers.filter(p => p.team===t.name);
                  if (!tp.length) return null;
                  return (
                    <div key={t.id} style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                        {t.logoUrl
                          ? <img src={t.logoUrl} alt="logo" style={{ width: 20, height: 20, borderRadius: 4, objectFit: "cover" }} />
                          : <span>{t.emoji}</span>
                        }
                        {t.name}
                      </div>
                      {tp.map(p => {
                        const ss = getPlayerSeasonStats(p, catSchedule, sport);
                        const isExpanded = expandedPlayerId === p.id;
                        // Games this player has stats recorded for, newest first
                        const playerGames = catSchedule
                          .filter(g => isGamePast(g) && g.playerStats && g.playerStats[p.id] !== undefined && !g.playerStats[p.id]?.draft && (g.home === p.team || g.away === p.team))
                          .sort((a, b) => new Date(`${b.date}T${b.time || '00:00'}`) - new Date(`${a.date}T${a.time || '00:00'}`));
                        // Active stats for this player's sport/position (respects toggles)
                        const activeStatDef = getActiveStats(sport, p, toggles);
                        return (
                          <div key={p.id} style={{ ...card, marginBottom: 8 }}>
                            <div
                              style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", userSelect: "none" }}
                              onClick={() => setExpandedPlayerId(isExpanded ? null : p.id)}
                            >
                              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                                {/* Player photo or jersey number box */}
                                {p.photoUrl
                                  ? <img src={p.photoUrl} alt={p.name} style={{ width: 40, height: 40, borderRadius: "50%", objectFit: "cover", border: `2px solid ${BORDER}` }} />
                                  : <div style={{ width: 40, height: 40, borderRadius: 8, background: "#23233a", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: ACC }}>#{p.number}</div>
                                }
                                <div>
                                  <div style={{ fontWeight: 600, display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                                    {p.name}
                                    {(() => {
                                      const rp = calcPlayerRP(p, catSchedule, league);
                                      const lbl2 = calcPlayerLabel(p, catPlayers, catSchedule, league);
                                      const tier2 = getTier(rp);
                                      if (!lbl2 || tier2.id === 'bronze') return null;
                                      return <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: tier2.color, background: tier2.color+'18', border: `1px solid ${tier2.color}40`, borderRadius: 100, padding: '2px 7px' }}>{lbl2.label}</span>;
                                    })()}
                                  </div>
                                  <div style={{ fontSize: 12, color: T2 }}>#{p.number} · {p.position}{isGoalie(p)?" — G":""}</div>
                                  {(p.height || p.weight) && (
                                    <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>
                                      {formatHeight(p.height, league.units || 'imperial')}
                                      {p.height && p.weight ? ' • ' : ''}
                                      {formatWeight(p.weight, league.units || 'imperial')}
                                    </div>
                                  )}
                                </div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                {_storage && (
                                  <label onClick={e => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: uploadingId === `player_${p.id}` ? "not-allowed" : "pointer", opacity: uploadingId === `player_${p.id}` ? 0.6 : 1, whiteSpace: "nowrap" }}>
                                    {uploadingId === `player_${p.id}` ? "Chargement…" : (p.photoUrl ? "Changer photo" : "Photo")}
                                    <input type="file" accept="image/png,image/jpeg,image/webp" style={{ display: "none" }} disabled={!!uploadingId} onChange={e => { const f = e.target.files?.[0]; if (f) uploadPlayerPhoto(p.id, f); e.target.value = ""; }} />
                                  </label>
                                )}
                                {/* FEATURE 2: Edit player */}
                                <button onClick={e => { e.stopPropagation(); const _units = league.units||'imperial'; setEditPlayer({ id: p.id, name: p.name, number: p.number || "", position: p.position || "", team: p.team || "", email: p.email || "", heightFt: (p.height && _units==='imperial') ? String(Math.floor(p.height/12)) : "", heightIn: (p.height && _units==='imperial') ? String(p.height%12) : "", heightCm: (p.height && _units==='metric') ? String(p.height) : "", weight: p.weight ? String(p.weight) : "" }); }} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: "pointer" }} title="Modifier">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                                <button onClick={e => { e.stopPropagation(); handleDeletePlayer(p.id); }} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 10px", fontSize: 12, cursor: "pointer" }} title="Retirer">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                                </button>
                                {/* Expand/collapse chevron */}
                                <span style={{ color: T2, fontSize: 11, marginLeft: 4, minWidth: 10 }}>{isExpanded ? '▼' : '▶'}</span>
                              </div>
                            </div>
                            <UploadStatus statusKey={`player_${p.id}`} />
                            {ss.gamesPlayed > 0 && (
                              <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${BORDER}`, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center" }}>
                                <span style={{ fontSize: 12, color: T2 }}>GP: <strong style={{ color: T1 }}>{ss.gamesPlayed}</strong></span>
                                {ss.statDef.filter(({ key }) => toggles[key] !== false).map(({ key, avg, isPct }) => (
                                  ss.averages[key] !== null && (
                                    <span key={key} style={{ fontSize: 12, color: T2 }}>{avg}: <strong style={{ color: ACC }}>{ss.averages[key]}{isPct ? "%" : ""}</strong></span>
                                  )
                                ))}
                              </div>
                            )}
                            {/* ── GAME LOG (expanded) ── */}
                            {isExpanded && (
                              <div style={{ marginTop: 12, padding: 16, background: '#0d0d1a', borderRadius: 8, borderTop: `1px solid ${BORDER}` }}>
                                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 10 }}>
                                  Historique — {playerGames.length} match{playerGames.length !== 1 ? 's' : ''}
                                </div>
                                {playerGames.length === 0 ? (
                                  <div style={{ color: T2, fontSize: 13, fontStyle: 'italic' }}>No recorded stats yet for this player.</div>
                                ) : (
                                  <div style={{ overflowX: 'auto' }}>
                                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                                      <thead>
                                        <tr style={{ color: T2, textAlign: 'left' }}>
                                          <th style={{ padding: '6px 8px', whiteSpace: 'nowrap' }}>Date</th>
                                          <th style={{ padding: '6px 8px', whiteSpace: 'nowrap' }}>Opponent</th>
                                          <th style={{ padding: '6px 8px', whiteSpace: 'nowrap' }}>Score</th>
                                          {activeStatDef.map(({ key, label }) => (
                                            <th key={key} style={{ padding: '6px 8px', textAlign: 'center', whiteSpace: 'nowrap' }}>{label}</th>
                                          ))}
                                          <th style={{ padding: '6px 8px' }}></th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {playerGames.map(g => {
                                          const opponent = g.home === p.team ? g.away : g.home;
                                          const isHome   = g.home === p.team;
                                          const scoreStr = g.homeScore !== undefined && g.awayScore !== undefined
                                            ? (isHome ? `${g.homeScore}–${g.awayScore}` : `${g.awayScore}–${g.homeScore}`)
                                            : '—';
                                          const pStats = (g.playerStats || {})[p.id] || {};
                                          return (
                                            <tr key={g.id} style={{ borderTop: `1px solid ${BORDER}` }}>
                                              <td style={{ padding: '8px 8px', whiteSpace: 'nowrap', color: T2 }}>{g.date}</td>
                                              <td style={{ padding: '8px 8px', whiteSpace: 'nowrap' }}>{opponent}</td>
                                              <td style={{ padding: '8px 8px', whiteSpace: 'nowrap', color: T2, fontVariantNumeric: 'tabular-nums' }}>{scoreStr}</td>
                                              {activeStatDef.map(({ key, isPct }) => (
                                                <td key={key} style={{ padding: '8px 8px', textAlign: 'center', color: (pStats[key] || 0) > 0 ? T1 : T2 }}>
                                                  {pStats[key] ?? 0}{isPct ? '%' : ''}
                                                </td>
                                              ))}
                                              <td style={{ padding: '8px 8px', textAlign: 'right' }}>
                                                <button
                                                  onClick={e => {
                                                    e.stopPropagation();
                                                    // Open existing stats editor pre-filled with all players for this game
                                                    const gamePlayers = league.players.filter(pl => pl.team === g.home || pl.team === g.away);
                                                    const stats = {};
                                                    gamePlayers.forEach(pl => {
                                                      const existing = (g.playerStats || {})[pl.id] || {};
                                                      const def = getSportStats(sport, pl);
                                                      const defaults = {};
                                                      def.forEach(({ key, madeKey, attKey }) => { defaults[key] = 0; if (madeKey) defaults[madeKey] = 0; if (attKey) defaults[attKey] = 0; });
                                                      stats[pl.id] = { ...defaults, ...existing };
                                                    });
                                                    setEditStats({ game: g, stats });
                                                    setStatsValidationError(null);
                                                  }}
                                                  style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: '4px 10px', fontSize: 12, cursor: 'pointer' }}
                                                >Edit</button>
                                              </td>
                                            </tr>
                                          );
                                        })}
                                      </tbody>
                                    </table>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })
              }
            </div>
          )}

          {/* ── SCHEDULE ── */}
          {tab==="schedule" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Calendrier {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.name}</span>}
              </div>
              {user?.role === "coordinator" ? null : (() => {
                // Per-league venue suggestions (deduplicated, sorted)
                const venueOptions = [...new Set(
                  (league.schedule || []).map(g => g.venue).filter(Boolean)
                )].sort();
                // Past-date detection for inline notice
                const nGDateTime = nG.date
                  ? new Date(nG.time ? `${nG.date}T${nG.time}` : `${nG.date}T00:00`)
                  : null;
                const nGIsInPast = nGDateTime && nGDateTime < new Date();
                return (
                  <div style={{ ...card, marginBottom: 24 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Ajouter un match</div>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                      <input type="date" style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.date} onChange={e=>setNG({...nG,date:e.target.value})} />
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.home} onChange={e=>setNG({...nG,home:e.target.value})}>
                        <option value="">Domicile</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.away} onChange={e=>setNG({...nG,away:e.target.value})}>
                        <option value="">Visiteur</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <input type="time" style={{ ...inp, flex: 1, minWidth: 100 }} value={nG.time} onChange={e=>setNG({...nG,time:e.target.value})} />
                      <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nG.venue} onChange={e=>setNG({...nG,venue:e.target.value})} placeholder="Gymnase / Aréna" />
                      <button style={{ ...btn(), opacity: saving ? 0.6 : 1 }} disabled={saving} onClick={() => {
                        if (!nG.date || !nG.home || !nG.away || saving) return;
                        if (nG.home === nG.away) return;
                        addConfirm.ask({
                          actionType: 'add', entityType: 'game', entityLabel: `${nG.home} vs ${nG.away}`,
                          summary: `Tu es sur le point de planifier un match entre "${nG.home}" et "${nG.away}" le ${nG.date}.`,
                          details: [
                            { label: 'Date',      value: nG.date },
                            { label: 'Domicile',  value: nG.home },
                            { label: 'Visiteur',  value: nG.away },
