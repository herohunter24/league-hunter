<script>
(function(){
  var msgs=['Loading your league...','Fetching player stats...','Building standings...','Almost ready...'];
  var mi=0, msgEl=document.getElementById('wx-msg'), progEl=document.getElementById('wx-prog');
  if(!msgEl) return;
  msgEl.textContent=msgs[0];

  // Animate progress bar to ~88% while waiting
  var pw=0;
  var progIv=setInterval(function(){
    pw = pw<88 ? pw + (88-pw)*0.035 + 0.3 : 88;
    if(progEl) progEl.style.width=pw.toFixed(1)+'%';
  }, 60);

  // Cycle messages every 1.5s
  var msgIv=setInterval(function(){
    mi=(mi+1)%msgs.length;
    msgEl.style.opacity='0';
    setTimeout(function(){ msgEl.textContent=msgs[mi]; msgEl.style.opacity='1'; },300);
  },1500);

  // 8-second slow-connection warning
  var tid=setTimeout(function(){
    clearInterval(msgIv);
    msgEl.style.color='#f59e0b';
    msgEl.style.opacity='1';
    msgEl.textContent='Taking longer than usual... Please check your connection.';
  },8000);

  // Dismiss: fill bar to 100%, then fade out overlay
  function dismiss(){
    clearInterval(progIv); clearInterval(msgIv); clearTimeout(tid);
    if(progEl){ progEl.style.transition='width 0.2s ease'; progEl.style.width='100%'; }
    setTimeout(function(){
      var el=document.getElementById('wx-loader');
      if(!el) return;
      el.style.opacity='0';
      setTimeout(function(){ el.style.display='none'; },520);
    },220);
  }
  window.__wxHideLoading=dismiss;
  window.__loadingBarDone=dismiss; // backward compat

  // Error state
  window.__wxLoadingError=function(msg){
    clearInterval(progIv); clearInterval(msgIv); clearTimeout(tid);
    msgEl.style.color='#ef4444';
    msgEl.style.opacity='1';
    msgEl.textContent=msg||'Could not connect to server. Retrying...';
    var wrap=document.getElementById('wx-loader');
    if(!wrap) return;
    var btn=document.createElement('button');
    btn.textContent='Retry';
    btn.style.cssText='margin:14px auto 0;display:block;padding:9px 24px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;';
    btn.onclick=function(){ location.reload(); };
    wrap.firstElementChild.appendChild(btn);
  };
})();
</script>

// Load all sub-collections for one league and reassemble into a flat league object.
async function loadFullLeague(leagueId) {
  if (!__fbReady) return null;
  const { doc, collection, getDocs, getDoc } = _FS;
  const lid = String(leagueId);
  try {
    const metaSnap = await getDoc(doc(_db, "leagues", lid));
    if (!metaSnap.exists()) return null;
    const meta = metaSnap.data();
    const [teamsSnap, playersSnap, gamesSnap] = await Promise.all([
      getDocs(collection(_db, "leagues", lid, "teams")),
      getDocs(collection(_db, "leagues", lid, "players")),
      getDocs(collection(_db, "leagues", lid, "games")),
    ]);
    const teams   = teamsSnap.docs.map(d => d.data());
    const players = playersSnap.docs.map(d => d.data());
    const games   = await Promise.all(gamesSnap.docs.map(async gDoc => {
      const game = gDoc.data();
      const statsSnap = await getDocs(collection(_db, "leagues", lid, "games", gDoc.id, "playerStats"));
      if (statsSnap.empty) return game;
      const playerStats = {};
      statsSnap.docs.forEach(s => { playerStats[s.id] = s.data(); });
      return { ...game, playerStats };
    }));
    return { ...meta, teams, players, schedule: games };
  } catch(e) {
    console.error("[loadFullLeague] failed for", lid, e);
    return null;
  }
}

// ── CLIENT-SIDE IMAGE COMPRESSION ──
async function compressImage(file, maxPx = 300, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Compression failed")), "image/jpeg", quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function uploadImageToStorage(file, path, maxPx = 300) {
  if (!_storage || !_ST.storageRef) throw new Error("Firebase Storage not available");
  const blob = await compressImage(file, maxPx);
  const ref = _ST.storageRef(_storage, path);
  await _ST.uploadBytes(ref, blob, { contentType: "image/jpeg" });
  return await _ST.getDownloadURL(ref);
}

// ── RANK TIERS ──
const RANK_TIERS = [

}
function calcPlayerRP(player, allGames, league) {
  const season  = (league && league.season) || {};
  const resetAt = season.resetAt || 0;
  const pid     = String(player.id);
  const milData = ((league && league.playerMilestones) || {})[pid] || {};

    .filter(g => {
      if (!g.playerStats || g.playerStats[pid] === undefined) return false;
      if (resetAt) { const gt = new Date((g.date||'9999')+'T00:00').getTime(); if (gt < resetAt) return false; }

    })
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if (!games.length) return 0;
  const baseScores = games.map(g => {
    const ps = g.playerStats[pid] || {};
    return Math.max(0,
      (+(ps.points||0))*1.0 + (+(ps.rebounds||0))*0.7 + (+(ps.assists||0))*1.2 +
      (+(ps.steals||0))*1.5 + (+(ps.blocks||0))*1.5 - (+(ps.turnovers||0))*1.0);
  });
  const avg = baseScores.reduce((s,x)=>s+x,0) / baseScores.length;
  let aStr = 0, bStr = 0;
  const adjusted = baseScores.map(s => {
    if (s >= avg) { aStr++; bStr = 0; } else { bStr++; aStr = 0; }
    let m = 1;
    if (s >= avg) {
      if (aStr>=7) m=1.70; else if (aStr>=6) m=1.50; else if (aStr>=5) m=1.35;
      else if (aStr>=4) m=1.25; else if (aStr>=3) m=1.15; else if (aStr>=2) m=1.08;

  let milRP = 0;
  const gp = games.length;
  if (gp>=1  && !achieved.has('games_1'))  milRP+=5;
  if (gp>=5  && !achieved.has('games_5'))  milRP+=15;

  if (gp>=20 && !achieved.has('games_20')) milRP+=120;
  let h15=achieved.has('pts_15'),h20=achieved.has('pts_20'),h30=achieved.has('pts_30'),h40=achieved.has('pts_40');
  let hDD=achieved.has('double_double'),hTD=achieved.has('triple_double'),hQD=achieved.has('quad_double');
  let hW3=achieved.has('ws_3'),hW5=achieved.has('ws_5'),hW8=achieved.has('ws_8'),hW10=achieved.has('ws_10');

    if (!h15&&pts>=15){milRP+=15;h15=true;} if (!h20&&pts>=20){milRP+=35;h20=true;}
    if (!h30&&pts>=30){milRP+=80;h30=true;} if (!h40&&pts>=40){milRP+=200;h40=true;}

    const hs=parseInt(g.homeScore),as2=parseInt(g.awayScore);

  let wStr=0;
  games.forEach(g=>{
    const ps=g.playerStats[pid]||{};const pts=+(ps.points||0),reb=+(ps.rebounds||0),ast=+(ps.assists||0),stl=+(ps.steals||0),blk=+(ps.blocks||0);
    if (pts>=15) chk('pts_15'); if (pts>=20) chk('pts_20'); if (pts>=30) chk('pts_30'); if (pts>=40) chk('pts_40');
    const t10=[pts,reb,ast,stl,blk].filter(v=>v>=10).length;
    if (t10>=2) chk('double_double'); if (t10>=3) chk('triple_double'); if (t10>=4) chk('quad_double');
    const hs=parseInt(g.homeScore),as2=parseInt(g.awayScore);
    const won=!isNaN(hs)&&!isNaN(as2)&&((g.home===player.team&&hs>as2)||(g.away===player.team&&as2>hs));
    if (won) wStr++; else wStr=0;
    if (wStr>=3) chk('ws_3'); if (wStr>=5) chk('ws_5'); if (wStr>=8) chk('ws_8'); if (wStr>=10) chk('ws_10');
  });
  return newOnes;
}

// ── EMAIL UTILITIES ──
async function hashEmail(email) {
  const clean = (email || '').trim().toLowerCase();
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(clean));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
}

    await emailjs.send(config.serviceId, templateId, params, config.publicKey);

async function sendScoreNotification(db, FS, league, game, emailConfig) {
  if (!emailConfig || !emailConfig.templateScores || league.notificationsPaused) return 0;
  const subs = await loadSubscribers(db, FS, league.id);
  const activeScoreSubs = subs.filter(s => s.active && s.preferences && s.preferences.scores);

  // Also include player emails for players in this game
  const gamePlayers = (league.players || []).filter(p => p.email && (p.team === game.home || p.team === game.away));
  const extraEmails = gamePlayers.map(p => p.email).filter(Boolean);

  // Deduplicate
  const allEmails = [...new Set([...activeScoreSubs.map(s => s.email), ...extraEmails])];

  const publicUrl = `${window.location.origin}/public.html?league=${league.id}`;
  let sent = 0;
  for (const email of allEmails) {
    const ok = await sendViaEmailJS(emailConfig, emailConfig.templateScores, {
      to_email: email,
      league_name: league.name || 'League',
      home_team: game.home,
      away_team: game.away,
      home_score: game.homeScore,
      away_score: game.awayScore,
      game_date: game.date || '',
      venue: game.venue || '',
      public_url: publicUrl,
      unsubscribe_url: publicUrl + '&unsubscribe=' + (await hashEmail(email)),
    });
    if (ok) sent++;
  }
  return sent;
}

async function sendPotwNotification(db, FS, league, player, emailConfig) {
  if (!emailConfig || !emailConfig.templatePotw || league.notificationsPaused) return 0;
  const subs = await loadSubscribers(db, FS, league.id);

}

const RANK_ORDER = ["bronze","silver","gold","platinum","diamond","elite","legend"];

function calcPlayerLabel(player, allPlayers, allGames, league) {
  const season  = (league && league.season) || {};
  const resetAt = season.resetAt || 0;
  const pid     = String(player.id);

  const games = (allGames || []).filter(g => {
    if (!g.playerStats || g.playerStats[pid] === undefined) return false;
    if (resetAt) { const gt = new Date((g.date||'9999')+'T00:00').getTime(); if (gt < resetAt) return false; }
    return true;
  }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  if (!games.length) return null;

  const gp   = games.length;
  const sum  = k => games.reduce((s,g)=>s+(+(g.playerStats[pid][k]||0)),0);
  const ppg  = sum('points')   / gp;
  const rpg  = sum('rebounds') / gp;
  const apg  = sum('assists')  / gp;
  const spg  = sum('steals')   / gp;
  const bpg  = sum('blocks')   / gp;

  // Streak above own average
  const baseScores = games.map(g => {
    const ps = g.playerStats[pid]||{};
    return Math.max(0,(+(ps.points||0))*1.0+(+(ps.rebounds||0))*0.7+(+(ps.assists||0))*1.2+(+(ps.steals||0))*1.5+(+(ps.blocks||0))*1.5-(+(ps.turnovers||0))*1.0);
  });
  const avg = baseScores.reduce((s,x)=>s+x,0)/baseScores.length;
  let maxStreak=0, streak=0;
  baseScores.forEach(s=>{ if(s>=avg){streak++;maxStreak=Math.max(maxStreak,streak);}else streak=0; });

  // Rank check helper
  const meetsRank = minRank => {
    const rp = typeof calcPlayerRP==='function' ? calcPlayerRP(player,allGames,league) : 0;
    const tier = typeof getTier==='function' ? getTier(rp) : {id:'bronze'};
    return RANK_ORDER.indexOf(tier.id) >= RANK_ORDER.indexOf(minRank);
  };

  // League-wide stats for comparisons
  const allStats = allPlayers.map(p2 => {
    const p2id=String(p2.id);
    const p2g=games.filter ? (allGames||[]).filter(g=>g.playerStats&&g.playerStats[p2id]!==undefined&&(!resetAt||new Date((g.date||'9999')+'T00:00').getTime()>=resetAt)) : [];
    if(!p2g.length) return null;
    const p2gp=p2g.length;
    return { id:p2id, ppg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].points||0)),0)/p2gp, apg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].assists||0)),0)/p2gp, bpg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].blocks||0)),0)/p2gp, rp:typeof calcPlayerRP==='function'?calcPlayerRP(p2,allGames,league):0 };
  }).filter(Boolean);
  const topPpg = allStats.slice().sort((a,b)=>b.ppg-a.ppg)[0];
  const topApg = allStats.slice().sort((a,b)=>b.apg-a.apg)[0];
  const topBpg = allStats.slice().sort((a,b)=>b.bpg-a.bpg)[0];
  const topRp  = allStats.slice().sort((a,b)=>b.rp-a.rp)[0];
  const totalGames = (allGames||[]).filter(g=>!resetAt||new Date((g.date||'9999')+'T00:00').getTime()>=resetAt);
  const uniqueGameDays = new Set(totalGames.map(g=>g.date)).size;

  // Check each label — collect all earned, return highest priority
  const earned = [];
  const chk = (id, condition) => { if(condition) earned.push(id); };

  chk('chosen_one',    meetsRank('legend')   && topPpg?.id===pid);
  chk('untouchable',   meetsRank('elite')    && ppg>=35);
  chk('assassin',      meetsRank('diamond')  && ppg>=30);
  chk('machine',       meetsRank('elite')    && maxStreak>=15);
  chk('point_god',     meetsRank('diamond')  && topApg?.id===pid);
  chk('eraser',        meetsRank('diamond')  && topBpg?.id===pid);
  chk('goat',          meetsRank('legend')   && (league?.awards?.mvp?.prevPlayerId===pid));
  chk('mvp_label',     meetsRank('platinum') && topRp?.id===pid);
  chk('cold_blooded',  meetsRank('platinum') && ppg>=25 && maxStreak>=5);
  chk('puppet_master', meetsRank('platinum') && apg>=10);
  chk('nightmare',     meetsRank('platinum') && spg>=2 && bpg>=2);
  chk('workhorse',     meetsRank('platinum') && gp>=10 && gp>=uniqueGameDays);
  chk('iron_man',      meetsRank('gold')     && gp>=totalGames.length && totalGames.length>0);
  chk('playmaker',     meetsRank('gold')     && apg>=8);
  chk('enforcer',      meetsRank('gold')     && bpg>=2);
  chk('scorer',        meetsRank('gold')     && ppg>=20);
  chk('reliable',      meetsRank('silver')   && maxStreak>=5);
  chk('floor_general', meetsRank('silver')   && apg>=5);
  chk('lockdown',      meetsRank('silver')   && spg>=2);
  chk('bucket',        meetsRank('silver')   && ppg>=15);

  if (!earned.length) return null;
  // Return highest priority label
  const best = earned.reduce((best,id) => {
    const def = PLAYER_LABELS.find(l=>l.id===id);
    const bestDef = PLAYER_LABELS.find(l=>l.id===best);
    return (def?.priority||0) > (bestDef?.priority||0) ? id : best;
  }, earned[0]);
  return PLAYER_LABELS.find(l=>l.id===best) || null;
}

// ── MIGRATION: Ensure league has categories array ──
function migrateLeagueIfNeeded(league) {
  if (!league) return league;
  const hasCats = league.categories && league.categories.length > 0;
  if (hasCats) {
    // Already has categories — just backfill any missing categoryIds
    const firstCat = league.categories[0];
    let changed = false;
    const teams    = (league.teams    || []).map(t => t.categoryId ? t : (changed=true, { ...t, categoryId: firstCat.id }));
    const players  = (league.players  || []).map(p => p.categoryId ? p : (changed=true, { ...p, categoryId: firstCat.id }));
    const schedule = (league.schedule || []).map(g => g.categoryId ? g : (changed=true, { ...g, categoryId: firstCat.id }));
    return changed ? { ...league, teams, players, schedule, _migrated: true } : league;
  }
  // No categories at all — create a "General" category and assign everything to it
  const genCat = { id: "cat_" + String(league.id) + "_gen", name: "General", gender: "", displayName: "General" };
  return {
    ...league,
    categories: [genCat],
    teams:    (league.teams    || []).map(t => ({ ...t, categoryId: genCat.id })),
    players:  (league.players  || []).map(p => ({ ...p, categoryId: genCat.id })),
    schedule: (league.schedule || []).map(g => ({ ...g, categoryId: genCat.id })),
    honours:  league.honours || {},
    _migrated: true,
  };
}

// ── TIME FORMAT HELPERS ──
// Converts stored 24h "HH:MM" → display "H:MM AM/PM".
// Pass-through if value already contains AM/PM (legacy data).
function formatTime12h(t) {
  if (!t) return "";
  if (/AM|PM/i.test(t)) return t;               // legacy format — already 12h
  const parts = t.split(":");
  if (parts.length < 2) return t;
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return t;
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
// Converts legacy "H:MM AM/PM" → "HH:MM" so <input type="time"> works with old data.
// Pass-through if already in HH:MM 24h format.
function parseTimeTo24h(t) {
  if (!t) return "";
  if (/^\d{1,2}:\d{2}$/.test(t)) return t.length === 4 ? "0" + t : t; // already 24h
  const m = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return "";
  let h = parseInt(m[1], 10);
  const min = m[2], period = m[3].toUpperCase();
  if (period === "AM" && h === 12) h = 0;
  if (period === "PM" && h !== 12) h += 12;
  return `${String(h).padStart(2, "0")}:${min}`;
}

const SPORT_DURATION_MS = { Basketball: 2 * 3600000, Hockey: 2.5 * 3600000 };
function getGameDateTime(game) {
  if (!game.date || !game.time) return null;
  // Normalize to 24h so the date string is always valid (handles "7:00 PM" stored in demo data)
  const t24 = parseTimeTo24h(game.time) || game.time;
  const dt = new Date(`${game.date}T${t24}`);
  return isNaN(dt.getTime()) ? null : dt;
}
function isGamePast(game) {
  const dt = getGameDateTime(game);
  if (dt) return dt < new Date();
  if (game.date) return new Date(game.date + "T23:59") < new Date();
  return false;
}
function isGameLive(game, sport) {
  const dt = getGameDateTime(game);
  if (!dt) return false;
  const now = new Date();
  const dur = SPORT_DURATION_MS[sport] || 2 * 3600000;
  return dt <= now && now < new Date(dt.getTime() + dur);
}

function isGameToday(game) {
  const gameDate = game.date ? new Date(game.date + "T12:00") : null; // mid-day to avoid DST edge cases
  if (!gameDate) return false;
  const today = new Date();
  return today.toDateString() === gameDate.toDateString();
}
function isGameAwaiting(game) {
  return isGamePast(game) && (game.homeScore === undefined || game.awayScore === undefined);
}
function getGameStatus(game, sport) {
  if (isGameLive(game, sport))                            return "LIVE";
  if (game.homeScore !== undefined && game.awayScore !== undefined) return "FINAL";
  if (isGameAwaiting(game))                               return "SCORE NEEDED";
  if (isGameToday(game))                                  return "TODAY";
  if (isGamePast(game))                                   return "AWAITING SCORE";
  return "UPCOMING";
}
function daysAgo(game) {
  const dt = getGameDateTime(game) || (game.date ? new Date(game.date + "T23:59") : null);
  if (!dt) return 0;
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}

function isGoalie(p) {
  const pos = (p.position || "").toLowerCase().trim();
  return pos === "goalie" || pos === "g" || pos === "gk" || pos === "goalkeeper" || pos === "goaltender";
}

function fmtAvg(val, gp) {
  if (!gp || gp === 0) return "—";
  return (val / gp).toFixed(2);
}

// Compute season totals + averages for one player across a given schedule slice
function getPlayerSeasonStats(player, schedule, sport) {
  const statDef = getSportStats(sport, player);
  const playedGames = schedule.filter(g =>
    isGamePast(g) && g.playerStats && g.playerStats[player.id] !== undefined
  );
  const totals = {}, averages = {};
  statDef.forEach(({ key }) => {
    const vals = playedGames.map(g => parseFloat(g.playerStats[player.id]?.[key]) || 0);
    totals[key] = vals.reduce((a, b) => a + b, 0);
    averages[key] = vals.length > 0 ? (totals[key] / vals.length).toFixed(1) : null;
  });
  return { gamesPlayed: playedGames.length, totals, averages, statDef };
}

function initNPS(players, sport) {
  const s = {};
  players.forEach(p => {
    if (sport === "Hockey") {
      s[p.id] = isGoalie(p) ? { saves: "", goalsAgainst: "" } : { goals: "", assists: "" };
    } else if (sport === "Basketball") {
      s[p.id] = { points: "", rebounds: "", assists: "", steals: "", blocks: "", turnovers: "", threes: "", fgPct: "", ftPct: "" };
    } else {
      s[p.id] = { goals: "", assists: "" };
    }
  });
  return s;
}

  const sorted = [...data].filter(p => p[statKey] !== undefined && p[statKey] !== null && p.gp > 0)
    .sort((a, b) => lowerBetter ? (a[statKey] - b[statKey]) : (b[statKey] - a[statKey]));
  const top = sorted.slice(0, 3);
  if (!top.length) return null;
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div style={{ ...card, minWidth: 200, flex: "1 1 200px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 14 }}>{icon} {title.toUpperCase()}</div>
      {top.map((p, i) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: i < top.length - 1 ? 10 : 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, minWidth: 20 }}>{medals[i]}</span>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: T2 }}>{p.team}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: i === 0 ? color : T1 }}>

            {p.gp > 0 && !lowerBetter && !fmtFn && (
              <div style={{ fontSize: 10, color: T2 }}>{fmtAvg(p[statKey], p.gp)}/g</div>

          </div>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// ACTION CONFIRM MODAL — reusable confirmation for all admin actions
// Props:
//   open              bool     — show/hide
//   onCancel          fn       — close without acting
//   onConfirm         fn       — execute the action
//   actionType        string   — 'add' | 'edit' | 'delete' | 'modify'
//   entityType        string   — 'team' | 'player' | 'game' | 'score' | 'stats'
//   entityLabel       string   — e.g. "Wolves", "Marc Tremblay"
//   summary           string   — human-readable sentence about the action
//   details           array    — [{ label, oldValue, newValue }] — shown as change table
//   requiresTypedConfirm bool  — if true, user must type confirmWord to enable button
//   confirmWord       string   — word user must type (default "DELETE")
//   confirmLabel      string   — button label
//   dangerStyle       bool     — red confirm button (for destructive actions)
// ══════════════════════════════════════════════════════════════════
function ActionConfirmModal({
  open, onCancel, onConfirm,
  actionType = 'modify', entityType = '', entityLabel = '',
  summary = '', details = [],
  requiresTypedConfirm = false, confirmWord = 'DELETE',
  confirmLabel = 'Confirm', dangerStyle = false,
}) {
  const [typed, setTyped] = React.useState('');
  const inputRef = React.useRef(null);

  // Reset typed input whenever modal opens
  React.useEffect(() => {
    if (open) {
      setTyped('');
      if (requiresTypedConfirm) {
        // Small delay so the DOM is mounted before focusing
        setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
      }
    }
  }, [open, requiresTypedConfirm]);

  // Esc to cancel, Enter to confirm (when allowed)
  React.useEffect(() => {
    if (!open) return;
    function handleKey(e) {
      if (e.key === 'Escape') { onCancel(); }
      if (e.key === 'Enter'  && canConfirm) { onConfirm(); }
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  });

  if (!open) return null;

  const canConfirm = !requiresTypedConfirm || typed === confirmWord;

  // Icon + title derived from actionType
  const ACTION_META = {
    add:    { icon: '➕', verb: 'Add'    },
    edit:   { icon: '✏️',  verb: 'Edit'   },
    delete: { icon: '🗑️', verb: 'Delete' },
    modify: { icon: '⚙️', verb: 'Modify' },
  };
  const meta       = ACTION_META[actionType] || ACTION_META.modify;
  const entityCap  = entityType ? entityType.charAt(0).toUpperCase() + entityType.slice(1) : '';
  const autoTitle  = `${meta.icon} ${meta.verb}${entityCap ? ' ' + entityCap : ''}${entityLabel ? ': ' + entityLabel : ''}`;

  const confirmBg  = dangerStyle ? '#ef4444' : ACC;

  return (
    <div
      style={{ position: 'fixed', inset: 0, background: '#00000095', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300 }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}
    >
      <div style={{ width: 440, ...card, padding: 32 }}>

        {/* Header */}
        <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>{autoTitle}</div>

        {/* Summary sentence */}
        {summary && (
          <div style={{ fontSize: 14, color: T2, marginBottom: details.length ? 16 : 24 }}>{summary}</div>
        )}

        {/* Details table — "Field: old → new" for edits, "Field: value" for adds */}
        {details.length > 0 && (
          <div style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 8, padding: '12px 16px', marginBottom: 20 }}>
            {details.map((row, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 13, padding: '4px 0', borderBottom: i < details.length - 1 ? `1px solid ${BORDER}` : 'none' }}>
                <span style={{ color: T2, flexShrink: 0, marginRight: 12 }}>{row.label}</span>
                {row.oldValue !== undefined
                  ? <span style={{ color: T1, textAlign: 'right' }}>
                      <span style={{ color: '#ef4444', textDecoration: 'line-through', marginRight: 6 }}>{row.oldValue}</span>
                      <span style={{ color: T2, marginRight: 6 }}>→</span>
                      <span style={{ color: '#22c55e' }}>{row.newValue}</span>
                    </span>
                  : <span style={{ color: T1, textAlign: 'right' }}>{row.value}</span>
                }
              </div>
            ))}
          </div>
        )}

        {/* Typed confirm input */}
        {requiresTypedConfirm && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 13, color: T2, marginBottom: 8 }}>
              Type <strong style={{ color: '#ef4444' }}>{confirmWord}</strong> to confirm
            </div>
            <input
              ref={inputRef}
              value={typed}
              onChange={e => setTyped(e.target.value)}
              placeholder={confirmWord}
              style={{ width: '100%', boxSizing: 'border-box', background: BG, border: `1px solid ${typed === confirmWord ? '#22c55e' : BORDER}`, borderRadius: 8, color: T1, padding: '10px 14px', fontSize: 14, outline: 'none' }}
            />
          </div>
        )}

        {/* Buttons */}
        <div style={{ display: 'flex', gap: 12 }}>
          <button
            style={{ ...btn(confirmBg), flex: 1, opacity: canConfirm ? 1 : 0.4, cursor: canConfirm ? 'pointer' : 'not-allowed' }}
            onClick={() => { if (canConfirm) onConfirm(); }}
            disabled={!canConfirm}
          >{confirmLabel}</button>
          <button style={{ ...btn('#252540'), flex: 1 }} onClick={onCancel}>Cancel</button>
        </div>

      </div>
    </div>
  );
}

// ── useActionConfirm — hook for imperative modal API ──
// Usage:
//   const askConfirm = useActionConfirm();
//   askConfirm({ actionType:'add', entityType:'team', entityLabel:'Wolves',
//                summary:"You are about to add team 'Wolves' to category 'U17'.",
//                onConfirm: () => doActualAdd() });
//   // In JSX: <ActionConfirmModal {...askConfirm.modalProps} />
function useActionConfirm() {
  const [state, setState] = React.useState(null); // null = closed

  function ask(opts) {
    setState(opts);
  }

  const modalProps = state
    ? {
        open:                 true,
        onCancel:             () => setState(null),
        onConfirm:            () => { setState(null); state.onConfirm && state.onConfirm(); },
        actionType:           state.actionType           || 'modify',
        entityType:           state.entityType           || '',
        entityLabel:          state.entityLabel          || '',
        summary:              state.summary              || '',
        details:              state.details              || [],
        requiresTypedConfirm: state.requiresTypedConfirm || false,
        confirmWord:          state.confirmWord          || 'DELETE',
        confirmLabel:         state.confirmLabel         || 'Confirm',
        dangerStyle:          state.dangerStyle          || false,
      }
    : { open: false, onCancel: () => {}, onConfirm: () => {} };

  return { ask, modalProps };
}

// SEASON RECAP GENERATOR
// ═══════════════════════════════════════════
function generateSeasonRecap(league, seasonNum) {
  const players  = league.players || [];
  const teams    = league.teams   || [];
  const schedule = league.schedule || [];
  const played   = schedule.filter(g => g.homeScore !== undefined && g.awayScore !== undefined);
  const season   = league.season || {};
  const resetAt  = season.resetAt || 0;

  // Filter games to current season
  const seasonGames = resetAt ? played.filter(g => new Date((g.date||'9999')+'T00:00').getTime() >= resetAt) : played;

  // Win counts per team
  const wins = {};
  teams.forEach(t => { wins[t.name] = 0; });
  seasonGames.forEach(g => {
    const hs = parseInt(g.homeScore), as = parseInt(g.awayScore);
    if (!isNaN(hs) && !isNaN(as)) {
      if (hs > as) wins[g.home] = (wins[g.home]||0)+1;
      else         wins[g.away] = (wins[g.away]||0)+1;
    }
  });
  const champion = teams.slice().sort((a,b) => (wins[b.name]||0)-(wins[a.name]||0))[0];

  // Player stats
  const playerStats = players.map(p => {
    const pid  = String(p.id);
    const gs   = seasonGames.filter(g => g.playerStats && g.playerStats[pid] !== undefined);
    const gp   = gs.length || 1;
    const sum  = k => gs.reduce((s,g)=>s+(+(g.playerStats[pid][k]||0)),0);
    const rp   = typeof calcPlayerRP === 'function' ? calcPlayerRP(p, schedule, league) : 0;
    return {
      id: p.id, name: p.name, team: p.team, photoUrl: p.photoUrl||'', position: p.position||'',
      gp: gs.length, rp,
      ppg: (sum('points')/gp).toFixed(1),  rpg: (sum('rebounds')/gp).toFixed(1),
      apg: (sum('assists')/gp).toFixed(1), spg: (sum('steals')/gp).toFixed(1),
      bpg: (sum('blocks')/gp).toFixed(1),
    };
  }).filter(p => p.gp > 0);

  const byRp      = [...playerStats].sort((a,b) => b.rp-a.rp);
  const byPpg     = [...playerStats].sort((a,b) => parseFloat(b.ppg)-parseFloat(a.ppg));
  const byApg     = [...playerStats].sort((a,b) => parseFloat(b.apg)-parseFloat(a.apg));
  const byRpg     = [...playerStats].sort((a,b) => parseFloat(b.rpg)-parseFloat(a.rpg));
  const byDef     = [...playerStats].sort((a,b) => (parseFloat(b.spg)+parseFloat(b.bpg))-(parseFloat(a.spg)+parseFloat(a.bpg)));

  // Best single game
  let bestGame = null, bestGameScore = 0;
  seasonGames.forEach(g => {
    if (!g.playerStats) return;
    Object.entries(g.playerStats).forEach(([pid,ps]) => {
      const pts = +(ps.points||0);
      if (pts > bestGameScore) { bestGameScore = pts; bestGame = { gameId: g.id, playerId: pid, pts, date: g.date, home: g.home, away: g.away }; }
    });
  });

  // Date range
  const dates = seasonGames.map(g=>g.date).filter(Boolean).sort();
  const dateRange = dates.length >= 2 ? `${dates[0]} → ${dates[dates.length-1]}` : (dates[0]||'');

  return {
    seasonNum, generatedAt: Date.now(), dateRange,
    totalGames: seasonGames.length, totalPlayers: playerStats.length,
    champion:   champion ? { name: champion.name, wins: wins[champion.name]||0, emoji: champion.emoji||'🏆' } : null,
    mvp:        byRp[0]  || null,
    topScorer:  byPpg[0] || null,
    topPasser:  byApg[0] || null,
    topRebounder: byRpg[0] || null,
    topDefender:  byDef[0] || null,
    allStars:   byRp.slice(0,5),
    bestGame,
    standings:  teams.map(t => ({ name: t.name, emoji: t.emoji||'', wins: wins[t.name]||0 })).sort((a,b)=>b.wins-a.wins),
  };
}

  // ── IMMEDIATE FIRESTORE WRITE (sub-collection architecture) ──
  // Bridge pattern: in-memory league state is unchanged (still has flat arrays).
  // Only the persistence layer changes — meta goes to root doc, arrays go to sub-collections.
  // Diffs against subcolData.current to only write/delete changed documents.
  async function writeLeagueNow(updated) {
    // Strip in-memory migration flag
    const { _migrated: _dropped, ...cleanUpdated } = updated;
    updated = cleanUpdated;
    // 1. Update in-memory React state + localStorage
    setLeagues(prev => {
      const next = prev.map(l => l.id === updated.id ? updated : l);
      localStorage.setItem("wxLeagues", JSON.stringify(next));
      localStorage.setItem("wxLeagues_updated", Date.now().toString());
      return next;
    });
    if (!__fbReady) return;
    try {
      const ts = Date.now();
      lastWriteRef.current = ts;
      const lid = String(updated.id);
      const { doc, collection, writeBatch } = _FS;

      // RISK 1 — Cold-start detection: if no tracked state exists for this league,
      // treat it as a full write (skip diff entirely — write every doc unconditionally).
      // This protects against a new device/session where subcolData is empty.
      const isFirstWrite = !subcolData.current[lid];
      const prev = subcolData.current[lid] || { teams: {}, players: {}, games: {}, stats: {} };

      // Build new state maps (keyed by string id for easy diff)
      const newTeams   = Object.fromEntries((updated.teams   || []).map(t => [String(t.id), t]));
      const newPlayers = Object.fromEntries((updated.players || []).map(p => [String(p.id), p]));
      const newGames   = Object.fromEntries((updated.schedule || []).map(g => [String(g.id), g]));

      // Collect all Firestore operations
      const ops = [];

      // Root meta doc — ALWAYS written (RISK 2: keeps _updatedAt current so public
      // site's onSnapshot detects every write). No arrays — sub-collections handle data.
      ops.push({ type: 'set', ref: doc(_db, "leagues", lid), data: {
        id:               updated.id,
        name:             updated.name             || "",
        sport:            updated.sport            || "",
        color:            updated.color            || "#6366f1",
        domain:           updated.domain           || "",
        categories:       updated.categories       || [],
        statToggles:      updated.statToggles      || {},
        honours:          updated.honours          || {},
        awards:           updated.awards           || {},
        season:           updated.season           || {},
        playerMilestones: updated.playerMilestones || {},
        _format:     "v2",
        _updatedAt:  ts,  // ← always bumped so public onSnapshot always detects this write
      }});

      // Teams: write changed docs (or all on cold start), delete removed docs
      for (const [tid, team] of Object.entries(newTeams)) {
        if (isFirstWrite || JSON.stringify(team) !== JSON.stringify(prev.teams[tid])) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "teams", tid), data: team });
        }
      }
      for (const tid of Object.keys(prev.teams)) {
        if (!newTeams[tid]) ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "teams", tid) });
      }

      // Players: write changed docs (or all on cold start), delete removed docs
      for (const [pid, player] of Object.entries(newPlayers)) {
        if (isFirstWrite || JSON.stringify(player) !== JSON.stringify(prev.players[pid])) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "players", pid), data: player });
        }
      }
      for (const pid of Object.keys(prev.players)) {
        if (!newPlayers[pid]) ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "players", pid) });
      }

      // Games + playerStats sub-sub-collection
      for (const [gid, game] of Object.entries(newGames)) {
        const { playerStats, ...gameWithoutStats } = game;
        const prevGame = prev.games[gid] || {};
        if (isFirstWrite || JSON.stringify(gameWithoutStats) !== JSON.stringify(prevGame)) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "games", gid), data: gameWithoutStats });
        }
        // PlayerStats sub-collection
        const newStats  = playerStats || {};
        const prevStats = prev.stats[gid] || {};
        for (const [pid, stats] of Object.entries(newStats)) {
          if (isFirstWrite || JSON.stringify(stats) !== JSON.stringify(prevStats[pid])) {
            ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)), data: stats });
          }
        }
        for (const pid of Object.keys(prevStats)) {
          if (!newStats[pid]) ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)) });
        }
      }
      // Delete removed games (and their playerStats)
      for (const gid of Object.keys(prev.games)) {
        if (!newGames[gid]) {
          ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid) });
          for (const pid of Object.keys(prev.stats[gid] || {})) {
            ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)) });
          }
        }
      }

      // meta/sync update (always included)
      ops.push({ type: 'set', ref: doc(_db, "meta", "sync"), data: { updatedAt: ts } });

      // RISK 4 — Batch chunking: Firestore hard limit is 500 ops per batch.
      // Chunking at 499 means multiple batches are committed sequentially for large leagues.
      // e.g. 1000 ops → 3 batch commits (499, 499, 2).
      for (let i = 0; i < ops.length; i += 499) {
        const chunk = ops.slice(i, i + 499);
        const batch = writeBatch(_db);
        for (const op of chunk) {
          if (op.type === 'set') batch.set(op.ref, op.data);
          else batch.delete(op.ref);
        }
        await batch.commit();
      }

      // Update tracked state so next write can diff correctly
      subcolData.current[lid] = {
        teams:   newTeams,
        players: newPlayers,
        games:   Object.fromEntries(Object.entries(newGames).map(([gid, g]) => {
          const { playerStats, ...rest } = g; return [gid, rest];
        })),
        stats:   Object.fromEntries((updated.schedule || []).map(g => [String(g.id), g.playerStats || {}])),
      };

    } catch(e) { console.error("Firestore writeLeagueNow:", e); }
  }

  async function createOwner() {
    const { email: e, password: p, confirm: c } = newOwner;
    if (!e.trim() || !p) { setOwnerError("Email and password are required."); return; }
    if (p !== c) { setOwnerError("Passwords do not match."); return; }
    if (users.some(u => u.email === e.trim())) { setOwnerError("That email is already in use."); return; }
    let fresh = loadUsers();
    if (__fbReady) {
      try {
        const { getDocs, collection } = _FS;
        const snap = await getDocs(collection(_db, "users"));
        fresh = snap.docs.map(d => d.data());
      } catch(e2) { /* use localStorage list */ }
    }
    if (JSON.stringify(fresh) !== JSON.stringify(users)) setUsers(fresh);
    if (fresh.find(u => u.email === e.trim())) { setOwnerError("An account with that email already exists."); return; }
    const lg = leagues.find(l => l.id === ownerModal);
    const hashedPw = await hashPassword(p);

      id: "user_" + Date.now(), email: e.trim(), password: hashedPw,
      role: "owner", leagueId: ownerModal,
      createdAt: new Date().toISOString().slice(0, 10),
    };

    saveUsers(updated);
    if (__fbReady) {
      try {
        const { setDoc, doc } = _FS;
        await setDoc(doc(_db, "users", newUser.id), newUser);
      } catch(e2) { console.error("Firestore createOwner:", e2); }
    }
    setUsers(updated);
    setOwnerModal(null);
    setNewOwner({ email: "", password: "", confirm: "" });
    setOwnerError("");
    setCreatedCreds({ email: newUser.email, password: p, leagueName: lg?.name || "League" });
  }

  // Returns players array with orphans removed — checks both p.team (name) and p.teamId (id)
  // so it works regardless of which field was stored in Firestore.
  function stripOrphanedPlayers(teams, players) {
    const teamNames = new Set(teams.map(t => t.name));
    const teamIds   = new Set(teams.map(t => String(t.id)));
    return players.filter(p => {
      const byName = p.team   && teamNames.has(p.team);
      const byId   = p.teamId && teamIds.has(String(p.teamId));
      return byName || byId;
    });
  }

  async function delTeam(id) {
    if (!league) return;
    const teamToDelete = league.teams.find(t => t.id === id);
    const remainingTeams = league.teams.filter(t => t.id !== id);
    const remainingPlayers = league.players.filter(p => {
      if (teamToDelete && p.team   === teamToDelete.name)   return false;
      if (teamToDelete && String(p.teamId) === String(id))  return false;
      return true;
    });
    // Also remove games that involved this team
    const remainingSchedule = teamToDelete
      ? league.schedule.filter(g => g.home !== teamToDelete.name && g.away !== teamToDelete.name)
      : league.schedule;
    // Belt-and-suspenders: delete directly from Firestore, don't rely solely on diff
    if (__fbReady && _db) {
      try {
        const { deleteDoc, doc } = _FS;
        await deleteDoc(doc(_db, 'leagues', String(league.id), 'teams', String(id)));
        // Delete players on this team
        const playersToRemove = league.players.filter(p =>
          (teamToDelete && p.team === teamToDelete.name) || String(p.teamId) === String(id)
        );
        for (const p of playersToRemove) {
          await deleteDoc(doc(_db, 'leagues', String(league.id), 'players', String(p.id)));
        }
        // Delete games involving this team
        const gamesToRemove = teamToDelete
          ? league.schedule.filter(g => g.home === teamToDelete.name || g.away === teamToDelete.name)
          : [];
        for (const g of gamesToRemove) {
          await deleteDoc(doc(_db, 'leagues', String(league.id), 'games', String(g.id)));
        }
      } catch (e) {
        console.error('[League Hunter] Direct deleteDoc failed in delTeam:', e);
        // Continue to writeLeagueNow as fallback
      }
    }
    const updated = { ...league, teams: remainingTeams, players: remainingPlayers, schedule: remainingSchedule };
    await writeLeagueNow(updated);
    setDirty(false);
  }

  async function cleanOrphanedPlayers() {
    if (!league) return;
    const before = league.players.length;
    const cleaned = stripOrphanedPlayers(league.teams, league.players);
    const removed = before - cleaned.length;
    if (removed === 0) { showToast("No orphaned players found."); return; }
    const updated = { ...league, players: cleaned };
    await writeLeagueNow(updated);
    setDirty(false);
    showToast(`Removed ${removed} orphaned player${removed !== 1 ? "s" : ""} from Firestore.`);
  }

  async function delPlayer(id) {
    if (!league) return;
    const cleanedSchedule = (league.schedule || []).map(g => {
      if (!g.playerStats) return g;
      const ps = { ...g.playerStats };

    });
    // Belt-and-suspenders: delete directly from Firestore, don't rely solely on diff
    if (__fbReady && _db) {
      try {
        const { deleteDoc, doc } = _FS;
        await deleteDoc(doc(_db, 'leagues', String(league.id), 'players', String(id)));

  async function deleteLeague(id) {
    if (__fbReady) {
      try {
        const { deleteDoc, doc, getDocs, collection, writeBatch } = _FS;
        const lid = String(id);
        // Load sub-collections so we can delete them (Firestore doesn't cascade)
        const [teamsSnap, playersSnap, gamesSnap] = await Promise.all([
          getDocs(collection(_db, "leagues", lid, "teams")),
          getDocs(collection(_db, "leagues", lid, "players")),
          getDocs(collection(_db, "leagues", lid, "games")),
        ]);
        // Load playerStats for every game
        const statSnaps = await Promise.all(
          gamesSnap.docs.map(gDoc => getDocs(collection(_db, "leagues", lid, "games", gDoc.id, "playerStats")))
        );
        // RISK 3 — Delete in correct dependency order:
        // 1. playerStats first (deepest sub-collection)
        // 2. games (parent of playerStats)
        // 3. players
        // 4. teams
        // 5. root league doc LAST
        const allSubDocs = [
          ...statSnaps.flatMap(s => s.docs),  // 1. playerStats docs
          ...gamesSnap.docs,                   // 2. game docs
          ...playersSnap.docs,                 // 3. player docs
          ...teamsSnap.docs,                   // 4. team docs
        ];
        // Delete in batches of 499
        for (let i = 0; i < allSubDocs.length; i += 499) {
          const batch = writeBatch(_db);
          allSubDocs.slice(i, i + 499).forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
        // Delete root doc last
        await deleteDoc(doc(_db, "leagues", lid));
        // Clear tracked state
        const next = { ...subcolData.current };
        delete next[lid];
        subcolData.current = next;
      } catch(e) { console.error("Firestore deleteLeague:", e); }
    }
    const updated = leagues.filter(l => l.id !== id);
    setLeagues(updated);
    localStorage.setItem("wxLeagues", JSON.stringify(updated));
    if (selId === id) { setSelId(null); setPage("dashboard"); setDirty(false); }
    showToast("League deleted.");
  }

  // ── FEATURE 2: SAVE EDIT TEAM ──
  async function saveEditTeam() {
    if (!editTeam || !league) return;
    if (!isValidEmoji(editTeam.emoji)) { setEditEmojiErr("Please enter a valid emoji."); return; }
    setEditEmojiErr("");
    const oldTeam = league.teams.find(t => t.id === editTeam.id);
    const oldName = oldTeam?.name;
    const newName = editTeam.name.trim();
    if (!newName) return;
    const nameChanged = oldName && oldName !== newName;
    const updatedTeams = league.teams.map(t => t.id === editTeam.id ? { ...t, name: newName, emoji: editTeam.emoji } : t);
    const updatedPlayers = nameChanged ? league.players.map(p => p.team === oldName ? { ...p, team: newName } : p) : league.players;
    const updatedSchedule = nameChanged
      ? (league.schedule || []).map(g => ({ ...g, home: g.home === oldName ? newName : g.home, away: g.away === oldName ? newName : g.away }))
      : league.schedule;
    const updated = { ...league, teams: updatedTeams, players: updatedPlayers, schedule: updatedSchedule };
    await writeLeagueNow(updated);
    setDirty(false);
    setEditTeam(null);
    showToast("Team updated!");
  }

  // ── FEATURE 2: SAVE EDIT PLAYER ──
  async function saveEditPlayer() {
    if (!editPlayer || !league) return;
    const newName = editPlayer.name.trim();
    if (!newName) return;
    // Jersey number uniqueness within same team
    const teamPlayers = league.players.filter(p => p.team === editPlayer.team && p.id !== editPlayer.id);
    if (editPlayer.number && teamPlayers.some(p => String(p.number) === String(editPlayer.number))) {
      showToast(`Jersey #${editPlayer.number} is already taken on ${editPlayer.team}`);
      return;
    }
    const team = league.teams.find(t => t.name === editPlayer.team);
    const updatedPlayers = league.players.map(p => p.id === editPlayer.id
      ? { ...p, name: newName, number: editPlayer.number, position: editPlayer.position, team: editPlayer.team, teamId: team?.id || p.teamId, categoryId: team?.categoryId || p.categoryId, email: editPlayer.email || p.email || "" }
      : p);
    const updated = { ...league, players: updatedPlayers };
    await writeLeagueNow(updated);
    setDirty(false);
    // Send notification if email changed/added and emailConfig exists
    if (editPlayer.email && emailConfig) {
      const playerUrl = `${window.location.origin}/public.html?league=${league.id}&player=${editPlayer.id}`;
      sendViaEmailJS(emailConfig, emailConfig.templateScores, {
        to_email: editPlayer.email,
        league_name: league.name || 'League',
        player_name: newName,
        player_team: editPlayer.team || '',
        player_card_url: playerUrl,
        public_url: `${window.location.origin}/public.html?league=${league.id}`,
        unsubscribe_url: playerUrl,
      }).catch(()=>{});
    }
    setEditPlayer(null);
    showToast("Player updated!");
  }

  // ── FEATURE 5: DELETE PLAYER — uses deleteConfirm.ask for both cases ──
  function handleDeletePlayer(id) {
    if (!league) return;
    const p = league.players.find(pl => pl.id === id);
    if (!p) return;
    const gamesCount = (league.schedule || []).filter(g => g.playerStats && (g.playerStats[id] !== undefined || g.playerStats[String(id)] !== undefined)).length;
    const totalPts   = (league.schedule || []).reduce((sum, g) => sum + (+(g.playerStats?.[id]?.points || g.playerStats?.[String(id)]?.points || 0)), 0);
    deleteConfirm.ask({
      actionType: 'delete',
      entityType: 'player',
      entityLabel: p.name,
      summary: gamesCount > 0
        ? `You are about to permanently delete "${p.name}". This will also remove their stats from ${gamesCount} recorded game${gamesCount !== 1 ? 's' : ''}. This cannot be undone.`
        : `You are about to permanently delete player "${p.name}". This cannot be undone.`,
      details: [
        { label: 'Player',   value: p.name },
        { label: 'Team',     value: p.team || '—' },
        { label: 'Games',    value: String(gamesCount) },
        ...(gamesCount > 0 ? [{ label: 'Points recorded', value: String(totalPts) }] : []),
      ],
      requiresTypedConfirm: true,
      confirmWord: 'DELETE',
      confirmLabel: 'Yes, Delete Player',
      dangerStyle: true,
      onConfirm: () => delPlayer(id),
    });
  }

  async function submitScore() {
    if (!nS.gameId || !league || saving) return;
    const hs = parseInt(nS.homeScore);
    const as = parseInt(nS.awayScore);
    if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
      showToast("Scores must be non-negative numbers.");
      return;
    }
    setSaving(true);
    try {
      const gId = parseInt(nS.gameId);
      const psForGame = {};
      Object.keys(nPS).forEach(pid => {
        const raw = nPS[pid];
        const entry = {};
        Object.keys(raw).forEach(k => {
          const v = parseInt(raw[k]);
          entry[k] = (isNaN(v) || v < 0) ? 0 : v;
        });
        psForGame[pid] = entry;
      });
      const updated = { ...league, schedule: league.schedule.map(g => g.id === gId ? { ...g, played: true, homeScore: hs, awayScore: as, playerStats: psForGame } : g) };
      await writeLeagueNow(updated);
      setDirty(false);
      setNS({ gameId: "", homeScore: "", awayScore: "" }); setNPS({});
    } finally { setSaving(false); }
  }

  // ── Shared stats-write helper (always saves, no validation) ──
  async function _doWriteStats() {
    const cleaned = {};
    Object.keys(editStats.stats).forEach(pid => {
      cleaned[pid] = {};
      Object.keys(editStats.stats[pid]).forEach(k => {
        const v = parseFloat(editStats.stats[pid][k]);
        cleaned[pid][k] = isNaN(v) || v < 0 ? 0 : v;
      });
    });
    const updated = {
      ...league,
      schedule: league.schedule.map(g =>
        g.id === editStats.game.id ? { ...g, playerStats: cleaned } : g
      ),
    };
    await writeLeagueNow(updated);
    setDirty(false);
    setEditStats(null);
    setStatsValidationError(null);
    showToast("Stats saved ✅");
    // Send score notification for the game
    if (emailConfig) {
      const savedGame = updated.schedule.find(g => g.id === editStats?.game?.id);
      if (savedGame && savedGame.homeScore !== undefined) {
        sendScoreNotification(_db, _FS, updated, savedGame, emailConfig)
          .then(count => { if(count>0) showToast(`Score notification sent to ${count} subscriber${count!==1?'s':''}`, 'info'); })
          .catch(()=>{});
      }
    }
    // Auto-save newly earned milestones
    try {
      const milUpdates = {};
      (updated.players||[]).forEach(p => {
        const newMils = calcNewMilestones(p, updated.schedule||[], updated);
        if (newMils.length > 0) {
          const pid = String(p.id);
          const ex = ((updated.playerMilestones||{})[pid]) || { milestones:[], rpAdjustments:[] };
          milUpdates[pid] = { ...ex, milestones: [...(ex.milestones||[]), ...newMils] };
        }
      });
      if (Object.keys(milUpdates).length > 0) {
        const withMil = { ...updated, playerMilestones: { ...(updated.playerMilestones||{}), ...milUpdates } };
        await writeLeagueNow(withMil);
      }
    } catch(e) { console.error('Milestone auto-save:', e); }
    // Count newly earned milestones for toast
    try {
      let newBadgeCount = 0;
      (updated.players||[]).forEach(p => {
        const pid = String(p.id);
        const prevMils = new Set(((league.playerMilestones||{})[pid]?.milestones)||[]);
        const nowMils  = new Set(((updated.playerMilestones||{})[pid]?.milestones)||[]);
        const milToBadge = { pts_20:'scorer_20', pts_30:'scorer_30', pts_40:'scorer_40', double_double:'double_double', triple_double:'triple_double', ws_5:'win_streak_5', ws_10:'win_streak_10' };
        Object.keys(milToBadge).forEach(mk => { if (!prevMils.has(mk) && nowMils.has(mk)) newBadgeCount++; });
      });
      if (newBadgeCount > 0) showToast(`🏅 ${newBadgeCount} new badge${newBadgeCount!==1?'s':''} unlocked this game!`, 'success');
    } catch(e) { /* badge toast is non-critical */ }

  async function saveStats(skipCheck = false) {
    if (!editStats || !league || saving) return;
    // ── Points validation (Basketball only, when a score exists) ──
    // Use league.sport — NOT the block-scoped `sport` variable inside the league render branch.
    if (!skipCheck && league.sport === "Basketball") {
      const g = editStats.game;
      if (g.homeScore !== undefined && g.awayScore !== undefined) {
        const allGamePlayers = league.players.filter(p => p.team === g.home || p.team === g.away);
        const mismatches = [g.home, g.away].map(teamName => {
          const teamPlayers = allGamePlayers.filter(p => p.team === teamName);
          const entered = teamPlayers.reduce((s, p) => s + (parseFloat(editStats.stats[p.id]?.points) || 0), 0);
          const score   = parseInt(teamName === g.home ? g.homeScore : g.awayScore);
          const diff    = score - entered;
          if (diff !== 0) {
            const suspects = teamPlayers.filter(p => !(parseFloat(editStats.stats[p.id]?.points) > 0));
            return { team: teamName, entered, score, diff, suspects };
          }
          return null;
        }).filter(Boolean);
        if (mismatches.length > 0) {
          setStatsValidationError(mismatches);
          return;
        }
      }
    }
    setStatsValidationError(null);
    setSaving(true);
    try { await _doWriteStats(); } finally { setSaving(false); }
  }

  async function saveStatsForce() {
    if (!editStats || !league || saving) return;

    setSaving(true);

  }

    if (!league) return;
    const currentNum = (league.season || {}).number || 1;

    // Generate and save season recap before resetting
    if (__fbReady && _db) {
      try {
        const recap = generateSeasonRecap(league, currentNum);
        const { doc, setDoc } = _FS;
        await setDoc(doc(_db, 'leagues', String(league.id), 'recaps', String(currentNum)), recap);
      } catch(e) { console.error('Recap save:', e); }
    }

    const updated = { ...league, season: { resetAt: Date.now(), number: currentNum + 1 }, playerMilestones: {} };
    await writeLeagueNow(updated);
    setDirty(false);
    showToast(`Season ${currentNum + 1} started! Rankings reset.`, "success");
  }
  async function applyRpAdjustment(pid, amount, reason) {
    if (!league || !pid || !amount) return;
    const existing = ((league.playerMilestones||{})[pid]) || { milestones: [], rpAdjustments: [] };
    const adj = { amount: parseInt(amount), reason: reason||"Manual adjustment", date: new Date().toISOString().slice(0,10) };
    const updated = { ...league, playerMilestones: { ...(league.playerMilestones||{}), [pid]: { ...existing, rpAdjustments: [...(existing.rpAdjustments||[]), adj] } } };
    await writeLeagueNow(updated); setDirty(false);
    showToast(`RP adjustment applied.`, "success");
  }
