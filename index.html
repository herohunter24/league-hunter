                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: toggles[key] ? T1 : T2 }}>
                          <span style={{ color: toggles[key] ? color : T2, marginRight: 8, fontSize: 12 }}>●</span>{label}
                        </div>
                        <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{desc}</div>
                      </div>
                      <Toggle on={toggles[key]} onChange={() => setToggle(key, !toggles[key])} />
                    </div>
                  ))}
                  {sport==="Basketball" && [
                    { key: "points",   label: "Points",   desc: "Track scoring and points leaders",          color: ACC },
                    { key: "assists",  label: "Assists",  desc: "Track assists and assist leaders",          color: "#38bdf8" },
                    { key: "rebounds", label: "Rebounds", desc: "Track rebounds and rebounding leaders",     color: "#22c55e" },
                    { key: "blocks",   label: "Blocks",   desc: "Track blocks and shot-blocking leaders",    color: "#a78bfa" },
                    { key: "steals",   label: "Steals",   desc: "Track steals and steal leaders",           color: "#f472b6" },
                  ].map(({ key, label, desc, color }) => (
                    <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 0", borderBottom: `1px solid ${BORDER}` }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: toggles[key] ? T1 : T2 }}>
                          <span style={{ color: toggles[key] ? color : T2, marginRight: 8, fontSize: 12 }}>●</span>{label}
                        </div>
                        <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{desc}</div>
                      </div>
                      <Toggle on={toggles[key]} onChange={() => setToggle(key, !toggles[key])} />
                    </div>
                  ))}
                  {sport!=="Hockey" && sport!=="Basketball" && (
                    <div style={{ padding: "20px 0", color: T2, fontSize: 14 }}>No configurable stat categories for {sport} yet.</div>
                  )}
                </div>
              </div>

              <div style={{ ...card, background: SURF }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 4 }}>How toggles work</div>
                <div style={{ fontSize: 13, color: T2, lineHeight: 1.6 }}>
                  When a stat category is turned <strong style={{ color: "#ef4444" }}>OFF</strong>, it disappears from the Stats tab — including leader cards, columns in the rankings table, and per-game averages for that category. Toggle it back <strong style={{ color: "#22c55e" }}>ON</strong> at any time to restore it. All data is preserved regardless of toggle state. Settings are saved per-league and persist across sessions.
                </div>
              </div>

              <div style={{ ...card, background: SURF, marginTop: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>Data Cleanup</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 14, lineHeight: 1.6 }}>
                  Remove any players whose team no longer exists in the teams list. Runs instantly and writes to Firestore — use this if a team was deleted but its players are still showing on the public site.
                </div>
                {(() => {
                  const orphanCount = stripOrphanedPlayers(league.teams, league.players).length < league.players.length
                    ? league.players.length - stripOrphanedPlayers(league.teams, league.players).length
                    : 0;
                  return (
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <button onClick={cleanOrphanedPlayers} style={{ ...btn("#ef4444"), fontSize: 13, padding: "9px 18px" }}>
                        🧹 Clean Orphaned Players
                      </button>
                      {orphanCount > 0
                        ? <span style={{ fontSize: 12, color: "#ef4444", fontWeight: 600 }}>⚠️ {orphanCount} orphaned player{orphanCount !== 1 ? "s" : ""} detected</span>
                        : <span style={{ fontSize: 12, color: "#22c55e" }}>✓ No orphans detected</span>
                      }
                    </div>
                  );
                })()}
              </div>

              <div style={{ ...card, background: "#1a0a0a", border: "1px solid #7f1d1d", marginTop: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6, color: "#ef4444" }}>Danger Zone</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 14, lineHeight: 1.6 }}>
                  Permanently delete this league and all its data from Firestore. This cannot be undone.
                </div>
                <button onClick={() => setDeleteLeagueId(league.id)} style={{ ...btn("#ef4444"), fontSize: 13, padding: "9px 18px" }}>
                  Delete League
                </button>
              </div>

              {/* CONNECTION STATUS */}
              {(() => {
                const hb = localStorage.getItem("wxLeagues_pubHeartbeat");
                const lastUpdated = localStorage.getItem("wxLeagues_updated");
                let hbColor = T2, hbLabel = "No heartbeat", hbDesc = "Public site heartbeat not detected.";
                if (hb) {
                  const diff = Date.now() - parseInt(hb);
                  if (diff < 5*60000)  { hbColor="#22c55e"; hbLabel="Active";   hbDesc=`Public site active ${Math.round(diff/1000)}s ago`; }
                  else if (diff < 60*60000) { hbColor="#f59e0b"; hbLabel="Idle"; hbDesc=`Public site last seen ${Math.round(diff/60000)}m ago`; }
                  else                 { hbColor="#ef4444"; hbLabel="Stale";  hbDesc=`Public site last seen ${Math.round(diff/3600000)}h ago`; }
                }
                const fbColor = __fbReady ? "#22c55e" : __fbUncfg ? "#ef4444" : "#f59e0b";
                const fbLabel = __fbReady ? "Firebase Connected" : __fbUncfg ? "Firebase Not Configured" : "Firebase Offline";
                const devRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true; // DEV ONLY — open access
    }
  }
}`;
                const prodRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Public sites can read leagues
    match /leagues/{leagueId} {
      allow read: if true;
      allow write: if false; // write via admin SDK or auth
    }
    // meta/sync readable by public sites
    match /meta/{doc} {
      allow read: if true;
      allow write: if false;
    }
    // Users only readable/writable server-side
    match /users/{userId} {
      allow read, write: if false;
    }
  }
}`;
                return (
                  <div style={{ ...card, marginTop: 20 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>Firebase / Public Site Connection</div>

                    {/* Firebase status */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, padding: "12px 16px", background: SURF, borderRadius: 8 }}>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: fbColor, boxShadow: `0 0 6px ${fbColor}`, flexShrink: 0 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: fbColor }}>{fbLabel}</div>
                        {__fbUncfg && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Replace REPLACE_ME values in the Firebase module script at the top of index.html</div>}
                        {__fbReady && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Firestore doc: <code style={{ color: T1 }}>leagues/{String(selId)}</code></div>}
                        {fbError && <div style={{ fontSize: 11, color: "#f59e0b", marginTop: 2 }}>{fbError}</div>}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: hbColor }} />
                        <div style={{ fontSize: 11, color: hbColor }}>{hbLabel}</div>
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
                      <button onClick={copyPublicSnippet} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>📋 Copy Public Site Snippet</button>
                      <button onClick={forceSync} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>⚡ Force Sync</button>
                    </div>
                    {lastUpdated && <div style={{ fontSize: 11, color: T2, marginTop: -14, marginBottom: 16 }}>Last sync: {new Date(parseInt(lastUpdated)).toLocaleTimeString()}</div>}

                    {/* Setup guide */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 12 }}>
                      <button onClick={() => setShowConnGuide(v => !v)} style={{ background: "none", border: "none", color: ACC, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
                        {showConnGuide ? "▾" : "▸"} Firebase Setup Guide
                      </button>
                      {showConnGuide && (
                        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                          {[
                            ["1. Create a Firebase project", "Go to console.firebase.google.com → Add project. Give it a name (e.g. league-hunter)."],
                            ["2. Enable Firestore", "In the Firebase console → Build → Firestore Database → Create database → Start in test mode."],
                            ["3. Get your config", "Project Settings → Your apps → Add app (Web) → Copy the firebaseConfig object."],
                            ["4. Paste config into index.html", `Find the Firebase module script near the top of index.html and replace all six REPLACE_ME values with your real config values.`],
                            ["5. Connect your public site", `In Website X → Settings → Connection, click 📋 Copy Public Site Snippet. Paste it into the <head> of your public HTML file (basketball-public.html or any custom site). It auto-fills your Firebase config and this league's ID (${selId}).`],
                            ["6. Deploy security rules", "In Firebase console → Firestore → Rules, paste the production rules shown below. This lets public sites read league data while keeping writes server-side."],
                          ].map(([title, body]) => (
                            <div key={title} style={{ background: SURF, borderRadius: 8, padding: "12px 14px" }}>
                              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{title}</div>
                              <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>{body}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Security rules */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 12 }}>FIRESTORE SECURITY RULES</div>
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#f59e0b", marginBottom: 6 }}>Dev rules (open access — for testing only):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{devRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(devRules).then(()=>showToast("Dev rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Dev Rules</button>
                      </div>
                      <div>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#22c55e", marginBottom: 6 }}>Production rules (read-only for public, no user data exposed):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{prodRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(prodRules).then(()=>showToast("Prod rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Prod Rules</button>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

        </div>{/* end content */}

        {/* ── STICKY SAVE BAR ── */}
        {dirty && (
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#0f0f1f", borderTop: `1px solid ${BORDER}`, padding: "12px 32px", display: "flex", alignItems: "center", justifyContent: "space-between", zIndex: 150, boxShadow: "0 -4px 20px #00000060" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#f59e0b", boxShadow: "0 0 6px #f59e0b", flexShrink: 0 }} />
              <div>
                <div style={{ fontSize: 14, color: T1, fontWeight: 600 }}>Unsaved changes</div>
                {lastSaved && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Last saved: {lastSaved}</div>}
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={discardDirty} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>Discard</button>
              <button onClick={handleSave} style={{ ...btn("#22c55e"), padding: "9px 20px", fontSize: 14 }}>💾 Save Changes</button>
            </div>
          </div>
        )}

        {/* ── TOAST ── */}
        {toast && (
          <div style={{ position: "fixed", bottom: dirty ? 76 : 24, left: "50%", transform: "translateX(-50%)", background: "#1a2e1a", border: "1px solid #22c55e40", borderRadius: 10, padding: "12px 22px", fontSize: 13, fontWeight: 600, color: "#22c55e", zIndex: 400, whiteSpace: "nowrap", boxShadow: "0 4px 20px #00000080" }}>
            ✓ {toast}
          </div>
        )}

        {/* ── MODALS ── */}
        {editGame && (() => {
          // Use the game's own categoryId for the team lists so only same-category teams are shown
          const editGameCatTeams = editGame.categoryId
            ? league.teams.filter(t => t.categoryId === editGame.categoryId)
            : catTeams;
          return (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
            <div style={{ width: 500, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Edit Game</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div><label style={lbl}>Date</label><input type="date" style={inp} value={editGame.date || ""} onChange={e=>setEditGame({...editGame,date:e.target.value})} /></div>
                <div><label style={lbl}>Time</label><input type="time" style={inp} value={parseTimeTo24h(editGame.time || "")} onChange={e=>setEditGame({...editGame,time:e.target.value})} /></div>
                <div><label style={lbl}>Venue</label>
                  <input style={inp} value={editGame.venue || ""} onChange={e=>setEditGame({...editGame,venue:e.target.value})} placeholder="Arena / Venue" />
                  {(() => {
                    const ev = [...new Set((league.schedule || []).map(g => g.venue).filter(Boolean))].sort();
                    return ev.length > 0 ? (
                      <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: T2, marginRight: 2 }}>Venues:</span>
                        {ev.map(v => (
                          <button key={v} type="button" onClick={() => setEditGame({...editGame, venue: v})}
                            style={{ fontSize: 11, padding: "3px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${editGame.venue === v ? ACC : BORDER}`, background: editGame.venue === v ? ACC + "22" : "none", color: editGame.venue === v ? ACC : T2, fontWeight: editGame.venue === v ? 700 : 400 }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    ) : null;
                  })()}
                </div>
                <div><label style={lbl}>Home Team</label>
                  <select style={inp} value={editGame.home} onChange={e=>setEditGame({...editGame,home:e.target.value})}>
                    {editGameCatTeams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div><label style={lbl}>Away Team</label>
                  <select style={inp} value={editGame.away} onChange={e=>setEditGame({...editGame,away:e.target.value})}>
                    {editGameCatTeams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={saveEditGame}>Save Changes</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditGame(null)}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
          );
        })()}

        {deleteGameId && (
          <ConfirmModal icon="🗑️" title="Delete this game?" body="This action cannot be undone. The game and all associated data will be permanently removed." confirmLabel="Yes, Delete" onConfirm={() => deleteGame(deleteGameId)} onCancel={() => setDeleteGameId(null)} />
        )}

        {editScore && (() => {
          const g = league.schedule.find(x => x.id===editScore.id);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
              <div style={{ width: 400, ...card, padding: 32 }}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Edit Score</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 24 }}>{g?.home} vs {g?.away} · {g?.date}</div>
                <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.home}</label><input type="number" min="0" style={inp} value={editScore.homeScore} onChange={e=>setEditScore({...editScore,homeScore:e.target.value})} /></div>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.away}</label><input type="number" min="0" style={inp} value={editScore.awayScore} onChange={e=>setEditScore({...editScore,awayScore:e.target.value})} /></div>
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={saveEditScore}>Save Score</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditScore(null)}>Cancel</button>
                </div>
              </div>
            </div>
          );
        })()}

        {deleteScoreId && (
          <ConfirmModal icon="↩️" title="Reset this game result?" body="The score and player stats will be cleared. The game returns to Upcoming status." confirmLabel="Yes, Reset" onConfirm={() => deleteScore(deleteScoreId)} onCancel={() => setDeleteScoreId(null)} />
        )}

        {/* ── STATS ENTRY MODAL ── */}
        {editStats && (() => {
          const g = editStats.game;
          const gamePlayers = league.players.filter(p => p.team === g.home || p.team === g.away);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 250, padding: 16 }}>
              <div style={{ width: "100%", maxWidth: 620, ...card, display: "flex", flexDirection: "column", maxHeight: "90vh" }}>
                {/* Header */}
                <div style={{ padding: "24px 28px 16px", borderBottom: `1px solid ${BORDER}`, flexShrink: 0 }}>
                  <div style={{ fontSize: 17, fontWeight: 700 }}>Player Stats</div>
                  <div style={{ fontSize: 13, color: T2, marginTop: 4 }}>{g.home} vs {g.away} · {g.date}{g.venue ? " · " + g.venue : ""}</div>
                </div>
                {/* Scrollable body */}
                <div style={{ overflowY: "auto", padding: "16px 28px", flex: 1 }}>
                  {[g.home, g.away].map(teamName => {
                    const tp = gamePlayers.filter(p => p.team === teamName);
                    if (!tp.length) return null;
                    return (
                      <div key={teamName} style={{ marginBottom: 24 }}>
                        <div style={{ fontSize: 12, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 12 }}>{teamName.toUpperCase()}</div>
                        {tp.map(p => {
                          const statDef = getSportStats(sport, p);
                          const ps = editStats.stats[p.id] || {};
                          return (
                            <div key={p.id} style={{ marginBottom: 16, padding: "12px 14px", background: "#ffffff06", borderRadius: 8, border: `1px solid ${BORDER}` }}>
                              <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                                <span style={{ color: ACC, fontWeight: 700, fontSize: 12 }}>#{p.number}</span>
                                {p.name}
                                {isGoalie(p) && sport === "Hockey" && <span style={{ fontSize: 11, color: T2 }}>🥅</span>}
                              </div>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                                {statDef.map(({ key, label }) => (
                                  <div key={key} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                                    <span style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.05em" }}>{label}</span>
                                    <input
                                      type="number" min="0"
                                      style={{ ...inp, width: 64, padding: "6px 6px", textAlign: "center", fontSize: 14, fontWeight: 600 }}
                                      value={ps[key] === undefined ? 0 : ps[key]}
                                      onChange={e => setEditStats(prev => ({
                                        ...prev,
                                        stats: { ...prev.stats, [p.id]: { ...prev.stats[p.id], [key]: e.target.value } }
                                      }))}
                                    />
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                  {gamePlayers.length === 0 && (
                    <div style={{ textAlign: "center", color: T2, padding: 32 }}>No players found for these teams. Add players first.</div>
                  )}
                </div>
                {/* Footer */}
                <div style={{ padding: "16px 28px 24px", borderTop: `1px solid ${BORDER}`, flexShrink: 0, display: "flex", gap: 12 }}>
                  <button style={{ ...btn(), flex: 1, opacity: saving ? 0.6 : 1 }} disabled={saving} onClick={saveStats}>{saving ? "Saving…" : "Save Stats"}</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditStats(null)}>Cancel</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ── SAVE CONFIRMATION MODAL ── */}
        {pendingSave && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350 }}>
            <div style={{ width: 420, ...card, padding: 36, textAlign: "center" }}>
              <div style={{ fontSize: 40, marginBottom: 16 }}>💾</div>
              <div style={{ fontSize: 19, fontWeight: 800, marginBottom: 10 }}>Save Changes?</div>
              <div style={{ fontSize: 14, color: T2, marginBottom: 28, lineHeight: 1.6 }}>Are you sure you want to apply these changes?<br/>This will update the live league data.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <button style={{ ...btn("#22c55e"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={confirmSave}>Confirm Save</button>
                <button style={{ ...btn("#252540"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={() => setPendingSave(false)}>Cancel</button>
              </div>
            </div>
          </div>
        )}

        {/* ── ADD CATEGORY MODAL ── */}
        {showCatModal && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ width: 440, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Add Category</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <label style={lbl}>Age Group</label>
                  <select style={inp} value={nCat.ageGroup} onChange={e => setNCat({ ...nCat, ageGroup: e.target.value })}>
                    {["U13","U15","U18","U20","U30","U50","Open","Custom"].map(ag => <option key={ag}>{ag}</option>)}
                  </select>
                </div>
                {nCat.ageGroup === "Custom" && (
                  <div>
                    <label style={lbl}>Custom Name</label>
                    <input style={inp} value={nCat.customAge} onChange={e => setNCat({ ...nCat, customAge: e.target.value })} placeholder="e.g. Masters, Senior, Varsity…" />
                  </div>
                )}
                <div>
                  <label style={lbl}>Gender</label>
                  <select style={inp} value={nCat.gender} onChange={e => setNCat({ ...nCat, gender: e.target.value })}>
                    {["Masculine","Feminine","Mixed"].map(g => <option key={g}>{g}</option>)}
                  </select>
                </div>
                <div style={{ background: SURF, borderRadius: 8, padding: "12px 16px", fontSize: 14 }}>
                  <span style={{ color: T2 }}>Display name: </span>
                  <strong style={{ color: T1 }}>
                    {(nCat.ageGroup === "Custom" ? (nCat.customAge.trim() || "…") : nCat.ageGroup) + (nCat.gender ? " " + nCat.gender : "")}
                  </strong>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1, opacity: (nCat.ageGroup === "Custom" && !nCat.customAge.trim()) ? 0.45 : 1 }} onClick={addCategory}>Add Category</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => { setShowCatModal(false); setNCat({ ageGroup: "U15", gender: "Masculine", customAge: "" }); }}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── DELETE CATEGORY CONFIRM ── */}
        {deleteCatId && (() => {
          const cat = (league.categories || []).find(c => c.id === deleteCatId);
          const tCount = league.teams.filter(t => t.categoryId === deleteCatId).length;
          const pCount = league.players.filter(p => p.categoryId === deleteCatId).length;
          const gCount = (league.schedule || []).filter(g => g.categoryId === deleteCatId).length;
          return (
            <ConfirmModal
              icon="⚠️"
              title={`Delete "${cat?.displayName || cat?.name || "this category"}"?`}
              body={`This will permanently delete ${tCount} team${tCount!==1?"s":""}, ${pCount} player${pCount!==1?"s":""}, and ${gCount} game${gCount!==1?"s":""}. This cannot be undone.`}
              confirmLabel="Yes, Delete Category"
              onConfirm={() => deleteCategory(deleteCatId)}
              onCancel={() => setDeleteCatId(null)}
            />
          );
        })()}

        {/* ── UNSAVED CHANGES MODAL ── */}
        {pendingNavTab && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350 }}>
            <div style={{ width: 420, ...card, padding: 36, textAlign: "center" }}>
              <div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div>
              <div style={{ fontSize: 19, fontWeight: 800, marginBottom: 10 }}>Unsaved Changes</div>
              <div style={{ fontSize: 14, color: T2, marginBottom: 28, lineHeight: 1.6 }}>You have unsaved changes. Leaving without saving will discard all edits made on this tab.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <button style={{ ...btn("#252540"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={() => setPendingNavTab(null)}>Stay</button>
                <button style={{ ...btn("#ef4444"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={leaveWithoutSaving}>Leave Without Saving</button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
