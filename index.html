<script type="module">
  import { initializeApp }                                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, getDocs, getDoc, setDoc,
           onSnapshot, deleteDoc, writeBatch, updateDoc,
           deleteField, query, where, orderBy, arrayUnion, arrayRemove,
           serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref as storageRef, uploadBytes,
           getDownloadURL }                                         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
           updatePassword, deleteUser,
           onAuthStateChanged, signOut,
           browserLocalPersistence, setPersistence }               from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ─── REPLACE with your Firebase project config ───────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyDfMttfJLMvEW-LB3TIkFgebR5Cb7-1Wi4",
    authDomain:        "league-hunter.firebaseapp.com",
    projectId:         "league-hunter",
    storageBucket:     "league-hunter.firebasestorage.app",
    messagingSenderId: "356722740419",
    appId:             "1:356722740419:web:59e10cb552f5f4fa02e676",
  };
  // ─────────────────────────────────────────────────────────────────────────

  window.__wxFirebaseConfig = firebaseConfig;

  if (firebaseConfig.apiKey === "REPLACE_ME") {
    window.__wxFirebaseUnconfigured = true;
    window.__wxFirebaseReady        = false;
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const db  = getFirestore(app);
      const storage = getStorage(app);
      const auth = getAuth(app);
      // Expose globals synchronously — do NOT await before this point so that
      // window.__wxFirebaseReady is set before DOMContentLoaded fires and
      // the Babel script reads it.
      window.__wxDB      = db;
      window.__wxAuth    = auth;
      window.__wxStorage = storage;
      window.__wxFS      = { collection, doc, getDocs, getDoc, setDoc, onSnapshot, deleteDoc, writeBatch, updateDoc, deleteField, query, where, orderBy, arrayUnion, arrayRemove, serverTimestamp };
      window.__wxST      = { storageRef, uploadBytes, getDownloadURL };
      window.__wxAuthFns = { signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, deleteUser, onAuthStateChanged, signOut };
      // Mark ready BEFORE the secondary-app await so DOMContentLoaded / Babel always
      // sees the flag as true. The secondary app is only needed for owner creation.
      window.__wxFirebaseReady = true;
      window.dispatchEvent(new CustomEvent('wxFirebaseReady'));
      // Local persistence: best-effort, fire-and-forget — auth works without it
      setPersistence(auth, browserLocalPersistence).catch(e => console.warn("[Auth] setPersistence:", e));
      // Secondary app instance for creating owner accounts without signing out the superadmin
      try {
        const { initializeApp: initApp2 } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
        const { getAuth: getAuth2 } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
        const secondaryApp = initApp2(firebaseConfig, "secondary");
        window.__wxSecondaryAuth = getAuth2(secondaryApp);
      } catch(e2) { console.warn("[Auth] secondary app init:", e2); }
    } catch(e) {
      console.error("[League Hunter] Firebase init failed:", e);
      window.__wxFirebaseReady  = false;
      window.__wxFirebaseOffline = true;
    }
  }
</script>

<script>
/* Website X loader — one object at a time; sport switches exactly at floor impact */
(function(){
  var ball=document.getElementById('wxBall'), shadow=document.getElementById('wxShadow');
  if(!ball) return;
  var svgs=ball.querySelectorAll('svg'), N=svgs.length;
  var PERIOD=700, H=82;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur=-1, start=null, spin=0;
  function show(i){ if(i===cur) return; for(var k=0;k<N;k++) svgs[k].style.display=(k===i?'block':'none'); cur=i; }
  function frame(ts){
    if(start===null) start=ts;
    var t=(ts-start);
    var n=Math.floor(t/PERIOD), p=(t%PERIOD)/PERIOD;
    show(n%N);
    if(reduce){ ball.style.transform='translateY('+H+'px)'; ball.style.opacity=String(.5+.5*Math.cos(p*Math.PI*2)); }
    else{
      var h=1-Math.pow(2*p-1,2);
      var y=H*(1-h);
      var imp=Math.max(0,1-Math.min(p,1-p)/0.08);
      var isPuck=(n%N)===N-1;
      var sx=1+(isPuck?0.04:0.18)*imp, sy=1-(isPuck?0.04:0.2)*imp;
      var rot=isPuck?Math.sin(p*Math.PI)*-10:(n*360*0.35+p*360*0.35)%360;
      ball.style.transformOrigin='50% 100%';
      ball.style.transform='translateY('+y+'px) scale('+sx+','+sy+')';
      svgs[cur].style.transformOrigin='50% 50%'; svgs[cur].style.transform='rotate('+rot+'deg)';
      var s=0.55+0.45*(1-h); shadow.style.transform='scale('+s+')'; shadow.style.opacity=String(0.35+0.65*(1-h));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Dismiss: fade out overlay
  function dismiss(){
    var el=document.getElementById('wxLoader');
    if(!el) return;
    el.style.opacity='0';
    setTimeout(function(){ el.style.display='none'; },520);

// ── CLIENT-SIDE IMAGE COMPRESSION ──
async function compressImage(file, maxPx = 300, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    // Timeout guard — a 0×0 canvas's toBlob() callback never fires, so bail after 10s
    const timeout = setTimeout(() => {
      URL.revokeObjectURL(url);
      reject(new Error("Image compression timed out"));
    }, 10000);

    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));   // guard against 0×0 canvas
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      // Keep the timeout armed across the async toBlob() — clear it only once the callback fires
      canvas.toBlob(blob => {
        clearTimeout(timeout);
        if (blob) resolve(blob);
        else reject(new Error("Compression failed"));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { clearTimeout(timeout); reject(new Error("Image load failed")); };
    img.src = url;
  });
}
async function uploadImageToStorage(file, path, maxPx = 300) {
  if (!_storage || !_ST.storageRef) throw new Error("Firebase Storage not available");
  const blob = await compressImage(file, maxPx);
  const ref = _ST.storageRef(_storage, path);
  // Guard against uploadBytes hanging on an unreachable bucket / network issue
  await Promise.race([
    _ST.uploadBytes(ref, blob, { contentType: "image/jpeg" }),
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("Storage upload timed out after 15s")), 15000)
    )
  ]);
  return await _ST.getDownloadURL(ref);
}

function calcPlayerRP(player, allGames, league) {
  const season  = (league && league.season) || {};
  const resetAt = season.resetAt || 0;
  const pid     = String(player.id);
  const milData = ((league && league.playerMilestones) || {})[pid] || {};
  const achieved = new Set(milData.milestones || []);
  const games = [...(allGames || [])]
    .filter(g => {

      if (resetAt) { const gt = new Date((g.date||'9999')+'T00:00').getTime(); if (gt < resetAt) return false; }
      return true;
    })
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if (!games.length) return 0;
  const baseScores = games.map(g => {
    const ps = g.playerStats[pid] || {};
    return Math.max(0,
      (+(ps.points||0))*1.0 + (+(ps.rebounds||0))*0.7 + (+(ps.assists||0))*1.2 +
      (+(ps.steals||0))*1.5 + (+(ps.blocks||0))*1.5 - (+(ps.turnovers||0))*1.0);
  });
  const avg = baseScores.reduce((s,x)=>s+x,0) / baseScores.length;
  let aStr = 0, bStr = 0;
  const adjusted = baseScores.map(s => {
    if (s >= avg) { aStr++; bStr = 0; } else { bStr++; aStr = 0; }
    let m = 1;
    if (s >= avg) {
      if (aStr>=7) m=1.70; else if (aStr>=6) m=1.50; else if (aStr>=5) m=1.35;
      else if (aStr>=4) m=1.25; else if (aStr>=3) m=1.15; else if (aStr>=2) m=1.08;
    } else if (bStr >= 3) m = 0.95;
    return s * m;
  });
  let total = adjusted.reduce((s,x)=>s+x,0);
  let milRP = 0;
  const gp = games.length;
  if (gp>=1  && !achieved.has('games_1'))  milRP+=5;
  if (gp>=5  && !achieved.has('games_5'))  milRP+=15;
  if (gp>=10 && !achieved.has('games_10')) milRP+=30;
  if (gp>=15 && !achieved.has('games_15')) milRP+=60;
  if (gp>=20 && !achieved.has('games_20')) milRP+=120;
  let h15=achieved.has('pts_15'),h20=achieved.has('pts_20'),h30=achieved.has('pts_30'),h40=achieved.has('pts_40');
  let hDD=achieved.has('double_double'),hTD=achieved.has('triple_double'),hQD=achieved.has('quad_double');
  let hW3=achieved.has('ws_3'),hW5=achieved.has('ws_5'),hW8=achieved.has('ws_8'),hW10=achieved.has('ws_10');
  let wStr = 0;
  games.forEach(g => {
    const ps = g.playerStats[pid]||{}; const pts=+(ps.points||0),reb=+(ps.rebounds||0),ast=+(ps.assists||0),stl=+(ps.steals||0),blk=+(ps.blocks||0);
    if (!h15&&pts>=15){milRP+=15;h15=true;} if (!h20&&pts>=20){milRP+=35;h20=true;}
    if (!h30&&pts>=30){milRP+=80;h30=true;} if (!h40&&pts>=40){milRP+=200;h40=true;}
    const t10=[pts,reb,ast,stl,blk].filter(v=>v>=10).length;
    if (!hDD&&t10>=2){milRP+=40;hDD=true;} if (!hTD&&t10>=3){milRP+=120;hTD=true;} if (!hQD&&t10>=4){milRP+=500;hQD=true;}
    const hs=parseInt(g.homeScore),as2=parseInt(g.awayScore);
    const won=!isNaN(hs)&&!isNaN(as2)&&((g.home===player.team&&hs>as2)||(g.away===player.team&&as2>hs));
    if (won) wStr++; else wStr=0;
    if (!hW3&&wStr>=3){milRP+=20;hW3=true;} if (!hW5&&wStr>=5){milRP+=45;hW5=true;}
    if (!hW8&&wStr>=8){milRP+=100;hW8=true;} if (!hW10&&wStr>=10){milRP+=250;hW10=true;}
  });
  const adjTotal = (milData.rpAdjustments||[]).reduce((s,a)=>s+(+(a.amount||0)),0);
  return Math.max(0, Math.round(total + milRP + adjTotal));
}
function calcNewMilestones(player, allGames, league) {

async function hashEmail(email) {
  const clean = (email || '').trim().toLowerCase();
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(clean));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
}

  const gamePlayers = (league.players || []).filter(p => p.email && (p.team === game.home || p.team === game.away));
  const extraEmails = gamePlayers.map(p => p.email).filter(Boolean);

  // Deduplicate
  const allEmails = [...new Set([...activeScoreSubs.map(s => s.email), ...extraEmails])];

  const publicUrl = `${window.location.origin}/public.html?league=${league.id}`;

const RANK_ORDER = ["bronze","silver","gold","platinum","diamond","elite","legend"];

function calcPlayerLabel(player, allPlayers, allGames, league) {
  const season  = (league && league.season) || {};
  const resetAt = season.resetAt || 0;
  const pid     = String(player.id);

  const games = (allGames || []).filter(g => {
    if (!g.playerStats || g.playerStats[pid] === undefined) return false;
    if (resetAt) { const gt = new Date((g.date||'9999')+'T00:00').getTime(); if (gt < resetAt) return false; }
    return true;
  }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  if (!games.length) return null;

  const gp   = games.length;
  const sum  = k => games.reduce((s,g)=>s+(+(g.playerStats[pid][k]||0)),0);
  const ppg  = sum('points')   / gp;
  const rpg  = sum('rebounds') / gp;
  const apg  = sum('assists')  / gp;
  const spg  = sum('steals')   / gp;
  const bpg  = sum('blocks')   / gp;

  // Streak above own average
  const baseScores = games.map(g => {
    const ps = g.playerStats[pid]||{};
    return Math.max(0,(+(ps.points||0))*1.0+(+(ps.rebounds||0))*0.7+(+(ps.assists||0))*1.2+(+(ps.steals||0))*1.5+(+(ps.blocks||0))*1.5-(+(ps.turnovers||0))*1.0);
  });
  const avg = baseScores.reduce((s,x)=>s+x,0)/baseScores.length;
  let maxStreak=0, streak=0;
  baseScores.forEach(s=>{ if(s>=avg){streak++;maxStreak=Math.max(maxStreak,streak);}else streak=0; });

  // Rank check helper
  const meetsRank = minRank => {
    const rp = typeof calcPlayerRP==='function' ? calcPlayerRP(player,allGames,league) : 0;
    const tier = typeof getTier==='function' ? getTier(rp) : {id:'bronze'};
    return RANK_ORDER.indexOf(tier.id) >= RANK_ORDER.indexOf(minRank);
  };

  // League-wide stats for comparisons
  const allStats = allPlayers.map(p2 => {
    const p2id=String(p2.id);
    const p2g=games.filter ? (allGames||[]).filter(g=>g.playerStats&&g.playerStats[p2id]!==undefined&&(!resetAt||new Date((g.date||'9999')+'T00:00').getTime()>=resetAt)) : [];
    if(!p2g.length) return null;
    const p2gp=p2g.length;
    return { id:p2id, ppg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].points||0)),0)/p2gp, apg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].assists||0)),0)/p2gp, bpg:p2g.reduce((s,g)=>s+(+(g.playerStats[p2id].blocks||0)),0)/p2gp, rp:typeof calcPlayerRP==='function'?calcPlayerRP(p2,allGames,league):0 };
  }).filter(Boolean);
  const topPpg = allStats.slice().sort((a,b)=>b.ppg-a.ppg)[0];
  const topApg = allStats.slice().sort((a,b)=>b.apg-a.apg)[0];
  const topBpg = allStats.slice().sort((a,b)=>b.bpg-a.bpg)[0];
  const topRp  = allStats.slice().sort((a,b)=>b.rp-a.rp)[0];
  const totalGames = (allGames||[]).filter(g=>!resetAt||new Date((g.date||'9999')+'T00:00').getTime()>=resetAt);
  const uniqueGameDays = new Set(totalGames.map(g=>g.date)).size;

  // Check each label — collect all earned, return highest priority
  const earned = [];
  const chk = (id, condition) => { if(condition) earned.push(id); };

  chk('chosen_one',    meetsRank('legend')   && topPpg?.id===pid);
  chk('untouchable',   meetsRank('elite')    && ppg>=35);
  chk('assassin',      meetsRank('diamond')  && ppg>=30);
  chk('machine',       meetsRank('elite')    && maxStreak>=15);
  chk('point_god',     meetsRank('diamond')  && topApg?.id===pid);
  chk('eraser',        meetsRank('diamond')  && topBpg?.id===pid);
  chk('goat',          meetsRank('legend')   && (league?.awards?.mvp?.prevPlayerId===pid));
  chk('mvp_label',     meetsRank('platinum') && topRp?.id===pid);
  chk('cold_blooded',  meetsRank('platinum') && ppg>=25 && maxStreak>=5);
  chk('puppet_master', meetsRank('platinum') && apg>=10);
  chk('nightmare',     meetsRank('platinum') && spg>=2 && bpg>=2);
  chk('workhorse',     meetsRank('platinum') && gp>=10 && gp>=uniqueGameDays);
  chk('iron_man',      meetsRank('gold')     && gp>=totalGames.length && totalGames.length>0);
  chk('playmaker',     meetsRank('gold')     && apg>=8);
  chk('enforcer',      meetsRank('gold')     && bpg>=2);
  chk('scorer',        meetsRank('gold')     && ppg>=20);
  chk('reliable',      meetsRank('silver')   && maxStreak>=5);
  chk('floor_general', meetsRank('silver')   && apg>=5);
  chk('lockdown',      meetsRank('silver')   && spg>=2);
  chk('bucket',        meetsRank('silver')   && ppg>=15);

  if (!earned.length) return null;
  // Return highest priority label
  const best = earned.reduce((best,id) => {
    const def = PLAYER_LABELS.find(l=>l.id===id);
    const bestDef = PLAYER_LABELS.find(l=>l.id===best);
    return (def?.priority||0) > (bestDef?.priority||0) ? id : best;
  }, earned[0]);
  return PLAYER_LABELS.find(l=>l.id===best) || null;
}

// ── MIGRATION: Ensure league has categories array ──
function migrateLeagueIfNeeded(league) {
  if (!league) return league;
  const hasCats = league.categories && league.categories.length > 0;
  if (hasCats) {
    // Already has categories — just backfill any missing categoryIds
    const firstCat = league.categories[0];
    let changed = false;
    const teams    = (league.teams    || []).map(t => t.categoryId ? t : (changed=true, { ...t, categoryId: firstCat.id }));
    const players  = (league.players  || []).map(p => p.categoryId ? p : (changed=true, { ...p, categoryId: firstCat.id }));
    const schedule = (league.schedule || []).map(g => g.categoryId ? g : (changed=true, { ...g, categoryId: firstCat.id }));
    return changed ? { ...league, teams, players, schedule, _migrated: true } : league;
  }
  // No categories at all — create a "General" category and assign everything to it
  const genCat = { id: "cat_" + String(league.id) + "_gen", name: "General", gender: "", displayName: "General" };
  return {
    ...league,
    categories: [genCat],
    teams:    (league.teams    || []).map(t => ({ ...t, categoryId: genCat.id })),
    players:  (league.players  || []).map(p => ({ ...p, categoryId: genCat.id })),
    schedule: (league.schedule || []).map(g => ({ ...g, categoryId: genCat.id })),
    honours:  league.honours || {},
    _migrated: true,
  };
}

// ── TIME FORMAT HELPERS ──
// Converts stored 24h "HH:MM" → display "H:MM AM/PM".
// Pass-through if value already contains AM/PM (legacy data).
function formatTime12h(t) {
  if (!t) return "";
  if (/AM|PM/i.test(t)) return t;               // legacy format — already 12h
  const parts = t.split(":");
  if (parts.length < 2) return t;
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return t;
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
// Converts legacy "H:MM AM/PM" → "HH:MM" so <input type="time"> works with old data.
// Pass-through if already in HH:MM 24h format.
function parseTimeTo24h(t) {
  if (!t) return "";
  if (/^\d{1,2}:\d{2}$/.test(t)) return t.length === 4 ? "0" + t : t; // already 24h
  const m = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return "";
  let h = parseInt(m[1], 10);
  const min = m[2], period = m[3].toUpperCase();
  if (period === "AM" && h === 12) h = 0;
  if (period === "PM" && h !== 12) h += 12;
  return `${String(h).padStart(2, "0")}:${min}`;
}

function formatHeight(height, units) {
  if (!height && height !== 0) return '';
  if (units === 'metric') return `${height} cm`;
  const ft = Math.floor(height / 12);
  const inches = height % 12;
  return `${ft}'${inches}"`;
}
function formatWeight(weight, units) {
  if (!weight && weight !== 0) return '';
  return units === 'metric' ? `${weight} kg` : `${weight} lbs`;
}

const SPORT_DURATION_MS = { Basketball: 2 * 3600000, Hockey: 2.5 * 3600000 };
function getGameDateTime(game) {
  if (!game.date || !game.time) return null;
  // Normalize to 24h so the date string is always valid (handles "7:00 PM" stored in demo data)
  const t24 = parseTimeTo24h(game.time) || game.time;
  const dt = new Date(`${game.date}T${t24}`);
  return isNaN(dt.getTime()) ? null : dt;
}
function isGamePast(game) {
  const dt = getGameDateTime(game);
  if (dt) return dt < new Date();
  if (game.date) return new Date(game.date + "T23:59") < new Date();
  return false;
}
function isGameLive(game, sport) {
  const dt = getGameDateTime(game);
  if (!dt) return false;
  const now = new Date();
  const dur = SPORT_DURATION_MS[sport] || 2 * 3600000;
  return dt <= now && now < new Date(dt.getTime() + dur);
}

function isGameToday(game) {
  const gameDate = game.date ? new Date(game.date + "T12:00") : null; // mid-day to avoid DST edge cases
  if (!gameDate) return false;
  const today = new Date();
  return today.toDateString() === gameDate.toDateString();
}
function isGameAwaiting(game) {
  return isGamePast(game) && (game.homeScore === undefined || game.awayScore === undefined);
}
// "SCORE À ENTRER": game started + 60 min ago, not yet locked/played
const SCORE_DELAY_MIN = 60;
function isNeedingScore(game) {
  if (game.locked || game.played) return false;
  const gdt = getGameDateTime(game);
  return gdt ? gdt.getTime() + SCORE_DELAY_MIN * 60000 < Date.now() : false;
}
function getGameStatus(game, sport) {
  if (isGameLive(game, sport))                            return "LIVE";
  if (game.homeScore !== undefined && game.awayScore !== undefined) return "FINAL";
  if (isGameAwaiting(game))                               return "SCORE NEEDED";
  if (isGameToday(game))                                  return "TODAY";
  if (isGamePast(game))                                   return "AWAITING SCORE";
  return "UPCOMING";
}
function daysAgo(game) {
  const dt = getGameDateTime(game) || (game.date ? new Date(game.date + "T23:59") : null);
  if (!dt) return 0;
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}

function isGoalie(p) {
  const pos = (p.position || "").toLowerCase().trim();
  return pos === "goalie" || pos === "g" || pos === "gk" || pos === "goalkeeper" || pos === "goaltender";
}

function fmtAvg(val, gp) {
  if (!gp || gp === 0) return "—";
  return (val / gp).toFixed(2);
}

  return SPORT_STATS[sport] || [{ key: "goals", label: "G", avg: "GPG" }, { key: "assists", label: "A", avg: "APG" }];
}
// Returns only the stats currently toggled ON for this league (Hockey goalies respect goalieStats toggle)
function getActiveStats(sport, player, toggles) {
  if (sport === "Hockey" && isGoalie(player)) {
    return toggles.goalieStats !== false ? (SPORT_STATS.HockeyGoalie || []) : [];
  }
  return (SPORT_STATS[sport] || []).filter(({ key }) => toggles[key] !== false);
}

// Compute season totals + averages for one player across a given schedule slice
function getPlayerSeasonStats(player, schedule, sport) {
  const statDef = getSportStats(sport, player);
  const playedGames = schedule.filter(g =>
    isGamePast(g) && g.playerStats && g.playerStats[player.id] !== undefined && !g.playerStats[player.id]?.draft
  );
  const totals = {}, averages = {};
  statDef.forEach(({ key, madeKey, attKey }) => {
    // Percentage stats: aggregate as total made ÷ total attempted (correct), not a mean of per-game %
    if (madeKey && attKey) {
      const totMade = playedGames.reduce((a, g) => a + (parseFloat(g.playerStats[player.id]?.[madeKey]) || 0), 0);
      const totAtt  = playedGames.reduce((a, g) => a + (parseFloat(g.playerStats[player.id]?.[attKey])  || 0), 0);
      totals[key] = totMade;
      averages[key] = totAtt > 0 ? ((totMade / totAtt) * 100).toFixed(1) : null;
      return;
    }
    const vals = playedGames.map(g => parseFloat(g.playerStats[player.id]?.[key]) || 0);
    totals[key] = vals.reduce((a, b) => a + b, 0);
    averages[key] = vals.length > 0 ? (totals[key] / vals.length).toFixed(1) : null;
  });
  return { gamesPlayed: playedGames.length, totals, averages, statDef };
}

function initNPS(players, sport) {
  const s = {};
  players.forEach(p => {
    if (sport === "Hockey") {
      s[p.id] = isGoalie(p) ? { saves: "", goalsAgainst: "" } : { goals: "", assists: "" };
    } else if (sport === "Basketball") {
      s[p.id] = { points: "", rebounds: "", assists: "", steals: "", blocks: "", turnovers: "", threes: "", fgPct: "", ftPct: "" };
    } else {
      s[p.id] = { goals: "", assists: "" };
    }
  });
  return s;
}

// ── LEADER CARD ──
function LeaderCard({ title, icon, data, statKey, color, lowerBetter, fmtFn }) {
  const sorted = [...data].filter(p => p[statKey] !== undefined && p[statKey] !== null && p.gp > 0)
    .sort((a, b) => lowerBetter ? (a[statKey] - b[statKey]) : (b[statKey] - a[statKey]));
  const top = sorted.slice(0, 3);
  if (!top.length) return null;
  const medals = ["1.", "2.", "3."];
  return (
    <div style={{ ...card, minWidth: 200, flex: "1 1 200px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 14 }}>{title.toUpperCase()}</div>
      {top.map((p, i) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: i < top.length - 1 ? 10 : 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, minWidth: 20 }}>{medals[i]}</span>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: T2 }}>{p.team}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: i === 0 ? color : T1 }}>
              {fmtFn ? fmtFn(p) : p[statKey]}
            </div>
            {p.gp > 0 && !lowerBetter && !fmtFn && (
              <div style={{ fontSize: 10, color: T2 }}>{fmtAvg(p[statKey], p.gp)}/g</div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// ACTION CONFIRM MODAL — reusable confirmation for all admin actions
// Props:
//   open              bool     — show/hide
//   onCancel          fn       — close without acting
//   onConfirm         fn       — execute the action
//   actionType        string   — 'add' | 'edit' | 'delete' | 'modify'
//   entityType        string   — 'team' | 'player' | 'game' | 'score' | 'stats'
//   entityLabel       string   — e.g. "Wolves", "Marc Tremblay"
//   summary           string   — human-readable sentence about the action
//   details           array    — [{ label, oldValue, newValue }] — shown as change table
//   requiresTypedConfirm bool  — if true, user must type confirmWord to enable button
//   confirmWord       string   — word user must type (default "DELETE")
//   confirmLabel      string   — button label
//   dangerStyle       bool     — red confirm button (for destructive actions)
// ══════════════════════════════════════════════════════════════════
function ActionConfirmModal({
  open, onCancel, onConfirm,
  actionType = 'modify', entityType = '', entityLabel = '',
  summary = '', details = [],
  requiresTypedConfirm = false, confirmWord = 'DELETE',
  confirmLabel = 'Confirm', dangerStyle = false,
}) {
  const [typed, setTyped] = React.useState('');
  const inputRef = React.useRef(null);

  // Reset typed input whenever modal opens
  React.useEffect(() => {
    if (open) {
      setTyped('');
      if (requiresTypedConfirm) {
        // Small delay so the DOM is mounted before focusing
        setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
      }
    }
  }, [open, requiresTypedConfirm]);

  // Esc to cancel, Enter to confirm (when allowed)
  React.useEffect(() => {
    if (!open) return;
    function handleKey(e) {
      if (e.key === 'Escape') { onCancel(); }
      if (e.key === 'Enter'  && canConfirm) { onConfirm(); }
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  });

  if (!open) return null;

  const canConfirm = !requiresTypedConfirm || typed === confirmWord;

  // Icon + title derived from actionType
  const ACTION_META = {
    add:    { verb: 'Add'    },
    edit:   { verb: 'Edit'   },
    delete: { verb: 'Delete' },
    modify: { verb: 'Modify' },
  };
  const meta       = ACTION_META[actionType] || ACTION_META.modify;
  const entityCap  = entityType ? entityType.charAt(0).toUpperCase() + entityType.slice(1) : '';
  const autoTitle  = `${meta.verb}${entityCap ? ' ' + entityCap : ''}${entityLabel ? ': ' + entityLabel : ''}`;

  const confirmBg  = dangerStyle ? '#ef4444' : ACC;

  return (
    <div
      style={{ position: 'fixed', inset: 0, background: '#00000095', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300 }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}
    >
      <div style={{ width: 440, ...card, padding: 32 }}>

        {/* Header */}
        <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>{autoTitle}</div>

        {/* Summary sentence */}
        {summary && (
          <div style={{ fontSize: 14, color: T2, marginBottom: details.length ? 16 : 24 }}>{summary}</div>
        )}

        {/* Details table — "Field: old → new" for edits, "Field: value" for adds */}
        {details.length > 0 && (
          <div style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 8, padding: '12px 16px', marginBottom: 20 }}>
            {details.map((row, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 13, padding: '4px 0', borderBottom: i < details.length - 1 ? `1px solid ${BORDER}` : 'none' }}>
                <span style={{ color: T2, flexShrink: 0, marginRight: 12 }}>{row.label}</span>
                {row.oldValue !== undefined
                  ? <span style={{ color: T1, textAlign: 'right' }}>
                      <span style={{ color: '#ef4444', textDecoration: 'line-through', marginRight: 6 }}>{row.oldValue}</span>
                      <span style={{ color: T2, marginRight: 6 }}>→</span>
                      <span style={{ color: '#22c55e' }}>{row.newValue}</span>
                    </span>
                  : <span style={{ color: T1, textAlign: 'right' }}>{row.value}</span>
                }
              </div>
            ))}
          </div>
        )}

        {/* Typed confirm input */}
        {requiresTypedConfirm && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 13, color: T2, marginBottom: 8 }}>
              Type <strong style={{ color: '#ef4444' }}>{confirmWord}</strong> to confirm
            </div>
            <input
              ref={inputRef}
              value={typed}
              onChange={e => setTyped(e.target.value)}
              placeholder={confirmWord}
              style={{ width: '100%', boxSizing: 'border-box', background: BG, border: `1px solid ${typed === confirmWord ? '#22c55e' : BORDER}`, borderRadius: 8, color: T1, padding: '10px 14px', fontSize: 14, outline: 'none' }}
            />
          </div>
        )}

        {/* Buttons */}
        <div style={{ display: 'flex', gap: 12 }}>
          <button
            style={{ ...btn(confirmBg), flex: 1, opacity: canConfirm ? 1 : 0.4, cursor: canConfirm ? 'pointer' : 'not-allowed' }}
            onClick={() => { if (canConfirm) onConfirm(); }}
            disabled={!canConfirm}
          >{confirmLabel}</button>
          <button style={{ ...btn('#252540'), flex: 1 }} onClick={onCancel}>Cancel</button>
        </div>

      </div>
    </div>
  );
}

// ── useActionConfirm — hook for imperative modal API ──
// Usage:
//   const askConfirm = useActionConfirm();
//   askConfirm({ actionType:'add', entityType:'team', entityLabel:'Wolves',
//                summary:"You are about to add team 'Wolves' to category 'U17'.",
//                onConfirm: () => doActualAdd() });
//   // In JSX: <ActionConfirmModal {...askConfirm.modalProps} />
function useActionConfirm() {
  const [state, setState] = React.useState(null); // null = closed

  function ask(opts) {
    setState(opts);
  }

  const modalProps = state
    ? {
        open:                 true,
        onCancel:             () => setState(null),
        onConfirm:            () => { setState(null); state.onConfirm && state.onConfirm(); },
        actionType:           state.actionType           || 'modify',
        entityType:           state.entityType           || '',
        entityLabel:          state.entityLabel          || '',
        summary:              state.summary              || '',
        details:              state.details              || [],
        requiresTypedConfirm: state.requiresTypedConfirm || false,
        confirmWord:          state.confirmWord          || 'DELETE',
        confirmLabel:         state.confirmLabel         || 'Confirm',
        dangerStyle:          state.dangerStyle          || false,
      }
    : { open: false, onCancel: () => {}, onConfirm: () => {} };

  return { ask, modalProps };
}

// SEASON RECAP GENERATOR
// ═══════════════════════════════════════════
function generateSeasonRecap(league, seasonNum) {
  const players  = league.players || [];
  const teams    = league.teams   || [];
  const schedule = league.schedule || [];
  const played   = schedule.filter(g => g.homeScore !== undefined && g.awayScore !== undefined);
  const season   = league.season || {};
  const resetAt  = season.resetAt || 0;

  // Filter games to current season
  const seasonGames = resetAt ? played.filter(g => new Date((g.date||'9999')+'T00:00').getTime() >= resetAt) : played;

  // Win counts per team
  const wins = {};
  teams.forEach(t => { wins[t.name] = 0; });
  seasonGames.forEach(g => {
    const hs = parseInt(g.homeScore), as = parseInt(g.awayScore);
    if (!isNaN(hs) && !isNaN(as)) {
      if (hs > as) wins[g.home] = (wins[g.home]||0)+1;
      else         wins[g.away] = (wins[g.away]||0)+1;
    }
  });
  const champion = teams.slice().sort((a,b) => (wins[b.name]||0)-(wins[a.name]||0))[0];

  // Player stats
  const playerStats = players.map(p => {
    const pid  = String(p.id);
    const gs   = seasonGames.filter(g => g.playerStats && g.playerStats[pid] !== undefined);
    const gp   = gs.length || 1;
    const sum  = k => gs.reduce((s,g)=>s+(+(g.playerStats[pid][k]||0)),0);
    const rp   = typeof calcPlayerRP === 'function' ? calcPlayerRP(p, schedule, league) : 0;
    return {
      id: p.id, name: p.name, team: p.team, photoUrl: p.photoUrl||'', position: p.position||'',
      gp: gs.length, rp,
      ppg: (sum('points')/gp).toFixed(1),  rpg: (sum('rebounds')/gp).toFixed(1),
      apg: (sum('assists')/gp).toFixed(1), spg: (sum('steals')/gp).toFixed(1),
      bpg: (sum('blocks')/gp).toFixed(1),
    };
  }).filter(p => p.gp > 0);

  const byRp      = [...playerStats].sort((a,b) => b.rp-a.rp);
  const byPpg     = [...playerStats].sort((a,b) => parseFloat(b.ppg)-parseFloat(a.ppg));
  const byApg     = [...playerStats].sort((a,b) => parseFloat(b.apg)-parseFloat(a.apg));
  const byRpg     = [...playerStats].sort((a,b) => parseFloat(b.rpg)-parseFloat(a.rpg));
  const byDef     = [...playerStats].sort((a,b) => (parseFloat(b.spg)+parseFloat(b.bpg))-(parseFloat(a.spg)+parseFloat(a.bpg)));

  // Best single game
  let bestGame = null, bestGameScore = 0;
  seasonGames.forEach(g => {
    if (!g.playerStats) return;
    Object.entries(g.playerStats).forEach(([pid,ps]) => {
      const pts = +(ps.points||0);
      if (pts > bestGameScore) { bestGameScore = pts; bestGame = { gameId: g.id, playerId: pid, pts, date: g.date, home: g.home, away: g.away }; }
    });
  });

  // Date range
  const dates = seasonGames.map(g=>g.date).filter(Boolean).sort();
  const dateRange = dates.length >= 2 ? `${dates[0]} → ${dates[dates.length-1]}` : (dates[0]||'');

  return {
    seasonNum, generatedAt: Date.now(), dateRange,
    totalGames: seasonGames.length, totalPlayers: playerStats.length,
    champion:   champion ? { name: champion.name, wins: wins[champion.name]||0, emoji: champion.emoji||'🏆' } : null,
    mvp:        byRp[0]  || null,
    topScorer:  byPpg[0] || null,
    topPasser:  byApg[0] || null,
    topRebounder: byRpg[0] || null,
    topDefender:  byDef[0] || null,
    allStars:   byRp.slice(0,5),
    bestGame,
    standings:  teams.map(t => ({ name: t.name, emoji: t.emoji||'', wins: wins[t.name]||0 })).sort((a,b)=>b.wins-a.wins),
  };
}

// ERROR BOUNDARY
// ═══════════════════════════════════════════
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("[ErrorBoundary] Caught error:", error, info.componentStack);
  }
  render() {
    if (this.state.hasError) {
      return React.createElement("div", {
        style: { minHeight: "100vh", background: "#08080f", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }
      }, React.createElement("div", {
        style: { maxWidth: 480, width: "100%", background: "#12121f", border: "1px solid #ef444440", borderRadius: 12, padding: 32, textAlign: "center" }
      }, [
        React.createElement("div", { key: "icon", style: { marginBottom: 12, color: "#ef4444", display: "flex", justifyContent: "center" } },
          React.createElement("svg", { width: 40, height: 40, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round" },
            React.createElement("path", { d: "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" }),
            React.createElement("line", { x1: 12, y1: 9, x2: 12, y2: 13 }),
            React.createElement("line", { x1: 12, y1: 17, x2: "12.01", y2: 17 })
          )
        ),
        React.createElement("div", { key: "title", style: { fontSize: 18, fontWeight: 700, color: "#f1f1f8", marginBottom: 8 } }, "Une erreur est survenue"),
        React.createElement("div", { key: "msg", style: { fontSize: 13, color: "#8888aa", marginBottom: 20, wordBreak: "break-word" } },
          this.state.error?.message || "Erreur inconnue"
        ),
        React.createElement("button", {
          key: "btn",
          onClick: () => { this.setState({ hasError: false, error: null }); window.location.reload(); },
          style: { background: "#6366f1", color: "#fff", border: "none", borderRadius: 8, padding: "10px 24px", fontSize: 14, fontWeight: 600, cursor: "pointer" }
        }, "Recharger la page")
      ]));
    }
    return this.props.children;
  }
}

  // 1) URL valid  2) site reachable (full fetch; falls back to opaque no-cors for cross-origin)
  // 3) Firestore league data readable (what the public site actually pulls)
  async function testPublicSiteConnection(lg) {
    if (!lg || testingConn) return;
    const url = (lg.customPublicSiteUrl || '').trim() || `${window.location.origin}/public.html?league=${lg.id}`;
    setTestingConn(true);
    let connected = false, error = '';
    let isFileUrl = false;
    // Step 1 — URL format (http/https for hosted sites, file:// for local pages)
    try {
      const parsed = new URL(url);
      isFileUrl = parsed.protocol === 'file:';
      if (!isFileUrl && parsed.protocol !== 'http:' && parsed.protocol !== 'https:') throw new Error('bad protocol');
    } catch {
      error = 'URL format is invalid (must start with http://, https:// or file://)';
    }
    // Step 2 — HTTP reachability (browsers cannot fetch file:// — skip for local pages)
    if (!error && !isFileUrl) {
      try {
        const res = await fetch(url, { method: 'GET', cache: 'no-store' });
        if (!res.ok) {
          error = res.status === 404 ? 'Connection failed: 404 Not Found'
                : res.status >= 500  ? `Connection failed: ${res.status} Server Error`
                : `Connection failed: HTTP ${res.status}`;
        }
      } catch (e) {
        // Cross-origin pages block CORS reads — opaque fetch still proves reachability
        try { await fetch(url, { mode: 'no-cors', cache: 'no-store' }); }
        catch (e2) { error = 'Connection failed: Cannot reach URL'; }
      }
    }
    // Step 3 — Firestore data access (what the public site actually reads)
    if (!error) {
      if (__fbReady && _db) {
        try {
          const { getDoc, doc } = _FS;
          const snap = await getDoc(doc(_db, 'leagues', String(lg.id)));
          if (!snap.exists()) error = 'Connection failed: League data not found in Firestore';
          else connected = true;
        } catch (e) { error = 'Connection failed: Cannot access Firestore'; }
      } else {
        error = 'Connection failed: Network error — Firebase not connected in admin';
      }
    }
    const status = { connected, lastTestedAt: Date.now(), ...(error ? { error } : {}) };
    setLeagues(prev => prev.map(l => l.id === lg.id ? { ...l, publicSiteConnectionStatus: status } : l));
    if (__fbReady && _db) {
      try {
        const { updateDoc, doc } = _FS;
        await updateDoc(doc(_db, 'leagues', String(lg.id)), { publicSiteConnectionStatus: status });
      } catch (e) { console.error('[League Hunter] connectionStatus write failed:', e); }
    }
    setTestingConn(false);
    showToast(connected ? '✓ Connected successfully — data syncing' : `✗ ${error}`, connected ? 'info' : 'error');
  }

  // ── IMMEDIATE FIRESTORE WRITE (sub-collection architecture) ──
  // Bridge pattern: in-memory league state is unchanged (still has flat arrays).
  // Only the persistence layer changes — meta goes to root doc, arrays go to sub-collections.
  // Diffs against subcolData.current to only write/delete changed documents.
  async function writeLeagueNow(updated) {
    // Strip in-memory migration flag
    const { _migrated: _dropped, ...cleanUpdated } = updated;
    updated = cleanUpdated;
    // 1. Update in-memory React state + localStorage
    setLeagues(prev => {
      const next = prev.map(l => l.id === updated.id ? updated : l);
      localStorage.setItem("wxLeagues", JSON.stringify(next));
      localStorage.setItem("wxLeagues_updated", Date.now().toString());
      return next;
    });
    if (!__fbReady) return;
    try {
      const ts = Date.now();
      lastWriteRef.current = ts;
      const lid = String(updated.id);
      const { doc, collection, writeBatch } = _FS;

      // Guard: subcolData must be seeded before we can diff correctly.
      // It is seeded from the Firestore snapshot on page load (line ~1993) and immediately
      // for newly created leagues. If it's missing, Firestore data hasn't arrived yet —
      // bail rather than doing a blind full-rewrite.
      if (!subcolData.current[lid]) {
        showToast("Données en cours de chargement, réessaie dans un instant.");
        return;
      }
      const prev = subcolData.current[lid];

      // Build new state maps (keyed by string id for easy diff)
      const newTeams   = Object.fromEntries((updated.teams   || []).map(t => [String(t.id), t]));
      const newPlayers = Object.fromEntries((updated.players || []).map(p => [String(p.id), p]));
      const newGames   = Object.fromEntries((updated.schedule || []).map(g => [String(g.id), g]));

      // Collect all Firestore operations
      const ops = [];

      // Root meta doc — ALWAYS written (keeps _updatedAt current so public
      // site's onSnapshot detects every write). No arrays — sub-collections handle data.
      ops.push({ type: 'set', ref: doc(_db, "leagues", lid), data: {
        id:               updated.id,
        name:             updated.name             || "",
        seasonDisplay:    updated.seasonDisplay    || "",
        sport:            updated.sport            || "",
        color:            updated.color            || "#6366f1",
        domain:           updated.domain           || "",
        categories:       updated.categories       || [],
        categoryOrder:    updated.categoryOrder    || [],
        statToggles:      updated.statToggles      || {},
        honours:          updated.honours          || {},
        awards:           updated.awards           || {},
        season:           updated.season           || {},
        playerMilestones: updated.playerMilestones || {},
        units:            updated.units            || "imperial",
        publicSettings:   updated.publicSettings   || DEFAULT_PUBLIC_SETTINGS,
        customPublicSiteUrl:        updated.customPublicSiteUrl        || "",
        publicSiteConnectionStatus: updated.publicSiteConnectionStatus || { connected: false, lastTestedAt: 0 },
        leagueMessage:              updated.leagueMessage              || {},
        playOfTheMonth:             updated.playOfTheMonth             || {},
        playerOfTheWeek:            updated.playerOfTheWeek            || {},
        _format:     "v2",
        _updatedAt:  ts,  // ← always bumped so public onSnapshot always detects this write
      }});

      // Teams: write changed docs, delete removed docs
      for (const [tid, team] of Object.entries(newTeams)) {
        if (JSON.stringify(team) !== JSON.stringify(prev.teams[tid])) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "teams", tid), data: team });
        }
      }
      for (const tid of Object.keys(prev.teams)) {
        if (!newTeams[tid]) ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "teams", tid) });
      }

      // Players: strip email from public doc; write email to playersPrivate
      // Email is a personal field — public site reads players but never needs email.
      for (const [pid, player] of Object.entries(newPlayers)) {
        const { email: playerEmail, ...publicPlayer } = player;
        if (JSON.stringify(publicPlayer) !== JSON.stringify(prev.players[pid])) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "players", pid), data: publicPlayer });
        }
        const prevPriv = prev.playersPrivate[pid];
        if (playerEmail && playerEmail !== prevPriv?.email) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "playersPrivate", pid), data: { email: playerEmail } });
        } else if (!playerEmail && prevPriv) {
          ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "playersPrivate", pid) });
        }
      }
      for (const pid of Object.keys(prev.players)) {
        if (!newPlayers[pid]) {
          ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "players", pid) });
          ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "playersPrivate", pid) });
        }
      }

      // Games + playerStats sub-sub-collection
      for (const [gid, game] of Object.entries(newGames)) {
        const { playerStats, ...gameWithoutStats } = game;
        const prevGame = prev.games[gid] || {};
        if (JSON.stringify(gameWithoutStats) !== JSON.stringify(prevGame)) {
          ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "games", gid), data: gameWithoutStats });
        }
        // PlayerStats sub-collection
        const newStats  = playerStats || {};
        const prevStats = prev.stats[gid] || {};
        for (const [pid, stats] of Object.entries(newStats)) {
          if (JSON.stringify(stats) !== JSON.stringify(prevStats[pid])) {
            ops.push({ type: 'set', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)), data: stats });
          }
        }
        for (const pid of Object.keys(prevStats)) {
          if (!newStats[pid]) ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)) });
        }
      }
      // Delete removed games (and their playerStats)
      for (const gid of Object.keys(prev.games)) {
        if (!newGames[gid]) {
          ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid) });
          for (const pid of Object.keys(prev.stats[gid] || {})) {
            ops.push({ type: 'delete', ref: doc(_db, "leagues", lid, "games", gid, "playerStats", String(pid)) });
          }
        }
      }

      // meta/sync update (always included)
      ops.push({ type: 'set', ref: doc(_db, "meta", "sync"), data: { updatedAt: ts } });

      // RISK 4 — Batch chunking: Firestore hard limit is 500 ops per batch.
      // Chunking at 450 gives a safety buffer above the 500 limit.
      // e.g. 1000 ops → 3 batch commits (450, 450, 100).
      for (let i = 0; i < ops.length; i += 450) {
        const chunk = ops.slice(i, i + 450);
        const batch = writeBatch(_db);
        for (const op of chunk) {
          if (op.type === 'set') batch.set(op.ref, op.data);
          else batch.delete(op.ref);
        }
        await batch.commit();
      }

      // Update tracked state so next write can diff correctly
      subcolData.current[lid] = {
        teams:   newTeams,
        players: Object.fromEntries(Object.entries(newPlayers).map(([pid, p]) => { const { email: _e, ...pub } = p; return [pid, pub]; })),
        playersPrivate: Object.fromEntries(Object.entries(newPlayers).filter(([, p]) => p.email).map(([pid, p]) => [pid, { email: p.email }])),
        games:   Object.fromEntries(Object.entries(newGames).map(([gid, g]) => {
          const { playerStats, ...rest } = g; return [gid, rest];
        })),
        stats:   Object.fromEntries((updated.schedule || []).map(g => [String(g.id), g.playerStats || {}])),
      };

    } catch(e) { console.error("Firestore writeLeagueNow:", e); }
  }

  // Returns players array with orphans removed — checks both p.team (name) and p.teamId (id)
  // so it works regardless of which field was stored in Firestore.
  function stripOrphanedPlayers(teams, players) {
    const teamNames = new Set(teams.map(t => t.name));
    const teamIds   = new Set(teams.map(t => String(t.id)));
    return players.filter(p => {

  }

    const remainingPlayers = league.players.filter(p => {
      if (teamToDelete && p.team   === teamToDelete.name)   return false;
      if (teamToDelete && String(p.teamId) === String(id))  return false;

    // Also remove games that involved this team

      ? league.schedule.filter(g => g.home !== teamToDelete.name && g.away !== teamToDelete.name)

  async function saveRoster() {
    if (!rosterTeam || !league) return;
    const team = rosterTeam;
    const catId = team.categoryId || activeCatId || (league.categories?.[0]?.id) || null;

    // Classify rows: skip fully blank ones, validate partial ones
    const activeRows = rosterRows.filter(r => !r._del);
    const newErrs = {};
    for (const row of activeRows) {
      const hasAny = row.firstName.trim() || row.lastName.trim() || row.number.trim() || row.position.trim();
      if (!hasAny) continue; // fully blank → ignore on save
      if (!row.firstName.trim()) { newErrs[row._key] = { ...newErrs[row._key], firstName: true }; }
      if (!row.lastName.trim())  { newErrs[row._key] = { ...newErrs[row._key], lastName: true }; }
    }
    if (Object.keys(newErrs).length) { setRosterErrors(newErrs); showToast('Prénom et nom requis pour chaque joueur.'); return; }
    setRosterErrors({});

    // Validate: no duplicate jersey numbers among non-blank active rows
    const nonBlank = activeRows.filter(r => r.firstName.trim() || r.lastName.trim());
    const nums = nonBlank.map(r => r.number).filter(Boolean);
    const dupes = nums.filter((n, i) => nums.indexOf(n) !== i);
    if (dupes.length) { showToast(`Numéros en double : ${[...new Set(dupes)].join(', ')}`); return; }

    setRosterSaving(true);
    try {
      let updatedPlayers = [...league.players];
      let updatedSchedule = [...(league.schedule || [])];
      let newIdBase = Date.now();

      for (const row of rosterRows) {
        const fullName = [row.firstName.trim(), row.lastName.trim()].filter(Boolean).join(' ');
        if (row._new && !row._del) {
          const hasAny = row.firstName.trim() || row.lastName.trim() || row.number.trim() || row.position.trim();
          if (!hasAny || !fullName) continue; // skip fully blank rows
          const newP = { id: newIdBase++, name: fullName, number: row.number.trim(), position: row.position.trim(), team: team.name, teamId: team.id, categoryId: catId };
          updatedPlayers.push(newP);
        } else if (!row._new && row._del) {
          // Remove from stats
          updatedSchedule = updatedSchedule.map(g => {
            if (!g.playerStats) return g;
            const ps = { ...g.playerStats };
            delete ps[row.id]; delete ps[String(row.id)];
            return { ...g, playerStats: ps };
          });
          if (__fbReady && _db) {
            try { const { deleteDoc, doc } = _FS; await deleteDoc(doc(_db, 'leagues', String(league.id), 'players', String(row.id))); } catch(e) {}
          }
          updatedPlayers = updatedPlayers.filter(p => p.id !== row.id);
        } else if (!row._new && !row._del) {
          // Update existing
          updatedPlayers = updatedPlayers.map(p => {
            if (p.id !== row.id) return p;
            return { ...p, name: fullName || p.name, number: row.number.trim(), position: row.position.trim() };
          });
        }
      }

      const updated = { ...league, players: updatedPlayers, schedule: updatedSchedule };
      await writeLeagueNow(updated);
      setDirty(false);
      setRosterTeam(null);
      setRosterRows([]);
      showToast('Alignement sauvegardé.');
    } finally {
      setRosterSaving(false);
    }
  }

  async function deleteLeague(id) {
    if (__fbReady) {
      try {
        const { deleteDoc, doc, getDocs, collection, writeBatch } = _FS;
        const lid = String(id);
        // Load sub-collections so we can delete them (Firestore doesn't cascade)
        const [teamsSnap, playersSnap, gamesSnap] = await Promise.all([
          getDocs(collection(_db, "leagues", lid, "teams")),
          getDocs(collection(_db, "leagues", lid, "players")),
          getDocs(collection(_db, "leagues", lid, "games")),
        ]);
        // Load playerStats for every game
        const statSnaps = await Promise.all(
          gamesSnap.docs.map(gDoc => getDocs(collection(_db, "leagues", lid, "games", gDoc.id, "playerStats")))
        );
        // RISK 3 — Delete in correct dependency order:
        // 1. playerStats first (deepest sub-collection)
        // 2. games (parent of playerStats)
        // 3. players
        // 4. teams
        // 5. root league doc LAST
        const allSubDocs = [
          ...statSnaps.flatMap(s => s.docs),  // 1. playerStats docs
          ...gamesSnap.docs,                   // 2. game docs
          ...playersSnap.docs,                 // 3. player docs
          ...teamsSnap.docs,                   // 4. team docs
        ];
        // Delete in batches of 499
        for (let i = 0; i < allSubDocs.length; i += 499) {
          const batch = writeBatch(_db);
          allSubDocs.slice(i, i + 499).forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
        // Delete root doc last
        await deleteDoc(doc(_db, "leagues", lid));
        // Clear tracked state
        const next = { ...subcolData.current };
        delete next[lid];
        subcolData.current = next;
      } catch(e) { console.error("Firestore deleteLeague:", e); }
    }
    const updated = leagues.filter(l => l.id !== id);
    setLeagues(updated);
    localStorage.setItem("wxLeagues", JSON.stringify(updated));
    if (selId === id) { setSelId(null); setPage("dashboard"); setDirty(false); }
    showToast("Ligue supprimée.");
  }

      }

    try {
      const milUpdates = {};
      (updated.players||[]).forEach(p => {
        const newMils = calcNewMilestones(p, updated.schedule||[], updated);
        if (newMils.length > 0) {
          const pid = String(p.id);
          const ex = ((updated.playerMilestones||{})[pid]) || { milestones:[], rpAdjustments:[] };
          milUpdates[pid] = { ...ex, milestones: [...(ex.milestones||[]), ...newMils] };
        }
      });

        const withMil = { ...updated, playerMilestones: { ...(updated.playerMilestones||{}), ...milUpdates } };
        await writeLeagueNow(withMil);
      }
    } catch(e) { console.error('Milestone auto-save:', e); }
    // Count newly earned milestones for toast
    try {
      let newBadgeCount = 0;
      (updated.players||[]).forEach(p => {
        const pid = String(p.id);
        const prevMils = new Set(((league.playerMilestones||{})[pid]?.milestones)||[]);
        const nowMils  = new Set(((updated.playerMilestones||{})[pid]?.milestones)||[]);
        const milToBadge = { pts_20:'scorer_20', pts_30:'scorer_30', pts_40:'scorer_40', double_double:'double_double', triple_double:'triple_double', ws_5:'win_streak_5', ws_10:'win_streak_10' };
        Object.keys(milToBadge).forEach(mk => { if (!prevMils.has(mk) && nowMils.has(mk)) newBadgeCount++; });
      });
      if (newBadgeCount > 0) showToast(`🏅 ${newBadgeCount} new badge${newBadgeCount!==1?'s':''} unlocked this game!`, 'success');

  async function saveStats(skipCheck = false) {
    if (!editStats || !league || saving) return;
    // ── Points validation (Basketball only, when a score exists) ──
    // Use league.sport — NOT the block-scoped `sport` variable inside the league render branch.
    if (!skipCheck && league.sport === "Basketball") {
      const g = editStats.game;
      if (g.homeScore !== undefined && g.awayScore !== undefined) {
        const allGamePlayers = league.players.filter(p => p.team === g.home || p.team === g.away);
        const mismatches = [g.home, g.away].map(teamName => {
          const teamPlayers = allGamePlayers.filter(p => p.team === teamName);
          const entered = teamPlayers.reduce((s, p) => s + (parseFloat(editStats.stats[p.id]?.points) || 0), 0);
          const score   = parseInt(teamName === g.home ? g.homeScore : g.awayScore);
          const diff    = score - entered;
          if (diff !== 0) {
            const suspects = teamPlayers.filter(p => !(parseFloat(editStats.stats[p.id]?.points) > 0));
            return { team: teamName, entered, score, diff, suspects };
          }
          return null;
        }).filter(Boolean);
        if (mismatches.length > 0) {
          setStatsValidationError(mismatches);
          return;
        }
      }
    }
    setStatsValidationError(null);
    setSaving(true);
    try { await _doWriteStats(); } finally { setSaving(false); }
  }

      </div>
    );
    return null;
  }

  async function deleteScore(id) {
    if (!league) return;
    const updated = {
      ...league,
      schedule: league.schedule.map(g => {
        if (g.id !== id) return g;
        const { homeScore, awayScore, playerStats, ...rest } = g;
        return { ...rest, played: false };
      })
    };
    await writeLeagueNow(updated);
    setDirty(false);
  }
  async function setToggle(key, val) {
    if (!league) return;
    const updated = { ...league, statToggles: { ...getToggles(league), [key]: val } };
    await writeLeagueNow(updated);
    setDirty(false);
  }

  async function addCategory() {
    if (!league) return;
    if (nCat.ageGroup === "Personnalisé" && !nCat.customAge.trim()) { showToast("Entre un nom pour le groupe d'âge personnalisé."); return; }
    const ageLabel = nCat.ageGroup === "Custom" ? nCat.customAge.trim() : nCat.ageGroup;
    const displayName = nCat.gender ? `${ageLabel} ${nCat.gender}` : ageLabel;
    const newCat = { id: "cat_" + Date.now(), name: ageLabel, gender: nCat.gender, division: nCat.division.toLowerCase(), displayName };
    const updated = { ...league, categories: [...(league.categories || []), newCat] };
    await writeLeagueNow(updated);
    setDirty(false);
    setNCat({ ageGroup: "U15", gender: "Masculine", division: "Gold", customAge: "" });
    setShowCatModal(false);
    setActiveCatId(newCat.id);
    showToast(`Catégorie "${displayName}" ajoutée !`);
  }

  // Persist a custom category order — reorders the categories array and stores categoryOrder (ids)
  async function saveCategoryOrder(ordered) {
    if (!league || !ordered.length) return;
    const updated = { ...league, categories: ordered, categoryOrder: ordered.map(c => c.id) };
    await writeLeagueNow(updated);
    setDirty(false);
    setShowReorderModal(false);
    showToast("Ordre des catégories sauvegardé");
  }

  async function deleteCategory(catId) {
    if (!league) return;
    if ((league.categories || []).length <= 1) { showToast("Tu dois avoir au moins une catégorie."); return; }
    const updCategories = (league.categories || []).filter(c => c.id !== catId);
    const updTeams    = league.teams.filter(t => t.categoryId !== catId);
    const updPlayers  = league.players.filter(p => p.categoryId !== catId);
    const updSchedule = (league.schedule || []).filter(g => g.categoryId !== catId);
    const updHonours  = { ...(league.honours || {}) };
    delete updHonours[catId];
    const updated = { ...league, categories: updCategories, teams: updTeams, players: updPlayers, schedule: updSchedule, honours: updHonours };
    await writeLeagueNow(updated);
    setDirty(false);
    setDeleteCatId(null);
    setActiveCatId(updCategories[0]?.id || null);
    showToast("Catégorie supprimée.");

                                {l.sport==="Hockey"?"HKY":l.sport==="Basketball"?"BBL":l.sport==="Soccer"?"SOC":l.sport==="Baseball"?"BSB":"SPT"}
                              </div>
                              <div>
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{l.name}</div>
                                {lPublicUrl && <a href={lPublicUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11, color: ACC, marginTop: 1, display: "block", textDecoration: "none" }}>↗ Site public</a>}
                              </div>
                            </div>
                          </td>
                          <td style={{ padding: "14px 16px", fontSize: 13, color: T2 }}>{l.sport}</td>
                          <td style={{ padding: "14px 16px", fontSize: 13 }}>
                            {lOwners.length > 0
                              ? lOwners.map(o => <div key={o.id} style={{ color: T1, fontSize: 13 }}>{o.email}</div>)
                              : <span style={{ color: T2, fontStyle: "italic" }}>Aucun responsable</span>}
                          </td>
                          <td style={{ padding: "14px 16px", fontWeight: 700, fontSize: 15, color: T1 }}>{l.teams.length}</td>
                          <td style={{ padding: "14px 16px", fontWeight: 700, fontSize: 15, color: T1 }}>{l.players.length}</td>
                          <td style={{ padding: "14px 16px", fontWeight: 700, fontSize: 15, color: T1 }}>{l.schedule.length}</td>
                          <td style={{ padding: "14px 16px" }}>
                            <span style={{ fontSize: 12, padding: "3px 10px", borderRadius: 6, background: statusColor+"20", color: statusColor, fontWeight: 700 }}>{status}</span>
                          </td>
                          {/* ── ALERTS COLUMN ── */}
                          <td style={{ padding: "14px 16px" }}>
                            {(() => {
                              const awaitingCount = (l.schedule || []).filter(g => isGameAwaiting(g)).length;
                              const urgentCount   = (l.schedule || []).filter(g => isGameAwaiting(g) && daysAgo(g) >= 2).length;
                              if (!awaitingCount) return <span style={{ fontSize: 12, color: "#22c55e" }}>✓ RAS</span>;
                              return (
                                <button onClick={() => { setSelId(l.id); setPage("league"); setTab("schedule"); }}
                                  style={{ background: urgentCount ? "#ef444420" : "#f59e0b20", border: `1px solid ${urgentCount ? "#ef444450" : "#f59e0b50"}`, borderRadius: 6, color: urgentCount ? "#ef4444" : "#f59e0b", padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                                  {awaitingCount} manquant{awaitingCount > 1 ? "s" : ""}
                                  {urgentCount > 0 && <span style={{ marginLeft: 4, color: "#ef4444" }}>· {urgentCount} urgent{urgentCount > 1 ? "s" : ""}</span>}
                                </button>
                              );
                            })()}
                          </td>
                          <td style={{ padding: "14px 16px", textAlign: "right" }}>
                            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", flexWrap: "nowrap" }}>
                              {user?.role === "superadmin" && (
                                <button onClick={() => { setManageOwnerId(l.id); }}
                                  style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 11, cursor: "pointer", whiteSpace: "nowrap" }}>
                                  Responsables {lOwners.length > 0 ? `(${lOwners.length})` : ""}
                                </button>
                              )}
                              <button onClick={() => { setSelId(l.id); setPage("league"); setTab("teams"); }}
                                style={{ ...btn(), padding: "5px 14px", fontSize: 12, whiteSpace: "nowrap" }}>
                                Accéder →
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}
      </div>

      {/* ── SYSTEM SECTION (superadmin only) ── */}
      {user?.role === "superadmin" && (
        <div style={{ maxWidth: 1100, margin: "0 auto 40px", padding: "0 24px" }}>
          <div style={{ ...card, padding: 28 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Système</div>
            <div style={{ fontSize: 13, color: T2, marginBottom: 20 }}>Migrations et outils de maintenance ponctuels. Super admin uniquement.</div>

            {/* Migration: move player emails to playersPrivate */}
            <div style={{ background: SURF, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 20 }}>
              <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 4 }}>Migration des courriels joueurs</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 14 }}>
                Déplace le champ <code style={{ background: "#ffffff10", padding: "1px 5px", borderRadius: 4 }}>email</code>
                des docs publics <code style={{ background: "#ffffff10", padding: "1px 5px", borderRadius: 4 }}>players/*</code>
                vers les docs privés <code style={{ background: "#ffffff10", padding: "1px 5px", borderRadius: 4 }}>playersPrivate/*</code>.
                Fais d'abord un scan test pour voir le compte, puis confirme.
              </div>

              {/* Results of dry-run */}
              {migDryRun && !migDone && (
                <div style={{ marginBottom: 14 }}>
                  {migDryRun.total === 0
                    ? <div style={{ fontSize: 13, color: "#22c55e" }}>✓ Aucun doc joueur avec un champ email trouvé. Rien à migrer.</div>
                    : (
                      <div>
                        <div style={{ fontSize: 13, marginBottom: 8 }}>
                          Trouvé <strong>{migDryRun.total}</strong> doc{migDryRun.total !== 1 ? "s" : ""} joueur avec un email dans {migDryRun.results.length} ligue{migDryRun.results.length !== 1 ? "s" : ""} :
                        </div>
                        <ul style={{ margin: "0 0 10px 16px", padding: 0, fontSize: 13, color: T2 }}>
                          {migDryRun.results.map(r => (
                            <li key={r.leagueId}><strong style={{ color: T1 }}>{r.name}</strong> : {r.count} joueur{r.count !== 1 ? "s" : ""}</li>
                          ))}
                        </ul>
                        {!migConfirm
                          ? <button onClick={() => setMigConfirm(true)}
                              style={{ ...btn(), background: "#ef444430", border: "1px solid #ef444460", color: "#ef4444" }}>
                              Lancer la migration →
                            </button>
                          : (
                            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                              <span style={{ fontSize: 13, color: "#f59e0b" }}>Ceci écrira dans Firestore. Continuer ?</span>
                              <button onClick={migrationRun} disabled={migRunning}
                                style={{ ...btn(), background: "#ef444430", border: "1px solid #ef444460", color: "#ef4444", opacity: migRunning ? 0.5 : 1 }}>
                                {migRunning ? "En cours…" : "Oui, lancer"}
                              </button>
                              <button onClick={() => setMigConfirm(false)}
                                style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>
                                Annuler
                              </button>
                            </div>
                          )
                        }
                      </div>
                    )
                  }
                </div>
              )}

              {/* Migration completed */}
              {migDone && (
                <div style={{ fontSize: 13, marginBottom: 14, color: migDone.errors > 0 ? "#f59e0b" : "#22c55e" }}>
                  {migDone.errors > 0
                    ? `Terminé avec erreurs — ${migDone.moved} déplacés, ${migDone.errors} échoués. Voir la console.`
                    : `✓ Migration terminée — ${migDone.moved} courriel${migDone.moved !== 1 ? "s" : ""} déplacés vers playersPrivate.`
                  }
                </div>
              )}

              <button onClick={migrationDryRun} disabled={migRunning}
                style={{ ...btn("#252540"), opacity: migRunning ? 0.5 : 1 }}>
                {migRunning ? "Scan en cours…" : migDryRun ? "Re-scanner" : "Scan test"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── MANAGE OWNERS MODAL ── */}
      {manageOwnerId && (() => {
        const lg = leagues.find(l => l.id === manageOwnerId);
        const ownersForLeague = users.filter(u => u.leagueId === manageOwnerId && u.role === "owner");
        const isResetting = resetAccessForm.ownerId !== null;
        return (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>

              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Propriétaires — {lg?.name}</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 20 }}>Les propriétaires se connectent avec nom d'utilisateur + mot de passe.</div>

              {/* Create owner form */}
              {!isResetting && (

                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <div>
                      <label style={lbl}>Nom d'utilisateur</label>
                      <input style={inp} value={newOwner.username}

                      <input type="password" style={inp} value={newOwner.password}

                        placeholder="6 caractères minimum" autoComplete="new-password" />
                    </div>
                    {ownerError && <div style={{ color: "#ef4444", fontSize: 12 }}>{ownerError}</div>}
                    <button onClick={createOwner} style={{ ...btn(), padding: "9px 16px", fontSize: 13 }}>
                      Créer le compte →
                    </button>
                  </div>
                </div>
              )}

              {/* Reset access form */}
              {isResetting && (() => {
                const targetOwner = users.find(u => u.id === resetAccessForm.ownerId);

                  <div style={{ background: "#2e1313", border: "1px solid #ef444440", borderRadius: 10, padding: 18, marginBottom: 20 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#ef4444", letterSpacing: "0.08em", marginBottom: 8 }}>
                      RÉINITIALISER L'ACCÈS — {targetOwner?.username}
                    </div>
                    <div style={{ fontSize: 12, color: T2, marginBottom: 12, lineHeight: 1.5 }}>

                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <div>
                        <label style={lbl}>Nouveau nom d'utilisateur</label>
                        <input style={inp} value={resetAccessForm.newUsername}
                          onChange={e => setResetAccessForm(f => ({ ...f, newUsername: e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '') }))}

                      </div>
                      <div>
                        <label style={lbl}>Nouveau mot de passe temporaire</label>
                        <input type="password" style={inp} value={resetAccessForm.tempPassword}
                          onChange={e => setResetAccessForm(f => ({ ...f, tempPassword: e.target.value }))}
                          placeholder="6 caractères minimum" autoComplete="new-password" />
                      </div>
                      {ownerError && <div style={{ color: "#ef4444", fontSize: 12 }}>{ownerError}</div>}
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={resetAccess} style={{ ...btn(), background: "#7f1d1d", padding: "9px 16px", fontSize: 13, flex: 1 }}>

                        </button>
                        <button onClick={() => { setResetAccessForm({ ownerId: null, newUsername: "", tempPassword: "" }); setOwnerError(""); }}
                          style={{ ...btn("#252540"), padding: "9px 16px", fontSize: 13 }}>
                          Annuler
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* Owner list */}
              {ownersForLeague.length === 0
                ? <div style={{ color: T2, fontSize: 14, marginBottom: 20, textAlign: "center", padding: "16px 0" }}>Aucun propriétaire. Crée un compte ci-dessus.</div>
                : ownersForLeague.map(owner => (
                  <div key={owner.id} style={{ background: SURF, borderRadius: 10, padding: "12px 16px", marginBottom: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{owner.username || owner.email || owner.id}</div>
                      <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>
                        {owner.mustChangePassword ? "! Doit changer son MDP" : "Actif"} · Créé {owner.createdAt || "—"}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {!isResetting && (
                        <button onClick={() => { setResetAccessForm({ ownerId: owner.id, newUsername: owner.username || "", tempPassword: "" }); setOwnerError(""); }}
                          style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 11, cursor: "pointer", whiteSpace: "nowrap" }}>
                          Reset accès
                        </button>
                      )}
                      <button onClick={() => setDeleteOwnerId(owner.id)}
                        style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 10px", fontSize: 11, cursor: "pointer", whiteSpace: "nowrap" }}>
                        Supprimer
                      </button>
                    </div>
                  </div>
                ))
              }
              <button style={{ ...btn("#252540"), width: "100%", marginTop: 12 }} onClick={() => { setManageOwnerId(null); setNewOwner({ username: "", password: "" }); setOwnerError(""); setResetAccessForm({ ownerId: null, newUsername: "", tempPassword: "" }); }}>Fermer</button>
            </div>
          </div>
        );
      })()}

      {/* ── REMOVE OWNER CONFIRM ── */}
      {deleteOwnerId && (
        <ConfirmModal title="Supprimer ce propriétaire ?" body={`Supprimer ${users.find(u=>u.id===deleteOwnerId)?.username || deleteOwnerId} ? Leur compte Firestore sera supprimé. Les données de la ligue ne sont pas affectées.`} confirmLabel="Oui, supprimer" onConfirm={() => { const uid = deleteOwnerId; setDeleteOwnerId(null); deleteOwner(uid); }} onCancel={() => setDeleteOwnerId(null)} />

      {/* ── CREATED CREDENTIALS MODAL ── */}
      {createdCreds && (
        <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
          <div style={{ width: 420, ...card, padding: 32 }}>

            <div style={{ fontSize: 13, color: T2, marginBottom: 20, lineHeight: 1.6 }}>

            <div style={{ background: SURF, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 16, marginBottom: 20 }}>
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 11, color: T2, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 4 }}>NOM D'UTILISATEUR</div>
                <span style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 800, color: ACC }}>{createdCreds.username}</span>
              </div>
              <div>
                <div style={{ fontSize: 11, color: T2, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 4 }}>MOT DE PASSE TEMPORAIRE</div>
                <span style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 800, color: "#22c55e" }}>{createdCreds.password}</span>
              </div>
            </div>
            <button onClick={() => {
              navigator.clipboard.writeText(`Nom d'utilisateur: ${createdCreds.username}\nMot de passe: ${createdCreds.password}`).then(() => showToast("Identifiants copiés!")).catch(() => {});
            }} style={{ ...btn("#252540"), width: "100%", marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier les identifiants</button>
            <button onClick={() => setCreatedCreds(null)} style={{ ...btn(), width: "100%" }}>Fermer</button>
          </div>
        </div>
      )}

      {showAdd && (
        <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ width: 460, ...card, padding: 32 }}>
            <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Créer une ligue</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div><label style={lbl}>Nom de la ligue</label><input style={inp} value={nL.name} onChange={e => setNL({...nL,name:e.target.value})} placeholder="ex. Ligue de hockey été" /></div>
              <div><label style={lbl}>Sport</label>
                <select style={inp} value={nL.sport} onChange={e => setNL({...nL,sport:e.target.value})}>
                  {["Basketball","Hockey","Soccer","Baseball","Other"].map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
              <div><label style={lbl}>Domaine public</label><input style={inp} value={nL.domain} onChange={e => setNL({...nL,domain:e.target.value})} placeholder="ex. ligueligue.com" /></div>
              <div><label style={lbl}>Couleur de la ligue</label>
                <input type="color" value={nL.color} onChange={e => setNL({...nL,color:e.target.value})} style={{ height: 44, width: "100%", borderRadius: 8, border: `1px solid ${BORDER}`, background: SURF, cursor: "pointer", padding: 4 }} />
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                <button style={{ ...btn(), flex: 1 }} onClick={addLeague}>Créer la ligue</button>
                <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setShowAdd(false)}>Annuler</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── TOAST STACK ── */}
      {toasts.length > 0 && (
        <div className="toast-stack">
          {toasts.map(t => (
