                            ...(nG.time  ? [{ label: 'Heure',   value: nG.time }]  : []),
                            ...(nG.venue ? [{ label: 'Gymnase', value: nG.venue }] : []),
                          ],
                          confirmLabel: 'Oui, ajouter',
                          onConfirm: () => addGame(),
                        });
                      }}>{saving ? "Enregistrement…" : "Ajouter"}</button>
                    </div>
                    {venueOptions.length > 0 && (
                      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: T2, marginRight: 2 }}>Gymnases :</span>
                        {venueOptions.map(v => (
                          <button key={v} type="button" onClick={() => setNG({...nG, venue: v})}
                            style={{ fontSize: 11, padding: "3px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${nG.venue === v ? ACC : BORDER}`, background: nG.venue === v ? ACC + "22" : "none", color: nG.venue === v ? ACC : T2, fontWeight: nG.venue === v ? 700 : 400, transition: "all 0.1s" }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {nG.date && nG.time && (
                      <div style={{ marginTop: 10, fontSize: 12, color: nGIsInPast ? ACC : T2, display: "flex", alignItems: "center", gap: 6 }}>
                        {nGIsInPast
                          ? "ⓘ Ce match est dans le passé — il ira dans les matchs terminés. Tu pourras entrer le score ensuite."
                          : "ⓘ Ce match sera planifié comme à venir."}
                      </div>
                    )}
                  </div>
                );
              })()}
              {/* ── CALENDAR FILTERS & SEARCH ── */}
              {catSchedule.length > 0 && (
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} placeholder="Rechercher équipe, gymnase…" value={calSearch} onChange={e => setCalSearch(e.target.value)} />
                  <select style={{ ...inp, flex: 1, minWidth: 120 }} value={calFilter.team} onChange={e => setCalFilter(f => ({...f, team: e.target.value}))}>
                    <option value="">Toutes les équipes</option>
                    {catTeams.map(t => <option key={t.id} value={t.name}>{t.name}</option>)}
                  </select>
                  <select style={{ ...inp, flex: 1, minWidth: 120 }} value={calFilter.venue} onChange={e => setCalFilter(f => ({...f, venue: e.target.value}))}>
                    <option value="">Tous les gymnases</option>
                    {[...new Set((catSchedule).map(g => g.venue).filter(Boolean))].sort().map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select style={{ ...inp, flex: 1, minWidth: 120 }} value={calFilter.status} onChange={e => setCalFilter(f => ({...f, status: e.target.value}))}>
                    <option value="">Tous les statuts</option>
                    <option value="upcoming">À venir</option>
                    <option value="today">Aujourd'hui</option>

            const draftAccent = psDraft && psDraft.accentColor  !== undefined ? psDraft.accentColor : (ps.accentColor || '');

                    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>URL publique</div>

                </div>

                        <input
                          type="checkbox"

                          onChange={() => savePublicSettings(league, { ...ps, [key]: !(ps[key] !== false) })}

                  </div>

                </div>

                <div style={{ ...card, marginBottom: 20 }}>

                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

                    </div>
                    <div>
                      <label style={lbl}>Corps du message</label>
                      <textarea style={{ ...inp, minHeight: 110, resize: "vertical", fontFamily: "inherit", lineHeight: 1.6 }} value={draftBody} onChange={e => setPsDraft({ ...(psDraft || {}), _lmBody: e.target.value, _lmTitle: draftTitle, accentColor: draftAccent })} placeholder="Notre mission est de développer…" />
                    </div>
                    <div>
                      <label style={lbl}>Couleur d'accentuation</label>
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>

                        <input style={{ ...inp, maxWidth: 130 }} value={draftAccent} onChange={e => setPsDraft({ ...(psDraft || {}), accentColor: e.target.value, _lmTitle: draftTitle, _lmBody: draftBody })} placeholder="#C9A24A" />
                        {draftAccent && <button style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "6px 12px", fontSize: 12, cursor: "pointer" }} onClick={() => setPsDraft({ ...(psDraft || {}), accentColor: '', _lmTitle: draftTitle, _lmBody: draftBody })}>Réinitialiser</button>}
                      </div>

                  </div>
                </div>

            );

                              <input type="password" style={inp} value={newCoord.tempPassword}

                                placeholder="6 caractères minimum" autoComplete="new-password" />

                          </div>
                          <div style={{ fontSize: 12, color: T2, marginBottom: 12, lineHeight: 1.5 }}>

                            <div style={{ flex: 1, minWidth: 140 }}>
                              <label style={lbl}>Nouveau mot de passe temporaire</label>
                              <input type="password" style={inp} value={resetCoordForm.tempPassword}
                                onChange={e => setResetCoordForm(f => ({ ...f, tempPassword: e.target.value }))}
                                placeholder="6 caractères minimum" autoComplete="new-password" />
                            </div>

                          <div key={coord.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", background: SURF, border: `1px solid ${BORDER}`, borderRadius: 8 }}>

                              <div style={{ fontWeight: 600, fontSize: 14 }}>{coord.displayName || coord.username}</div>
                              <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>

                                {coord.active === false ? "Réactiver" : "Désactiver"}
                              </button>

                  <div>

                    <div style={{ flex: 2, minWidth: 180 }}>
                      <label style={lbl}>Domaine public</label>
                      <input style={inp} value={league.domain || ""} onChange={e => upd({ ...league, domain: e.target.value })} placeholder="ex. monbasketball.com" />
                    </div>
                  </div>

                    if (g.homeScore === undefined || !g.playerStats) return false;
                    const gDate = new Date((g.date || "") + "T12:00:00");
                    return gDate >= startDate && gDate <= now && g.playerStats;
                  });
                  if (!periodGames.length) return null;
                  let best = null, bestPPG = -1;
                  for (const p of catPlayers) {
                    const pg = periodGames.filter(g => g.playerStats && (g.playerStats[p.id] !== undefined || g.playerStats[String(p.id)] !== undefined));
                    if (!pg.length) continue;
                    const pts = pg.reduce((s, g) => s + parseInt((g.playerStats[p.id] || g.playerStats[String(p.id)])?.points || 0), 0);
                    const ppg = pts / pg.length;
                    if (ppg > bestPPG) { bestPPG = ppg; best = p; }
                  }
                  return best;
                }

                function AwardCard({ awardKey, label, icon }) {
                  const current = awards[awardKey] || { playerId: null, mode: "manual" };
                  const mode = current.mode || "manual";
                  const autoPlayer = mode === "auto" ? calcAutoPlayer(awardKey === "playerOfWeek" ? "week" : "month") : null;
                  const displayPlayerId = mode === "auto" ? (autoPlayer?.id ?? null) : current.playerId;
                  const displayPlayer = displayPlayerId ? catPlayers.find(p => String(p.id) === String(displayPlayerId)) : null;

                  function setAward(playerId) {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, playerId, setAt: Date.now() } } };
                    writeLeagueNow(updated); setDirty(false);
                    if (emailConfig && playerId) {
                      const awardedPlayer = league.players.find(p => String(p.id) === String(playerId));
                      if (awardedPlayer) {
                        sendPotwNotification(_db, _FS, league, awardedPlayer, emailConfig)

                          .catch(()=>{});
                      }
                    }
                  }
                  function clearAward() {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, playerId: null } } };
                    writeLeagueNow(updated); setDirty(false);
                  }
                  function setMode(m) {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, mode: m } } };

                          {MODES.map(m => (
                            <button key={m} onClick={() => setMode(m)} style={{ fontSize: 11, padding: "4px 10px", borderRadius: 6, border: `1px solid ${mode===m?ACC:BORDER}`, background: mode===m?ACC+"22":"none", color: mode===m?ACC:T2, cursor: "pointer", fontWeight: mode===m?700:400, textTransform: "capitalize" }}>{m}</button>
                          ))}
                        </div>
                      </div>
                      {mode === "auto" ? (
                        <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>

                            : <span style={{ marginLeft: 8, color: T2 }}>→ No qualifying games yet</span>}
                        </div>
                      ) : (
                        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                          <select style={{ ...inp, flex: 1, minWidth: 160 }} value={current.playerId || ""} onChange={e => setAward(e.target.value ? parseInt(e.target.value) || e.target.value : null)}>
                            <option value="">— Select player —</option>
                            {catPlayers.map(p => <option key={p.id} value={p.id}>#{p.number} {p.name} ({p.team})</option>)}
                          </select>
                          {current.playerId && <button onClick={clearAward} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Clear</button>}
                        </div>
                      )}
                      {displayPlayer && (
                        <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: "#f59e0b10", border: "1px solid #f59e0b40", borderRadius: 8 }}>
                          {displayPlayer.photoUrl
                            ? <img src={displayPlayer.photoUrl} alt={displayPlayer.name} style={{ width: 36, height: 36, borderRadius: "50%", objectFit: "cover", border: "2px solid #f59e0b" }} />
                            : <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#f59e0b22", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: "#f59e0b", fontSize: 13 }}>#{displayPlayer.number}</div>
                          }
                          <div>
                            <div style={{ fontWeight: 700, color: "#f59e0b" }}>{displayPlayer.name}</div>
                            <div style={{ fontSize: 11, color: T2 }}>{displayPlayer.team}</div>
                          </div>
                          <span style={{ marginLeft: "auto", color: "#f59e0b", display: "flex" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="10"/><path d="M7 4H3v3c0 3.3 2.7 6 6 6"/><path d="M17 4h4v3c0 3.3-2.7 6-6 6"/><path d="M7 4h10v5c0 3.3-2.7 6-6 6s-6-2.7-6-6V4"/></svg></span>
                        </div>
                      )}
                    </div>

                return (

                    <AwardCard awardKey="playerOfWeek" label="Player of the Week" icon="★" />
                    <AwardCard awardKey="playerOfMonth" label="Player of the Month" icon="1" />
                  </div>
                );
              })()}

              <div style={{ ...card, background: "#1a0a0a", border: "1px solid #7f1d1d", marginTop: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6, color: "#ef4444" }}>Danger Zone</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                  <div>
                    <div style={{ fontSize: 13, color: T2, marginBottom: 8, lineHeight: 1.6 }}>Reset all player rankings and start a new season. Cannot be undone.</div>

service cloud.firestore {

                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: hbColor }} />

                        {showConnGuide ? "▾" : "▸"} Firebase Setup Guide
                      </button>
                      {showConnGuide && (
                        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                          {[
                            ["1. Create a Firebase project", "Go to console.firebase.google.com → Add project. Give it a name (e.g. league-hunter)."],
                            ["2. Enable Firestore", "In the Firebase console → Build → Firestore Database → Create database → Start in test mode."],
                            ["3. Get your config", "Project Settings → Your apps → Add app (Web) → Copy the firebaseConfig object."],
                            ["4. Paste config into index.html", `Find the Firebase module script near the top of index.html and replace all six REPLACE_ME values with your real config values.`],

                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{devRules}</pre>

          {/* ── ALERTES TAB ── */}
          {tab==="alertes" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>Alertes courriel</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 28, lineHeight: 1.6 }}>Gère les abonnés aux alertes NLS. Les courriels sont envoyés via Cloud Functions + Resend. Le switch ci-dessous active ou désactive tous les envois automatiques.</div>

              {/* ── Alertes actives switch ── */}
              <div style={{ ...card, marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between" }}>

          const q = searchQuery.toLowerCase().trim();
          const teamResults = q ? catTeams.filter(t => t.name?.toLowerCase().includes(q)).map(t => ({ type: "team", label: t.name, sub: "Équipe", action: () => { handleTabSwitch("teams"); setSearchOpen(false); } })) : [];
          const playerResults = q ? catPlayers.filter(p => p.name?.toLowerCase().includes(q) || p.number?.toString().includes(q)).map(p => ({ type: "player", label: p.name, sub: `#${p.number || "?"} · ${p.team || ""}`, action: () => { handleTabSwitch("players"); setSearchOpen(false); } })) : [];
          const results = [...teamResults, ...playerResults].slice(0, 12);
          return (
            <div onClick={() => setSearchOpen(false)} style={{ position: "fixed", inset: 0, background: "#00000085", zIndex: 900, display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 80 }}>
              <div onClick={e => e.stopPropagation()} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 14, width: "100%", maxWidth: 520, boxShadow: "0 24px 60px #00000090", overflow: "hidden" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", borderBottom: `1px solid ${BORDER}` }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T2} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input autoFocus value={searchQuery} onChange={e => { setSearchQuery(e.target.value); setSearchFocusIdx(0); }}
                    onKeyDown={e => {
                      if (e.key === "ArrowDown") { e.preventDefault(); setSearchFocusIdx(i => Math.min(i+1, results.length-1)); }
                      if (e.key === "ArrowUp")   { e.preventDefault(); setSearchFocusIdx(i => Math.max(i-1, 0)); }
                      if (e.key === "Enter" && results[searchFocusIdx]) results[searchFocusIdx].action();
                    }}
                    placeholder="Rechercher équipes ou joueurs…"
                    style={{ flex: 1, background: "none", border: "none", outline: "none", color: T1, fontSize: 16 }} />
                  <kbd style={{ fontSize: 10, background: SURF, border: `1px solid ${BORDER}`, borderRadius: 5, padding: "2px 7px", color: T2 }}>Échap</kbd>
                </div>
                {q && results.length === 0 && (
                  <div style={{ padding: "24px", textAlign: "center", color: T2, fontSize: 14 }}>Aucun résultat pour "{searchQuery}"</div>
                )}
                {results.map((r, i) => (
                  <button key={i} onClick={r.action}
                    style={{ display: "flex", alignItems: "center", gap: 14, width: "100%", background: i === searchFocusIdx ? ACC+"18" : "none", border: "none", padding: "12px 18px", cursor: "pointer", textAlign: "left", borderBottom: i < results.length-1 ? `1px solid ${BORDER}` : "none" }}
                    onMouseEnter={() => setSearchFocusIdx(i)}>
                    <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", color: T2, letterSpacing: 1, width: 44, flexShrink: 0 }}>{r.type === "team" ? "Équipe" : "Joueur"}</span>
                    <span style={{ flex: 1 }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: T1 }}>{r.label}</span>
                      <span style={{ fontSize: 12, color: T2, marginLeft: 8 }}>{r.sub}</span>
                    </span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T2} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                  </button>
                ))}
                {!q && (
                  <div style={{ padding: "20px 18px", color: T2, fontSize: 13 }}>Tape pour chercher des équipes ou joueurs dans cette catégorie.</div>
                )}
              </div>
            </div>
          );
        })()}

        {/* ── MOBILE BOTTOM NAV (<768px) ── */}
        <div className="wx-bottom-nav">
          {[["today","Aujourd'hui"],["schedule","Calendrier"],["teams","Équipes"]].map(([t, label]) => (
            <button key={t} onClick={() => { handleTabSwitch(t); setMoreSheetOpen(false); }}
              style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: "none", border: "none", color: tab === t ? ACC : T2, cursor: "pointer", fontSize: 10, fontWeight: tab === t ? 700 : 400, minHeight: 44, padding: "6px 0" }}>
              {TAB_ICONS[t] || null}
              {label}
            </button>
          ))}
          <button onClick={() => setMoreSheetOpen(v => !v)}
            style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: "none", border: "none", color: ["players","scores","stats","public","settings","alertes"].includes(tab) ? ACC : T2, cursor: "pointer", fontSize: 10, fontWeight: ["players","scores","stats","public","settings","alertes"].includes(tab) ? 700 : 400, minHeight: 44, padding: "6px 0" }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            Plus
          </button>
        </div>
        {/* More sheet */}
        {moreSheetOpen && (
          <div onClick={() => setMoreSheetOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 500, background: "#00000060" }}>
            <div onClick={e => e.stopPropagation()} style={{ position: "absolute", bottom: 56, left: 0, right: 0, background: SURF, borderTop: `1px solid ${BORDER}`, borderRadius: "16px 16px 0 0", padding: "16px 8px" }}>
              {[["players","Joueurs"],["scores","Scores"],["stats","Classement & stats"],["public","Site public"],["settings","Paramètres"],["alertes","Alertes"]].map(([t, label]) => (
                <button key={t} onClick={() => { handleTabSwitch(t); setMoreSheetOpen(false); }}
                  style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", background: tab === t ? ACC+"22" : "none", border: "none", borderRadius: 8, padding: "13px 16px", fontSize: 15, color: tab === t ? ACC : T1, cursor: "pointer", fontWeight: tab === t ? 700 : 400 }}>
                  {TAB_ICONS[t] || null}
                  {label}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ── TOAST STACK (league view) — see also dashboard ── */}

        {/* ── MODALS ── */}
        {editGame && (() => {
          // Use the game's own categoryId for the team lists so only same-category teams are shown
          const editGameCatTeams = editGame.categoryId
            ? league.teams.filter(t => t.categoryId === editGame.categoryId)
            : catTeams;
          return (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
            <div style={{ width: 500, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Modifier le match</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div><label style={lbl}>Date</label><input type="date" style={inp} value={editGame.date || ""} onChange={e=>setEditGame({...editGame,date:e.target.value})} /></div>
                <div><label style={lbl}>Heure</label><input type="time" style={inp} value={parseTimeTo24h(editGame.time || "")} onChange={e=>setEditGame({...editGame,time:e.target.value})} /></div>
                <div><label style={lbl}>Gymnase</label>
                  <input style={inp} value={editGame.venue || ""} onChange={e=>setEditGame({...editGame,venue:e.target.value})} placeholder="Gymnase / Aréna" />
                  {(() => {
                    const ev = [...new Set((league.schedule || []).map(g => g.venue).filter(Boolean))].sort();
                    return ev.length > 0 ? (
                      <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: T2, marginRight: 2 }}>Gymnases :</span>
                        {ev.map(v => (
                          <button key={v} type="button" onClick={() => setEditGame({...editGame, venue: v})}
                            style={{ fontSize: 11, padding: "3px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${editGame.venue === v ? ACC : BORDER}`, background: editGame.venue === v ? ACC + "22" : "none", color: editGame.venue === v ? ACC : T2, fontWeight: editGame.venue === v ? 700 : 400 }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    ) : null;
                  })()}
                </div>
                <div><label style={lbl}>Domicile</label>
                  <select style={inp} value={editGame.home} onChange={e=>setEditGame({...editGame,home:e.target.value})}>
                    {editGameCatTeams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div><label style={lbl}>Visiteur</label>
                  <select style={inp} value={editGame.away} onChange={e=>setEditGame({...editGame,away:e.target.value})}>
                    {editGameCatTeams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={() => {
                    if (!editGame) return;
                    const orig = league.schedule.find(g => g.id === editGame.id);
                    const changes = [];
                    if (orig && editGame.date !== orig.date) changes.push({ label: 'Date', oldValue: orig.date || '—', newValue: editGame.date || '—' });
                    if (orig && (editGame.time || '') !== (orig.time || '')) changes.push({ label: 'Heure', oldValue: orig.time || '—', newValue: editGame.time || '—' });
                    if (orig && editGame.home !== orig.home) changes.push({ label: 'Domicile', oldValue: orig.home || '—', newValue: editGame.home || '—' });
                    if (orig && editGame.away !== orig.away) changes.push({ label: 'Visiteur', oldValue: orig.away || '—', newValue: editGame.away || '—' });
                    if (orig && (editGame.venue || '') !== (orig.venue || '')) changes.push({ label: 'Gymnase', oldValue: orig.venue || '—', newValue: editGame.venue || '—' });
                    if (changes.length === 0) { setEditGame(null); return; }
                    editConfirm.ask({
                      actionType: 'edit', entityType: 'game', entityLabel: `${editGame.home} vs ${editGame.away}`,
                      summary: `Tu es sur le point de modifier ce match.`,
                      details: changes,
                      confirmLabel: 'Oui, enregistrer',
                      onConfirm: () => saveEditGame(),
                    });
                  }}>Enregistrer</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditGame(null)}>Annuler</button>
                </div>
              </div>
            </div>
          </div>
          );
        })()}


        {editScore && (() => {
          const g = league.schedule.find(x => x.id===editScore.id);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
              <div style={{ width: 400, ...card, padding: 32 }}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Modifier le score</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 24 }}>{g?.home} vs {g?.away} · {g?.date}</div>
                <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.home}</label><input type="number" min="0" style={inp} value={editScore.homeScore} onChange={e=>setEditScore({...editScore,homeScore:e.target.value})} /></div>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.away}</label><input type="number" min="0" style={inp} value={editScore.awayScore} onChange={e=>setEditScore({...editScore,awayScore:e.target.value})} /></div>
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={() => {
                    if (!editScore || !g) return;
                    const newH = parseInt(editScore.homeScore), newA = parseInt(editScore.awayScore);
                    if (isNaN(newH) || isNaN(newA) || newH < 0 || newA < 0) return;
                    const newWinner = newH > newA ? g.home : (newA > newH ? g.away : 'Tie');
                    editConfirm.ask({
                      actionType: 'modify', entityType: 'score', entityLabel: `${g.home} vs ${g.away}`,
                      summary: `Tu es sur le point de CORRIGER le score enregistré pour ${g.home} vs ${g.away} (${g.date}). Le classement et les stats seront recalculés.`,
                      details: [
                        { label: 'Date',              value: g.date },
                        { label: 'Score précédent',   value: `${g.homeScore} – ${g.awayScore}` },
                        { label: 'Nouveau score',     value: `${newH} – ${newA}` },
                        { label: 'Nouveau gagnant',   value: newWinner === 'Tie' ? 'Égalité' : newWinner },
                      ],
                      confirmLabel: 'Oui, corriger',
                      dangerStyle: true,
                      onConfirm: () => saveEditScore(),
                    });
                  }}>Enregistrer le score</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditScore(null)}>Annuler</button>
                </div>
              </div>
            </div>
          );
        })()}


        {/* ── UNLOCK CONFIRMATION MODAL ── */}
        {coordUnlockGame && (() => {
          const g = coordUnlockGame;
          const [unlocking, setUnlocking] = React.useState(false);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
              <div style={{ width: 400, ...card, padding: 32 }}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Déverrouiller ce match ?</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 16 }}>{g.home} vs {g.away} · {g.date}</div>
                <div style={{ fontSize: 13, color: "#f59e0b", background: "#f59e0b15", border: "1px solid #f59e0b40", borderRadius: 8, padding: "10px 14px", marginBottom: 24 }}>
                  Le score sera déverrouillé et pourra être modifié par le coordinateur. L'action sera journalisée.
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={{ ...btn("#f59e0b20"), border: "1px solid #f59e0b60", color: "#f59e0b", flex: 1 }} disabled={unlocking} onClick={async () => {
                    setUnlocking(true);
                    try { await unlockScore(g.id); setCoordUnlockGame(null); }
                    catch(e) { alert("Erreur : " + e.message); setUnlocking(false); }
                  }}>{unlocking ? "..." : "Confirmer le déverrouillage"}</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setCoordUnlockGame(null)}>Annuler</button>
                </div>
              </div>
            </div>
          );
        })()}


        {/* ── STATS ENTRY MODAL ── */}
        {editStats && (() => {
          const g = editStats.game;
          const gamePlayers = league.players.filter(p => p.team === g.home || p.team === g.away);
          // Score verification bar (Basketball + game has a score)
          const hasScore = sport === "Basketball" && g.homeScore !== undefined && g.awayScore !== undefined;
          const hs = hasScore ? parseInt(g.homeScore) : 0;
          const as = hasScore ? parseInt(g.awayScore) : 0;
          const homeTotal = hasScore ? gamePlayers.filter(p => p.team === g.home).reduce((s, p) => s + (parseFloat(editStats.stats[p.id]?.points) || 0), 0) : 0;
          const awayTotal = hasScore ? gamePlayers.filter(p => p.team === g.away).reduce((s, p) => s + (parseFloat(editStats.stats[p.id]?.points) || 0), 0) : 0;
          const homeMatch = homeTotal === hs;
          const awayMatch = awayTotal === as;
          const bothMatch = homeMatch && awayMatch;
          return (
            <div className="modal-overlay" style={{ zIndex: 250, padding: 16, alignItems: "stretch" }}>
              <div className="modal-box" style={{ width: "100%", maxWidth: 640, ...card, display: "flex", flexDirection: "column", maxHeight: "92vh", padding: 0, borderRadius: 12 }}>
                {/* Header */}
                <div style={{ padding: "20px 28px 16px", borderBottom: `1px solid ${BORDER}`, flexShrink: 0 }}>
                  <div style={{ fontSize: 17, fontWeight: 700 }}>Player Stats</div>
                  <div style={{ fontSize: 13, color: T2, marginTop: 4 }}>{g.home} vs {g.away} · {g.date}{g.venue ? " · " + g.venue : ""}</div>
                </div>

                {/* ── Score Verification Bar (Basketball only) ── */}
                {hasScore && (
                  <div style={{ margin: "14px 28px 0", padding: "12px 16px", borderRadius: 8, border: `1px solid ${bothMatch ? "#22c55e50" : "#ef444450"}`, background: bothMatch ? "#22c55e0a" : "#ef44440a", flexShrink: 0 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 8 }}>SCORE VERIFICATION — POINTS</div>
                    {[{ team: g.home, entered: homeTotal, score: hs, match: homeMatch }, { team: g.away, entered: awayTotal, score: as, match: awayMatch }].map(({ team, entered, score, match }) => {
                      const diff = score - entered;
                      return (
                        <div key={team} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                          <span style={{ fontSize: 13, color: T1, fontWeight: 500 }}>{team}</span>
                          <span style={{ fontSize: 13, fontWeight: 700, color: match ? "#22c55e" : "#ef4444" }}>
                            {entered} / {score} pts {match ? "✅" : `— ${Math.abs(diff)} ${diff < 0 ? "over" : "missing"}`}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Scrollable body */}
                <div style={{ overflowY: "auto", padding: "16px 28px", flex: 1 }}>
                  {[g.home, g.away].map(teamName => {
                    const tp = gamePlayers.filter(p => p.team === teamName);
                    if (!tp.length) return null;
                    return (
                      <div key={teamName} style={{ marginBottom: 24 }}>
                        <div style={{ fontSize: 12, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 12 }}>{teamName.toUpperCase()}</div>
                        {tp.map(p => {
                          const activeStats = getActiveStats(sport, p, toggles);
                          const ps = editStats.stats[p.id] || {};
                          if (!activeStats.length) return null;
                          return (
                            <div key={p.id} style={{ marginBottom: 16, padding: "12px 14px", background: "#ffffff06", borderRadius: 8, border: `1px solid ${BORDER}` }}>
                              <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                                {p.photoUrl
                                  ? <img src={p.photoUrl} alt={p.name} style={{ width: 28, height: 28, borderRadius: "50%", objectFit: "cover", border: `1px solid ${BORDER}` }} />
                                  : <span style={{ color: ACC, fontWeight: 700, fontSize: 12 }}>#{p.number}</span>
                                }
                                {p.name}
                                {isGoalie(p) && sport === "Hockey" && <span style={{ fontSize: 11, color: T2 }}> — G</span>}
                              </div>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
                                {activeStats.map(({ key, label, isPct, madeKey, attKey, madeLabel, attLabel }) => {
                                  // Percentage stat → two inputs (made / attempted), % auto-calculated
                                  if (madeKey && attKey) {
                                    const made = ps[madeKey] === undefined ? 0 : ps[madeKey];
                                    const att  = ps[attKey]  === undefined ? 0 : ps[attKey];
                                    const m = parseFloat(made) || 0, a = parseFloat(att) || 0;
                                    const pct = a > 0 ? Math.round((m / a) * 1000) / 10 : 0;
                                    const setMA = (field, val) => setEditStats(prev => {
                                      const cur = { ...(prev.stats[p.id] || {}), [field]: val };
                                      const mm = parseFloat(cur[madeKey]) || 0, aa = parseFloat(cur[attKey]) || 0;
                                      cur[key] = aa > 0 ? Math.round((mm / aa) * 1000) / 10 : 0;
                                      return { ...prev, stats: { ...prev.stats, [p.id]: cur } };
                                    });
                                    return (
                                      <div key={key} style={{ display: "flex", flexDirection: "column", gap: 4, padding: "4px 8px", borderRadius: 8, background: "#ffffff05", border: `1px solid ${BORDER}` }}>
                                        <span style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.05em", textAlign: "center" }}>{label} <span style={{ color: a > 0 ? ACC : T2 }}>= {pct}%</span></span>
                                        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                                            <span style={{ fontSize: 8.5, color: T2, fontWeight: 700 }}>{madeLabel}</span>
                                            <input type="number" min="0" style={{ ...inp, width: 50, padding: "6px 4px", textAlign: "center", fontSize: 14, fontWeight: 600 }}
                                              value={made} onChange={e => setMA(madeKey, e.target.value)} />
                                          </div>
                                          <span style={{ color: T2, fontSize: 13, marginTop: 12 }}>/</span>
                                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                                            <span style={{ fontSize: 8.5, color: T2, fontWeight: 700 }}>{attLabel}</span>
                                            <input type="number" min="0" style={{ ...inp, width: 50, padding: "6px 4px", textAlign: "center", fontSize: 14, fontWeight: 600 }}
                                              value={att} onChange={e => setMA(attKey, e.target.value)} />
                                          </div>
                                        </div>
                                      </div>
                                    );
                                  }
                                  return (
                                    <div key={key} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                                      <span style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.05em" }}>{label}</span>
                                      <input
                                        type="number" min="0" max={isPct ? 100 : undefined}
                                        style={{ ...inp, width: 64, padding: "6px 6px", textAlign: "center", fontSize: 14, fontWeight: 600 }}
                                        value={ps[key] === undefined ? 0 : ps[key]}
                                        onChange={e => setEditStats(prev => ({
                                          ...prev,
                                          stats: { ...prev.stats, [p.id]: { ...prev.stats[p.id], [key]: e.target.value } }
                                        }))}
                                      />
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                  {gamePlayers.length === 0 && (
                    <div style={{ textAlign: "center", color: T2, padding: 32 }}>No players found for these teams. Add players first.</div>
                  )}
                </div>

                {/* ── Inline Validation Error ── */}
                {statsValidationError && (
                  <div style={{ margin: "0 28px 0", padding: "14px 16px", borderRadius: 8, border: "1px solid #ef444455", background: "#ef44440d", flexShrink: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#ef4444", marginBottom: 8, letterSpacing: "0.05em" }}>⚠ POINTS MISMATCH — FIX OR SAVE ANYWAY</div>
                    {statsValidationError.map(({ team, entered, score, diff, suspects }) => (
                      <div key={team} style={{ marginBottom: 8 }}>
                        <div style={{ fontSize: 13, color: "#f8b4b4", fontWeight: 600 }}>
                          {team}: {entered} entered / {score} on scoreboard — {Math.abs(diff)} pts {diff > 0 ? "missing" : "over"}
                        </div>
                        {suspects.length > 0 && (
                          <div style={{ fontSize: 11, color: "#f87171", marginTop: 3, paddingLeft: 8 }}>
                            Check: {suspects.map(p => `#${p.number} ${p.name}`).join(", ")}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {/* Footer */}
                <div style={{ padding: "16px 28px 24px", borderTop: `1px solid ${BORDER}`, flexShrink: 0 }}>
                  <div className="stat-footer-btns" style={{ display: "flex", gap: 10 }}>
                    <button style={{ ...btn("#22c55e"), flex: 2, opacity: saving ? 0.6 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }} disabled={saving} onClick={() => {
                      if (!editStats || saving) return;
                      const g = editStats.game;
                      const playersWithStats = Object.entries(editStats.stats || {}).filter(([, s]) =>
                        s && Object.values(s).some(v => v && v !== '0' && v !== 0)
                      ).length;
                      editConfirm.ask({
                        actionType: 'modify', entityType: 'stats', entityLabel: `${g.home} vs ${g.away}`,
                        summary: `Tu es sur le point d'enregistrer les stats des joueurs pour ${g.home} vs ${g.away} (${g.date}). Le classement et les moyennes seront mis à jour.`,

                          { label: 'Date',                  value: g.date },

                        onConfirm: () => saveStats(false),

                    </button>

        {/* ── SAVE CONFIRMATION MODAL ── */}

                <button style={{ ...btn("#22c55e"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={confirmSave}>Confirmer</button>

              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
                {reorderCats.map((c, idx) => {
                  const editing = editCatId === c.id;
                  const commitRename = () => {
                    const v = editCatVal.trim();
                    if (v) setReorderCats(prev => prev.map(x => x.id === c.id ? { ...x, name: v, displayName: v } : x));
                    setEditCatId(null);
                  };
                  return (
                  <div key={c.id}
                    draggable={!editing}
                    onDragStart={() => { dragIdxRef.current = idx; }}
                    onDragOver={e => {
                      e.preventDefault();
                      const from = dragIdxRef.current;
                      if (from === null || from === idx) return;
                      setReorderCats(prev => {
                        const next = prev.slice();
                        const [moved] = next.splice(from, 1);
                        next.splice(idx, 0, moved);
                        dragIdxRef.current = idx;
                        return next;
                      });
                    }}
                    onDragEnd={() => { dragIdxRef.current = null; }}
                    style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 16px", background: SURF, border: `1px solid ${BORDER}`, borderRadius: 10, cursor: editing ? "default" : "grab", userSelect: "none" }}>
                    <span style={{ fontSize: 18, color: T2, cursor: editing ? "default" : "grab", opacity: editing ? 0.4 : 1 }}>☰</span>
                    <span style={{ fontSize: 12, fontWeight: 800, color: ACC, width: 22 }}>{idx + 1}</span>

                      <>
                        <input autoFocus style={{ ...inp, flex: 1, padding: "7px 10px", fontSize: 14 }} value={editCatVal}
                          onChange={e => setEditCatVal(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') setEditCatId(null); }} />
                        <button onClick={commitRename} title="Save name" style={{ background: "none", border: `1px solid #22c55e55`, borderRadius: 6, color: "#22c55e", padding: "6px 10px", fontSize: 13, cursor: "pointer" }}>✓</button>
                        <button onClick={() => setEditCatId(null)} title="Annuler" style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "6px 10px", fontSize: 13, cursor: "pointer" }}>✗</button>
                      </>

                      <>
                        <span style={{ fontSize: 14, fontWeight: 600, color: T1, flex: 1 }}>{c.name}</span>
                        <button onClick={() => { setEditCatId(c.id); setEditCatVal(c.name); }} title="Renommer" style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "6px 10px", fontSize: 12, cursor: "pointer" }}>Modifier</button>
                      </>
                    )}
                  </div>

              <div style={{ display: "flex", gap: 12 }}>

              </div>

        {/* ── ADD CATEGORY MODAL ── */}
        {showCatModal && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>

                    {["U13","U15","U18","U20","U30","U50","Open","Personnalisé"].map(ag => <option key={ag}>{ag}</option>)}

                {nCat.ageGroup === "Personnalisé" && (
                  <div>
                    <label style={lbl}>Nom personnalisé</label>

                  </div>

                <div>
                  <label style={lbl}>Genre</label>

                <div>
                  <label style={lbl}>Division</label>

                <div style={{ background: SURF, borderRadius: 8, padding: "12px 16px", fontSize: 14 }}>

                    const ageLabel   = nCat.ageGroup === "Personnalisé" ? nCat.customAge.trim() : nCat.ageGroup;
                    const displayName = nCat.gender ? `${ageLabel} ${nCat.gender}` : ageLabel;
                    addConfirm.ask({
                      actionType: 'add', entityType: 'category', entityLabel: displayName,
                      summary: `Tu es sur le point d'ajouter la catégorie "${displayName}" à cette ligue.`,
                      details: [
                        { label: "Groupe d'âge", value: ageLabel },
                        ...(nCat.gender ? [{ label: 'Genre', value: nCat.gender }] : []),
                        { label: 'Division',     value: nCat.division },
                        { label: 'Nom affiché',  value: displayName },
                      ],
                      confirmLabel: 'Oui, ajouter',
                      onConfirm: () => addCategory(),
                    });
                  }}>Ajouter la catégorie</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => { setShowCatModal(false); setNCat({ ageGroup: "U15", gender: "Masculin", division: "Or", customAge: "" }); }}>Annuler</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── DELETE CATEGORY CONFIRM ── */}
        {deleteCatId && (() => {
          const cat = (league.categories || []).find(c => c.id === deleteCatId);
          const tCount = league.teams.filter(t => t.categoryId === deleteCatId).length;
          const pCount = league.players.filter(p => p.categoryId === deleteCatId).length;
          const gCount = (league.schedule || []).filter(g => g.categoryId === deleteCatId).length;
          return (
            <ConfirmModal
              icon="⚠️"
              title={`Supprimer "${cat?.name || "cette catégorie"}" ?`}
              body={`Cela supprimera définitivement ${tCount} équipe${tCount!==1?"s":""}, ${pCount} joueur${pCount!==1?"s":""} et ${gCount} match${gCount!==1?"s":""}. Cette action est irréversible.`}
              confirmLabel="Oui, supprimer"
              onConfirm={() => deleteCategory(deleteCatId)}
              onCancel={() => setDeleteCatId(null)}
            />
          );
        })()}

        {editTeam && (
          <div className="modal-overlay" style={{ zIndex: 200 }}>

                <div>
                  <label style={lbl}>Nom de l'équipe</label>

                    const changes = [];
                    if (orig && editTeam.name.trim() !== orig.name) changes.push({ label: 'Nom', oldValue: orig.name, newValue: editTeam.name.trim() });
                    if (orig && (editTeam.emoji || '⭐') !== (orig.emoji || '⭐')) changes.push({ label: 'Emoji', oldValue: orig.emoji || '⭐', newValue: editTeam.emoji || '⭐' });
                    if (changes.length === 0) { setEditTeam(null); setEditEmojiErr(""); return; }
                    editConfirm.ask({
                      actionType: 'edit', entityType: 'team', entityLabel: orig?.name || editTeam.name,
                      summary: `Tu es sur le point de modifier l'équipe "${orig?.name || editTeam.name}".`,
                      details: changes,
                      confirmLabel: 'Oui, enregistrer',
                      onConfirm: () => saveEditTeam(),
                    });
                  }}>Enregistrer</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => { setEditTeam(null); setEditEmojiErr(""); }}>Annuler</button>
                </div>
              </div>
            </div>
          </div>

              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
                <div style={{ fontSize: 18, fontWeight: 700 }}>Alignement — {rosterTeam.name}</div>
                <button onClick={() => { setRosterTeam(null); setRosterRows([]); }} style={{ background: "none", border: "none", color: T2, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>✕</button>
              </div>

              {/* Roster table */}
              <div style={{ overflowY: "auto", overflowX: "auto", flex: 1, marginBottom: 16 }}>
                {rosterRows.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "32px 0", color: T2, fontSize: 13 }}>Aucun joueur. Clique sur « + Ajouter » pour commencer.</div>

                  <table style={{ width: "100%", minWidth: 420, borderCollapse: "collapse" }}>
                    <thead>
                      <tr style={{ fontSize: 11, color: T2 }}>
                        <th style={{ padding: "4px 6px", textAlign: "left", width: 52 }}>#</th>

                        <th style={{ padding: "4px 6px", textAlign: "left", minWidth: 90 }}>Nom *</th>

                              disabled={row._del} placeholder="#"
                              style={{ ...inp, padding: "5px 8px", width: 44, textAlign: "center", fontSize: 13, opacity: row._del ? 0.5 : 1 }}
                              onKeyDown={e => { if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); const next = document.querySelector(`[data-rr="${ri}-fn"]`); if (next) next.focus(); } }}

                          </td>
                          <td style={{ padding: "4px 6px" }}>
                            <input value={row.firstName} onChange={e => { rosterUpdateRow(row._key, 'firstName', e.target.value); if (rosterErrors[row._key]?.firstName) setRosterErrors(prev => { const n={...prev}; if(n[row._key]) { delete n[row._key].firstName; if(!Object.keys(n[row._key]).length) delete n[row._key]; } return n; }); }}
                              disabled={row._del} placeholder="Prénom" data-rr={`${ri}-fn`}
                              style={{ ...inp, padding: "5px 8px", width: "100%", fontSize: 13, borderColor: errs.firstName ? "#ef4444" : undefined, boxShadow: errs.firstName ? "0 0 0 1px #ef4444" : undefined }}
                              onKeyDown={e => { if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); const next = document.querySelector(`[data-rr="${ri}-ln"]`); if (next) next.focus(); } }}
                            />
                          </td>
                          <td style={{ padding: "4px 6px" }}>
                            <input value={row.lastName} onChange={e => { rosterUpdateRow(row._key, 'lastName', e.target.value); if (rosterErrors[row._key]?.lastName) setRosterErrors(prev => { const n={...prev}; if(n[row._key]) { delete n[row._key].lastName; if(!Object.keys(n[row._key]).length) delete n[row._key]; } return n; }); }}
                              disabled={row._del} placeholder="Nom" data-rr={`${ri}-ln`}
                              style={{ ...inp, padding: "5px 8px", width: "100%", fontSize: 13, borderColor: errs.lastName ? "#ef4444" : undefined, boxShadow: errs.lastName ? "0 0 0 1px #ef4444" : undefined }}
                              onKeyDown={e => { if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); const next = document.querySelector(`[data-rr="${ri}-pos"]`); if (next) next.focus(); } }}

                          </td>
                          <td style={{ padding: "4px 6px" }}>
                            <input value={row.position} onChange={e => rosterUpdateRow(row._key, 'position', e.target.value)}
                              disabled={row._del} placeholder="Position" data-rr={`${ri}-pos`}
                              style={{ ...inp, padding: "5px 8px", width: "100%", fontSize: 13 }}
                              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (ri === rosterRows.length - 1) rosterAddRow(); else { const next = document.querySelector(`[data-rr="${ri+1}-fn"]`); if (next) next.focus(); } } }}
                            />
                          </td>
                          <td style={{ padding: "4px 6px", textAlign: "center" }}>
                            <button onClick={() => { if (row._new) setRosterRows(rows => rows.filter(r => r._key !== row._key)); else rosterToggleDel(row._key); }}

                              {row._del ? "↩" : "✕"}

                          </td>
                        </tr>

                      })}
                    </tbody>
                  </table>

              </div>

              {/* Paste panel */}
              {rosterPasteOpen && (
                <div style={{ marginBottom: 12, background: SURF, borderRadius: 8, padding: 12, border: `1px solid ${BORDER}` }}>

                  <textarea value={rosterPasteRaw} onChange={e => setRosterPasteRaw(e.target.value)} rows={5}

                  <div style={{ fontSize: 12, color: T2, marginBottom: 10 }}>

                <button onClick={saveRoster} disabled={rosterSaving} style={{ ...btn(), minHeight: 36, opacity: rosterSaving ? 0.6 : 1 }}>

            </div>
          </div>

        {/* ── DELETE TEAM MODAL ── */}
        {delTeamTarget && (
          <div className="modal-overlay" style={{ zIndex: 200 }} onMouseDown={e => { if (e.target === e.currentTarget) { setDelTeamTarget(null); setDelTeamTyped(''); } }}>
            <div className="modal-box" style={{ width: "min(96vw, 440px)", ...card, padding: 28 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>Supprimer l'équipe</div>

                    <>
                      <div style={{ fontSize: 14, color: "#ef4444", marginBottom: 16, lineHeight: 1.5 }}>

                  <>
                    <div style={{ fontSize: 13, color: T2, marginBottom: 16, lineHeight: 1.6 }}>

                        <input type="checkbox" checked={delTeamDeletePlayers} onChange={e => setDelTeamDeletePlayers(e.target.checked)} />

                      <label style={lbl}>Saisis le nom de l'équipe pour confirmer</label>

                      <button onClick={() => { setDelTeamTarget(null); setDelTeamTyped(''); }} style={{ ...btn("#252540"), flex: 1 }}>Annuler</button>
                    </div>
                  </>

            </div>
          </div>

        {/* ── FEATURE 2: EDIT PLAYER MODAL ── */}
        {editPlayer && (
          <div className="modal-overlay" style={{ zIndex: 200 }}>
            <div className="modal-box" style={{ width: 460, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Modifier le joueur</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <label style={lbl}>Nom complet</label>
                  <input style={inp} value={editPlayer.name} onChange={e => setEditPlayer({ ...editPlayer, name: e.target.value })} placeholder="Nom du joueur" />
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <div style={{ flex: 0.5, minWidth: 72 }}>
                    <label style={lbl}>Numéro</label>
                    <input style={inp} value={editPlayer.number} onChange={e => setEditPlayer({ ...editPlayer, number: e.target.value })} placeholder="#" />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>Position</label>
                    <input style={inp} value={editPlayer.position} onChange={e => setEditPlayer({ ...editPlayer, position: e.target.value })} placeholder={sport === "Hockey" ? "Centre / Gardien" : "Meneur / Ailier"} />
                  </div>
                </div>
                <div>
                  <label style={lbl}>Équipe</label>
                  <select style={inp} value={editPlayer.team} onChange={e => setEditPlayer({ ...editPlayer, team: e.target.value })}>
                    {catTeams.map(t => <option key={t.id}>{t.name}</option>)}
                  </select>
                  <div style={{ fontSize: 11, color: T2, marginTop: 4 }}>Les stats sont préservées — l'ID du joueur reste le même.</div>
                </div>
                <div>
                  <label style={lbl}>Courriel <span style={{color:T2,fontWeight:400}}>(optionnel)</span></label>
                  <input style={inp} type="email" value={editPlayer.email||""} onChange={e=>setEditPlayer({...editPlayer,email:e.target.value})} placeholder="joueur@email.com" />
                </div>
                <div>
                  <label style={lbl}>Taille &amp; Poids <span style={{color:T2,fontWeight:400}}>(optionnel)</span></label>
                  <div style={{ display: "flex", gap: 10 }}>
                    {(league.units||'imperial') === 'imperial' ? (<>
                      <input style={{ ...inp, flex: 1 }} type="number" min="0" max="8" value={editPlayer.heightFt||""} onChange={e=>setEditPlayer({...editPlayer,heightFt:e.target.value})} placeholder="Ft" />
                      <input style={{ ...inp, flex: 1 }} type="number" min="0" max="11" value={editPlayer.heightIn||""} onChange={e=>setEditPlayer({...editPlayer,heightIn:e.target.value})} placeholder="In" />
                    </>) : (
                      <input style={{ ...inp, flex: 1 }} type="number" min="0" value={editPlayer.heightCm||""} onChange={e=>setEditPlayer({...editPlayer,heightCm:e.target.value})} placeholder="Height (cm)" />
                    )}
                    <input style={{ ...inp, flex: 1 }} type="number" min="0" value={editPlayer.weight||""} onChange={e=>setEditPlayer({...editPlayer,weight:e.target.value})} placeholder={(league.units||'imperial')==='metric'?'Weight (kg)':'Weight (lbs)'} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={() => {
                    if (!editPlayer) return;
                    const orig = league.players.find(p => p.id === editPlayer.id);
                    const changes = [];
                    const _units = league.units || 'imperial';
                    if (orig && editPlayer.name.trim() !== orig.name) changes.push({ label: 'Nom', oldValue: orig.name, newValue: editPlayer.name.trim() });
                    if (orig && editPlayer.team !== orig.team) changes.push({ label: 'Équipe', oldValue: orig.team || '—', newValue: editPlayer.team || '—' });
                    if (orig && String(editPlayer.number || '') !== String(orig.number || '')) changes.push({ label: 'Numéro', oldValue: orig.number || '—', newValue: editPlayer.number || '—' });
                    if (orig && (editPlayer.position || '') !== (orig.position || '')) changes.push({ label: 'Position', oldValue: orig.position || '—', newValue: editPlayer.position || '—' });
                    if (orig && (editPlayer.email || '') !== (orig.email || '')) changes.push({ label: 'Courriel', oldValue: orig.email || '—', newValue: editPlayer.email || '—' });
                    const newH = _units==='metric' ? (editPlayer.heightCm?parseInt(editPlayer.heightCm)||0:0) : ((editPlayer.heightFt||editPlayer.heightIn)?parseInt(editPlayer.heightFt||0)*12+parseInt(editPlayer.heightIn||0):0);
                    const newW = editPlayer.weight ? parseInt(editPlayer.weight)||0 : 0;
                    if (orig && newH !== (orig.height||0)) changes.push({ label: 'Taille', oldValue: formatHeight(orig.height, _units)||'—', newValue: formatHeight(newH, _units)||'—' });
                    if (orig && newW !== (orig.weight||0)) changes.push({ label: 'Poids', oldValue: formatWeight(orig.weight, _units)||'—', newValue: formatWeight(newW, _units)||'—' });
                    if (changes.length === 0) { setEditPlayer(null); return; }
                    editConfirm.ask({
                      actionType: 'edit', entityType: 'player', entityLabel: orig?.name || editPlayer.name,
                      summary: `Tu es sur le point de modifier le joueur "${orig?.name || editPlayer.name}".`,
                      details: changes,
                      confirmLabel: 'Oui, enregistrer',
                      onConfirm: () => saveEditPlayer(),
                    });
                  }}>Enregistrer</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditPlayer(null)}>Annuler</button>
                </div>
              </div>
            </div>
          </div>
        )}


        {/* ── RESET SEASON CONFIRM ── */}
        {showResetConfirm && (
          <ConfirmModal
            icon="🔄"
            title={`Démarrer la saison ${((league.season||{}).number||1)+1} ?`}
            body="Cela réinitialisera les RP de TOUS les joueurs à 0 et effacera tous les accomplissements de jalons. Les stats de saison sont préservées mais exclues des calculs RP. Cette action est irréversible."
            confirmLabel="Oui, réinitialiser"
            onConfirm={() => { resetSeasonRankings(); setShowResetConfirm(false); }}
            onCancel={() => setShowResetConfirm(false)}
          />
        )}

        {/* ── MISSING SCORE MODAL (shown once per day on login) ── */}
        {showMissingModal && (() => {
          const awaiting = (league.schedule || []).filter(g => isGameAwaiting(g)).sort((a,b) => daysAgo(b) - daysAgo(a));
          if (!awaiting.length) { setShowMissingModal(false); return null; }
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350, padding: 20 }}>
              <div style={{ width: 460, ...card, padding: 32 }}>
                <div style={{ marginBottom: 12, color: "#f59e0b", display: "flex", justifyContent: "center" }}><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
                <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 6 }}>
                  {awaiting.length} match{awaiting.length !== 1 ? "s" : ""} sans score
                </div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 20, lineHeight: 1.6 }}>
                  Les joueurs et les fans attendent les résultats. Entre les scores pour mettre à jour le classement et envoyer les notifications.
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24, maxHeight: 200, overflowY: "auto" }}>
                  {awaiting.map(g => {
                    const ago = daysAgo(g);
                    return (
                      <div key={g.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 12px", background: SURF, borderRadius: 8, border: "1px solid #ef444430" }}>
                        <span style={{ fontSize: 13, fontWeight: 600 }}>{g.home} vs {g.away}</span>
                        <span style={{ fontSize: 11, color: ago >= 2 ? "#ef4444" : "#f59e0b", fontWeight: 600 }}>
                          {ago === 0 ? "Aujourd'hui" : ago === 1 ? "Hier" : `Il y a ${ago} jours`}
                        </span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={{ ...btn("#ef4444"), flex: 2 }} onClick={() => { setShowMissingModal(false); handleTabSwitch("schedule"); }}>
                    Entrer les scores →
                  </button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setShowMissingModal(false)}>
                    Me le rappeler
                  </button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ── UNSAVED CHANGES MODAL ── */}
        {pendingNavTab && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350 }}>
            <div style={{ width: 420, ...card, padding: 36, textAlign: "center" }}>
              <div style={{ marginBottom: 16, color: "#f59e0b", display: "flex", justifyContent: "center" }}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
              <div style={{ fontSize: 19, fontWeight: 800, marginBottom: 10 }}>Modifications non sauvegardées</div>
              <div style={{ fontSize: 14, color: T2, marginBottom: 28, lineHeight: 1.6 }}>Tu as des modifications non sauvegardées. Quitter sans sauvegarder effacera toutes les modifications sur cet onglet.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <button style={{ ...btn("#252540"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={() => setPendingNavTab(null)}>Rester</button>
                <button style={{ ...btn("#ef4444"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={leaveWithoutSaving}>Quitter sans sauvegarder</button>
              </div>
            </div>
          </div>
        )}

      {/* DELETE CONFIRM — single ActionConfirmModal for all delete actions */}
      <ActionConfirmModal {...deleteConfirm.modalProps} />
      {/* ADD CONFIRM — single ActionConfirmModal for all add actions */}
      <ActionConfirmModal {...addConfirm.modalProps} />
      {/* EDIT CONFIRM — single ActionConfirmModal for all edit/save actions */}
      <ActionConfirmModal {...editConfirm.modalProps} />

      {/* ── TOAST STACK ── */}
      {toasts.length > 0 && (
        <div className="toast-stack">
          {toasts.map(t => (
            <div key={t.id} className={`toast-item toast-${t.type}`}>
              <span style={{ flex: 1 }}>{t.msg}</span>
              <button className="toast-close" onClick={() => dismissToast(t.id)}>✕</button>
            </div>
          ))}
        </div>
      )}

      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
