                                    <button onClick={() => { setManageOwnerId(l.id); setResetPwForm({ userId: null, password: "", confirm: "" }); setOwnerError(""); }}
                                      style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 11, cursor: "pointer" }}>
                                      Manage
                                    </button>
                                  )}
                                </>
                              )}
                              <button onClick={() => { setSelId(l.id); setPage("league"); setTab("teams"); }}
                                style={{ ...btn(), padding: "5px 14px", fontSize: 12, whiteSpace: "nowrap" }}>
                                Enter League →
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}
      </div>

      {/* ── ASSIGN OWNER MODAL ── */}
      {ownerModal && (() => {
        const lg = leagues.find(l => l.id === ownerModal);
        return (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
            <div style={{ width: 460, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Assign Owner Account</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 20 }}>{lg?.name}</div>
              <div style={{ fontSize: 12, color: "#22c55e", background: "#22c55e12", border: "1px solid #22c55e30", borderRadius: 8, padding: "10px 14px", marginBottom: 20, lineHeight: 1.6 }}>
                🔒 Passwords are hashed with SHA-256 before storage — plaintext is never saved.
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div><label style={lbl}>Email</label><input style={inp} value={newOwner.email} onChange={e=>setNewOwner({...newOwner,email:e.target.value})} placeholder="owner@example.com" autoComplete="off" /></div>
                <div><label style={lbl}>Password</label><input type="password" style={inp} value={newOwner.password} onChange={e=>setNewOwner({...newOwner,password:e.target.value})} placeholder="Choose a password" autoComplete="new-password" /></div>
                <div><label style={lbl}>Confirm Password</label><input type="password" style={inp} value={newOwner.confirm} onChange={e=>setNewOwner({...newOwner,confirm:e.target.value})} onKeyDown={e=>e.key==="Enter"&&createOwner()} placeholder="Repeat password" autoComplete="new-password" /></div>
                {ownerError && <div style={{ color: "#ef4444", fontSize: 13 }}>{ownerError}</div>}
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={createOwner}>Create Account</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => { setOwnerModal(null); setOwnerError(""); }}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── CREDENTIALS CARD ── */}
      {createdCreds && (
        <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
          <div style={{ width: 460, ...card, padding: 32 }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>🎉</div>
              <div style={{ fontSize: 18, fontWeight: 800 }}>Owner Account Created</div>
              <div style={{ fontSize: 13, color: T2, marginTop: 6 }}>Share these credentials with the league owner. Screenshot or copy them now — the password will not be shown again.</div>
            </div>
            <div style={{ background: SURF, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "20px 22px", marginBottom: 20, fontFamily: "monospace", fontSize: 13 }}>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 4 }}>LOGIN URL</div>
                <div style={{ color: T1, wordBreak: "break-all" }}>{window.location.href}</div>
              </div>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 4 }}>EMAIL</div>
                <div style={{ color: T1, fontWeight: 700 }}>{createdCreds.email}</div>
              </div>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 4 }}>PASSWORD</div>
                <div style={{ color: ACC, fontWeight: 800, fontSize: 15 }}>{createdCreds.password}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: T2, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 4 }}>LEAGUE</div>
                <div style={{ color: T1 }}>{createdCreds.leagueName}</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => {
                const txt = `Login: ${window.location.href}\nEmail: ${createdCreds.email}\nPassword: ${createdCreds.password}\nLeague: ${createdCreds.leagueName}`;
                navigator.clipboard.writeText(txt).then(() => showToast("Credentials copied!")).catch(() => showToast("Copy failed."));
              }}>📋 Copy All</button>
              <button style={{ ...btn(), flex: 1 }} onClick={() => setCreatedCreds(null)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ── MANAGE OWNERS MODAL ── */}
      {manageOwnerId && (() => {
        const lg = leagues.find(l => l.id === manageOwnerId);
        const ownersForLeague = users.filter(u => u.leagueId === manageOwnerId && u.role === "owner");
        return (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
            <div style={{ width: 480, ...card, padding: 32, maxHeight: "80vh", overflowY: "auto" }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Manage Owners</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 24 }}>{lg?.name}</div>
              {ownersForLeague.length === 0 && <div style={{ color: T2, fontSize: 14, marginBottom: 20 }}>No owners assigned yet.</div>}
              {ownersForLeague.map(owner => (
                <div key={owner.id} style={{ background: SURF, borderRadius: 10, padding: "16px 18px", marginBottom: 14 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{owner.email}</div>
                      <div style={{ fontSize: 11, color: T2, marginTop: 3 }}>Created {owner.createdAt} · ID {owner.id}</div>
                    </div>
                    <button onClick={() => setDeleteOwnerId(owner.id)}
                      style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Delete</button>
                  </div>
                  {resetPwForm.userId === owner.id ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <input type="password" style={{ ...inp, fontSize: 13 }} value={resetPwForm.password} onChange={e=>setResetPwForm({...resetPwForm,password:e.target.value})} placeholder="New password" autoComplete="new-password" />
                      <input type="password" style={{ ...inp, fontSize: 13 }} value={resetPwForm.confirm} onChange={e=>setResetPwForm({...resetPwForm,confirm:e.target.value})} placeholder="Confirm new password" autoComplete="new-password" />
                      {ownerError && <div style={{ color: "#ef4444", fontSize: 12 }}>{ownerError}</div>}
                      <div style={{ display: "flex", gap: 8 }}>
                        <button style={{ ...btn(), flex: 1, padding: "8px 14px", fontSize: 13 }} onClick={resetOwnerPassword}>Save</button>
                        <button style={{ ...btn("#252540"), flex: 1, padding: "8px 14px", fontSize: 13 }} onClick={() => { setResetPwForm({ userId: null, password: "", confirm: "" }); setOwnerError(""); }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => { setResetPwForm({ userId: owner.id, password: "", confirm: "" }); setOwnerError(""); }}
                      style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>
                      🔑 Reset Password
                    </button>
                  )}
                </div>
              ))}
              <button style={{ ...btn("#252540"), width: "100%", marginTop: 8 }} onClick={() => { setManageOwnerId(null); setResetPwForm({ userId: null, password: "", confirm: "" }); setOwnerError(""); }}>Close</button>
            </div>
          </div>
        );
      })()}

      {/* ── DELETE OWNER CONFIRM ── */}
      {deleteOwnerId && (
        <ConfirmModal icon="🗑️" title="Delete Owner Account?" body={`This will permanently remove the login credentials for ${users.find(u=>u.id===deleteOwnerId)?.email}. The league data is unaffected.`} confirmLabel="Yes, Delete Account" onConfirm={() => deleteOwner(deleteOwnerId)} onCancel={() => setDeleteOwnerId(null)} />
      )}

      {showAdd && (
        <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ width: 460, ...card, padding: 32 }}>
            <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Add New League</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div><label style={lbl}>League Name</label><input style={inp} value={nL.name} onChange={e => setNL({...nL,name:e.target.value})} placeholder="e.g. Hockey Summer League" /></div>
              <div><label style={lbl}>Sport</label>
                <select style={inp} value={nL.sport} onChange={e => setNL({...nL,sport:e.target.value})}>
                  {["Basketball","Hockey","Soccer","Baseball","Other"].map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
              <div><label style={lbl}>Public Domain</label><input style={inp} value={nL.domain} onChange={e => setNL({...nL,domain:e.target.value})} placeholder="e.g. hockeyleague.com" /></div>
              <div><label style={lbl}>League Color</label>
                <input type="color" value={nL.color} onChange={e => setNL({...nL,color:e.target.value})} style={{ height: 44, width: "100%", borderRadius: 8, border: `1px solid ${BORDER}`, background: SURF, cursor: "pointer", padding: 4 }} />
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                <button style={{ ...btn(), flex: 1 }} onClick={addLeague}>Create League</button>
                <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setShowAdd(false)}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── TOAST STACK ── */}
      {toasts.length > 0 && (
        <div className="toast-stack">
          {toasts.map(t => (
            <div key={t.id} className={`toast-item toast-${t.type}`}>
              <span style={{ flex: 1 }}>{t.msg}</span>
              <button className="toast-close" onClick={() => dismissToast(t.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  // ── LEAGUE — show spinner while Firestore data is still in flight ──
  if (page === "league" && !league) {
    return (
      <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 900, color: ACC, letterSpacing: "-1px", marginBottom: 20 }}>WEBSITE X</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
            <span className="spinner spinner-dark" style={{ width: 18, height: 18 }} />
            <span style={{ fontSize: 14, color: T2 }}>Loading league data…</span>
          </div>
        </div>
      </div>
    );
  }

  if (page === "league" && league) {
    const toggles = getToggles(league);
    const sport = league.sport;
    const TABS = [["teams","🏟 Teams"],["players","👤 Players"],["schedule","📅 Schedule"],["scores","🏆 Scores"],["stats","📊 Stats"],["settings","⚙️ Settings"]];

    // ── CATEGORY FILTERING ──
    const activeCat = (league.categories || []).find(c => c.id === activeCatId);
    const catTeams   = activeCatId ? league.teams.filter(t => t.categoryId === activeCatId)      : league.teams;
    const catPlayers = activeCatId ? league.players.filter(p => p.categoryId === activeCatId)    : league.players;
    const catSchedule = activeCatId ? (league.schedule || []).filter(g => g.categoryId === activeCatId) : (league.schedule || []);

    // ── Dynamic past/upcoming split (computed at render time, never trust stored `played` flag) ──
    // liveRefreshTick is consumed here so re-renders happen every 60s for live detection
    void liveRefreshTick;
    const upcomingGames = catSchedule
      .filter(g => !isGamePast(g))
      .sort((a, b) => {
        // Today's games first, then future ascending
        const aToday = isGameToday(a) ? 0 : 1;
        const bToday = isGameToday(b) ? 0 : 1;
        if (aToday !== bToday) return aToday - bToday;
        const da = getGameDateTime(a) || new Date((a.date || "9999") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "9999") + "T00:00");
        return da - db;
      });
    const pastGames = catSchedule
      .filter(g => isGamePast(g))
      .sort((a, b) => {
        // Sort: LIVE first, then AWAITING SCORE (most overdue first), then FINAL (most recent first)
        const statusOrder = g => isGameLive(g, sport) ? 0 : isGameAwaiting(g) ? 1 : 2;
        const oa = statusOrder(a), ob = statusOrder(b);
        if (oa !== ob) return oa - ob;
        if (oa === 1) return daysAgo(b) - daysAgo(a); // most overdue first for awaiting
        const da = getGameDateTime(a) || new Date((a.date || "0") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "0") + "T00:00");
        return db - da; // most recent first for finals
      });
    const gamesWithScore = pastGames.filter(g => g.homeScore !== undefined && g.awayScore !== undefined);
    const needsScore     = catSchedule.filter(g => g.homeScore === undefined || g.awayScore === undefined);
    // Backward-compat aliases used by stats calculations below
    const unplayed = upcomingGames;
    const played   = gamesWithScore;

    const standings = catTeams.map(t => {
      const hg = gamesWithScore.filter(g => g.home===t.name), ag = gamesWithScore.filter(g => g.away===t.name);
      const wins = hg.filter(g=>parseInt(g.homeScore)>parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)>parseInt(g.homeScore)).length;
      const losses = hg.filter(g=>parseInt(g.homeScore)<parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)<parseInt(g.homeScore)).length;
      return { name: t.name, emoji: t.emoji, gp: wins+losses, wins, losses };
    }).sort((a,b) => b.wins-a.wins);

    // ── COMPUTE TOTALS ──
    let skaterTotals=[], goalieTotals=[], bballTotals=[];
    if (sport === "Hockey") {
      skaterTotals = catPlayers.filter(p => !isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const goals = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goals||0),0);
        const assists = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        return { ...p, gp: gs.length, goals, assists, points: goals+assists };
      }).sort((a,b) => b.points-a.points || b.goals-a.goals);

      goalieTotals = catPlayers.filter(p => isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const saves = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.saves||0),0);
        const goalsAgainst = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goalsAgainst||0),0);
        const cleanSheets = gs.filter(g=>(g.playerStats[p.id]?.goalsAgainst||0)===0).length;
        const gaa = gs.length>0 ? goalsAgainst/gs.length : null;
        return { ...p, gp: gs.length, saves, goalsAgainst, cleanSheets, gaa };
      }).sort((a,b) => (a.gaa??99)-(b.gaa??99));
    }
    if (sport === "Basketball") {
      bballTotals = catPlayers.map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const points  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.points||0),0);
        const assists  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        const rebounds = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.rebounds||0),0);
        const blocks   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.blocks||0),0);
        const steals   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.steals||0),0);
        return { ...p, gp: gs.length, points, assists, rebounds, blocks, steals };
      }).sort((a,b) => b.points-a.points || b.assists-a.assists);
    }

    // player stat entry helpers
    function getGamePlayers(g) { return catPlayers.filter(p => p.team===g.home||p.team===g.away); }

    return (
      <div style={{ minHeight: "100vh", background: BG, color: T1 }}>

        {/* HEADER */}
        <div style={{ background: CARD, borderBottom: `1px solid ${BORDER}`, padding: "0 32px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 60 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {user?.role==="superadmin" && <button onClick={handleBack} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>← Back</button>}
            <div style={{ width: 1, height: 24, background: BORDER }} />
            <div style={{ fontSize: 18, fontWeight: 900, color: ACC }}>WEBSITE X</div>
            <div style={{ fontSize: 14, color: T2 }}>/ {league.name}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {lastSaved && !dirty && (
              <span style={{ fontSize: 11, color: "#22c55e", display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#22c55e", display: "inline-block" }} />
                Saved {lastSaved}
              </span>
            )}
            <span style={{ fontSize: 12, padding: "4px 10px", background: user?.role==="superadmin"?ACC+"20":"#6366f120", borderRadius: 6, fontWeight: 600, color: user?.role==="superadmin"?ACC:"#818cf8" }}>
              {user?.role==="superadmin"?"Super Admin":"League Owner"}
            </span>
            <button onClick={handleLogout} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>Logout</button>
          </div>
        </div>

        {/* 👁 SUPERADMIN VIEWING BANNER */}
        {user?.role === "superadmin" && (
          <div style={{ background: ACC+"18", borderBottom: `1px solid ${ACC}40`, padding: "8px 32px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 13, color: ACC, fontWeight: 600 }}>
              👁 Viewing: <strong>{league.name}</strong>
            </span>
            <button onClick={handleBack}
              style={{ background: "none", border: `1px solid ${ACC}50`, borderRadius: 6, color: ACC, padding: "4px 14px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}>
              ← Back to Dashboard
            </button>
          </div>
        )}

        {/* ── MISSING SCORE ALERT BANNER ── */}
        {(() => {
          const awaiting = (league.schedule || []).filter(g => isGameAwaiting(g));
          if (!awaiting.length) return null;
          const urgent = awaiting.filter(g => daysAgo(g) >= 2);
          return (
            <div style={{ background: urgent.length ? "#ef444418" : "#f59e0b18", borderBottom: `1px solid ${urgent.length ? "#ef444440" : "#f59e0b40"}`, padding: "10px 32px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: urgent.length ? "#ef4444" : "#f59e0b", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ animation: "livepulse-admin 1.4s ease-in-out infinite", display: "inline-block" }}>⚠️</span>
                {awaiting.length} game{awaiting.length !== 1 ? "s" : ""} missing score{urgent.length ? ` — ${urgent.length} overdue 48h+` : ""}
              </span>
              <button onClick={() => { handleTabSwitch("schedule"); setShowMissingModal(false); }}
                style={{ background: urgent.length ? "#ef4444" : "#f59e0b", border: "none", borderRadius: 7, color: "#fff", padding: "6px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                Enter Scores →
              </button>
            </div>
          );
        })()}

        {/* ── CATEGORY BAR ── */}
        {(league.categories || []).length > 0 && (() => {
          const cats = league.categories;
          return (
            <div style={{ background: BG, borderBottom: `1px solid ${BORDER}` }}>
              {/* Mobile: dropdown */}
              <div className="cat-select-row">
                <select style={{ ...inp, width: "100%" }} value={activeCatId || ""} onChange={e => setActiveCatId(e.target.value)}>
                  {cats.map(c => <option key={c.id} value={c.id}>{c.displayName || c.name}</option>)}
                </select>
              </div>
              {/* Desktop: tab row */}
              <div className="cat-tabs-row" style={{ paddingLeft: 24 }}>
                {cats.map(c => (
                  <button key={c.id} onClick={() => setActiveCatId(c.id)}
                    style={{ background: "none", border: "none", padding: "11px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", color: activeCatId===c.id ? ACC : T2, borderBottom: activeCatId===c.id ? `2px solid ${ACC}` : "2px solid transparent", transition: "all 0.15s" }}>
                    {c.displayName || c.name}
                  </button>
                ))}
                <button onClick={() => setShowCatModal(true)}
                  style={{ background: "none", border: "none", padding: "11px 18px", fontSize: 13, cursor: "pointer", color: T2, opacity: 0.55, whiteSpace: "nowrap" }}>
                  + Add Category
                </button>
                <div style={{ flex: 1 }} />
                {activeCatId && cats.length > 1 && (
                  <button onClick={() => setDeleteCatId(activeCatId)}
                    style={{ background: "none", border: "none", padding: "11px 16px", fontSize: 12, cursor: "pointer", color: "#ef444488", whiteSpace: "nowrap" }}>
                    🗑 Delete
                  </button>
                )}
              </div>
            </div>
          );
        })()}

        {/* TAB BAR */}
        <div style={{ background: SURF, borderBottom: `1px solid ${BORDER}`, paddingLeft: 32, display: "flex", overflowX: "auto" }}>
          {TABS.map(([t,label]) => (
            <button key={t} onClick={() => handleTabSwitch(t)} style={{ background: "none", border: "none", padding: "16px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", color: tab===t?ACC:T2, borderBottom: tab===t?`2px solid ${ACC}`:"2px solid transparent" }}>{label}</button>
          ))}
        </div>

        <div style={{ maxWidth: 860, margin: "0 auto", padding: "36px 24px" }}>

          {/* ── MIGRATION WARNING ── */}
          {league._migrated && (
            <div style={{ background: "#f59e0b15", border: "1px solid #f59e0b50", borderRadius: 8, padding: "10px 16px", marginBottom: 20, fontSize: 13, color: "#f59e0b", lineHeight: 1.6 }}>
              ⚠️ <strong>Categories auto-assigned.</strong> Teams, players, and games have been placed in a <strong>General</strong> category. Click <strong>Save Changes</strong> to persist this to Firestore.
            </div>
          )}

          {/* ── TEAMS ── */}
          {tab==="teams" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>

                  </div>
                  {(league.categories || []).length > 1 && (
                    <select style={{ ...inp, flex: 1, minWidth: 140 }} value={nT.categoryId || activeCatId || ""} onChange={e=>setNT({...nT,categoryId:e.target.value})}>

                  <button style={btn()} onClick={() => {
                    if (!nT.name || !nT.name.trim()) return;
                    const catId = nT.categoryId || activeCatId || (league.categories?.[0]?.id) || null;
                    const catName = (league.categories || []).find(c => c.id === catId)?.displayName || (league.categories || []).find(c => c.id === catId)?.name || '—';
                    addConfirm.ask({
                      actionType: 'add', entityType: 'team', entityLabel: nT.name.trim(),
                      summary: `You are about to add team "${nT.name.trim()}"${catName !== '—' ? ` to category "${catName}"` : ''}.`,
                      details: [
                        { label: 'Team Name', value: nT.name.trim() },
                        { label: 'Emoji',     value: nT.emoji || '⭐' },
                        ...(catName !== '—' ? [{ label: 'Category', value: catName }] : []),
                      ],
                      confirmLabel: 'Yes, Add Team',
                      onConfirm: () => addTeam(),
                    });
                  }}>Add Team</button>
                </div>
              </div>
              {catTeams.length===0 ? (
                <div style={{ textAlign: "center", padding: "56px 24px" }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>🏟️</div>
                  <div style={{ fontWeight: 700, fontSize: 16, color: T1, marginBottom: 6 }}>No teams yet</div>
                  <div style={{ fontSize: 13, color: T2 }}>Add your first team above ☝️</div>
                </div>
              ) :
                catTeams.map(t => (
                  <div key={t.id} style={{ ...card, display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      {/* Team logo or emoji */}
                      {t.logoUrl
                        ? <img src={t.logoUrl} alt="logo" style={{ width: 44, height: 44, borderRadius: 8, objectFit: "cover", border: `1px solid ${BORDER}` }} />
                        : <span style={{ fontSize: 28 }}>{t.emoji}</span>
                      }
                      <div>
                        <div style={{ fontWeight: 700 }}>{t.name}</div>
                        <div style={{ fontSize: 12, color: T2 }}>{catPlayers.filter(p=>p.team===t.name).length} players</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {/* Upload Logo button */}
                      {_storage && (
                        <label style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: uploadingId === `team_${t.id}` ? "not-allowed" : "pointer", opacity: uploadingId === `team_${t.id}` ? 0.6 : 1, whiteSpace: "nowrap" }}>
                          {uploadingId === `team_${t.id}` ? "Uploading…" : (t.logoUrl ? "🖼 Change Logo" : "📷 Upload Logo")}
                          <input type="file" accept="image/png,image/jpeg,image/webp" style={{ display: "none" }} disabled={!!uploadingId} onChange={e => { const f = e.target.files?.[0]; if (f) uploadTeamLogo(t.id, f); e.target.value = ""; }} />
                        </label>
                      )}
                      {/* FEATURE 2: Edit team */}
                      <button onClick={() => { setEditTeam({ id: t.id, name: t.name, emoji: t.emoji }); setEditEmojiErr(""); }} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: "pointer" }} title="Edit team">✏️</button>
                      <button onClick={() => deleteConfirm.ask({
                          actionType: 'delete', entityType: 'team', entityLabel: t.name,
                          summary: `You are about to permanently delete team "${t.name}". All players assigned to it and all games involving it will also be removed. This cannot be undone.`,
                          details: [
                            { label: 'Team',             value: t.name },
                            { label: 'Players to remove', value: String(league.players.filter(p => p.team === t.name || String(p.teamId) === String(t.id)).length) },
                            { label: 'Games to remove',   value: String(league.schedule.filter(g => g.home === t.name || g.away === t.name).length) },
                          ],
                          requiresTypedConfirm: true, confirmWord: 'DELETE',
                          confirmLabel: 'Yes, Delete Team', dangerStyle: true,
                          onConfirm: () => delTeam(t.id),
                        })} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                    </div>
                  </div>
                ))
              }
            </div>
          )}

          {/* ── PLAYERS ── */}
          {tab==="players" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Players {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add New Player</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nP.name} onChange={e=>setNP({...nP,name:e.target.value})} placeholder="Full name" />
                  <input style={{ ...inp, flex: 0.5, minWidth: 64 }} value={nP.number} onChange={e=>setNP({...nP,number:e.target.value})} placeholder="#" />
                  <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.position} onChange={e=>setNP({...nP,position:e.target.value})} placeholder={sport==="Hockey"?"Center / Goalie":"Guard / Forward"} />
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nP.team} onChange={e=>setNP({...nP,team:e.target.value})}>
                    <option value="">Select team</option>
                    {catTeams.map(t => <option key={t.id}>{t.name}</option>)}
                  </select>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} type="email" value={nP.email||""} onChange={e=>setNP({...nP,email:e.target.value})} placeholder="player@email.com (optional)" />
                  <button style={btn()} onClick={() => {
                    if (!nP.name || !nP.name.trim() || !nP.team) return;
                    addConfirm.ask({
                      actionType: 'add', entityType: 'player', entityLabel: nP.name.trim(),
                      summary: `You are about to add player "${nP.name.trim()}" to team "${nP.team}".`,
                      details: [
                        { label: 'Name',     value: nP.name.trim() },
                        { label: 'Team',     value: nP.team },
                        ...(nP.number   ? [{ label: 'Jersey #',  value: nP.number }]   : []),
                        ...(nP.position ? [{ label: 'Position',  value: nP.position }] : []),
                        ...(nP.email    ? [{ label: 'Email',     value: nP.email }]    : []),
                      ],
                      confirmLabel: 'Yes, Add Player',
                      onConfirm: () => addPlayer(),
                    });
                  }}>Add Player</button>
                </div>
                {sport==="Hockey" && <div style={{ fontSize: 12, color: T2, marginTop: 10 }}>💡 Set position to <strong style={{ color: T1 }}>Goalie</strong> to track saves &amp; goals against separately.</div>}
                {catTeams.length === 0 && <div style={{ fontSize: 12, color: "#f59e0b", marginTop: 10 }}>⚠️ Add a team in this category first before adding players.</div>}
              </div>
              {catPlayers.length===0 ? (
                <div style={{ textAlign: "center", padding: "56px 24px" }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>👤</div>
                  <div style={{ fontWeight: 700, fontSize: 16, color: T1, marginBottom: 6 }}>No players yet</div>
                  <div style={{ fontSize: 13, color: T2 }}>Add your first player above ☝️</div>
                </div>
              ) :
                catTeams.map(t => {
                  const tp = catPlayers.filter(p => p.team===t.name);
                  if (!tp.length) return null;
                  return (
                    <div key={t.id} style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                        {t.logoUrl
                          ? <img src={t.logoUrl} alt="logo" style={{ width: 20, height: 20, borderRadius: 4, objectFit: "cover" }} />
                          : <span>{t.emoji}</span>
                        }
                        {t.name}
                      </div>
                      {tp.map(p => {
                        const ss = getPlayerSeasonStats(p, catSchedule, sport);
                        return (
                          <div key={p.id} style={{ ...card, marginBottom: 8 }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                                {/* Player photo or jersey number box */}
                                {p.photoUrl
                                  ? <img src={p.photoUrl} alt={p.name} style={{ width: 40, height: 40, borderRadius: "50%", objectFit: "cover", border: `2px solid ${BORDER}` }} />
                                  : <div style={{ width: 40, height: 40, borderRadius: 8, background: "#23233a", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: ACC }}>#{p.number}</div>
                                }
                                <div>
                                  <div style={{ fontWeight: 600, display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                                    {p.name}
                                    {(() => {
                                      const rp = calcPlayerRP(p, catSchedule, league);
                                      const lbl2 = calcPlayerLabel(p, catPlayers, catSchedule, league);
                                      const tier2 = getTier(rp);
                                      if (!lbl2 || tier2.id === 'bronze') return null;
                                      return <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: tier2.color, background: tier2.color+'18', border: `1px solid ${tier2.color}40`, borderRadius: 100, padding: '2px 7px' }}>{lbl2.label}</span>;
                                    })()}
                                  </div>
                                  <div style={{ fontSize: 12, color: T2 }}>#{p.number} · {p.position}{isGoalie(p)?" 🥅":""}</div>
                                </div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                {_storage && (
                                  <label style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: uploadingId === `player_${p.id}` ? "not-allowed" : "pointer", opacity: uploadingId === `player_${p.id}` ? 0.6 : 1, whiteSpace: "nowrap" }}>
                                    {uploadingId === `player_${p.id}` ? "Uploading…" : (p.photoUrl ? "📷 Change Photo" : "📷 Photo")}
                                    <input type="file" accept="image/png,image/jpeg,image/webp" style={{ display: "none" }} disabled={!!uploadingId} onChange={e => { const f = e.target.files?.[0]; if (f) uploadPlayerPhoto(p.id, f); e.target.value = ""; }} />
                                  </label>
                                )}
                                {/* FEATURE 2: Edit player */}
                                <button onClick={() => setEditPlayer({ id: p.id, name: p.name, number: p.number || "", position: p.position || "", team: p.team || "", email: p.email || "" })} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 10px", fontSize: 12, cursor: "pointer" }} title="Edit player">✏️</button>
                                {/* FEATURE 5: Warn before delete if stats exist */}
                                <button onClick={() => handleDeletePlayer(p.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                              </div>
                            </div>
                            {ss.gamesPlayed > 0 && (
                              <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${BORDER}`, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center" }}>
                                <span style={{ fontSize: 12, color: T2 }}>GP: <strong style={{ color: T1 }}>{ss.gamesPlayed}</strong></span>
                                {ss.statDef.filter(({ key }) => toggles[key] !== false).map(({ key, avg, isPct }) => (
                                  ss.averages[key] !== null && (
                                    <span key={key} style={{ fontSize: 12, color: T2 }}>{avg}: <strong style={{ color: ACC }}>{ss.averages[key]}{isPct ? "%" : ""}</strong></span>
                                  )
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })
              }
            </div>
          )}

          {/* ── SCHEDULE ── */}
          {tab==="schedule" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Schedule {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              {(() => {
                // Per-league venue suggestions (deduplicated, sorted)
                const venueOptions = [...new Set(
                  (league.schedule || []).map(g => g.venue).filter(Boolean)
                )].sort();
                // Past-date detection for inline notice
                const nGDateTime = nG.date
                  ? new Date(nG.time ? `${nG.date}T${nG.time}` : `${nG.date}T00:00`)
                  : null;
                const nGIsInPast = nGDateTime && nGDateTime < new Date();
                return (
                  <div style={{ ...card, marginBottom: 24 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add Game</div>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                      <input type="date" style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.date} onChange={e=>setNG({...nG,date:e.target.value})} />
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.home} onChange={e=>setNG({...nG,home:e.target.value})}>
                        <option value="">Home team</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.away} onChange={e=>setNG({...nG,away:e.target.value})}>
                        <option value="">Away team</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <input type="time" style={{ ...inp, flex: 1, minWidth: 100 }} value={nG.time} onChange={e=>setNG({...nG,time:e.target.value})} />
                      <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nG.venue} onChange={e=>setNG({...nG,venue:e.target.value})} placeholder="Venue / Arena" />
                      <button style={{ ...btn(), opacity: saving ? 0.6 : 1 }} disabled={saving} onClick={() => {
                        if (!nG.date || !nG.home || !nG.away || saving) return;
                        if (nG.home === nG.away) return;
                        addConfirm.ask({
                          actionType: 'add', entityType: 'game', entityLabel: `${nG.home} vs ${nG.away}`,
                          summary: `You are about to schedule a game between "${nG.home}" and "${nG.away}" on ${nG.date}.`,
                          details: [
                            { label: 'Date',      value: nG.date },
                            { label: 'Home team', value: nG.home },
                            { label: 'Away team', value: nG.away },
                            ...(nG.time  ? [{ label: 'Time',  value: nG.time }]  : []),
                            ...(nG.venue ? [{ label: 'Venue', value: nG.venue }] : []),
                          ],
                          confirmLabel: 'Yes, Add Game',
                          onConfirm: () => addGame(),
                        });
                      }}>{saving ? "Saving…" : "Add Game"}</button>
                    </div>
                    {venueOptions.length > 0 && (
                      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: T2, marginRight: 2 }}>Venues:</span>
                        {venueOptions.map(v => (
                          <button key={v} type="button" onClick={() => setNG({...nG, venue: v})}
                            style={{ fontSize: 11, padding: "3px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${nG.venue === v ? ACC : BORDER}`, background: nG.venue === v ? ACC + "22" : "none", color: nG.venue === v ? ACC : T2, fontWeight: nG.venue === v ? 700 : 400, transition: "all 0.1s" }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {nG.date && nG.time && (
                      <div style={{ marginTop: 10, fontSize: 12, color: nGIsInPast ? "#f97316" : T2, display: "flex", alignItems: "center", gap: 6 }}>
                        {nGIsInPast
                          ? "ⓘ This game is in the past — it will go to Past Games. You can enter the score after."
                          : "ⓘ This game will be scheduled as upcoming."}
                      </div>
                    )}
                  </div>
                );
              })()}
              {catSchedule.length===0 ? (
                <div style={{ textAlign: "center", padding: "56px 24px" }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>📅</div>
                  <div style={{ fontWeight: 700, fontSize: 16, color: T1, marginBottom: 6 }}>No games scheduled yet</div>
                  <div style={{ fontSize: 13, color: T2 }}>Add a game above ☝️</div>
                </div>
              ) : (
                <div>
                  {/* ── UPCOMING ── sorted ascending */}
                  {upcomingGames.length > 0 && (
                    <>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10 }}>Upcoming</div>
                      {upcomingGames.map(g => {
                        const status = getGameStatus(g, sport);
                        const isToday = isGameToday(g);
                        return (
                          <div key={g.id} style={{ ...card, marginBottom: 8, borderColor: isToday ? "#f97316aa" : BORDER }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                              <div>
                                <div style={{ fontWeight: 700 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                                <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{g.date}{g.time ? " · " + formatTime12h(g.time) : ""}{g.venue ? " · " + g.venue : ""}</div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                {status === "TODAY"
                                  ? <span style={{ fontSize: 12, color: "#f97316", padding: "4px 12px", background: "#f9731620", borderRadius: 6, fontWeight: 700, border: "1px solid #f9731640" }}>📅 Today</span>
                                  : <span style={{ fontSize: 12, color: "#6b7280", padding: "4px 12px", background: "#6b728015", borderRadius: 6, fontWeight: 600 }}>Upcoming</span>
                                }
                                <button onClick={() => setEditGame({...g})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Edit</button>
                                <button onClick={() => deleteConfirm.ask({
                                    actionType: 'delete', entityType: 'game', entityLabel: `${g.home} vs ${g.away}`,
                                    summary: `You are about to permanently delete this game. This cannot be undone.`,
                                    details: [
                                      { label: 'Matchup', value: `${g.home} vs ${g.away}` },
                                      { label: 'Date',    value: g.date || '—' },
                                      { label: 'Stats entered', value: g.playerStats && Object.keys(g.playerStats).length > 0 ? 'Yes' : 'No' },
                                    ],
                                    requiresTypedConfirm: true, confirmWord: 'DELETE',
                                    confirmLabel: 'Yes, Delete Game', dangerStyle: true,
                                    onConfirm: () => deleteGame(g.id),
                                  })} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Delete</button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </>
                  )}

                  {/* ── PAST GAMES ── sorted: LIVE → AWAITING SCORE → FINAL */}
                  {pastGames.length > 0 && (
                    <>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, margin: upcomingGames.length > 0 ? "20px 0 10px" : "0 0 10px" }}>Past Games</div>
                      {pastGames.map(g => {
                        const hasScore = g.homeScore !== undefined && g.awayScore !== undefined;
                        const hw       = hasScore && parseInt(g.homeScore) > parseInt(g.awayScore);
                        const live     = isGameLive(g, sport);
                        const awaiting = isGameAwaiting(g);
                        const status   = getGameStatus(g, sport);
                        const ago      = daysAgo(g);
                        const cardClass = live ? "game-card-live" : awaiting ? "game-card-awaiting" : undefined;
                        const cardBorder = live ? `1px solid #22c55e50` : awaiting ? `1px solid #ef444455` : `1px solid ${BORDER}`;
                        return (
                          <div key={g.id} className={cardClass} style={{ ...card, marginBottom: 8, border: cardBorder }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                              <div>
                                <div style={{ fontWeight: 700, display: "flex", alignItems: "center", gap: 8 }}>
                                  {g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}
                                  {live && (
                                    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, color: "#22c55e", padding: "2px 8px", background: "#22c55e18", borderRadius: 20, border: "1px solid #22c55e40" }}>
                                      <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#22c55e", display: "inline-block", animation: "livepulse-admin 1.4s ease-in-out infinite" }} />
                                      LIVE
                                    </span>
                                  )}
                                </div>
                                <div style={{ fontSize: 12, color: awaiting ? "#f59e0b" : T2, marginTop: 3 }}>
                                  {g.date}{g.time ? " · " + formatTime12h(g.time) : ""}{g.venue ? " · " + g.venue : ""}
                                  {awaiting && ago > 0 && <span style={{ color: ago >= 2 ? "#ef4444" : "#f59e0b", fontWeight: 600, marginLeft: 8 }}>— {ago === 1 ? "Yesterday" : `${ago} days ago`} — score missing</span>}
                                </div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                {hasScore && (
                                  <span style={{ fontWeight: 800, fontSize: 18, color: "#22c55e" }}>{g.homeScore} – {g.awayScore}</span>
                                )}
                                {status === "FINAL"         && <span style={{ fontSize: 12, color: "#22c55e", padding: "4px 12px", background: "#22c55e15", borderRadius: 6, fontWeight: 600 }}>Final</span>}
                                {status === "LIVE"          && null /* LIVE badge already shown inline */}
                                {status === "SCORE NEEDED"  && <span style={{ fontSize: 12, color: "#ef4444", padding: "4px 12px", background: "#ef444420", borderRadius: 6, fontWeight: 700, border: "1px solid #ef444440", animation: "livepulse-admin 1.8s ease-in-out infinite" }}>⚠️ Score Needed</span>}

                                    <button onClick={() => {
                                      const stats = {};
                                      gamePlayers.forEach(p => {
                                        const existing = (g.playerStats || {})[p.id] || {};

                                        const defaults = {};
                                        def.forEach(({ key }) => { defaults[key] = 0; });

                                      setEditStats({ game: g, stats });

                              </div>
                            </div>
                            {hasScore && <BoxScore game={g} players={league.players} sport={sport} toggles={toggles} />}

                    </>
                  )}
                </div>

          )}

          {tab==="scores" && (

              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>

                  <div>

                          <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.home} Score</label><input type="number" min="0" style={inp} value={nS.homeScore} onChange={e=>setNS({...nS,homeScore:e.target.value})} placeholder="0" /></div>
                          <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.away} Score</label><input type="number" min="0" style={inp} value={nS.awayScore} onChange={e=>setNS({...nS,awayScore:e.target.value})} placeholder="0" /></div>
                        </>);

                          {skaters.length > 0 && (

                              <div style={{ display: "flex", gap: 8, fontSize: 11, color: T2, fontWeight: 700, padding: "0 4px", marginBottom: 6 }}>

                              </div>
                              {[g.home, g.away].map(tn => {
                                const tp = skaters.filter(p => p.team===tn);
                                if (!tp.length) return null;
                                return (
                                  <div key={tn} style={{ marginBottom: 12 }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 6, paddingLeft: 4 }}>{tn}</div>

                                      return (
                                        <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>

                                          <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.assists} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],assists:e.target.value}}))} placeholder="0" />

                            </div>

                                        <tr key={p.id}>

                                          ))}
                                        </tr>

                                    })
                                  ];
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>

                    })()}

                    return (
                      <div key={g.id} style={{ ...card, marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>

                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <span style={{ fontWeight: 800, fontSize: 20, color: hw?"#22c55e":T2 }}>{g.homeScore}</span>
                            <span style={{ color: T2 }}>–</span>
                            <span style={{ fontWeight: 800, fontSize: 20, color: !hw?"#22c55e":T2 }}>{g.awayScore}</span>
                            <button onClick={() => setEditScore({id:g.id,homeScore:g.homeScore,awayScore:g.awayScore})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Edit</button>
                            <button onClick={() => deleteConfirm.ask({
                                actionType: 'delete', entityType: 'score', entityLabel: `${g.home} vs ${g.away}`,
                                summary: `You are about to reset this game result. The score and all player stats will be cleared and the game returns to Upcoming status. This cannot be undone.`,
                                details: [
                                  { label: 'Game',       value: `${g.home} vs ${g.away}` },

                          </div>
                        </div>
                        <BoxScore game={g} players={league.players} sport={sport} toggles={toggles} />
                      </div>

                  {standings.length>0 && (

                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                          <thead><tr style={{ borderBottom: `1px solid ${BORDER}` }}>{["#","Team","GP","W","L","PTS"].map(h=><th key={h} style={{ padding: "8px 12px", textAlign: h==="Team"?"left":"center", color: T2, fontSize: 12, fontWeight: 600 }}>{h}</th>)}</tr></thead>

                                <td style={{ padding: 12, textAlign: "center", color: T2 }}>{t.gp}</td>
                                <td style={{ padding: 12, textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{t.wins}</td>

                                <td style={{ padding: 12, textAlign: "center", fontWeight: 800, color: ACC }}>{t.wins*2}</td>
                              </tr>

                          </tbody>
                        </table>
                      </div>
                    </div>

                </div>

                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>

                          <th key={h} style={{ textAlign: "left", padding: "8px 12px", fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.05em", borderBottom: `1px solid ${BORDER}` }}>{h}</th>

                        .map((p, i) => {
                          const tier = getTier(p.rp);
                          const next = getNextTier(p.rp);
                          const pct  = next ? Math.min(100, Math.round(((p.rp - tier.minRP)/(next.minRP - tier.minRP))*100)) : 100;

                            <tr key={p.id} style={{ borderBottom: `1px solid ${BORDER}` }}>
                              <td style={{ padding: "10px 12px", fontWeight: 700, color: T2, width: 36 }}>{i+1}</td>

                                <div className="rp-bar-bg" style={{ width: 120 }}>
                                  <div className="rp-bar-fill" style={{ width: `${pct}%`, background: tier.color }} />

                                <div style={{ fontSize: 10, color: T2 }}>{p.rp} RP{next ? ` · ${next.minRP - p.rp} to ${next.label}` : ' · MAX'}</div>

                              <td style={{ padding: "10px 12px" }}>

                              </td>
                              <td style={{ padding: "10px 12px", fontWeight: 800, color: tier.color }}>{p.rp}</td>
                              <td style={{ padding: "10px 12px", color: T2 }}>{p.gp}</td>
                            </tr>
                          );
                        })
                      }
                      {catPlayers.length === 0 && (

                      <label style={lbl}>Reason</label>
                      <input style={inp} value={rpAdjReason} onChange={e => setRpAdjReason(e.target.value)} placeholder="e.g. MVP bonus" />
                    </div>
                    <button style={{ ...btn(), padding: "10px 16px", fontSize: 13, flexShrink: 0 }}
                      onClick={() => { applyRpAdjustment(rpAdjPlayer, rpAdjAmount, rpAdjReason); setRpAdjPlayer(""); setRpAdjAmount(""); setRpAdjReason(""); }}>
                      Apply
                    </button>
                  </div>
                </div>
              </div>

              {sport==="Hockey" && (
                <div>

                      {toggles.assists   && <LeaderCard title="Assists Leader" icon="🍎" data={skaterTotals}  statKey="assists"     color="#38bdf8" />}
                      {toggles.points    && <LeaderCard title="Points Leader"  icon="⭐" data={skaterTotals}  statKey="points"      color={ACC} />}
                      {toggles.goalieStats && goalieTotals.length>0 && (
                        <LeaderCard title="Clean Sheets" icon="🥅" data={goalieTotals} statKey="cleanSheets" color="#a78bfa" />
                      )}
                      {toggles.goalieStats && goalieTotals.filter(g=>g.gp>0).length>0 && (
                        <LeaderCard title="Best GAA" icon="🛡️" data={goalieTotals.filter(g=>g.gp>0)} statKey="gaa" color="#38bdf8" lowerBetter={true} fmtFn={p=>p.gaa!==null?p.gaa.toFixed(2):"—"} />
                      )}

                  {skaterTotals.length>0 && (

              <div style={{ ...card, background: SURF }}>

                  Toggling a stat <strong style={{ color: "#ef4444" }}>OFF</strong> hides it everywhere — stats entry form, player cards, leader boards, and the public site. Historical data is never deleted. Toggle back <strong style={{ color: "#22c55e" }}>ON</strong> anytime to restore it.<br/>

                {(() => {

                    ? league.players.length - stripOrphanedPlayers(league.teams, league.players).length

              {/* ── STORAGE SIZE MONITOR ── */}
              {(() => {

                const isRed    = gameCount >= 900;

              {/* ── FEATURE 1: PLAYER AWARDS ── */}
              {sport === "Basketball" && (() => {
                const awards = league.awards || {};
                const MODES = ["manual", "auto"];

                function calcAutoPlayer(period) {
                  const now = new Date();
                  let startDate;
                  if (period === "week") {
                    const day = now.getDay();
                    const diff = day === 0 ? -6 : 1 - day;
                    startDate = new Date(now); startDate.setDate(now.getDate() + diff); startDate.setHours(0,0,0,0);
                  } else {
                    startDate = new Date(now.getFullYear(), now.getMonth(), 1);
                  }
                  const periodGames = (league.schedule || []).filter(g => {
                    if (g.homeScore === undefined || !g.playerStats) return false;
                    const gDate = new Date((g.date || "") + "T12:00:00");
                    return gDate >= startDate && gDate <= now && g.playerStats;
                  });
                  if (!periodGames.length) return null;
                  let best = null, bestPPG = -1;
                  for (const p of catPlayers) {
                    const pg = periodGames.filter(g => g.playerStats && (g.playerStats[p.id] !== undefined || g.playerStats[String(p.id)] !== undefined));
                    if (!pg.length) continue;
                    const pts = pg.reduce((s, g) => s + parseInt((g.playerStats[p.id] || g.playerStats[String(p.id)])?.points || 0), 0);
                    const ppg = pts / pg.length;
                    if (ppg > bestPPG) { bestPPG = ppg; best = p; }
                  }
                  return best;
                }

                function AwardCard({ awardKey, label, icon }) {
                  const current = awards[awardKey] || { playerId: null, mode: "manual" };
                  const mode = current.mode || "manual";
                  const autoPlayer = mode === "auto" ? calcAutoPlayer(awardKey === "playerOfWeek" ? "week" : "month") : null;
                  const displayPlayerId = mode === "auto" ? (autoPlayer?.id ?? null) : current.playerId;
                  const displayPlayer = displayPlayerId ? catPlayers.find(p => String(p.id) === String(displayPlayerId)) : null;

                  function setAward(playerId) {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, playerId, setAt: Date.now() } } };
                    writeLeagueNow(updated); setDirty(false);
                    if (emailConfig && playerId) {
                      const awardedPlayer = league.players.find(p => String(p.id) === String(playerId));
                      if (awardedPlayer) {
                        sendPotwNotification(_db, _FS, league, awardedPlayer, emailConfig)
                          .then(count => { if(count>0) showToast(`POTW notification sent to ${count} subscriber${count!==1?'s':''}`, 'info'); })
                          .catch(()=>{});
                      }
                    }
                  }
                  function clearAward() {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, playerId: null } } };
                    writeLeagueNow(updated); setDirty(false);
                  }
                  function setMode(m) {
                    const updated = { ...league, awards: { ...awards, [awardKey]: { ...current, mode: m } } };
                    writeLeagueNow(updated); setDirty(false);
                  }

                  return (
                    <div style={{ ...card, marginBottom: 14 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                        <div style={{ fontSize: 14, fontWeight: 700 }}>{icon} {label}</div>
                        <div style={{ display: "flex", gap: 6 }}>
                          {MODES.map(m => (
                            <button key={m} onClick={() => setMode(m)} style={{ fontSize: 11, padding: "4px 10px", borderRadius: 6, border: `1px solid ${mode===m?ACC:BORDER}`, background: mode===m?ACC+"22":"none", color: mode===m?ACC:T2, cursor: "pointer", fontWeight: mode===m?700:400, textTransform: "capitalize" }}>{m}</button>
                          ))}
                        </div>
                      </div>
                      {mode === "auto" ? (
                        <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>
                          Auto-selects the player with the highest PPG this {awardKey === "playerOfWeek" ? "week" : "month"}.
                          {autoPlayer
                            ? <span style={{ marginLeft: 8, color: "#f59e0b", fontWeight: 700 }}>→ {autoPlayer.name} ({autoPlayer.team})</span>
                            : <span style={{ marginLeft: 8, color: T2 }}>→ No qualifying games yet</span>}
                        </div>
                      ) : (
                        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                          <select style={{ ...inp, flex: 1, minWidth: 160 }} value={current.playerId || ""} onChange={e => setAward(e.target.value ? parseInt(e.target.value) || e.target.value : null)}>
                            <option value="">— Select player —</option>
                            {catPlayers.map(p => <option key={p.id} value={p.id}>#{p.number} {p.name} ({p.team})</option>)}
                          </select>
                          {current.playerId && <button onClick={clearAward} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Clear</button>}
                        </div>
                      )}
                      {displayPlayer && (
                        <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: "#f59e0b10", border: "1px solid #f59e0b40", borderRadius: 8 }}>
                          {displayPlayer.photoUrl
                            ? <img src={displayPlayer.photoUrl} alt={displayPlayer.name} style={{ width: 36, height: 36, borderRadius: "50%", objectFit: "cover", border: "2px solid #f59e0b" }} />
                            : <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#f59e0b22", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: "#f59e0b", fontSize: 13 }}>#{displayPlayer.number}</div>
                          }
                          <div>
                            <div style={{ fontWeight: 700, color: "#f59e0b" }}>{displayPlayer.name}</div>
                            <div style={{ fontSize: 11, color: T2 }}>{displayPlayer.team}</div>
                          </div>
                          <span style={{ marginLeft: "auto", fontSize: 22 }}>🏆</span>
                        </div>
                      )}
                    </div>
                  );

              <div style={{ ...card, background: "#1a0a0a", border: "1px solid #7f1d1d", marginTop: 20 }}>

                      { label: 'League',  value: league.name },
                      { label: 'Teams',   value: String((league.teams || []).length) },

                </button>
              </div>

              {/* CONNECTION STATUS */}
              {(() => {
                const hb = localStorage.getItem("wxLeagues_pubHeartbeat");
                const lastUpdated = localStorage.getItem("wxLeagues_updated");
                let hbColor = T2, hbLabel = "No heartbeat", hbDesc = "Public site heartbeat not detected.";
                if (hb) {
                  const diff = Date.now() - parseInt(hb);
                  if (diff < 5*60000)  { hbColor="#22c55e"; hbLabel="Active";   hbDesc=`Public site active ${Math.round(diff/1000)}s ago`; }
                  else if (diff < 60*60000) { hbColor="#f59e0b"; hbLabel="Idle"; hbDesc=`Public site last seen ${Math.round(diff/60000)}m ago`; }
                  else                 { hbColor="#ef4444"; hbLabel="Stale";  hbDesc=`Public site last seen ${Math.round(diff/3600000)}h ago`; }
                }
                const fbColor = __fbReady ? "#22c55e" : __fbUncfg ? "#ef4444" : "#f59e0b";
                const fbLabel = __fbReady ? "Firebase Connected" : __fbUncfg ? "Firebase Not Configured" : "Firebase Offline";
                const devRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true; // DEV ONLY — open access
    }
  }
}`;
                const prodRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Public sites can read leagues
    match /leagues/{leagueId} {
      allow read: if true;
      allow write: if false; // write via admin SDK or auth
    }
    // meta/sync readable by public sites
    match /meta/{doc} {
      allow read: if true;
      allow write: if false;
    }
    // Users only readable/writable server-side
    match /users/{userId} {
      allow read, write: if false;
    }
  }
}`;
                return (
                  <div style={{ ...card, marginTop: 20 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>Firebase / Public Site Connection</div>

                    {/* Firebase status */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, padding: "12px 16px", background: SURF, borderRadius: 8 }}>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: fbColor, boxShadow: `0 0 6px ${fbColor}`, flexShrink: 0 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: fbColor }}>{fbLabel}</div>
                        {__fbUncfg && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Replace REPLACE_ME values in the Firebase module script at the top of index.html</div>}
                        {__fbReady && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Firestore doc: <code style={{ color: T1 }}>leagues/{String(selId)}</code></div>}
                        {fbError && <div style={{ fontSize: 11, color: "#f59e0b", marginTop: 2 }}>{fbError}</div>}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: hbColor }} />
                        <div style={{ fontSize: 11, color: hbColor }}>{hbLabel}</div>
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
                      <button onClick={copyPublicSnippet} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>📋 Copy Public Site Snippet</button>
                      <button onClick={forceSync} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>⚡ Force Sync</button>
                    </div>
                    {lastUpdated && <div style={{ fontSize: 11, color: T2, marginTop: -14, marginBottom: 16 }}>Last sync: {new Date(parseInt(lastUpdated)).toLocaleTimeString()}</div>}

                    {/* Setup guide */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 12 }}>
                      <button onClick={() => setShowConnGuide(v => !v)} style={{ background: "none", border: "none", color: ACC, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
                        {showConnGuide ? "▾" : "▸"} Firebase Setup Guide
                      </button>
                      {showConnGuide && (
                        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                          {[
                            ["1. Create a Firebase project", "Go to console.firebase.google.com → Add project. Give it a name (e.g. league-hunter)."],
                            ["2. Enable Firestore", "In the Firebase console → Build → Firestore Database → Create database → Start in test mode."],
                            ["3. Get your config", "Project Settings → Your apps → Add app (Web) → Copy the firebaseConfig object."],
                            ["4. Paste config into index.html", `Find the Firebase module script near the top of index.html and replace all six REPLACE_ME values with your real config values.`],
                            ["5. Connect your public site", `In Website X → Settings → Connection, click 📋 Copy Public Site Snippet. Paste it into the <head> of your public HTML file (basketball-public.html or any custom site). It auto-fills your Firebase config and this league's ID (${selId}).`],
                            ["6. Deploy security rules", "In Firebase console → Firestore → Rules, paste the production rules shown below. This lets public sites read league data while keeping writes server-side."],
                          ].map(([title, body]) => (
                            <div key={title} style={{ background: SURF, borderRadius: 8, padding: "12px 14px" }}>
                              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{title}</div>
                              <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>{body}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Security rules */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 12 }}>FIRESTORE SECURITY RULES</div>
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#f59e0b", marginBottom: 6 }}>Dev rules (open access — for testing only):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{devRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(devRules).then(()=>showToast("Dev rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Dev Rules</button>
                      </div>
                      <div>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#22c55e", marginBottom: 6 }}>Production rules (read-only for public, no user data exposed):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{prodRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(prodRules).then(()=>showToast("Prod rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Prod Rules</button>
                      </div>
                    </div>
                  </div>
                );

            </div>

              <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#f59e0b", boxShadow: "0 0 6px #f59e0b", flexShrink: 0 }} />

                    const ev = [...new Set((league.schedule || []).map(g => g.venue).filter(Boolean))].sort();
                    return ev.length > 0 ? (
                      <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>

                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditGame(null)}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
          );
        })()}


        {editScore && (() => {
          const g = league.schedule.find(x => x.id===editScore.id);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
              <div style={{ width: 400, ...card, padding: 32 }}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Edit Score</div>
