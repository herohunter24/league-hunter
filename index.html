// ── MIGRATION: Ensure league has categories array ──
function migrateLeagueIfNeeded(league) {
  if (!league) return league;
  const hasCats = league.categories && league.categories.length > 0;
  if (hasCats) {
    // Already has categories — just backfill any missing categoryIds
    const firstCat = league.categories[0];
    let changed = false;
    const teams    = (league.teams    || []).map(t => t.categoryId ? t : (changed=true, { ...t, categoryId: firstCat.id }));
    const players  = (league.players  || []).map(p => p.categoryId ? p : (changed=true, { ...p, categoryId: firstCat.id }));
    const schedule = (league.schedule || []).map(g => g.categoryId ? g : (changed=true, { ...g, categoryId: firstCat.id }));
    return changed ? { ...league, teams, players, schedule, _migrated: true } : league;
  }
  // No categories at all — create a "General" category and assign everything to it
  const genCat = { id: "cat_" + String(league.id) + "_gen", name: "General", gender: "", displayName: "General" };
  return {
    ...league,
    categories: [genCat],
    teams:    (league.teams    || []).map(t => ({ ...t, categoryId: genCat.id })),
    players:  (league.players  || []).map(p => ({ ...p, categoryId: genCat.id })),
    schedule: (league.schedule || []).map(g => ({ ...g, categoryId: genCat.id })),
    honours:  league.honours || {},
    _migrated: true,
  };
}

// ── TIME FORMAT HELPERS ──
// Converts stored 24h "HH:MM" → display "H:MM AM/PM".
// Pass-through if value already contains AM/PM (legacy data).
function formatTime12h(t) {
  if (!t) return "";
  if (/AM|PM/i.test(t)) return t;               // legacy format — already 12h
  const parts = t.split(":");
  if (parts.length < 2) return t;
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return t;
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
// Converts legacy "H:MM AM/PM" → "HH:MM" so <input type="time"> works with old data.
// Pass-through if already in HH:MM 24h format.
function parseTimeTo24h(t) {
  if (!t) return "";
  if (/^\d{1,2}:\d{2}$/.test(t)) return t.length === 4 ? "0" + t : t; // already 24h
  const m = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return "";
  let h = parseInt(m[1], 10);
  const min = m[2], period = m[3].toUpperCase();
  if (period === "AM" && h === 12) h = 0;
  if (period === "PM" && h !== 12) h += 12;
  return `${String(h).padStart(2, "0")}:${min}`;
}

function getGameDateTime(game) {
  if (!game.date || !game.time) return null;
  return new Date(`${game.date}T${game.time}`);
}
function isGamePast(game) {
  const dt = getGameDateTime(game);
  if (dt) return dt < new Date();
  if (game.date) return new Date(game.date + "T23:59") < new Date();
  return false;
}

function isGoalie(p) {
  const pos = (p.position || "").toLowerCase().trim();
  return pos === "goalie" || pos === "g" || pos === "gk" || pos === "goalkeeper" || pos === "goaltender";
}

function fmtAvg(val, gp) {
  if (!gp || gp === 0) return "—";
  return (val / gp).toFixed(2);
}

function getDefaultToggles(sport) {
  if (sport === "Hockey")     return { goals: true, assists: true, points: true, goalieStats: true };
  if (sport === "Basketball") return { points: true, assists: true, rebounds: true, blocks: true, steals: true };
  return { goals: true, assists: true, points: true };
}

function getToggles(league) {

// ── SPORT STAT DEFINITIONS ──
// Each entry: { key (storage key), label (short col header), avg (per-game label) }
const SPORT_STATS = {
  Basketball: [
    { key: "points",   label: "PTS", avg: "PPG" },
    { key: "rebounds", label: "REB", avg: "RPG" },
    { key: "assists",  label: "AST", avg: "APG" },
    { key: "steals",   label: "STL", avg: "SPG" },
    { key: "blocks",   label: "BLK", avg: "BPG" },
  ],
  Hockey: [
    { key: "goals",   label: "G",  avg: "GPG" },
    { key: "assists", label: "A",  avg: "APG" },
  ],
  HockeyGoalie: [
    { key: "saves",        label: "SV",  avg: "SVG" },
    { key: "goalsAgainst", label: "GA",  avg: "GAG" },
  ],
};
function getSportStats(sport, player) {
  if (sport === "Hockey" && isGoalie(player)) return SPORT_STATS.HockeyGoalie || [];
  return SPORT_STATS[sport] || [{ key: "goals", label: "G", avg: "GPG" }, { key: "assists", label: "A", avg: "APG" }];
}

// Compute season totals + averages for one player across a given schedule slice
function getPlayerSeasonStats(player, schedule, sport) {
  const statDef = getSportStats(sport, player);
  const playedGames = schedule.filter(g =>
    isGamePast(g) && g.playerStats && g.playerStats[player.id] !== undefined
  );
  const totals = {}, averages = {};
  statDef.forEach(({ key }) => {
    const vals = playedGames.map(g => parseFloat(g.playerStats[player.id]?.[key]) || 0);
    totals[key] = vals.reduce((a, b) => a + b, 0);
    averages[key] = vals.length > 0 ? (totals[key] / vals.length).toFixed(1) : null;
  });
  return { gamesPlayed: playedGames.length, totals, averages, statDef };
}

function initNPS(players, sport) {
  const s = {};
  players.forEach(p => {
    if (sport === "Hockey") {
      s[p.id] = isGoalie(p) ? { saves: "", goalsAgainst: "" } : { goals: "", assists: "" };
    } else if (sport === "Basketball") {
      s[p.id] = { points: "", assists: "", rebounds: "", blocks: "", steals: "" };
    } else {
      s[p.id] = { goals: "", assists: "" };
    }
  });
  return s;
}

function LeaderCard({ title, icon, data, statKey, color, lowerBetter, fmtFn }) {
  const sorted = [...data].filter(p => p[statKey] !== undefined && p[statKey] !== null && p.gp > 0)
    .sort((a, b) => lowerBetter ? (a[statKey] - b[statKey]) : (b[statKey] - a[statKey]));
  const top = sorted.slice(0, 3);
  if (!top.length) return null;
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div style={{ ...card, minWidth: 200, flex: "1 1 200px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 14 }}>{icon} {title.toUpperCase()}</div>
      {top.map((p, i) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: i < top.length - 1 ? 10 : 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, minWidth: 20 }}>{medals[i]}</span>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: T2 }}>{p.team}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: i === 0 ? color : T1 }}>
              {fmtFn ? fmtFn(p) : p[statKey]}
            </div>
            {p.gp > 0 && !lowerBetter && !fmtFn && (
              <div style={{ fontSize: 10, color: T2 }}>{fmtAvg(p[statKey], p.gp)}/g</div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── BOX SCORE ──
function BoxScore({ game, players, sport }) {
  if (!game.playerStats) return null;

  if (sport === "Basketball") {
    const active = players.filter(p => {
      const ps = game.playerStats[p.id];
      return ps && (ps.points > 0 || ps.assists > 0 || ps.rebounds > 0 || ps.blocks > 0 || ps.steals > 0);
    });
    if (!active.length) return null;
    return (
      <div style={{ marginTop: 14, borderTop: `1px solid ${BORDER}`, paddingTop: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 8 }}>BOX SCORE</div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr>
                {["Player","Team","PTS","AST","REB","BLK","STL"].map(h => (
                  <th key={h} style={{ textAlign: h==="Player"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 6px" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {active.map(p => {
                const ps = game.playerStats[p.id];
                return (
                  <tr key={p.id}>
                    <td style={{ padding: "4px 6px", fontWeight: 600 }}>{p.name}</td>
                    <td style={{ padding: "4px 6px", color: T2 }}>{p.team}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: ACC, fontWeight: 700 }}>{ps.points||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#38bdf8", fontWeight: 700 }}>{ps.assists||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{ps.rebounds||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#a78bfa", fontWeight: 700 }}>{ps.blocks||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#f472b6", fontWeight: 700 }}>{ps.steals||0}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // Hockey (default)
  const skaters = players.filter(p => !isGoalie(p) && game.playerStats[p.id] && (game.playerStats[p.id].goals > 0 || game.playerStats[p.id].assists > 0));
  const goalies = players.filter(p => isGoalie(p) && game.playerStats[p.id]);
  if (!skaters.length && !goalies.length) return null;
  return (
    <div style={{ marginTop: 14, borderTop: `1px solid ${BORDER}`, paddingTop: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 8 }}>BOX SCORE</div>
      {skaters.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: goalies.length ? 10 : 0 }}>
          <thead>
            <tr>
              {["Player","Team","G","A","PTS"].map(h => (
                <th key={h} style={{ textAlign: h==="Player"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 8px" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {skaters.map(p => {
              const ps = game.playerStats[p.id];
              const g = ps.goals||0, a = ps.assists||0;
              return (
                <tr key={p.id}>
                  <td style={{ padding: "4px 8px", fontWeight: 600 }}>{p.name}</td>
                  <td style={{ padding: "4px 8px", color: T2, fontSize: 12 }}>{p.team}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{g}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#38bdf8", fontWeight: 700 }}>{a}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", fontWeight: 800, color: ACC }}>{g+a}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
      {goalies.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr>
              {["Goalie","Team","SV","GA"].map(h => (
                <th key={h} style={{ textAlign: h==="Goalie"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 8px" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {goalies.map(p => {
              const ps = game.playerStats[p.id];
              return (
                <tr key={p.id}>
                  <td style={{ padding: "4px 8px", fontWeight: 600 }}>{p.name}</td>
                  <td style={{ padding: "4px 8px", color: T2, fontSize: 12 }}>{p.team}</td>

                </tr>
              );
            })}
          </tbody>
        </table>
      )}

  );
}

  }

      ? league.schedule.filter(g => g.home !== teamToDelete.name && g.away !== teamToDelete.name)
      : league.schedule;

    const updHonours  = { ...(league.honours || {}) };
    delete updHonours[catId];
    const updated = { ...league, categories: updCategories, teams: updTeams, players: updPlayers, schedule: updSchedule, honours: updHonours };

      {/* ── CREDENTIALS CARD ── */}

  // ── LEAGUE ──
  if (page === "league" && league) {
    const toggles = getToggles(league);

    const TABS = [["teams","🏟 Teams"],["players","👤 Players"],["schedule","📅 Schedule"],["scores","🏆 Scores"],["stats","📊 Stats"],["settings","⚙️ Settings"]];

    // ── CATEGORY FILTERING ──
    const activeCat = (league.categories || []).find(c => c.id === activeCatId);
    const catTeams   = activeCatId ? league.teams.filter(t => t.categoryId === activeCatId)      : league.teams;
    const catPlayers = activeCatId ? league.players.filter(p => p.categoryId === activeCatId)    : league.players;
    const catSchedule = activeCatId ? (league.schedule || []).filter(g => g.categoryId === activeCatId) : (league.schedule || []);

    // ── Dynamic past/upcoming split (computed at render time, never trust stored `played` flag) ──
    const upcomingGames = catSchedule
      .filter(g => !isGamePast(g))
      .sort((a, b) => {
        const da = getGameDateTime(a) || new Date((a.date || "9999") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "9999") + "T00:00");
        return da - db;
      });
    const pastGames = catSchedule
      .filter(g => isGamePast(g))
      .sort((a, b) => {
        const da = getGameDateTime(a) || new Date((a.date || "0") + "T00:00");
        const db = getGameDateTime(b) || new Date((b.date || "0") + "T00:00");
        return db - da; // most recent first
      });
    const gamesWithScore = pastGames.filter(g => g.homeScore !== undefined && g.awayScore !== undefined);
    const needsScore     = catSchedule.filter(g => g.homeScore === undefined || g.awayScore === undefined);
    // Backward-compat aliases used by stats calculations below
    const unplayed = upcomingGames;
    const played   = gamesWithScore;

    const standings = catTeams.map(t => {
      const hg = gamesWithScore.filter(g => g.home===t.name), ag = gamesWithScore.filter(g => g.away===t.name);
      const wins = hg.filter(g=>parseInt(g.homeScore)>parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)>parseInt(g.homeScore)).length;
      const losses = hg.filter(g=>parseInt(g.homeScore)<parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)<parseInt(g.homeScore)).length;
      return { name: t.name, emoji: t.emoji, gp: wins+losses, wins, losses };
    }).sort((a,b) => b.wins-a.wins);

    // ── COMPUTE TOTALS ──
    let skaterTotals=[], goalieTotals=[], bballTotals=[];
    if (sport === "Hockey") {
      skaterTotals = catPlayers.filter(p => !isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const goals = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goals||0),0);
        const assists = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        return { ...p, gp: gs.length, goals, assists, points: goals+assists };
      }).sort((a,b) => b.points-a.points || b.goals-a.goals);

      goalieTotals = catPlayers.filter(p => isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const saves = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.saves||0),0);
        const goalsAgainst = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goalsAgainst||0),0);
        const cleanSheets = gs.filter(g=>(g.playerStats[p.id]?.goalsAgainst||0)===0).length;
        const gaa = gs.length>0 ? goalsAgainst/gs.length : null;
        return { ...p, gp: gs.length, saves, goalsAgainst, cleanSheets, gaa };
      }).sort((a,b) => (a.gaa??99)-(b.gaa??99));
    }
    if (sport === "Basketball") {
      bballTotals = catPlayers.map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const points  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.points||0),0);
        const assists  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        const rebounds = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.rebounds||0),0);
        const blocks   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.blocks||0),0);
        const steals   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.steals||0),0);
        return { ...p, gp: gs.length, points, assists, rebounds, blocks, steals };
      }).sort((a,b) => b.points-a.points || b.assists-a.assists);
    }

    // player stat entry helpers
    function getGamePlayers(g) { return catPlayers.filter(p => p.team===g.home||p.team===g.away); }

    return (
      <div style={{ minHeight: "100vh", background: BG, color: T1 }}>

        {/* HEADER */}
        <div style={{ background: CARD, borderBottom: `1px solid ${BORDER}`, padding: "0 32px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 60 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {user?.role==="superadmin" && <button onClick={handleBack} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>← Back</button>}
            <div style={{ width: 1, height: 24, background: BORDER }} />
            <div style={{ fontSize: 18, fontWeight: 900, color: ACC }}>WEBSITE X</div>
            <div style={{ fontSize: 14, color: T2 }}>/ {league.name}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {lastSaved && !dirty && (
              <span style={{ fontSize: 11, color: "#22c55e", display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#22c55e", display: "inline-block" }} />
                Saved {lastSaved}
              </span>
            )}
            <span style={{ fontSize: 12, padding: "4px 10px", background: user?.role==="superadmin"?ACC+"20":"#6366f120", borderRadius: 6, fontWeight: 600, color: user?.role==="superadmin"?ACC:"#818cf8" }}>
              {user?.role==="superadmin"?"Super Admin":"League Owner"}
            </span>
            <button onClick={handleLogout} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>Logout</button>
          </div>
        </div>

        {/* ── CATEGORY BAR ── */}
        {(league.categories || []).length > 0 && (() => {
          const cats = league.categories;
          return (
            <div style={{ background: BG, borderBottom: `1px solid ${BORDER}` }}>
              {/* Mobile: dropdown */}
              <div className="cat-select-row">
                <select style={{ ...inp, width: "100%" }} value={activeCatId || ""} onChange={e => setActiveCatId(e.target.value)}>
                  {cats.map(c => <option key={c.id} value={c.id}>{c.displayName || c.name}</option>)}
                </select>
              </div>
              {/* Desktop: tab row */}
              <div className="cat-tabs-row" style={{ paddingLeft: 24 }}>
                {cats.map(c => (
                  <button key={c.id} onClick={() => setActiveCatId(c.id)}
                    style={{ background: "none", border: "none", padding: "11px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", color: activeCatId===c.id ? ACC : T2, borderBottom: activeCatId===c.id ? `2px solid ${ACC}` : "2px solid transparent", transition: "all 0.15s" }}>
                    {c.displayName || c.name}
                  </button>
                ))}
                <button onClick={() => setShowCatModal(true)}
                  style={{ background: "none", border: "none", padding: "11px 18px", fontSize: 13, cursor: "pointer", color: T2, opacity: 0.55, whiteSpace: "nowrap" }}>
                  + Add Category
                </button>
                <div style={{ flex: 1 }} />
                {activeCatId && cats.length > 1 && (
                  <button onClick={() => setDeleteCatId(activeCatId)}
                    style={{ background: "none", border: "none", padding: "11px 16px", fontSize: 12, cursor: "pointer", color: "#ef444488", whiteSpace: "nowrap" }}>
                    🗑 Delete
                  </button>
                )}
              </div>
            </div>
          );
        })()}

        {/* TAB BAR */}
        <div style={{ background: SURF, borderBottom: `1px solid ${BORDER}`, paddingLeft: 32, display: "flex", overflowX: "auto" }}>
          {TABS.map(([t,label]) => (
            <button key={t} onClick={() => handleTabSwitch(t)} style={{ background: "none", border: "none", padding: "16px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", color: tab===t?ACC:T2, borderBottom: tab===t?`2px solid ${ACC}`:"2px solid transparent" }}>{label}</button>
          ))}
        </div>

        <div style={{ maxWidth: 860, margin: "0 auto", padding: "36px 24px" }}>

          {/* ── MIGRATION WARNING ── */}
          {league._migrated && (
            <div style={{ background: "#f59e0b15", border: "1px solid #f59e0b50", borderRadius: 8, padding: "10px 16px", marginBottom: 20, fontSize: 13, color: "#f59e0b", lineHeight: 1.6 }}>
              ⚠️ <strong>Categories auto-assigned.</strong> Teams, players, and games have been placed in a <strong>General</strong> category. Click <strong>Save Changes</strong> to persist this to Firestore.
            </div>
          )}

          {/* ── TEAMS ── */}
          {tab==="teams" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Teams {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add New Team</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} value={nT.name} onChange={e=>setNT({...nT,name:e.target.value})} placeholder="Team name" />
                  <input style={{ ...inp, flex: 1, minWidth: 80, textAlign: "center" }} value={nT.emoji} onChange={e=>setNT({...nT,emoji:e.target.value})} placeholder="🏒" />
                  {(league.categories || []).length > 1 && (
                    <select style={{ ...inp, flex: 1, minWidth: 140 }} value={nT.categoryId || activeCatId || ""} onChange={e=>setNT({...nT,categoryId:e.target.value})}>
                      <option value="">Select category</option>
                      {(league.categories || []).map(c => <option key={c.id} value={c.id}>{c.displayName || c.name}</option>)}
                    </select>
                  )}
                  <button style={btn()} onClick={addTeam}>Add Team</button>
                </div>
              </div>
              {catTeams.length===0 ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No teams in this category yet.</div> :
                catTeams.map(t => (
                  <div key={t.id} style={{ ...card, display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <span style={{ fontSize: 28 }}>{t.emoji}</span>
                      <div><div style={{ fontWeight: 700 }}>{t.name}</div><div style={{ fontSize: 12, color: T2 }}>{catPlayers.filter(p=>p.team===t.name).length} players</div></div>
                    </div>
                    <button onClick={() => delTeam(t.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                  </div>
                ))
              }
            </div>
          )}

          {/* ── PLAYERS ── */}
          {tab==="players" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Players {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add New Player</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nP.name} onChange={e=>setNP({...nP,name:e.target.value})} placeholder="Full name" />
                  <input style={{ ...inp, flex: 0.5, minWidth: 64 }} value={nP.number} onChange={e=>setNP({...nP,number:e.target.value})} placeholder="#" />
                  <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.position} onChange={e=>setNP({...nP,position:e.target.value})} placeholder={sport==="Hockey"?"Center / Goalie":"Guard / Forward"} />
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nP.team} onChange={e=>setNP({...nP,team:e.target.value})}>
                    <option value="">Select team</option>
                    {catTeams.map(t => <option key={t.id}>{t.name}</option>)}
                  </select>
                  <button style={btn()} onClick={addPlayer}>Add Player</button>
                </div>
                {sport==="Hockey" && <div style={{ fontSize: 12, color: T2, marginTop: 10 }}>💡 Set position to <strong style={{ color: T1 }}>Goalie</strong> to track saves &amp; goals against separately.</div>}
                {catTeams.length === 0 && <div style={{ fontSize: 12, color: "#f59e0b", marginTop: 10 }}>⚠️ Add a team in this category first before adding players.</div>}
              </div>
              {catPlayers.length===0 ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No players in this category yet.</div> :
                catTeams.map(t => {
                  const tp = catPlayers.filter(p => p.team===t.name);
                  if (!tp.length) return null;
                  return (
                    <div key={t.id} style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10 }}>{t.emoji} {t.name}</div>
                      {tp.map(p => {
                        const ss = getPlayerSeasonStats(p, catSchedule, sport);
                        return (
                          <div key={p.id} style={{ ...card, marginBottom: 8 }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                                <div style={{ width: 40, height: 40, borderRadius: 8, background: "#23233a", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: ACC }}>#{p.number}</div>
                                <div><div style={{ fontWeight: 600 }}>{p.name}</div><div style={{ fontSize: 12, color: T2 }}>{p.position}{isGoalie(p)?" 🥅":""}</div></div>
                              </div>
                              <button onClick={() => delPlayer(p.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                            </div>
                            {ss.gamesPlayed > 0 && (
                              <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${BORDER}`, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center" }}>
                                <span style={{ fontSize: 12, color: T2 }}>GP: <strong style={{ color: T1 }}>{ss.gamesPlayed}</strong></span>
                                {ss.statDef.map(({ key, avg }) => (
                                  ss.averages[key] !== null && (
                                    <span key={key} style={{ fontSize: 12, color: T2 }}>{avg}: <strong style={{ color: ACC }}>{ss.averages[key]}</strong></span>
                                  )
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })
              }
            </div>
          )}

          {/* ── SCHEDULE ── */}
          {tab==="schedule" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Schedule {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              {(() => {
                // Per-league venue suggestions (deduplicated, sorted)
                const venueOptions = [...new Set(
                  (league.schedule || []).map(g => g.venue).filter(Boolean)
                )].sort();
                // Past-date detection for inline notice
                const nGDateTime = nG.date
                  ? new Date(nG.time ? `${nG.date}T${nG.time}` : `${nG.date}T00:00`)
                  : null;
                const nGIsInPast = nGDateTime && nGDateTime < new Date();
                return (
                  <div style={{ ...card, marginBottom: 24 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add Game</div>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                      <input type="date" style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.date} onChange={e=>setNG({...nG,date:e.target.value})} />
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.home} onChange={e=>setNG({...nG,home:e.target.value})}>
                        <option value="">Home team</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.away} onChange={e=>setNG({...nG,away:e.target.value})}>
                        <option value="">Away team</option>{catTeams.map(t=><option key={t.id}>{t.name}</option>)}
                      </select>
                      <input type="time" style={{ ...inp, flex: 1, minWidth: 100 }} value={nG.time} onChange={e=>setNG({...nG,time:e.target.value})} />
                      <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nG.venue} onChange={e=>setNG({...nG,venue:e.target.value})} placeholder="Venue / Arena" />
                      <button style={{ ...btn(), opacity: saving ? 0.6 : 1 }} disabled={saving} onClick={addGame}>{saving ? "Saving…" : "Add Game"}</button>
                    </div>
                    {venueOptions.length > 0 && (
                      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: T2, marginRight: 2 }}>Venues:</span>
                        {venueOptions.map(v => (
                          <button key={v} type="button" onClick={() => setNG({...nG, venue: v})}
                            style={{ fontSize: 11, padding: "3px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${nG.venue === v ? ACC : BORDER}`, background: nG.venue === v ? ACC + "22" : "none", color: nG.venue === v ? ACC : T2, fontWeight: nG.venue === v ? 700 : 400, transition: "all 0.1s" }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {nG.date && nG.time && (
                      <div style={{ marginTop: 10, fontSize: 12, color: nGIsInPast ? "#f97316" : T2, display: "flex", alignItems: "center", gap: 6 }}>
                        {nGIsInPast
                          ? "ⓘ This game is in the past — it will go to Past Games. You can enter the score after."
                          : "ⓘ This game will be scheduled as upcoming."}
                      </div>
                    )}
                  </div>
                );
              })()}
              {catSchedule.length===0 ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No games scheduled in this category yet.</div> : (
                <div>
                  {/* ── UPCOMING ── sorted ascending */}
                  {upcomingGames.length > 0 && (
                    <>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10 }}>Upcoming</div>
                      {upcomingGames.map(g => (
                        <div key={g.id} style={{ ...card, marginBottom: 8 }}>
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                            <div>
                              <div style={{ fontWeight: 700 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                              <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{g.date}{g.time ? " · " + formatTime12h(g.time) : ""}{g.venue ? " · " + g.venue : ""}</div>
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontSize: 12, color: "#f97316", padding: "4px 12px", background: "#f9731615", borderRadius: 6, fontWeight: 600 }}>Upcoming</span>
                              <button onClick={() => setEditGame({...g})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Edit</button>
                              <button onClick={() => setDeleteGameId(g.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Delete</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </>
                  )}

                  {/* ── PAST GAMES ── sorted descending (most recent first) */}
                  {pastGames.length > 0 && (
                    <>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T2, margin: upcomingGames.length > 0 ? "20px 0 10px" : "0 0 10px" }}>Past Games</div>
                      {pastGames.map(g => {
                        const hasScore = g.homeScore !== undefined && g.awayScore !== undefined;
                        const hw = hasScore && parseInt(g.homeScore) > parseInt(g.awayScore);
                        return (
                          <div key={g.id} style={{ ...card, marginBottom: 8 }}>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                              <div>
                                <div style={{ fontWeight: 700 }}>{g.home} <span style={{ color: T2, fontWeight: 400 }}>vs</span> {g.away}</div>
                                <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{g.date}{g.time ? " · " + formatTime12h(g.time) : ""}{g.venue ? " · " + g.venue : ""}</div>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                {hasScore && (
                                  <span style={{ fontWeight: 800, fontSize: 18, color: "#22c55e" }}>{g.homeScore} – {g.awayScore}</span>
                                )}
                                {hasScore
                                  ? <span style={{ fontSize: 12, color: "#22c55e", padding: "4px 12px", background: "#22c55e15", borderRadius: 6, fontWeight: 600 }}>Final</span>
                                  : <span style={{ fontSize: 12, color: T2, padding: "4px 12px", background: "#ffffff0a", borderRadius: 6, fontWeight: 600 }}>Awaiting Score</span>
                                }
                                {!hasScore
                                  ? <button onClick={() => setEditScore({id: g.id, homeScore: "", awayScore: ""})} style={{ background: "none", border: `1px solid ${ACC}55`, borderRadius: 6, color: ACC, padding: "5px 12px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}>Enter Score</button>
                                  : <button onClick={() => setEditScore({id: g.id, homeScore: g.homeScore, awayScore: g.awayScore})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Edit Score</button>
                                }
                                {(() => {
                                  const hasStats = Object.keys(g.playerStats || {}).length > 0;
                                  const gamePlayers = league.players.filter(p => p.team === g.home || p.team === g.away);
                                  if (!gamePlayers.length) return null;
                                  return (
                                    <button onClick={() => {
                                      const stats = {};
                                      gamePlayers.forEach(p => {
                                        const existing = (g.playerStats || {})[p.id] || {};
                                        const def = getSportStats(sport, p);
                                        const defaults = {};
                                        def.forEach(({ key }) => { defaults[key] = 0; });
                                        stats[p.id] = { ...defaults, ...existing };
                                      });
                                      setEditStats({ game: g, stats });
                                    }} style={{ background: "none", border: `1px solid ${hasStats ? BORDER : "#a78bfa55"}`, borderRadius: 6, color: hasStats ? T2 : "#a78bfa", padding: "5px 12px", fontSize: 12, cursor: "pointer", fontWeight: hasStats ? 400 : 600 }}>
                                      {hasStats ? "Edit Stats" : "Enter Stats"}
                                    </button>
                                  );
                                })()}
                                <button onClick={() => setEditGame({...g})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Edit</button>
                                <button onClick={() => setDeleteGameId(g.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Delete</button>
                              </div>
                            </div>
                            {hasScore && <BoxScore game={g} players={league.players} sport={sport} />}
                          </div>
                        );
                      })}
                    </>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ── SCORES ── */}
          {tab==="scores" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>
                Enter Scores {activeCat && <span style={{ fontSize: 13, color: T2, fontWeight: 400 }}>— {activeCat.displayName || activeCat.name}</span>}
              </div>
              <div style={{ ...card, marginBottom: 28 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Submit Result</div>
                {needsScore.length===0 ? <div style={{ fontSize: 14, color: T2 }}>All game results have been entered. No scores pending.</div> : (
                  <div>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 20 }}>
                      <div style={{ flex: 2, minWidth: 200 }}>
                        <label style={lbl}>Select Game</label>
                        <select style={inp} value={nS.gameId} onChange={e => {
                          const gId = e.target.value;
                          setNS({ ...nS, gameId: gId, homeScore: "", awayScore: "" });
                          if (gId) { const g = catSchedule.find(x => x.id===parseInt(gId)); doInitPlayerStats(g); }
                          else setNPS({});
                        }}>
                          <option value="">Choose a game...</option>
                          {needsScore.map(g => <option key={g.id} value={g.id}>{g.home} vs {g.away} ({g.date}{g.time ? " " + formatTime12h(g.time) : ""}){isGamePast(g) ? " — Past" : ""}</option>)}
                        </select>
                      </div>
                      {nS.gameId && (() => {
                        const g = catSchedule.find(x => x.id===parseInt(nS.gameId));
                        return (<>
                          <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.home} Score</label><input type="number" min="0" style={inp} value={nS.homeScore} onChange={e=>setNS({...nS,homeScore:e.target.value})} placeholder="0" /></div>
                          <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.away} Score</label><input type="number" min="0" style={inp} value={nS.awayScore} onChange={e=>setNS({...nS,awayScore:e.target.value})} placeholder="0" /></div>
                        </>);
                      })()}
                    </div>

                    {/* Player stats entry — Hockey */}
                    {nS.gameId && sport==="Hockey" && (() => {
                      const g = catSchedule.find(x => x.id===parseInt(nS.gameId));
                      const gPlayers = getGamePlayers(g);
                      if (!gPlayers.length) return null;
                      const skaters = gPlayers.filter(p => !isGoalie(p));
                      const goalies = gPlayers.filter(p => isGoalie(p));

                        <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 16 }}>

                            <div style={{ marginBottom: 16 }}>
                              <div style={{ display: "flex", gap: 8, fontSize: 11, color: T2, fontWeight: 700, padding: "0 4px", marginBottom: 6 }}>

                              </div>
                              {[g.home, g.away].map(tn => {
                                const tp = skaters.filter(p => p.team===tn);
                                if (!tp.length) return null;

                                  <div key={tn} style={{ marginBottom: 12 }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 6, paddingLeft: 4 }}>{tn}</div>

                                      const ps = nPS[p.id]||{goals:"",assists:""};
                                      const g2=parseInt(ps.goals)||0, a=parseInt(ps.assists)||0;
                                      return (
                                        <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>

                                            <span style={{ color: ACC, fontWeight: 700, fontSize: 12, minWidth: 28 }}>#{p.number}</span>{p.name}

                                          <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.goals} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],goals:e.target.value}}))} placeholder="0" />
                                          <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.assists} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],assists:e.target.value}}))} placeholder="0" />
                                          <div style={{ flex: 1, textAlign: "center", fontWeight: 800, color: (g2+a)>0?ACC:T2, fontSize: 16 }}>{g2+a||"—"}</div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          {goalies.length > 0 && (
                            <div>
                              <div style={{ display: "flex", gap: 8, fontSize: 11, color: T2, fontWeight: 700, padding: "0 4px", marginBottom: 6 }}>
                                <span style={{ flex: 3 }}>GOALIE</span><span style={{ flex: 1, textAlign: "center" }}>SAVES</span><span style={{ flex: 1, textAlign: "center" }}>GA</span><span style={{ flex: 1 }}></span>
                              </div>
                              {goalies.map(p => {
                                const ps = nPS[p.id]||{saves:"",goalsAgainst:""};
                                return (
                                  <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>
                                    <div style={{ flex: 3, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
                                      <span style={{ color: "#38bdf8", fontWeight: 700, fontSize: 12, minWidth: 28 }}>#{p.number}</span>{p.name} <span style={{ fontSize: 11, color: T2 }}>({p.team})</span>
                                    </div>
                                    <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.saves} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],saves:e.target.value}}))} placeholder="0" />
                                    <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.goalsAgainst} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],goalsAgainst:e.target.value}}))} placeholder="0" />
                                    <div style={{ flex: 1 }}></div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })()}

                    {/* Player stats entry — Basketball */}
                    {nS.gameId && sport==="Basketball" && (() => {
                      const g = catSchedule.find(x => x.id===parseInt(nS.gameId));
                      const gPlayers = getGamePlayers(g);
                      if (!gPlayers.length) return null;
                      return (
                        <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 16 }}>

                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                              <thead>
                                <tr>
                                  <th style={{ textAlign: "left", color: T2, fontSize: 11, fontWeight: 700, padding: "4px 8px", minWidth: 160 }}>PLAYER</th>
                                  {["PTS","AST","REB","BLK","STL"].map(h => (
                                    <th key={h} style={{ color: T2, fontSize: 11, fontWeight: 700, padding: "4px 6px", textAlign: "center", minWidth: 60 }}>{h}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody>
                                {[g.home, g.away].map(tn => {
                                  const tp = gPlayers.filter(p => p.team===tn);
                                  if (!tp.length) return null;
                                  return [
                                    <tr key={tn+"hdr"}>
                                      <td colSpan={6} style={{ padding: "8px 8px 4px", fontSize: 12, fontWeight: 700, color: T2 }}>{tn}</td>
                                    </tr>,
                                    ...tp.map(p => {
                                      const ps = nPS[p.id]||{points:"",assists:"",rebounds:"",blocks:"",steals:""};
                                      return (
                                        <tr key={p.id}>
                                          <td style={{ padding: "4px 8px" }}>
                                            <span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}
                                          </td>
                                          {["points","assists","rebounds","blocks","steals"].map(k => (
                                            <td key={k} style={{ padding: "4px 4px" }}>
                                              <input type="number" min="0" style={{ ...inp, padding: "6px 4px", textAlign: "center", fontSize: 13 }} value={ps[k]} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],[k]:e.target.value}}))} placeholder="0" />
                                            </td>
                                          ))}
                                        </tr>
                                      );
                                    })
                                  ];
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })()}

                    <button style={{ ...btn(), opacity: saving ? 0.6 : 1 }} disabled={saving} onClick={submitScore}>{saving ? "Saving…" : "Submit Score"}</button>

                <div>

                      <div key={g.id} style={{ ...card, marginBottom: 8 }}>

                            <span style={{ fontWeight: 800, fontSize: 20, color: !hw?"#22c55e":T2 }}>{g.awayScore}</span>

                          </div>
                        </div>
                        <BoxScore game={g} players={league.players} sport={sport} />

                  {standings.length>0 && (
                    <div style={{ marginTop: 28 }}>
                      <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>Standings <span style={{ fontSize: 12, color: "#22c55e", fontWeight: 400 }}>● Auto-calculated</span></div>

                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                          <thead><tr style={{ borderBottom: `1px solid ${BORDER}` }}>{["#","Team","GP","W","L","PTS"].map(h=><th key={h} style={{ padding: "8px 12px", textAlign: h==="Team"?"left":"center", color: T2, fontSize: 12, fontWeight: 600 }}>{h}</th>)}</tr></thead>

                                <td style={{ padding: 12, textAlign: "center", fontWeight: 800, color: ACC }}>{t.wins*2}</td>
                              </tr>

                      </div>
                    </div>

            </div>

              </div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 20 }}>Season totals &amp; averages — auto-calculated, ranked by category</div>

              {sport==="Hockey" && (
                <div>
                  {/* Leader cards */}

                    <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 28 }}>

                      {toggles.assists   && <LeaderCard title="Assists Leader" icon="🍎" data={skaterTotals}  statKey="assists"     color="#38bdf8" />}

                        <LeaderCard title="Best GAA" icon="🛡️" data={goalieTotals.filter(g=>g.gp>0)} statKey="gaa" color="#38bdf8" lowerBetter={true} fmtFn={p=>p.gaa!==null?p.gaa.toFixed(2):"—"} />

                  {skaterTotals.length>0 && (
                    <div style={{ marginBottom: 24 }}>

                          <thead>
                            <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
                              <th style={{ padding: "10px 12px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600, width: 32 }}>#</th>
                              <th style={{ padding: "10px 12px", textAlign: "left",   color: T2, fontSize: 12, fontWeight: 600 }}>Player</th>
                              <th style={{ padding: "10px 12px", textAlign: "left",   color: T2, fontSize: 12, fontWeight: 600 }}>Team</th>
                              <th style={{ padding: "10px 12px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600 }}>GP</th>
                              {toggles.goals   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#22c55e", fontSize: 12, fontWeight: 600 }}>G</th>}
                              {toggles.assists && <th style={{ padding: "10px 8px", textAlign: "center", color: "#38bdf8", fontSize: 12, fontWeight: 600 }}>A</th>}
                              {toggles.points  && <th style={{ padding: "10px 8px", textAlign: "center", color: ACC,      fontSize: 12, fontWeight: 600 }}>PTS</th>}

                          <tbody>
                            {skaterTotals.map((p,i) => (
                              <tr key={p.id} style={{ borderBottom: i<skaterTotals.length-1?`1px solid ${BORDER}`:"none", background: i===0?ACC+"08":"transparent" }}>
                                <td style={{ padding: "10px 12px", textAlign: "center", color: i===0?ACC:T2, fontWeight: i===0?700:400 }}>{i+1}</td>
                                <td style={{ padding: "10px 12px", fontWeight: 600 }}><span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>
                                <td style={{ padding: "10px 12px", color: T2, fontSize: 13 }}>{p.team}</td>
                                <td style={{ padding: "10px 12px", textAlign: "center", color: T2 }}>{p.gp}</td>

                                {toggles.assists && <StatCell val={p.assists} gp={p.gp} color="#38bdf8" />}
                                {toggles.points  && <StatCell val={p.points}  gp={p.gp} color={ACC} />}
                              </tr>

                            {goalieTotals.map((p,i) => (

                        </table>
                      </div>

                      {toggles.blocks   && <LeaderCard title="Blocks Leader"   icon="🛡️" data={bballTotals} statKey="blocks"   color="#a78bfa" />}
                      {toggles.steals   && <LeaderCard title="Steals Leader"   icon="⚡" data={bballTotals} statKey="steals"   color="#f472b6" />}
                    </div>

                            <th style={{ padding: "10px 10px", textAlign: "left", color: T2, fontSize: 12, fontWeight: 600 }}>Team</th>

                            {toggles.points   && <th style={{ padding: "10px 8px", textAlign: "center", color: ACC,      fontSize: 12, fontWeight: 600 }}>PTS</th>}
                            {toggles.assists  && <th style={{ padding: "10px 8px", textAlign: "center", color: "#38bdf8", fontSize: 12, fontWeight: 600 }}>AST</th>}
                            {toggles.rebounds && <th style={{ padding: "10px 8px", textAlign: "center", color: "#22c55e", fontSize: 12, fontWeight: 600 }}>REB</th>}
                            {toggles.blocks   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#a78bfa", fontSize: 12, fontWeight: 600 }}>BLK</th>}
                            {toggles.steals   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#f472b6", fontSize: 12, fontWeight: 600 }}>STL</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {bballTotals.map((p,i) => (
                            <tr key={p.id} style={{ borderBottom: i<bballTotals.length-1?`1px solid ${BORDER}`:"none", background: i===0?ACC+"08":"transparent" }}>
                              <td style={{ padding: "10px 10px", textAlign: "center", color: i===0?ACC:T2, fontWeight: i===0?700:400 }}>{i+1}</td>
                              <td style={{ padding: "10px 10px", fontWeight: 600 }}><span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>

                              <td style={{ padding: "10px 10px", textAlign: "center", color: T2 }}>{p.gp}</td>

                              {toggles.assists  && <StatCell val={p.assists}  gp={p.gp} color="#38bdf8" />}
                              {toggles.rebounds && <StatCell val={p.rebounds} gp={p.gp} color="#22c55e" />}
                              {toggles.blocks   && <StatCell val={p.blocks}   gp={p.gp} color="#a78bfa" />}
                              {toggles.steals   && <StatCell val={p.steals}   gp={p.gp} color="#f472b6" />}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {/* Other sports — generic */}
              {sport!=="Hockey" && sport!=="Basketball" && (
                <div style={{ textAlign: "center", color: T2, padding: 48 }}>Stats tracking is available for Hockey and Basketball leagues.</div>

            </div>

          {/* ── SETTINGS ── */}
          {tab==="settings" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>League Settings</div>

              {/* ── PUBLIC SITE LINK ── */}
              {(() => {
                const publicFile = `${sport.toLowerCase()}-public.html`;
                const publicUrl  = `${window.location.origin}/${publicFile}`;
                const exists     = sport === "Basketball" || sport === "Hockey"; // add more as public files are created
                return (
                  <div style={{ ...card, marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>🌐 Public Site</div>
                      <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>
                        {exists
                          ? <><span style={{ fontFamily: "monospace", color: ACC }}>{publicUrl}</span></>
                          : <span style={{ color: "#f59e0b" }}>No public site file found for {sport} yet.</span>
                        }
                      </div>
                    </div>
                    {exists && (
                      <a href={publicUrl} target="_blank" rel="noopener noreferrer"
                        style={{ ...btn(), textDecoration: "none", fontSize: 13, padding: "9px 20px", display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
                        ↗ Open Public Site
                      </a>

                  </div>
                );
              })()}

                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>Stat Categories — {sport}</div>

                    { key: "points",     label: "Points",       desc: "Goals + Assists combined points leaderboard", color: ACC },
                    { key: "goalieStats",label: "Goalie Stats", desc: "Saves, goals against, GAA, clean sheets",    color: "#a78bfa" },
                  ].map(({ key, label, desc, color }) => (
