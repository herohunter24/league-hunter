                    <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>Firebase / Public Site Connection</div>

                    {/* Firebase status */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, padding: "12px 16px", background: SURF, borderRadius: 8 }}>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: fbColor, boxShadow: `0 0 6px ${fbColor}`, flexShrink: 0 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: fbColor }}>{fbLabel}</div>
                        {__fbUncfg && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Replace REPLACE_ME values in the Firebase module script at the top of index.html</div>}
                        {__fbReady && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Firestore doc: <code style={{ color: T1 }}>leagues/{String(selId)}</code></div>}
                        {fbError && <div style={{ fontSize: 11, color: "#f59e0b", marginTop: 2 }}>{fbError}</div>}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: hbColor }} />
                        <div style={{ fontSize: 11, color: hbColor }}>{hbLabel}</div>
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
                      <button onClick={copyPublicSnippet} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>📋 Copy Public Site Snippet</button>
                      <button onClick={forceSync} style={{ ...btn("#252540"), fontSize: 13, padding: "9px 16px" }}>⚡ Force Sync</button>
                    </div>
                    {lastUpdated && <div style={{ fontSize: 11, color: T2, marginTop: -14, marginBottom: 16 }}>Last sync: {new Date(parseInt(lastUpdated)).toLocaleTimeString()}</div>}

                    {/* Setup guide */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 12 }}>
                      <button onClick={() => setShowConnGuide(v => !v)} style={{ background: "none", border: "none", color: ACC, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
                        {showConnGuide ? "▾" : "▸"} Firebase Setup Guide
                      </button>
                      {showConnGuide && (
                        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                          {[
                            ["1. Create a Firebase project", "Go to console.firebase.google.com → Add project. Give it a name (e.g. league-hunter)."],
                            ["2. Enable Firestore", "In the Firebase console → Build → Firestore Database → Create database → Start in test mode."],
                            ["3. Get your config", "Project Settings → Your apps → Add app (Web) → Copy the firebaseConfig object."],
                            ["4. Paste config into index.html", `Find the Firebase module script near the top of index.html and replace all six REPLACE_ME values with your real config values.`],
                            ["5. Connect your public site", `In Website X → Settings → Connection, click 📋 Copy Public Site Snippet. Paste it into the <head> of your public HTML file (basketball-public.html or any custom site). It auto-fills your Firebase config and this league's ID (${selId}).`],
                            ["6. Deploy security rules", "In Firebase console → Firestore → Rules, paste the production rules shown below. This lets public sites read league data while keeping writes server-side."],
                          ].map(([title, body]) => (
                            <div key={title} style={{ background: SURF, borderRadius: 8, padding: "12px 14px" }}>
                              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{title}</div>
                              <div style={{ fontSize: 12, color: T2, lineHeight: 1.6 }}>{body}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Security rules */}
                    <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 12 }}>FIRESTORE SECURITY RULES</div>
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#f59e0b", marginBottom: 6 }}>Dev rules (open access — for testing only):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{devRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(devRules).then(()=>showToast("Dev rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Dev Rules</button>
                      </div>
                      <div>
                        <div style={{ fontSize: 11, fontWeight: 600, color: "#22c55e", marginBottom: 6 }}>Production rules (read-only for public, no user data exposed):</div>
                        <pre style={{ background: "#0a0a18", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "12px 14px", fontSize: 11, color: "#a0a0c8", fontFamily: "monospace", whiteSpace: "pre-wrap", margin: 0, overflowX: "auto" }}>{prodRules}</pre>
                        <button onClick={() => navigator.clipboard.writeText(prodRules).then(()=>showToast("Prod rules copied!")).catch(()=>{})} style={{ ...btn("#252540"), fontSize: 11, padding: "5px 12px", marginTop: 6 }}>Copy Prod Rules</button>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* Danger Zone — Delete League (superadmin only) */}
              {user?.role === "superadmin" && (
                <div style={{ ...card, marginTop: 20, border: "1px solid #ef444430" }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "#ef4444", marginBottom: 4 }}>Danger Zone</div>
                  <div style={{ fontSize: 13, color: T2, marginBottom: 16 }}>Permanently delete this league and all its data. This cannot be undone.</div>
                  <button onClick={() => setDeleteLeagueId(league.id)} style={{ ...btn("#ef4444"), fontSize: 13, padding: "9px 20px" }}>🗑 Delete League</button>
                </div>
              )}

            </div>
          )}

        </div>{/* end content */}

        {/* ── STICKY SAVE BAR ── */}
        {dirty && (
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#0f0f1f", borderTop: `1px solid ${BORDER}`, padding: "12px 32px", display: "flex", alignItems: "center", justifyContent: "space-between", zIndex: 150, boxShadow: "0 -4px 20px #00000060" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#f59e0b", boxShadow: "0 0 6px #f59e0b", flexShrink: 0 }} />
              <div>
                <div style={{ fontSize: 14, color: T1, fontWeight: 600 }}>Unsaved changes</div>
                {lastSaved && <div style={{ fontSize: 11, color: T2, marginTop: 2 }}>Last saved: {lastSaved}</div>}
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={discardDirty} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>Discard</button>
              <button onClick={handleSave} style={{ ...btn("#22c55e"), padding: "9px 20px", fontSize: 14 }}>💾 Save Changes</button>
            </div>
          </div>
        )}

        {/* ── TOAST ── */}
        {toast && (
          <div style={{ position: "fixed", bottom: dirty ? 76 : 24, left: "50%", transform: "translateX(-50%)", background: "#1a2e1a", border: "1px solid #22c55e40", borderRadius: 10, padding: "12px 22px", fontSize: 13, fontWeight: 600, color: "#22c55e", zIndex: 400, whiteSpace: "nowrap", boxShadow: "0 4px 20px #00000080" }}>
            ✓ {toast}
          </div>
        )}

        {/* ── MODALS ── */}

        {/* Delete Team */}
        {deleteTeamId && (() => {
          const teamToDelete = (league.teams||[]).find(t => t.id === deleteTeamId);
          const playerCount = (league.players||[]).filter(p =>
            (teamToDelete && p.team === teamToDelete.name) ||
            (teamToDelete && String(p.teamId) === String(deleteTeamId))
          ).length;
          return (
            <ConfirmModal
              icon="🗑️"
              title={`Delete "${teamToDelete?.name}"?`}
              body={`This will permanently delete the team and its ${playerCount} player${playerCount !== 1 ? "s" : ""}, and remove related games. This cannot be undone.`}
              confirmLabel="Yes, Delete Team"
              onConfirm={() => { delTeam(deleteTeamId); setDeleteTeamId(null); }}
              onCancel={() => setDeleteTeamId(null)}
            />
          );
        })()}

        {/* Delete League */}
        {deleteLeagueId && (
          <ConfirmModal
            icon="⚠️"
            title={`Delete "${league.name}"?`}
            body="This will permanently delete the league, all teams, players, and game data. This cannot be undone."
            confirmLabel="Yes, Delete League"
            onConfirm={() => deleteLeague(deleteLeagueId)}
            onCancel={() => setDeleteLeagueId(null)}
          />
        )}

        {editGame && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
            <div style={{ width: 500, ...card, padding: 32 }}>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Edit Game</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div><label style={lbl}>Date</label><input type="date" style={inp} value={editGame.date} onChange={e=>setEditGame({...editGame,date:e.target.value})} /></div>
                <div><label style={lbl}>Time</label><input style={inp} value={editGame.time} onChange={e=>setEditGame({...editGame,time:e.target.value})} placeholder="7:00 PM" /></div>
                <div><label style={lbl}>Venue</label><input style={inp} value={editGame.venue} onChange={e=>setEditGame({...editGame,venue:e.target.value})} placeholder="Arena / Venue" /></div>
                <div><label style={lbl}>Home Team</label>
                  <select style={inp} value={editGame.home} onChange={e=>setEditGame({...editGame,home:e.target.value})}>
                    {league.teams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div><label style={lbl}>Away Team</label>
                  <select style={inp} value={editGame.away} onChange={e=>setEditGame({...editGame,away:e.target.value})}>
                    {league.teams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={saveEditGame}>Save Changes</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditGame(null)}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {deleteGameId && (
          <ConfirmModal icon="🗑️" title="Delete this game?" body="This action cannot be undone. The game and all associated data will be permanently removed." confirmLabel="Yes, Delete" onConfirm={() => deleteGame(deleteGameId)} onCancel={() => setDeleteGameId(null)} />
        )}

        {editScore && (() => {
          const g = league.schedule.find(x => x.id===editScore.id);
          return (
            <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
              <div style={{ width: 400, ...card, padding: 32 }}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Edit Score</div>
                <div style={{ fontSize: 13, color: T2, marginBottom: 24 }}>{g?.home} vs {g?.away} · {g?.date}</div>
                <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.home}</label><input type="number" style={inp} value={editScore.homeScore} onChange={e=>setEditScore({...editScore,homeScore:e.target.value})} /></div>
                  <div style={{ flex: 1 }}><label style={lbl}>{g?.away}</label><input type="number" style={inp} value={editScore.awayScore} onChange={e=>setEditScore({...editScore,awayScore:e.target.value})} /></div>
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={{ ...btn(), flex: 1 }} onClick={saveEditScore}>Save Score</button>
                  <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setEditScore(null)}>Cancel</button>
                </div>
              </div>
            </div>
          );
        })()}

        {deleteScoreId && (
          <ConfirmModal icon="↩️" title="Reset this game result?" body="The score and player stats will be cleared. The game returns to Upcoming status." confirmLabel="Yes, Reset" onConfirm={() => deleteScore(deleteScoreId)} onCancel={() => setDeleteScoreId(null)} />
        )}

        {/* ── SAVE CONFIRMATION MODAL ── */}
        {pendingSave && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350 }}>
            <div style={{ width: 420, ...card, padding: 36, textAlign: "center" }}>
              <div style={{ fontSize: 40, marginBottom: 16 }}>💾</div>
              <div style={{ fontSize: 19, fontWeight: 800, marginBottom: 10 }}>Save Changes?</div>
              <div style={{ fontSize: 14, color: T2, marginBottom: 28, lineHeight: 1.6 }}>Are you sure you want to apply these changes?<br/>This will update the live league data.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <button style={{ ...btn("#22c55e"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={confirmSave}>Confirm Save</button>
                <button style={{ ...btn("#252540"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={() => setPendingSave(false)}>Cancel</button>
              </div>
            </div>
          </div>
        )}

        {/* ── UNSAVED CHANGES MODAL ── */}
        {pendingNavTab && (
          <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 350 }}>
            <div style={{ width: 420, ...card, padding: 36, textAlign: "center" }}>
              <div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div>
              <div style={{ fontSize: 19, fontWeight: 800, marginBottom: 10 }}>Unsaved Changes</div>
              <div style={{ fontSize: 14, color: T2, marginBottom: 28, lineHeight: 1.6 }}>You have unsaved changes. Leaving without saving will discard all edits made on this tab.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <button style={{ ...btn("#252540"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={() => setPendingNavTab(null)}>Stay</button>
                <button style={{ ...btn("#ef4444"), flex: 1, padding: "12px 20px", fontSize: 15 }} onClick={leaveWithoutSaving}>Leave Without Saving</button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
