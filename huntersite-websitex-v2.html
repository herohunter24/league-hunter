// ── SHA-256 helper ──
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// ── HELPERS ──
function isGoalie(p) {
  const pos = (p.position || "").toLowerCase().trim();
  return pos === "goalie" || pos === "g" || pos === "gk" || pos === "goalkeeper" || pos === "goaltender";
}

function fmtAvg(val, gp) {
  if (!gp || gp === 0) return "—";
  return (val / gp).toFixed(2);
}

function getDefaultToggles(sport) {
  if (sport === "Hockey")     return { goals: true, assists: true, points: true, goalieStats: true };
  if (sport === "Basketball") return { points: true, assists: true, rebounds: true, blocks: true, steals: true };
  return { goals: true, assists: true, points: true };
}

function getToggles(league) {
  return { ...getDefaultToggles(league.sport), ...(league.statToggles || {}) };
}

function initNPS(players, sport) {
  const s = {};
  players.forEach(p => {
    if (sport === "Hockey") {
      s[p.id] = isGoalie(p) ? { saves: "", goalsAgainst: "" } : { goals: "", assists: "" };
    } else if (sport === "Basketball") {
      s[p.id] = { points: "", assists: "", rebounds: "", blocks: "", steals: "" };
    } else {
      s[p.id] = { goals: "", assists: "" };
    }
  });
  return s;
}

// ── LEADER CARD ──
function LeaderCard({ title, icon, data, statKey, color, lowerBetter, fmtFn }) {
  const sorted = [...data].filter(p => p[statKey] !== undefined && p[statKey] !== null && p.gp > 0)
    .sort((a, b) => lowerBetter ? (a[statKey] - b[statKey]) : (b[statKey] - a[statKey]));
  const top = sorted.slice(0, 3);
  if (!top.length) return null;
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div style={{ ...card, minWidth: 200, flex: "1 1 200px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 14 }}>{icon} {title.toUpperCase()}</div>
      {top.map((p, i) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: i < top.length - 1 ? 10 : 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, minWidth: 20 }}>{medals[i]}</span>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: T2 }}>{p.team}</div>
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: i === 0 ? color : T1 }}>
              {fmtFn ? fmtFn(p) : p[statKey]}
            </div>
            {p.gp > 0 && !lowerBetter && !fmtFn && (
              <div style={{ fontSize: 10, color: T2 }}>{fmtAvg(p[statKey], p.gp)}/g</div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── BOX SCORE ──
function BoxScore({ game, players, sport }) {
  if (!game.playerStats) return null;

  if (sport === "Basketball") {
    const active = players.filter(p => {
      const ps = game.playerStats[p.id];
      return ps && (ps.points > 0 || ps.assists > 0 || ps.rebounds > 0 || ps.blocks > 0 || ps.steals > 0);
    });
    if (!active.length) return null;
    return (
      <div style={{ marginTop: 14, borderTop: `1px solid ${BORDER}`, paddingTop: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 8 }}>BOX SCORE</div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr>
                {["Player","Team","PTS","AST","REB","BLK","STL"].map(h => (
                  <th key={h} style={{ textAlign: h==="Player"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 6px" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {active.map(p => {
                const ps = game.playerStats[p.id];
                return (
                  <tr key={p.id}>
                    <td style={{ padding: "4px 6px", fontWeight: 600 }}>{p.name}</td>
                    <td style={{ padding: "4px 6px", color: T2 }}>{p.team}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: ACC, fontWeight: 700 }}>{ps.points||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#38bdf8", fontWeight: 700 }}>{ps.assists||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{ps.rebounds||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#a78bfa", fontWeight: 700 }}>{ps.blocks||0}</td>
                    <td style={{ padding: "4px 6px", textAlign: "center", color: "#f472b6", fontWeight: 700 }}>{ps.steals||0}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // Hockey (default)
  const skaters = players.filter(p => !isGoalie(p) && game.playerStats[p.id] && (game.playerStats[p.id].goals > 0 || game.playerStats[p.id].assists > 0));
  const goalies = players.filter(p => isGoalie(p) && game.playerStats[p.id]);
  if (!skaters.length && !goalies.length) return null;
  return (
    <div style={{ marginTop: 14, borderTop: `1px solid ${BORDER}`, paddingTop: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: T2, letterSpacing: "0.06em", marginBottom: 8 }}>BOX SCORE</div>
      {skaters.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: goalies.length ? 10 : 0 }}>
          <thead>
            <tr>
              {["Player","Team","G","A","PTS"].map(h => (
                <th key={h} style={{ textAlign: h==="Player"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 8px" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {skaters.map(p => {
              const ps = game.playerStats[p.id];
              const g = ps.goals||0, a = ps.assists||0;
              return (
                <tr key={p.id}>
                  <td style={{ padding: "4px 8px", fontWeight: 600 }}>{p.name}</td>
                  <td style={{ padding: "4px 8px", color: T2, fontSize: 12 }}>{p.team}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{g}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#38bdf8", fontWeight: 700 }}>{a}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", fontWeight: 800, color: ACC }}>{g+a}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
      {goalies.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr>
              {["Goalie","Team","SV","GA"].map(h => (
                <th key={h} style={{ textAlign: h==="Goalie"||h==="Team"?"left":"center", color: T2, fontSize: 11, fontWeight: 600, padding: "3px 8px" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {goalies.map(p => {
              const ps = game.playerStats[p.id];
              return (
                <tr key={p.id}>
                  <td style={{ padding: "4px 8px", fontWeight: 600 }}>{p.name}</td>
                  <td style={{ padding: "4px 8px", color: T2, fontSize: 12 }}>{p.team}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{ps.saves||0}</td>
                  <td style={{ padding: "4px 8px", textAlign: "center", color: "#ef4444", fontWeight: 700 }}>{ps.goalsAgainst||0}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

function App() {
  const [page, setPage] = useState("login");
  const [user, setUser] = useState(null);
  const [leagues, setLeagues] = useState(DEMO_LEAGUES);
  const [loading, setLoading]   = useState(true);
  const [fbError, setFbError]   = useState(null);
  const leaguesRef = useRef(DEMO_LEAGUES);
  const [selId, setSelId] = useState(null);
  const [tab, setTab] = useState("teams");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [nL, setNL] = useState({ name: "", sport: "Basketball", domain: "", color: "#6366f1" });
  const [nT, setNT] = useState({ name: "", emoji: "⭐" });
  const [nP, setNP] = useState({ name: "", team: "", number: "", position: "", height: "", weight: "", dob: "", handedness: "", hometown: "", photo: "" });
  const [deleteTeamId, setDeleteTeamId] = useState(null);
  const [deleteLeagueId, setDeleteLeagueId] = useState(null);
  const [nG, setNG] = useState({ date: "", home: "", away: "", time: "", venue: "" });
  const [nS, setNS] = useState({ gameId: "", homeScore: "", awayScore: "" });
  const [nPS, setNPS] = useState({});
  const [editGame, setEditGame] = useState(null);
  const [deleteGameId, setDeleteGameId] = useState(null);
  const [editScore, setEditScore] = useState(null);
  const [deleteScoreId, setDeleteScoreId] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [pendingSave, setPendingSave] = useState(false);
  const [pendingNavTab, setPendingNavTab] = useState(null);
  const [toast, setToast] = useState(null);
  const [showConnGuide, setShowConnGuide] = useState(false);
  const [users, setUsers] = useState(loadUsers);
  const [lastSaved, setLastSaved] = useState(null);
  const [ownerModal, setOwnerModal] = useState(null);
  const [newOwner, setNewOwner] = useState({ email: "", password: "", confirm: "" });
  const [ownerError, setOwnerError] = useState("");
  const [createdCreds, setCreatedCreds] = useState(null);
  const [manageOwnerId, setManageOwnerId] = useState(null);
  const [deleteOwnerId, setDeleteOwnerId] = useState(null);
  const [resetPwForm, setResetPwForm] = useState({ userId: null, password: "", confirm: "" });

  // Keep ref in sync so async functions always write the latest state
  useEffect(() => { leaguesRef.current = leagues; }, [leagues]);

  // ── INITIAL DATA LOAD ──
  useEffect(() => {
    if (__fbReady) {
      const { getDocs, collection } = _FS;
      getDocs(collection(_db, "leagues"))
        .then(snap => {
          if (!snap.empty) setLeagues(snap.docs.map(d => d.data()));
          else {
            try { const s = localStorage.getItem("wxLeagues"); if (s) setLeagues(JSON.parse(s)); } catch {}
          }
          setLoading(false);
        })
        .catch(e => {
          console.error("Firestore load:", e);
          setFbError("Firebase connection failed — running in local mode.");
          try { const s = localStorage.getItem("wxLeagues"); if (s) setLeagues(JSON.parse(s)); } catch {}
          setLoading(false);
        });
    } else {
      try { const s = localStorage.getItem("wxLeagues"); if (s) setLeagues(JSON.parse(s)); } catch {}
      setLoading(false);
    }
  }, []);

  // ── USERS LOAD FROM FIRESTORE ──
  useEffect(() => {
    if (!__fbReady) return;
    const { getDocs, collection } = _FS;
    getDocs(collection(_db, "users"))
      .then(snap => { if (!snap.empty) setUsers(snap.docs.map(d => d.data())); })
      .catch(e => console.error("Users load:", e));
  }, []);

  useEffect(() => {
    if (!dirty) return;
    function onBeforeUnload(e) { e.preventDefault(); e.returnValue = ""; }
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
  }, [dirty]);

  const league = leagues.find(l => l.id === selId);

  async function login() {
    const passHash = await sha256(pass);
    if (email === SUPERADMIN_EMAIL && passHash === SUPERADMIN_HASH) {
      setUser({ email: SUPERADMIN_EMAIL, role: "superadmin" }); setErr(""); setPage("dashboard"); return;
    }
    let allUsers = users;
    if (__fbReady) {
      try {
        const { getDocs, collection } = _FS;
        const snap = await getDocs(collection(_db, "users"));
        allUsers = snap.docs.map(d => d.data());
        setUsers(allUsers);
      } catch(e) {
        allUsers = loadUsers();
        if (JSON.stringify(allUsers) !== JSON.stringify(users)) setUsers(allUsers);
      }
    } else {
      allUsers = loadUsers();
      if (JSON.stringify(allUsers) !== JSON.stringify(users)) setUsers(allUsers);
    }
    const owner = allUsers.find(u => u.email === email && u.password === pass);
    if (owner) {
      setUser(owner); setErr("");
      setSelId(owner.leagueId); setTab("teams"); setPage("league"); return;
    }
    setErr("Invalid email or password.");
  }
  function logout() { setPage("login"); setUser(null); setEmail(""); setPass(""); setSelId(null); setDirty(false); setLastSaved(null); }
  function upd(updated) { setLeagues(prev => prev.map(l => l.id === updated.id ? updated : l)); setDirty(true); }

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 3000); }
  function handleTabSwitch(t) { if (dirty) { setPendingNavTab(t); } else { setTab(t); } }
  function handleBack() { if (dirty) { setPendingNavTab("__dashboard__"); } else { setPage("dashboard"); setSelId(null); } }
  function handleLogout() { if (dirty) { setPendingNavTab("__logout__"); } else { logout(); } }
  function handleSave() { setPendingSave(true); }
  async function confirmSave() {
    // leaguesRef.current always holds latest state (no stale closure)
    const current = leaguesRef.current;
    // Always write to localStorage (cache + fallback for discard)
    localStorage.setItem("wxLeagues", JSON.stringify(current));
    localStorage.setItem("wxLeagues_updated", Date.now().toString());
    // Also write to Firestore if configured
    if (__fbReady) {
      try {
        const { setDoc, doc } = _FS;
        const lg = current.find(l => l.id === selId);
        if (lg) {
          await setDoc(doc(_db, "leagues", String(lg.id)), lg);
          await setDoc(doc(_db, "meta", "sync"), { updatedAt: Date.now() });
        }
      } catch(e) { console.error("Firestore save:", e); }
    }
    const ts = new Date().toLocaleTimeString();
    setLastSaved(ts);
    setDirty(false); setPendingSave(false);
    showToast("Saved at " + ts);
  }
  function discardDirty() {
    try {
      const saved = JSON.parse(localStorage.getItem("wxLeagues") || "null") || DEMO_LEAGUES;
      const savedLeague = saved.find(l => l.id === selId);
      if (savedLeague) setLeagues(prev => prev.map(l => l.id === selId ? savedLeague : l));
    } catch {}
    setDirty(false);
  }
  function leaveWithoutSaving() {
    try {
      const saved = JSON.parse(localStorage.getItem("wxLeagues") || "null") || DEMO_LEAGUES;
      const savedLeague = saved.find(l => l.id === selId);
      if (savedLeague) setLeagues(prev => prev.map(l => l.id === selId ? savedLeague : l));
    } catch {}
    setDirty(false);
    const dest = pendingNavTab;
    setPendingNavTab(null);
    if (dest === "__dashboard__") { setPage("dashboard"); setSelId(null); }
    else if (dest === "__logout__") { logout(); }
    else { setTab(dest); }
  }
  function copyPublicSnippet() {
    const cfg = __fbCfg;
    if (!cfg || cfg.apiKey === "REPLACE_ME") {

                    </div>
                    <button onClick={() => setDeleteOwnerId(owner.id)}
                      style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Delete</button>
                  </div>
                  {resetPwForm.userId === owner.id ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <input type="password" style={{ ...inp, fontSize: 13 }} value={resetPwForm.password} onChange={e=>setResetPwForm({...resetPwForm,password:e.target.value})} placeholder="New password" autoComplete="new-password" />
                      <input type="password" style={{ ...inp, fontSize: 13 }} value={resetPwForm.confirm} onChange={e=>setResetPwForm({...resetPwForm,confirm:e.target.value})} placeholder="Confirm new password" autoComplete="new-password" />
                      {ownerError && <div style={{ color: "#ef4444", fontSize: 12 }}>{ownerError}</div>}
                      <div style={{ display: "flex", gap: 8 }}>
                        <button style={{ ...btn(), flex: 1, padding: "8px 14px", fontSize: 13 }} onClick={resetOwnerPassword}>Save</button>
                        <button style={{ ...btn("#252540"), flex: 1, padding: "8px 14px", fontSize: 13 }} onClick={() => { setResetPwForm({ userId: null, password: "", confirm: "" }); setOwnerError(""); }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => { setResetPwForm({ userId: owner.id, password: "", confirm: "" }); setOwnerError(""); }}
                      style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>
                      🔑 Reset Password
                    </button>
                  )}
                </div>
              ))}
              <button style={{ ...btn("#252540"), width: "100%", marginTop: 8 }} onClick={() => { setManageOwnerId(null); setResetPwForm({ userId: null, password: "", confirm: "" }); setOwnerError(""); }}>Close</button>
            </div>
          </div>
        );
      })()}

      {/* ── DELETE OWNER CONFIRM ── */}
      {deleteOwnerId && (
        <ConfirmModal icon="🗑️" title="Delete Owner Account?" body={`This will permanently remove the login credentials for ${users.find(u=>u.id===deleteOwnerId)?.email}. The league data is unaffected.`} confirmLabel="Yes, Delete Account" onConfirm={() => deleteOwner(deleteOwnerId)} onCancel={() => setDeleteOwnerId(null)} />
      )}

      {showAdd && (
        <div style={{ position: "fixed", inset: 0, background: "#00000095", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ width: 460, ...card, padding: 32 }}>
            <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 24 }}>Add New League</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div><label style={lbl}>League Name</label><input style={inp} value={nL.name} onChange={e => setNL({...nL,name:e.target.value})} placeholder="e.g. Hockey Summer League" /></div>
              <div><label style={lbl}>Sport</label>
                <select style={inp} value={nL.sport} onChange={e => setNL({...nL,sport:e.target.value})}>
                  {["Basketball","Hockey","Soccer","Baseball","Other"].map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
              <div><label style={lbl}>Public Domain</label><input style={inp} value={nL.domain} onChange={e => setNL({...nL,domain:e.target.value})} placeholder="e.g. hockeyleague.com" /></div>
              <div><label style={lbl}>League Color</label>
                <input type="color" value={nL.color} onChange={e => setNL({...nL,color:e.target.value})} style={{ height: 44, width: "100%", borderRadius: 8, border: `1px solid ${BORDER}`, background: SURF, cursor: "pointer", padding: 4 }} />
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                <button style={{ ...btn(), flex: 1 }} onClick={addLeague}>Create League</button>
                <button style={{ ...btn("#252540"), flex: 1 }} onClick={() => setShowAdd(false)}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  // ── LEAGUE ──
  if (page === "league" && league) {
    const toggles = getToggles(league);
    const sport = league.sport;
    const unplayed = league.schedule.filter(g => !g.played);
    const played = league.schedule.filter(g => g.played);
    const TABS = [["teams","🏟 Teams"],["players","👤 Players"],["schedule","📅 Schedule & Scores"],["stats","📊 Stats"],["settings","⚙️ Settings"]];
    const pFields = getPlayerFields(league);

    const standings = league.teams.map(t => {
      const hg = played.filter(g => g.home===t.name), ag = played.filter(g => g.away===t.name);
      const wins = hg.filter(g=>parseInt(g.homeScore)>parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)>parseInt(g.homeScore)).length;
      const losses = hg.filter(g=>parseInt(g.homeScore)<parseInt(g.awayScore)).length + ag.filter(g=>parseInt(g.awayScore)<parseInt(g.homeScore)).length;
      return { name: t.name, emoji: t.emoji, gp: wins+losses, wins, losses };
    }).sort((a,b) => b.wins-a.wins);

    // ── COMPUTE TOTALS ──
    let skaterTotals=[], goalieTotals=[], bballTotals=[];
    if (sport === "Hockey") {
      skaterTotals = league.players.filter(p => !isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const goals = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goals||0),0);
        const assists = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        return { ...p, gp: gs.length, goals, assists, points: goals+assists };
      }).sort((a,b) => b.points-a.points || b.goals-a.goals);

      goalieTotals = league.players.filter(p => isGoalie(p)).map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const saves = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.saves||0),0);
        const goalsAgainst = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.goalsAgainst||0),0);
        const cleanSheets = gs.filter(g=>(g.playerStats[p.id]?.goalsAgainst||0)===0).length;
        const gaa = gs.length>0 ? goalsAgainst/gs.length : null;
        return { ...p, gp: gs.length, saves, goalsAgainst, cleanSheets, gaa };
      }).sort((a,b) => (a.gaa??99)-(b.gaa??99));
    }
    if (sport === "Basketball") {
      bballTotals = league.players.map(p => {
        const gs = played.filter(g => g.playerStats && g.playerStats[p.id] !== undefined);
        const points  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.points||0),0);
        const assists  = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.assists||0),0);
        const rebounds = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.rebounds||0),0);
        const blocks   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.blocks||0),0);
        const steals   = gs.reduce((s,g)=>s+(g.playerStats[p.id]?.steals||0),0);
        return { ...p, gp: gs.length, points, assists, rebounds, blocks, steals };
      }).sort((a,b) => b.points-a.points || b.assists-a.assists);
    }

    // player stat entry helpers
    function getGamePlayers(g) { return league.players.filter(p => p.team===g.home||p.team===g.away); }

    return (
      <div style={{ minHeight: "100vh", background: BG, color: T1 }}>

        {/* HEADER */}
        <div style={{ background: CARD, borderBottom: `1px solid ${BORDER}`, padding: "0 32px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 60 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {user?.role==="superadmin" && <button onClick={handleBack} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>← Back</button>}
            <div style={{ width: 1, height: 24, background: BORDER }} />
            <div style={{ fontSize: 18, fontWeight: 900, color: ACC }}>WEBSITE X</div>
            <div style={{ fontSize: 14, color: T2 }}>/ {league.name}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            {lastSaved && !dirty && (
              <span style={{ fontSize: 11, color: "#22c55e", display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#22c55e", display: "inline-block" }} />
                Saved {lastSaved}
              </span>
            )}
            <span style={{ fontSize: 12, padding: "4px 10px", background: user?.role==="superadmin"?ACC+"20":"#6366f120", borderRadius: 6, fontWeight: 600, color: user?.role==="superadmin"?ACC:"#818cf8" }}>
              {user?.role==="superadmin"?"Super Admin":"League Owner"}
            </span>
            <button onClick={handleLogout} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 8, color: T2, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>Logout</button>
          </div>
        </div>

        {/* TAB BAR */}
        <div style={{ background: SURF, borderBottom: `1px solid ${BORDER}`, paddingLeft: 32, display: "flex", overflowX: "auto" }}>
          {TABS.map(([t,label]) => (
            <button key={t} onClick={() => handleTabSwitch(t)} style={{ background: "none", border: "none", padding: "16px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", color: tab===t?ACC:T2, borderBottom: tab===t?`2px solid ${ACC}`:"2px solid transparent" }}>{label}</button>
          ))}
        </div>

        <div style={{ maxWidth: 860, margin: "0 auto", padding: "36px 24px" }}>

          {/* ── TEAMS ── */}
          {tab==="teams" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>Teams</div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add New Team</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 160 }} value={nT.name} onChange={e=>setNT({...nT,name:e.target.value})} placeholder="Team name" />
                  <input style={{ ...inp, flex: 1, minWidth: 80, textAlign: "center" }} value={nT.emoji} onChange={e=>setNT({...nT,emoji:e.target.value})} placeholder="🏒" />
                  <button style={btn()} onClick={addTeam}>Add Team</button>
                </div>
              </div>
              {league.teams.length===0 ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No teams yet.</div> :
                league.teams.map(t => (
                  <div key={t.id} style={{ ...card, display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <span style={{ fontSize: 28 }}>{t.emoji}</span>
                      <div><div style={{ fontWeight: 700 }}>{t.name}</div><div style={{ fontSize: 12, color: T2 }}>{league.players.filter(p=>p.team===t.name).length} players</div></div>
                    </div>
                    <button onClick={() => setDeleteTeamId(t.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 14px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}>🗑 Delete</button>
                  </div>
                ))
              }
            </div>
          )}

          {/* ── PLAYERS ── */}
          {tab==="players" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>Players</div>
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add New Player</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nP.name} onChange={e=>setNP({...nP,name:e.target.value})} placeholder="Full name" />
                  <input style={{ ...inp, flex: 0.5, minWidth: 64 }} value={nP.number} onChange={e=>setNP({...nP,number:e.target.value})} placeholder="#" />
                  <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.position} onChange={e=>setNP({...nP,position:e.target.value})} placeholder={sport==="Hockey"?"Center / Goalie":"Guard / Forward"} />
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nP.team} onChange={e=>setNP({...nP,team:e.target.value})}>
                    <option value="">🆓 Free Agent (no team)</option>
                    {league.teams.map(t => <option key={t.id} value={t.name}>{t.emoji} {t.name}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 12 }}>
                  {pFields.height    && <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.height}     onChange={e=>setNP({...nP,height:e.target.value})}     placeholder='Height (e.g. 6\'1")' />}
                  {pFields.weight    && <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nP.weight}     onChange={e=>setNP({...nP,weight:e.target.value})}     placeholder="Weight (lbs)" />}
                  {pFields.dob       && <input type="date" style={{ ...inp, flex: 1, minWidth: 130 }} value={nP.dob} onChange={e=>setNP({...nP,dob:e.target.value})} />}
                  {pFields.handedness && (
                    <select style={{ ...inp, flex: 1, minWidth: 110 }} value={nP.handedness} onChange={e=>setNP({...nP,handedness:e.target.value})}>
                      <option value="">Handedness</option>
                      <option>Left</option><option>Right</option>
                    </select>
                  )}
                  {pFields.hometown  && <input style={{ ...inp, flex: 1, minWidth: 120 }} value={nP.hometown}   onChange={e=>setNP({...nP,hometown:e.target.value})}   placeholder="Hometown" />}
                </div>
                {pFields.photo && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      {nP.photo && <img src={nP.photo} alt="preview" style={{ width: 40, height: 40, borderRadius: 6, objectFit: "cover" }} />}
                      <label style={{ ...btn(league.color || ACC), display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer", padding: "8px 16px", fontSize: 13 }}>
                        📸 {nP.photo ? "Change Photo" : "Upload Photo"}
                        <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = ev => {
                            const img = new Image();
                            img.onload = () => {
                              const MAX = 300;
                              const scale = Math.min(1, MAX / Math.max(img.width, img.height));
                              const canvas = document.createElement("canvas");
                              canvas.width = img.width * scale; canvas.height = img.height * scale;
                              canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                              setNP(prev => ({ ...prev, photo: canvas.toDataURL("image/jpeg", 0.75) }));
                            };
                            img.src = ev.target.result;
                          };
                          reader.readAsDataURL(file);
                          e.target.value = "";
                        }} />
                      </label>
                      {nP.photo && <button type="button" onClick={() => setNP(prev=>({...prev,photo:""}))} style={{ background:"none", border:"none", color:"#ef4444", cursor:"pointer", fontSize:20 }}>×</button>}
                    </div>
                  </div>
                )}
                <div style={{ marginTop: 14 }}>
                  <button style={btn()} onClick={addPlayer}>Add Player</button>
                </div>
                {sport==="Hockey" && <div style={{ fontSize: 12, color: T2, marginTop: 10 }}>💡 Set position to <strong style={{ color: T1 }}>Goalie</strong> to track saves &amp; goals against separately.</div>}
              </div>

              {/* Teams with players */}
              {league.teams.map(t => {
                const tp = (league.players || []).filter(p => p.team===t.name);
                if (!tp.length) return null;
                return (
                  <div key={t.id} style={{ marginBottom: 24 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T2, marginBottom: 10 }}>{t.emoji} {t.name}</div>
                    {tp.map(p => (
                      <div key={p.id} style={{ ...card, display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                          {p.photo
                            ? <img src={p.photo} alt={p.name} style={{ width: 40, height: 40, borderRadius: 8, objectFit: "cover" }} />
                            : <div style={{ width: 40, height: 40, borderRadius: 8, background: "#23233a", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: ACC }}>#{p.number||"?"}</div>
                          }
                          <div>
                            <div style={{ fontWeight: 600 }}>{p.name}</div>
                            <div style={{ fontSize: 12, color: T2 }}>
                              {p.position}{isGoalie(p)?" 🥅":""}
                              {p.dob && ` · Age ${new Date().getFullYear()-new Date(p.dob).getFullYear()}`}
                              {p.hometown && ` · ${p.hometown}`}
                            </div>
                          </div>
                        </div>
                        <button onClick={() => delPlayer(p.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                      </div>
                    ))}
                  </div>
                );
              })}

              {/* Free Agents */}
              {(() => {
                const freeAgents = (league.players || []).filter(p => !p.team || p.team === "");
                if (!freeAgents.length) return null;
                return (
                  <div style={{ marginTop: 24 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: T2 }}>🆓 FREE AGENTS</span>
                      <span style={{ fontSize: 11, background: (league.color||ACC)+"22", color: league.color||ACC, borderRadius: 20, padding: "2px 10px", fontWeight: 700 }}>{freeAgents.length}</span>
                    </div>
                    {freeAgents.map(p => (
                      <div key={p.id} style={{ ...card, marginBottom: 8, borderLeft: `3px solid ${(league.color||ACC)}55` }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 14, flex: 1 }}>
                            {p.photo
                              ? <img src={p.photo} alt={p.name} style={{ width: 40, height: 40, borderRadius: 8, objectFit: "cover" }} />
                              : <div style={{ width: 40, height: 40, borderRadius: 8, background: "#23233a", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: T2 }}>#{p.number||"?"}</div>
                            }
                            <div>
                              <div style={{ fontWeight: 600 }}>{p.name}</div>
                              <div style={{ fontSize: 12, color: T2 }}>{p.position || "No position"}</div>
                            </div>
                          </div>
                          <select style={{ ...inp, width: "auto", minWidth: 150, fontSize: 12, padding: "6px 10px" }}
                            value=""
                            onChange={e => {
                              const teamName = e.target.value;
                              if (!teamName) return;
                              const team = league.teams.find(t => t.name === teamName);
                              upd({ ...league, players: (league.players||[]).map(pl => pl.id===p.id ? { ...pl, team: teamName, teamId: team?.id || null } : pl) });
                            }}>
                            <option value="">Assign to team…</option>
                            {league.teams.map(t => <option key={t.id} value={t.name}>{t.emoji} {t.name}</option>)}
                          </select>
                          <button onClick={() => delPlayer(p.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Remove</button>
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {(league.players||[]).length===0 && <div style={{ textAlign: "center", color: T2, padding: 48 }}>No players yet.</div>}
            </div>
          )}

          {/* ── SCHEDULE & SCORES (unified) ── */}
          {tab==="schedule" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 20 }}>Schedule &amp; Scores</div>

              {/* Add Game form */}
              <div style={{ ...card, marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Add Game</div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <input type="date" style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.date} onChange={e=>setNG({...nG,date:e.target.value})} />
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.home} onChange={e=>setNG({...nG,home:e.target.value})}>
                    <option value="">Home team</option>{league.teams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                  <select style={{ ...inp, flex: 1, minWidth: 130 }} value={nG.away} onChange={e=>setNG({...nG,away:e.target.value})}>
                    <option value="">Away team</option>{league.teams.map(t=><option key={t.id}>{t.name}</option>)}
                  </select>
                  <input style={{ ...inp, flex: 1, minWidth: 100 }} value={nG.time} onChange={e=>setNG({...nG,time:e.target.value})} placeholder="7:00 PM" />
                  <input style={{ ...inp, flex: 2, minWidth: 140 }} value={nG.venue} onChange={e=>setNG({...nG,venue:e.target.value})} placeholder="Venue / Arena" />
                  <button style={btn()} onClick={addGame}>Add Game</button>
                </div>
              </div>

              {/* Enter Score form */}
              {unplayed.length > 0 && (
                <div style={{ ...card, marginBottom: 28 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 14 }}>Enter Score</div>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 20 }}>
                    <div style={{ flex: 2, minWidth: 200 }}>
                      <label style={lbl}>Select Game</label>
                      <select style={inp} value={nS.gameId} onChange={e => {
                        const gId = e.target.value;
                        setNS({ ...nS, gameId: gId, homeScore: "", awayScore: "" });
                        if (gId) { const g = league.schedule.find(x => x.id===parseInt(gId)); doInitPlayerStats(g); }
                        else setNPS({});
                      }}>
                        <option value="">Choose a game...</option>
                        {unplayed.map(g => <option key={g.id} value={g.id}>{g.home} vs {g.away} ({g.date})</option>)}
                      </select>
                    </div>
                    {nS.gameId && (() => {
                      const g = league.schedule.find(x => x.id===parseInt(nS.gameId));
                      return (<>
                        <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.home} Score</label><input type="number" style={inp} value={nS.homeScore} onChange={e=>setNS({...nS,homeScore:e.target.value})} placeholder="0" /></div>
                        <div style={{ flex: 1, minWidth: 110 }}><label style={lbl}>{g?.away} Score</label><input type="number" style={inp} value={nS.awayScore} onChange={e=>setNS({...nS,awayScore:e.target.value})} placeholder="0" /></div>
                      </>);
                    })()}
                  </div>

                  {/* Player stats — Hockey */}
                  {nS.gameId && sport==="Hockey" && (() => {
                    const g = league.schedule.find(x => x.id===parseInt(nS.gameId));
                    const gPlayers = getGamePlayers(g);
                    if (!gPlayers.length) return null;
                    const skaters = gPlayers.filter(p => !isGoalie(p));
                    const goalies = gPlayers.filter(p => isGoalie(p));
                    return (
                      <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 16 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 12 }}>Player Stats <span style={{ fontWeight: 400 }}>(optional)</span></div>
                        {skaters.length > 0 && (
                          <div style={{ marginBottom: 16 }}>
                            <div style={{ display: "flex", gap: 8, fontSize: 11, color: T2, fontWeight: 700, padding: "0 4px", marginBottom: 6 }}>
                              <span style={{ flex: 3 }}>SKATER</span><span style={{ flex: 1, textAlign: "center" }}>GOALS</span><span style={{ flex: 1, textAlign: "center" }}>ASSISTS</span><span style={{ flex: 1, textAlign: "center" }}>PTS</span>
                            </div>
                            {[g.home, g.away].map(tn => {
                              const tp = skaters.filter(p => p.team===tn);
                              if (!tp.length) return null;
                              return (
                                <div key={tn} style={{ marginBottom: 12 }}>
                                  <div style={{ fontSize: 12, fontWeight: 700, color: T2, marginBottom: 6, paddingLeft: 4 }}>{tn}</div>
                                  {tp.map(p => {
                                    const ps = nPS[p.id]||{goals:"",assists:""};
                                    const g2=parseInt(ps.goals)||0, a=parseInt(ps.assists)||0;
                                    return (
                                      <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>
                                        <div style={{ flex: 3, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
                                          <span style={{ color: ACC, fontWeight: 700, fontSize: 12, minWidth: 28 }}>#{p.number}</span>{p.name}
                                        </div>
                                        <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.goals} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],goals:e.target.value}}))} placeholder="0" />
                                        <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.assists} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],assists:e.target.value}}))} placeholder="0" />
                                        <div style={{ flex: 1, textAlign: "center", fontWeight: 800, color: (g2+a)>0?ACC:T2, fontSize: 16 }}>{g2+a||"—"}</div>
                                      </div>
                                    );
                                  })}
                                </div>
                              );
                            })}
                          </div>
                        )}
                        {goalies.length > 0 && (
                          <div>
                            <div style={{ display: "flex", gap: 8, fontSize: 11, color: T2, fontWeight: 700, padding: "0 4px", marginBottom: 6 }}>
                              <span style={{ flex: 3 }}>GOALIE</span><span style={{ flex: 1, textAlign: "center" }}>SAVES</span><span style={{ flex: 1, textAlign: "center" }}>GA</span><span style={{ flex: 1 }}></span>
                            </div>
                            {goalies.map(p => {
                              const ps = nPS[p.id]||{saves:"",goalsAgainst:""};
                              return (
                                <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>
                                  <div style={{ flex: 3, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
                                    <span style={{ color: "#38bdf8", fontWeight: 700, fontSize: 12, minWidth: 28 }}>#{p.number}</span>{p.name} <span style={{ fontSize: 11, color: T2 }}>({p.team})</span>
                                  </div>
                                  <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.saves} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],saves:e.target.value}}))} placeholder="0" />
                                  <input type="number" min="0" style={{ ...inp, flex: 1, padding: "8px 10px", textAlign: "center" }} value={ps.goalsAgainst} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],goalsAgainst:e.target.value}}))} placeholder="0" />
                                  <div style={{ flex: 1 }}></div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Player stats — Basketball */}
                  {nS.gameId && sport==="Basketball" && (() => {
                    const g = league.schedule.find(x => x.id===parseInt(nS.gameId));
                    const gPlayers = getGamePlayers(g);
                    if (!gPlayers.length) return null;
                    return (
                      <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 16, marginBottom: 16 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 12 }}>Player Stats <span style={{ fontWeight: 400 }}>(optional)</span></div>
                        <div style={{ overflowX: "auto" }}>
                          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                            <thead>
                              <tr>
                                <th style={{ textAlign: "left", color: T2, fontSize: 11, fontWeight: 700, padding: "4px 8px", minWidth: 160 }}>PLAYER</th>
                                {["PTS","AST","REB","BLK","STL"].map(h => (
                                  <th key={h} style={{ color: T2, fontSize: 11, fontWeight: 700, padding: "4px 6px", textAlign: "center", minWidth: 60 }}>{h}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {[g.home, g.away].map(tn => {
                                const tp = gPlayers.filter(p => p.team===tn);
                                if (!tp.length) return null;
                                return [
                                  <tr key={tn+"hdr"}><td colSpan={6} style={{ padding: "8px 8px 4px", fontSize: 12, fontWeight: 700, color: T2 }}>{tn}</td></tr>,
                                  ...tp.map(p => {
                                    const ps = nPS[p.id]||{points:"",assists:"",rebounds:"",blocks:"",steals:""};
                                    return (
                                      <tr key={p.id}>
                                        <td style={{ padding: "4px 8px" }}><span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>
                                        {["points","assists","rebounds","blocks","steals"].map(k => (
                                          <td key={k} style={{ padding: "4px 4px" }}>
                                            <input type="number" min="0" style={{ ...inp, padding: "6px 4px", textAlign: "center", fontSize: 13 }} value={ps[k]} onChange={e=>setNPS(prev=>({...prev,[p.id]:{...prev[p.id],[k]:e.target.value}}))} placeholder="0" />
                                          </td>
                                        ))}
                                      </tr>
                                    );
                                  })
                                ];
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })()}

                  <button style={btn()} onClick={submitScore}>Submit Score</button>
                </div>
              )}

              {/* Month-grouped games table */}
              {league.schedule.length === 0
                ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No games scheduled.</div>
                : (() => {
                  const sorted = [...league.schedule].sort((a,b) => new Date(a.date) - new Date(b.date));
                  const LC = league.color || ACC;
                  // Group by month
                  const groups = {};
                  sorted.forEach(g => {
                    const d = new Date(g.date + "T00:00:00");
                    const key = `${d.getFullYear()}-${d.getMonth()}`;
                    if (!groups[key]) groups[key] = { label: MONTHS_FR[d.getMonth()] + " " + d.getFullYear(), games: [] };
                    groups[key].games.push(g);
                  });
                  return (
                    <div>
                      {Object.values(groups).map(({ label, games }) => (
                        <div key={label} style={{ marginBottom: 32 }}>
                          {/* Month header */}
                          <div style={{ background: "#0d0d1e", borderBottom: `2px solid ${LC}`, padding: "10px 16px", borderRadius: "8px 8px 0 0", marginBottom: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 800, color: T2, letterSpacing: "0.12em" }}>{label}</span>
                          </div>
                          {/* Table */}
                          <div style={{ overflowX: "auto", background: CARD, border: `1px solid ${BORDER}`, borderTop: "none", borderRadius: "0 0 8px 8px" }}>
                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                              <thead>
                                <tr style={{ background: "#0d0d1e" }}>
                                  {["VISITEUR","","LOCAL","ENDROIT","DATE","RÉSULTAT",""].map((h,i) => (
                                    <th key={i} style={{ padding: "10px 12px", textAlign: i===1||i===6?"center":"left", color: T2, fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", whiteSpace: "nowrap" }}>{h}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody>
                                {games.map((g, gi) => {
                                  const isPlayed = g.played;
                                  const d = new Date(g.date + "T00:00:00");
                                  const isPast = d < new Date() && !isPlayed;
                                  const dayStr = DAYS_FR[d.getDay()];
                                  const homeWin = isPlayed && parseInt(g.homeScore) > parseInt(g.awayScore);
                                  const awayWin = isPlayed && parseInt(g.awayScore) > parseInt(g.homeScore);
                                  return [
                                    <tr key={g.id} style={{ borderTop: gi>0?`1px solid ${BORDER}`:"none", background: "transparent" }}>
                                      {/* Away */}
                                      <td style={{ padding: "12px 12px", fontWeight: awayWin?700:400, color: awayWin?T1:T2 }}>{g.away}</td>
                                      {/* VS */}
                                      <td style={{ padding: "12px 8px", textAlign: "center", color: T2, fontSize: 11 }}>vs</td>
                                      {/* Home */}
                                      <td style={{ padding: "12px 12px", fontWeight: homeWin?700:400, color: homeWin?T1:T2 }}>{g.home}</td>
                                      {/* Venue */}
                                      <td style={{ padding: "12px 12px", color: T2, fontSize: 12 }}>{g.venue||"—"}</td>
                                      {/* Date */}
                                      <td style={{ padding: "12px 12px", color: T2, fontSize: 12, whiteSpace: "nowrap" }}>{dayStr} {g.date}{g.time?` · ${g.time}`:""}</td>
                                      {/* Result / Status */}
                                      <td style={{ padding: "12px 12px", whiteSpace: "nowrap" }}>
                                        {isPlayed ? (
                                          <span style={{ fontWeight: 800, fontSize: 15, color: "#22c55e" }}>{g.awayScore} – {g.homeScore}</span>
                                        ) : isPast ? (
                                          <button onClick={() => {
                                            setNS({ gameId: String(g.id), homeScore: "", awayScore: "" });
                                            doInitPlayerStats(g);
                                            window.scrollTo({ top: 0, behavior: "smooth" });
                                          }} style={{ ...btn(LC), fontSize: 11, padding: "4px 12px" }}>ENTRER</button>
                                        ) : (
                                          <span style={{ fontSize: 11, color: "#f97316", padding: "3px 10px", background: "#f9731615", borderRadius: 6, fontWeight: 700 }}>À VENIR</span>
                                        )}
                                      </td>
                                      {/* Actions */}
                                      <td style={{ padding: "12px 8px", whiteSpace: "nowrap" }}>
                                        <div style={{ display: "flex", gap: 6 }}>
                                          <button onClick={() => setEditGame({...g})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Edit</button>
                                          {isPlayed && <button onClick={() => setEditScore({id:g.id,homeScore:g.homeScore,awayScore:g.awayScore})} style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, color: T2, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Score</button>}
                                          {isPlayed && <button onClick={() => setDeleteScoreId(g.id)} style={{ background: "none", border: "1px solid #f59e0b40", borderRadius: 6, color: "#f59e0b", padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Reset</button>}
                                          <button onClick={() => setDeleteGameId(g.id)} style={{ background: "none", border: "1px solid #ef444440", borderRadius: 6, color: "#ef4444", padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>🗑</button>
                                        </div>
                                      </td>
                                    </tr>,
                                    isPlayed && g.playerStats && (
                                      <tr key={g.id+"_bs"} style={{ borderTop: `1px solid ${BORDER}22` }}>
                                        <td colSpan={7} style={{ padding: "0 12px 12px" }}>
                                          <BoxScore game={g} players={league.players} sport={sport} />
                                        </td>
                                      </tr>
                                    )
                                  ];
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ))}

                      {/* Standings */}
                      {standings.length > 0 && (
                        <div style={{ marginTop: 8 }}>
                          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>Standings <span style={{ fontSize: 12, color: "#22c55e", fontWeight: 400 }}>● Auto-calculated</span></div>
                          <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, overflow: "hidden" }}>
                            <div style={{ background: "#0d0d1e", borderBottom: `2px solid ${LC}`, padding: "10px 16px" }}>
                              <span style={{ fontSize: 12, fontWeight: 800, color: T2, letterSpacing: "0.1em" }}>CLASSEMENT</span>
                            </div>
                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                              <thead>
                                <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
                                  {["#","Équipe","PJ","V","D","PTS"].map(h => (
                                    <th key={h} style={{ padding: "10px 12px", textAlign: h==="Équipe"?"left":"center", color: T2, fontSize: 12, fontWeight: 600 }}>{h}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody>
                                {standings.map((t,i) => (
                                  <tr key={t.name} style={{ borderBottom: i<standings.length-1?`1px solid ${BORDER}`:"none", background: i===0?LC+"0a":"transparent" }}>
                                    <td style={{ padding: 12, textAlign: "center", color: i===0?LC:T2, fontWeight: i===0?800:400 }}>{i+1}</td>
                                    <td style={{ padding: 12, fontWeight: 600, color: i===0?T1:T1 }}>{t.emoji} {t.name}</td>
                                    <td style={{ padding: 12, textAlign: "center", color: T2 }}>{t.gp}</td>
                                    <td style={{ padding: 12, textAlign: "center", color: "#22c55e", fontWeight: 700 }}>{t.wins}</td>
                                    <td style={{ padding: 12, textAlign: "center", color: "#ef4444" }}>{t.losses}</td>
                                    <td style={{ padding: 12, textAlign: "center", fontWeight: 800, color: i===0?LC:T1 }}>{t.wins*2}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })()
              }
            </div>
          )}

          {/* ── STATS ── */}
          {tab==="stats" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>Player Statistics</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 20 }}>Season totals &amp; averages — auto-calculated, ranked by category</div>

              {/* HOCKEY STATS */}
              {sport==="Hockey" && (
                <div>
                  {/* Leader cards */}
                  {played.length>0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 28 }}>
                      {toggles.goals     && <LeaderCard title="Goals Leader"   icon="🎯" data={skaterTotals}  statKey="goals"       color="#22c55e" />}
                      {toggles.assists   && <LeaderCard title="Assists Leader" icon="🍎" data={skaterTotals}  statKey="assists"     color="#38bdf8" />}
                      {toggles.points    && <LeaderCard title="Points Leader"  icon="⭐" data={skaterTotals}  statKey="points"      color={ACC} />}
                      {toggles.goalieStats && goalieTotals.length>0 && (
                        <LeaderCard title="Clean Sheets" icon="🥅" data={goalieTotals} statKey="cleanSheets" color="#a78bfa" />
                      )}
                      {toggles.goalieStats && goalieTotals.filter(g=>g.gp>0).length>0 && (
                        <LeaderCard title="Best GAA" icon="🛡️" data={goalieTotals.filter(g=>g.gp>0)} statKey="gaa" color="#38bdf8" lowerBetter={true} fmtFn={p=>p.gaa!==null?p.gaa.toFixed(2):"—"} />
                      )}
                    </div>
                  )}

                  {/* Skater table */}
                  {skaterTotals.length>0 && (
                    <div style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Skater Stats</div>
                      <div style={{ ...card, overflowX: "auto" }}>
                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                          <thead>
                            <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
                              <th style={{ padding: "10px 12px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600, width: 32 }}>#</th>
                              <th style={{ padding: "10px 12px", textAlign: "left",   color: T2, fontSize: 12, fontWeight: 600 }}>Player</th>
                              <th style={{ padding: "10px 12px", textAlign: "left",   color: T2, fontSize: 12, fontWeight: 600 }}>Team</th>
                              <th style={{ padding: "10px 12px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600 }}>GP</th>
                              {toggles.goals   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#22c55e", fontSize: 12, fontWeight: 600 }}>G</th>}
                              {toggles.assists && <th style={{ padding: "10px 8px", textAlign: "center", color: "#38bdf8", fontSize: 12, fontWeight: 600 }}>A</th>}
                              {toggles.points  && <th style={{ padding: "10px 8px", textAlign: "center", color: ACC,      fontSize: 12, fontWeight: 600 }}>PTS</th>}
                            </tr>
                          </thead>
                          <tbody>
                            {skaterTotals.map((p,i) => (
                              <tr key={p.id} style={{ borderBottom: i<skaterTotals.length-1?`1px solid ${BORDER}`:"none", background: i===0?ACC+"08":"transparent" }}>
                                <td style={{ padding: "10px 12px", textAlign: "center", color: i===0?ACC:T2, fontWeight: i===0?700:400 }}>{i+1}</td>
                                <td style={{ padding: "10px 12px", fontWeight: 600 }}><span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>
                                <td style={{ padding: "10px 12px", color: T2, fontSize: 13 }}>{p.team}</td>
                                <td style={{ padding: "10px 12px", textAlign: "center", color: T2 }}>{p.gp}</td>
                                {toggles.goals   && <StatCell val={p.goals}   gp={p.gp} color="#22c55e" />}
                                {toggles.assists && <StatCell val={p.assists} gp={p.gp} color="#38bdf8" />}
                                {toggles.points  && <StatCell val={p.points}  gp={p.gp} color={ACC} />}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* Goalie table */}
                  {toggles.goalieStats && goalieTotals.length>0 && (
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Goalie Stats</div>
                      <div style={{ ...card, overflowX: "auto" }}>
                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                          <thead>
                            <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
                              {["#","Goalie","Team","GP","SV","GA","CS","GAA"].map(h=>(
                                <th key={h} style={{ padding: "10px 10px", textAlign: h==="Goalie"||h==="Team"?"left":"center", color: T2, fontSize: 12, fontWeight: 600 }}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {goalieTotals.map((p,i) => (
                              <tr key={p.id} style={{ borderBottom: i<goalieTotals.length-1?`1px solid ${BORDER}`:"none" }}>
                                <td style={{ padding: "10px 10px", textAlign: "center", color: i===0?ACC:T2 }}>{i+1}</td>
                                <td style={{ padding: "10px 10px", fontWeight: 600 }}><span style={{ color: "#38bdf8", fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>
                                <td style={{ padding: "10px 10px", color: T2, fontSize: 13 }}>{p.team}</td>
                                <td style={{ padding: "10px 10px", textAlign: "center", color: T2 }}>{p.gp}</td>
                                <StatCell val={p.saves}       gp={p.gp} color="#22c55e" />
                                <StatCell val={p.goalsAgainst} gp={p.gp} color="#ef4444" />
                                <td style={{ padding: "10px 10px", textAlign: "center", fontWeight: 700, color: "#a78bfa" }}>{p.cleanSheets}</td>
                                <td style={{ padding: "10px 10px", textAlign: "center", fontWeight: 700, color: "#38bdf8" }}>{p.gaa!==null?p.gaa.toFixed(2):"—"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {skaterTotals.length===0 && goalieTotals.length===0 && <div style={{ textAlign: "center", color: T2, padding: 48 }}>No players yet.</div>}
                </div>
              )}

              {/* BASKETBALL STATS */}
              {sport==="Basketball" && (
                <div>
                  {played.length>0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 28 }}>
                      {toggles.points   && <LeaderCard title="Points Leader"   icon="🏀" data={bballTotals} statKey="points"   color={ACC} />}
                      {toggles.assists  && <LeaderCard title="Assists Leader"  icon="🎯" data={bballTotals} statKey="assists"  color="#38bdf8" />}
                      {toggles.rebounds && <LeaderCard title="Rebounds Leader" icon="💪" data={bballTotals} statKey="rebounds" color="#22c55e" />}
                      {toggles.blocks   && <LeaderCard title="Blocks Leader"   icon="🛡️" data={bballTotals} statKey="blocks"   color="#a78bfa" />}
                      {toggles.steals   && <LeaderCard title="Steals Leader"   icon="⚡" data={bballTotals} statKey="steals"   color="#f472b6" />}
                    </div>
                  )}
                  {bballTotals.length===0 ? <div style={{ textAlign: "center", color: T2, padding: 48 }}>No players yet.</div> : (
                    <div style={{ ...card, overflowX: "auto" }}>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                        <thead>
                          <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
                            <th style={{ padding: "10px 10px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600, width: 32 }}>#</th>
                            <th style={{ padding: "10px 10px", textAlign: "left", color: T2, fontSize: 12, fontWeight: 600 }}>Player</th>
                            <th style={{ padding: "10px 10px", textAlign: "left", color: T2, fontSize: 12, fontWeight: 600 }}>Team</th>
                            <th style={{ padding: "10px 10px", textAlign: "center", color: T2, fontSize: 12, fontWeight: 600 }}>GP</th>
                            {toggles.points   && <th style={{ padding: "10px 8px", textAlign: "center", color: ACC,      fontSize: 12, fontWeight: 600 }}>PTS</th>}
                            {toggles.assists  && <th style={{ padding: "10px 8px", textAlign: "center", color: "#38bdf8", fontSize: 12, fontWeight: 600 }}>AST</th>}
                            {toggles.rebounds && <th style={{ padding: "10px 8px", textAlign: "center", color: "#22c55e", fontSize: 12, fontWeight: 600 }}>REB</th>}
                            {toggles.blocks   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#a78bfa", fontSize: 12, fontWeight: 600 }}>BLK</th>}
                            {toggles.steals   && <th style={{ padding: "10px 8px", textAlign: "center", color: "#f472b6", fontSize: 12, fontWeight: 600 }}>STL</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {bballTotals.map((p,i) => (
                            <tr key={p.id} style={{ borderBottom: i<bballTotals.length-1?`1px solid ${BORDER}`:"none", background: i===0?ACC+"08":"transparent" }}>
                              <td style={{ padding: "10px 10px", textAlign: "center", color: i===0?ACC:T2, fontWeight: i===0?700:400 }}>{i+1}</td>
                              <td style={{ padding: "10px 10px", fontWeight: 600 }}><span style={{ color: ACC, fontWeight: 700, fontSize: 12, marginRight: 6 }}>#{p.number}</span>{p.name}</td>
                              <td style={{ padding: "10px 10px", color: T2, fontSize: 13 }}>{p.team}</td>
                              <td style={{ padding: "10px 10px", textAlign: "center", color: T2 }}>{p.gp}</td>
                              {toggles.points   && <StatCell val={p.points}   gp={p.gp} color={ACC} />}
                              {toggles.assists  && <StatCell val={p.assists}  gp={p.gp} color="#38bdf8" />}
                              {toggles.rebounds && <StatCell val={p.rebounds} gp={p.gp} color="#22c55e" />}
                              {toggles.blocks   && <StatCell val={p.blocks}   gp={p.gp} color="#a78bfa" />}
                              {toggles.steals   && <StatCell val={p.steals}   gp={p.gp} color="#f472b6" />}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {/* Other sports — generic */}
              {sport!=="Hockey" && sport!=="Basketball" && (
                <div style={{ textAlign: "center", color: T2, padding: 48 }}>Stats tracking is available for Hockey and Basketball leagues.</div>
              )}
            </div>
          )}

          {/* ── SETTINGS ── */}
          {tab==="settings" && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>League Settings</div>
              <div style={{ fontSize: 13, color: T2, marginBottom: 28 }}>Toggle stat categories and manage your public site connection. Click <strong style={{ color: T1 }}>Save Changes</strong> to apply.</div>

              {/* Player Profile Fields */}
              <div style={{ ...card, marginBottom: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Player Profile Fields</div>
                <div style={{ fontSize: 12, color: T2, marginBottom: 18 }}>Choose which optional fields appear when adding or editing players.</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                  {[
                    { key: "height",     label: "Height",      desc: "Player height (e.g. 6'1\")" },
                    { key: "weight",     label: "Weight",      desc: "Player weight in lbs" },
                    { key: "dob",        label: "Date of Birth", desc: "Auto-calculates player age" },
                    { key: "handedness", label: "Handedness",  desc: "Left or Right" },
                    { key: "hometown",   label: "Hometown",    desc: "Player's city of origin" },
                    { key: "photo",      label: "Photo",       desc: "Upload a player photo from your device" },
                  ].map(({ key, label, desc }) => (
                    <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderBottom: `1px solid ${BORDER}` }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: pFields[key] ? T1 : T2 }}>{label}</div>
                        <div style={{ fontSize: 12, color: T2, marginTop: 2 }}>{desc}</div>
                      </div>
                      <Toggle on={!!pFields[key]} onChange={() => setPlayerField(key, !pFields[key])} />
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ ...card, marginBottom: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>Stat Categories — {sport}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                  {sport==="Hockey" && [
                    { key: "goals",      label: "Goals",       desc: "Track skater goals and goal leaders",         color: "#22c55e" },
                    { key: "assists",    label: "Assists",      desc: "Track skater assists and assist leaders",     color: "#38bdf8" },
                    { key: "points",     label: "Points",       desc: "Goals + Assists combined points leaderboard", color: ACC },
                    { key: "goalieStats",label: "Goalie Stats", desc: "Saves, goals against, GAA, clean sheets",    color: "#a78bfa" },
                  ].map(({ key, label, desc, color }) => (
                    <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 0", borderBottom: `1px solid ${BORDER}` }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: toggles[key] ? T1 : T2 }}>
                          <span style={{ color: toggles[key] ? color : T2, marginRight: 8, fontSize: 12 }}>●</span>{label}
                        </div>
                        <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{desc}</div>
                      </div>
                      <Toggle on={toggles[key]} onChange={() => setToggle(key, !toggles[key])} />
                    </div>
                  ))}
                  {sport==="Basketball" && [
                    { key: "points",   label: "Points",   desc: "Track scoring and points leaders",          color: ACC },
                    { key: "assists",  label: "Assists",  desc: "Track assists and assist leaders",          color: "#38bdf8" },
                    { key: "rebounds", label: "Rebounds", desc: "Track rebounds and rebounding leaders",     color: "#22c55e" },
                    { key: "blocks",   label: "Blocks",   desc: "Track blocks and shot-blocking leaders",    color: "#a78bfa" },
                    { key: "steals",   label: "Steals",   desc: "Track steals and steal leaders",           color: "#f472b6" },
                  ].map(({ key, label, desc, color }) => (
                    <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 0", borderBottom: `1px solid ${BORDER}` }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: toggles[key] ? T1 : T2 }}>
                          <span style={{ color: toggles[key] ? color : T2, marginRight: 8, fontSize: 12 }}>●</span>{label}
                        </div>
                        <div style={{ fontSize: 12, color: T2, marginTop: 3 }}>{desc}</div>
                      </div>
                      <Toggle on={toggles[key]} onChange={() => setToggle(key, !toggles[key])} />
                    </div>
                  ))}
                  {sport!=="Hockey" && sport!=="Basketball" && (
                    <div style={{ padding: "20px 0", color: T2, fontSize: 14 }}>No configurable stat categories for {sport} yet.</div>
                  )}
                </div>
              </div>

              <div style={{ ...card, background: SURF }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: T2, marginBottom: 4 }}>How toggles work</div>
                <div style={{ fontSize: 13, color: T2, lineHeight: 1.6 }}>
                  When a stat category is turned <strong style={{ color: "#ef4444" }}>OFF</strong>, it disappears from the Stats tab — including leader cards, columns in the rankings table, and per-game averages for that category. Toggle it back <strong style={{ color: "#22c55e" }}>ON</strong> at any time to restore it. All data is preserved regardless of toggle state. Settings are saved per-league and persist across sessions.
                </div>
              </div>

              {/* CONNECTION STATUS */}
              {(() => {
                const hb = localStorage.getItem("wxLeagues_pubHeartbeat");
                const lastUpdated = localStorage.getItem("wxLeagues_updated");
                let hbColor = T2, hbLabel = "No heartbeat", hbDesc = "Public site heartbeat not detected.";
                if (hb) {
                  const diff = Date.now() - parseInt(hb);
                  if (diff < 5*60000)  { hbColor="#22c55e"; hbLabel="Active";   hbDesc=`Public site active ${Math.round(diff/1000)}s ago`; }
                  else if (diff < 60*60000) { hbColor="#f59e0b"; hbLabel="Idle"; hbDesc=`Public site last seen ${Math.round(diff/60000)}m ago`; }
                  else                 { hbColor="#ef4444"; hbLabel="Stale";  hbDesc=`Public site last seen ${Math.round(diff/3600000)}h ago`; }
                }
                const fbColor = __fbReady ? "#22c55e" : __fbUncfg ? "#ef4444" : "#f59e0b";
                const fbLabel = __fbReady ? "Firebase Connected" : __fbUncfg ? "Firebase Not Configured" : "Firebase Offline";
                const devRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true; // DEV ONLY — open access
    }
  }
}`;
                const prodRules = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Public sites can read leagues
    match /leagues/{leagueId} {
      allow read: if true;
      allow write: if false; // write via admin SDK or auth
    }
    // meta/sync readable by public sites
    match /meta/{doc} {
      allow read: if true;
      allow write: if false;
    }
    // Users only readable/writable server-side
    match /users/{userId} {
      allow read, write: if false;
    }
  }
}`;
                return (
                  <div style={{ ...card, marginTop: 20 }}>
